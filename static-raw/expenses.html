<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Ausgaben</title>
    <!-- Tailwind Play CDN pinned to an exact version. See the long-form
         note in multiply_kittens.html for why floating tags are not safe
         here (Babel 8.0.0 silently broke that page on 2026-06-16). -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        /* Prevent iOS auto-zoom on focus by keeping inputs at 16px. */
        input, select, textarea, button { font-size: 16px; }
        /* Segmented-toggle look for radio groups. */
        .seg input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
        .seg label {
            flex: 1; text-align: center; padding: 0.75rem 0.5rem;
            border: 1px solid #cbd5e1; background: #fff; color: #334155;
            cursor: pointer; user-select: none;
        }
        .seg label:first-of-type { border-top-left-radius: 0.5rem; border-bottom-left-radius: 0.5rem; }
        .seg label:last-of-type  { border-top-right-radius: 0.5rem; border-bottom-right-radius: 0.5rem; }
        .seg label + label { border-left: none; }
        .seg input[type="radio"]:checked + label {
            background: #4f46e5; color: #fff; border-color: #4f46e5;
        }
    </style>
</head>
<body class="antialiased bg-slate-50 min-h-screen">
    <div class="max-w-md mx-auto p-4">
        <header class="mb-4">
            <h1 class="text-2xl font-bold text-slate-900">Ausgaben</h1>
            <p class="text-sm text-slate-500">Neue Buchung erfassen</p>
        </header>

        <div class="seg flex mb-4">
            <input type="radio" name="sheet" id="sheet-common" value="Common" checked>
            <label for="sheet-common">Gemeinsam</label>
            <input type="radio" name="sheet" id="sheet-personal" value="Personal">
            <label for="sheet-personal">Persönlich</label>
        </div>

        <form id="form" class="space-y-4 bg-white rounded-2xl shadow-sm p-4">
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Betrag</span>
                <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" required autofocus
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </label>

            <label class="block">
                <span class="text-sm font-medium text-slate-700">Notiz</span>
                <input id="note" type="text" autocomplete="off"
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </label>

            <label class="block">
                <span class="text-sm font-medium text-slate-700">Kategorie</span>
                <select id="category"
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <optgroup label="Häufig">
                        <option value="Lebensmittel: Essen">Lebensmittel: Essen</option>
                        <option value="Auswärts: Essen">Auswärts: Essen</option>
                        <option value="Verkehrsmittel">Verkehrsmittel</option>
                        <option value="Sport: Unterhaltung">Sport: Unterhaltung</option>
                        <option value="Medizinisch: Leben">Medizinisch: Leben</option>
                        <option value="Kleidung: Leben">Kleidung: Leben</option>
                        <option value="Geschenke: Leben">Geschenke: Leben</option>
                        <option value="Überweisen">Überweisen</option>
                    </optgroup>
                    <optgroup label="Leben">
                        <option value="Betreuung: Leben">Betreuung: Leben</option>
                        <option value="Andere: Leben">Andere: Leben</option>
                    </optgroup>
                    <optgroup label="Zuhause">
                        <option value="Miete: Zuhause">Miete: Zuhause</option>
                        <option value="Haushaltwaren: Zuhause">Haushaltwaren: Zuhause</option>
                        <option value="Elektronik: Zuhause">Elektronik: Zuhause</option>
                        <option value="Andere: Zuhause">Andere: Zuhause</option>
                    </optgroup>
                    <optgroup label="Unterhaltung">
                        <option value="Spielzeuge: Unterhaltung">Spielzeuge: Unterhaltung</option>
                        <option value="Andere: Unterhaltung">Andere: Unterhaltung</option>
                    </optgroup>
                    <optgroup label="Versorgungsunternehmen">
                        <option value="Breitband: Versorgungsunternehmen">Breitband: Versorgungsunternehmen</option>
                    </optgroup>
                </select>
            </label>

            <div>
                <span class="text-sm font-medium text-slate-700">Währung</span>
                <div class="seg mt-1 flex">
                    <input type="radio" name="currency" id="cur-chf" value="CHF" checked>
                    <label for="cur-chf">CHF</label>
                    <input type="radio" name="currency" id="cur-eur" value="EUR">
                    <label for="cur-eur">EUR</label>
                    <input type="radio" name="currency" id="cur-usd" value="USD">
                    <label for="cur-usd">USD</label>
                    <input type="radio" name="currency" id="cur-rub" value="RUB">
                    <label for="cur-rub">RUB</label>
                    <input type="radio" name="currency" id="cur-afn" value="AFN" data-currency-afn>
                    <label for="cur-afn" data-currency-afn title="Stunden — 1 AFN entspricht 1 Stunde">AFN</label>
                </div>
                <label id="amexRow" class="mt-2 flex items-center gap-2 hidden">
                    <input type="checkbox" id="amex"
                        class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                    <span class="text-sm text-slate-700">Mit CHF Amex-Karte bezahlt — in CHF umrechnen</span>
                </label>
                <p id="amexPreview" class="text-xs text-slate-500 mt-1 hidden"></p>
            </div>

            <div id="paidByRow">
                <span class="text-sm font-medium text-slate-700">Bezahlt von</span>
                <div class="seg mt-1 flex">
                    <input type="radio" name="paidBy" id="paid-andrey" value="Andrey" checked>
                    <label for="paid-andrey">Andrey</label>
                    <input type="radio" name="paidBy" id="paid-katia" value="Katia">
                    <label for="paid-katia">Katia</label>
                </div>
            </div>

            <label class="block">
                <span class="text-sm font-medium text-slate-700">Datum</span>
                <input id="date" type="date" required
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </label>

            <button id="submit" type="submit"
                class="w-full rounded-lg bg-indigo-600 text-white text-lg font-semibold px-4 py-3 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-50 disabled:cursor-not-allowed">
                Speichern
            </button>

            <p id="status" class="text-sm text-slate-600 min-h-[1.25rem] text-center" aria-live="polite"></p>
            <pre id="debug" class="text-xs text-slate-500 bg-slate-100 rounded-lg p-2 overflow-x-auto whitespace-pre-wrap break-words hidden"></pre>
        </form>

        <section class="mt-6">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-sm font-semibold text-slate-700">Letzte Buchungen</h2>
                <button id="refresh" type="button"
                    class="text-xs text-indigo-600 hover:text-indigo-800">Aktualisieren</button>
            </div>
            <ul id="recent" class="space-y-2"></ul>
            <div id="recentLoader" class="hidden py-6 flex justify-center">
                <div class="h-6 w-6 rounded-full border-2 border-slate-300 border-t-indigo-600 animate-spin"></div>
            </div>
            <p id="recentStatus" class="text-xs text-slate-400 mt-2 text-center"></p>
        </section>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyKCfEYka8l7KoNwnbcxSy1isH9NX_j3Z4lnp9Gw8Ypitv-zMZwHEIuPhYh1IeshSF_/exec';

        const DEFAULTS = {
            currency: 'CHF',
            paidBy: 'Andrey',
        };

        const form = document.getElementById('form');
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const submitBtn = document.getElementById('submit');
        const dateEl = document.getElementById('date');
        const amountEl = document.getElementById('amount');
        const noteEl = document.getElementById('note');
        const categoryEl = document.getElementById('category');
        const amexRow = document.getElementById('amexRow');
        const amexEl = document.getElementById('amex');
        const amexPreviewEl = document.getElementById('amexPreview');
        const paidByRow = document.getElementById('paidByRow');

        // Foreign currency charged on a CHF Amex card: convert to CHF at the
        // live rate plus a fixed card commission.
        const AMEX_COMMISSION = 0.025;
        const AMEX_CONVERTIBLE = ['EUR', 'USD'];

        // Different sheets have different most-likely categories.
        const SHEET_DEFAULT_CATEGORY = {
            Common: 'Lebensmittel: Essen',
            Personal: 'Auswärts: Essen',
        };

        // AFN tracks hours owed between us (1 AFN = 1 Stunde @ 30 CHF). The
        // category is always Überweisen and takes precedence over the
        // note-based guess.
        const CURRENCY_DEFAULT_CATEGORY = {
            AFN: 'Überweisen',
        };

        // Substring patterns in the note → category. Order matters: more
        // specific patterns first (e.g. "salsa party" before plain "salsa").
        const CATEGORY_RULES = [
            [['salsa party'],                                                                'Andere: Unterhaltung'],
            [['salsa', 'bachata', 'salsarica'],                                              'Sport: Unterhaltung'],
            [['migros', 'coop', 'denner', 'hellofresh'],                                     'Lebensmittel: Essen'],
            [['sbb', 'tram', 'publibike', 'bolt', 'taxi'],                                   'Verkehrsmittel'],
            [['krankenkasse', 'krankenpflege', 'zahnarzt', 'apotheke', 'arzt',
              'impfung', 'antihistamin', 'symbicort', 'ventolin'],                           'Medizinisch: Leben'],
            [['bier', 'kaffee', 'tee', 'mcdonalds', 'sushi', 'brot&ware', 'pizza', 'kebab'], 'Auswärts: Essen'],
            [['splitwise', 'bargeld', 'stunde wechsel', 'abholen', 'verdorben'],             'Überweisen'],
            [['miete', 'nebenkosten'],                                                       'Miete: Zuhause'],
            [['betreuung', 'kita', 'afn'],                                                   'Betreuung: Leben'],
            [['fiber', 'globaltel', 'breitband', 'mobilfunk'],                               'Breitband: Versorgungsunternehmen'],
            [['schuhe', 'jacke', 'hose', 'hemd', 't-shirt', 'tshirt', 'kleidung',
              'unterwäsche', 'socken', 'sandalen', 'hausschuhe'],                            'Kleidung: Leben'],
        ];

        function guessCategory(note) {
            const n = String(note || '').toLowerCase();
            if (!n) return null;
            for (const [keywords, cat] of CATEGORY_RULES) {
                if (keywords.some(k => n.includes(k))) return cat;
            }
            return null;
        }

        // Track whether the user has manually picked a category since the
        // last reset / sheet switch. While false, auto-suggest is in charge.
        let categoryUserOverridden = false;

        function applyCategoryDefault() {
            if (categoryUserOverridden) return;
            const currencyOverride = CURRENCY_DEFAULT_CATEGORY[selectedCurrency()];
            const guess = guessCategory(noteEl.value);
            categoryEl.value = currencyOverride
                || guess
                || SHEET_DEFAULT_CATEGORY[selectedSheet()];
        }

        function todayISO() {
            const d = new Date();
            const tz = d.getTimezoneOffset() * 60000;
            return new Date(d - tz).toISOString().slice(0, 10);
        }

        function selectedCurrency() {
            return document.querySelector('input[name="currency"]:checked').value;
        }

        function selectedSheet() {
            return document.querySelector('input[name="sheet"]:checked').value;
        }

        function syncSheetUI() {
            const personal = selectedSheet() === 'Personal';
            // Personal expenses are always Andrey's, so don't ask.
            paidByRow.classList.toggle('hidden', personal);
            // AFN (Stunden) only makes sense on the Common sheet.
            document.querySelectorAll('[data-currency-afn]')
                .forEach(el => el.classList.toggle('hidden', personal));
            if (personal && selectedCurrency() === 'AFN') {
                document.querySelector('input[name="currency"][value="CHF"]').checked = true;
                syncAmexUI();
            }
        }

        document.querySelectorAll('input[name="sheet"]').forEach(el =>
            el.addEventListener('change', () => {
                syncSheetUI();
                // Switching sheets revisits the default category, but only
                // if the user hasn't already picked one manually.
                applyCategoryDefault();
                loadRecent();
            }));

        // User picking a category from the dropdown locks in their choice.
        categoryEl.addEventListener('change', () => { categoryUserOverridden = true; });
        // Note keystrokes re-evaluate the auto-suggest while not overridden.
        noteEl.addEventListener('input', applyCategoryDefault);

        function resetToDefaults() {
            amountEl.value = '';
            noteEl.value = '';
            categoryUserOverridden = false;
            categoryEl.value = SHEET_DEFAULT_CATEGORY[selectedSheet()];
            document.querySelector(`input[name="currency"][value="${DEFAULTS.currency}"]`).checked = true;
            document.querySelector(`input[name="paidBy"][value="${DEFAULTS.paidBy}"]`).checked = true;
            dateEl.value = todayISO();
            amexEl.checked = false;
            syncAmexUI();
        }

        // Rates to CHF cached per currency per session (they barely move).
        const rateCache = {};
        async function getRateToChf(from) {
            if (rateCache[from]) return rateCache[from];
            const res = await fetch(
                `https://api.frankfurter.dev/v1/latest?base=${from}&symbols=CHF`);
            if (!res.ok) throw new Error('Wechselkurs nicht verfügbar');
            const data = await res.json();
            const rate = data && data.rates && data.rates.CHF;
            if (!rate) throw new Error('Wechselkurs nicht verfügbar');
            rateCache[from] = { rate, date: data.date };
            return rateCache[from];
        }

        function toChf(amountEur, rate) {
            return Math.round(amountEur * rate * (1 + AMEX_COMMISSION) * 100) / 100;
        }

        async function syncAmexUI() {
            const cur = selectedCurrency();
            const convertible = AMEX_CONVERTIBLE.includes(cur);
            amexRow.classList.toggle('hidden', !convertible);
            if (!convertible) amexEl.checked = false;
            const active = convertible && amexEl.checked;
            amexPreviewEl.classList.toggle('hidden', !active);
            if (!active) { amexPreviewEl.textContent = ''; return; }
            const amt = parseFloat(amountEl.value);
            if (!Number.isFinite(amt) || amt <= 0) {
                amexPreviewEl.textContent = `Betrag in ${cur} eingeben…`;
                return;
            }
            amexPreviewEl.textContent = 'Wechselkurs lädt…';
            try {
                const { rate, date } = await getRateToChf(cur);
                amexPreviewEl.textContent =
                    `${amt} ${cur} → ${toChf(amt, rate).toFixed(2)} CHF `
                    + `(Kurs ${rate} vom ${date} + 2,5%)`;
            } catch (_) {
                amexPreviewEl.textContent = 'Wechselkurs konnte nicht geladen werden.';
            }
        }

        document.querySelectorAll('input[name="currency"]').forEach(
            el => el.addEventListener('change', () => {
                syncAmexUI();
                applyCategoryDefault();
            }));
        amexEl.addEventListener('change', syncAmexUI);
        amountEl.addEventListener('input', () => { if (amexEl.checked) syncAmexUI(); });

        resetToDefaults();

        function setStatus(text, kind) {
            const colors = { ok: 'text-green-700', err: 'text-red-700', info: 'text-slate-600' };
            statusEl.textContent = text;
            statusEl.className = `text-sm min-h-[1.25rem] text-center ${colors[kind] || colors.info}`;
        }

        function newRequestId() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
            return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        }

        function isRetryableError(err) {
            const msg = String(err && err.message || err || '');
            if (/server hat nicht|ungültig|invalid|unknown category/i.test(msg)) return false;
            // 404 happens on some Apps Script redirect/wake glitches — retry; manual
            // re-save must reuse the same requestId (see pending save id below).
            return /failed to fetch|network|timeout|unexpected|HTTP 404|HTTP 408|HTTP 429|HTTP 5\d\d/i.test(msg);
        }

        // One requestId per unsaved form snapshot so a manual re-tap after an error
        // (or our automatic retry) cannot create a second row.
        let pendingSaveId = null;
        let pendingSaveKey = null;

        function savePayloadKey(payload) {
            const copy = Object.assign({}, payload);
            delete copy.requestId;
            return JSON.stringify(copy);
        }

        function assignPendingRequestId(payload) {
            const key = savePayloadKey(payload);
            if (pendingSaveId && pendingSaveKey === key) {
                payload.requestId = pendingSaveId;
            } else {
                pendingSaveId = newRequestId();
                pendingSaveKey = key;
                payload.requestId = pendingSaveId;
            }
        }

        function clearPendingRequestId() {
            pendingSaveId = null;
            pendingSaveKey = null;
        }

        function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

        function retryDelayMs(attemptIndex, baseMs) {
            return baseMs * Math.pow(2, attemptIndex);
        }

        function shortError(err) {
            const msg = String(err && err.message || err || 'Unbekannter Fehler').trim();
            return msg.length > 72 ? msg.slice(0, 69) + '…' : msg;
        }

        function retryStatusMessage(err, failedAttemptIndex, maxAttempts, delaySec) {
            const next = failedAttemptIndex + 2;
            const secs = delaySec === 1 ? '1 Sekunde' : delaySec + ' Sekunden';
            return 'Anfrage fehlgeschlagen (' + shortError(err) + '). Versuch ' + next + '/' +
                maxAttempts + ' in ' + secs + '…';
        }

        async function sleepWithCountdown(ms, onTick) {
            if (!onTick || ms <= 0) {
                await sleep(ms);
                return;
            }
            const ticks = Math.ceil(ms / 1000);
            for (let t = 0; t < ticks; t++) {
                onTick(ticks - t);
                const slice = t === ticks - 1 ? ms - t * 1000 : 1000;
                if (slice > 0) await sleep(slice);
            }
        }


        async function postExpense(payload) {
            const res = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload),
            });
            const text = await res.text();
            if (!res.ok) throw new Error('HTTP ' + res.status);
            let parsed;
            try { parsed = JSON.parse(text); } catch (_) { parsed = null; }
            if (!parsed) throw new Error('Unexpected response from server.');
            if (parsed.ok !== true) {
                throw new Error(parsed.error ? parsed.error : 'Server hat nicht ok zurückgegeben');
            }
            return { parsed, text, status: res.status };
        }

        async function postExpenseWithRetry(payload, opts) {
            opts = opts || {};
            const attempts = opts.attempts || 4;
            const baseMs = opts.baseMs || 1000;
            if (!payload.requestId) payload.requestId = newRequestId();
            let lastErr;
            for (let i = 0; i < attempts; i++) {
                try {
                    return await postExpense(payload);
                } catch (err) {
                    lastErr = err;
                    if (!isRetryableError(err) || i === attempts - 1) throw err;
                    const delayMs = retryDelayMs(i, baseMs);
                    const notify = (delaySec) => {
                        const message = retryStatusMessage(err, i, attempts, delaySec);
                        if (opts.onRetry) opts.onRetry({ attempt: i + 1, maxAttempts: attempts, delaySec, message });
                    };
                    await sleepWithCountdown(delayMs, notify);
                }
            }
            throw lastErr;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const sheet = selectedSheet();
            const payload = {
                sheet,
                date: dateEl.value,
                amount: parseFloat(amountEl.value),
                note: noteEl.value.trim(),
                category: categoryEl.value,
                currency: selectedCurrency(),
            };
            if (sheet === 'Common') {
                payload.paidBy = document.querySelector('input[name="paidBy"]:checked').value;
            }

            submitBtn.disabled = true;
            setStatus('Speichern…', 'info');
            debugEl.classList.add('hidden');
            debugEl.textContent = '';

            const showDebug = (label, body) => {
                debugEl.textContent = `→ sent:\n${JSON.stringify(payload, null, 2)}\n\n← ${label}:\n${body}`;
                debugEl.classList.remove('hidden');
            };

            try {
                if (amexEl.checked && AMEX_CONVERTIBLE.includes(payload.currency)) {
                    const orig = payload.amount;
                    const origCur = payload.currency;
                    const { rate } = await getRateToChf(origCur);
                    payload.amount = toChf(orig, rate);
                    payload.currency = 'CHF';
                    payload.note = [payload.note, orig + ' ' + origCur]
                        .filter(Boolean).join(' ');
                }

                assignPendingRequestId(payload);
                const { parsed, text, status } = await postExpenseWithRetry(payload, {
                    onRetry: ({ message }) => setStatus(message, 'info'),
                });
                clearPendingRequestId();
                setStatus(`Gespeichert ✓ (v${parsed.version || '?'})`, 'ok');
                showDebug(`HTTP ${status}`, text);
                resetToDefaults();
                amountEl.focus();
                loadRecent(); // fire-and-forget; form stays usable
            } catch (err) {
                showDebug('error', String(err.message || err));
                setStatus('Fehler: ' + err.message, 'err');
            } finally {
                submitBtn.disabled = false;
            }
        });

        const recentEl = document.getElementById('recent');
        const recentStatusEl = document.getElementById('recentStatus');
        const recentLoaderEl = document.getElementById('recentLoader');
        const refreshBtn = document.getElementById('refresh');

        function fmtDate(v) {
            if (!v) return '';
            // Apps Script serializes a Date cell as an ISO string; a text cell
            // comes back as-is. Either way, keep the YYYY-MM-DD prefix.
            const m = String(v).match(/^\d{4}-\d{2}-\d{2}/);
            return m ? m[0] : String(v);
        }

        function fmtAmount(v) {
            const n = Number(v);
            return Number.isFinite(n) ? n.toFixed(2) : String(v ?? '');
        }

        function renderRecent(rows) {
            recentEl.innerHTML = '';
            if (!rows || rows.length === 0) {
                recentStatusEl.textContent = 'Noch keine Buchungen.';
                return;
            }
            for (const r of rows) {
                const li = document.createElement('li');
                li.className = 'bg-white rounded-lg shadow-sm px-3 py-2 text-sm';
                li.innerHTML = `
                    <div class="flex items-baseline justify-between gap-2">
                        <span class="font-semibold text-slate-900">${fmtAmount(r.amount)} ${escapeHtml(r.currency || '')}</span>
                        <span class="text-xs text-slate-400">${escapeHtml(fmtDate(r.date))}</span>
                    </div>
                    <div class="text-slate-600 truncate">${escapeHtml(r.note || '')}</div>
                    <div class="text-xs text-slate-400 flex justify-between gap-2">
                        <span class="truncate">${escapeHtml(r.category || '')}</span>
                        <span>${escapeHtml(r.paidBy || '')}</span>
                    </div>`;
                recentEl.appendChild(li);
            }
            recentStatusEl.textContent = '';
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        let recentSeq = 0;
        async function loadRecent() {
            const seq = ++recentSeq;
            recentEl.classList.add('hidden');
            recentLoaderEl.classList.remove('hidden');
            recentStatusEl.textContent = '';
            try {
                const url = WEB_APP_URL + '?sheet=' + encodeURIComponent(selectedSheet());
                const res = await fetch(url, { method: 'GET' });
                const text = await res.text();
                if (seq !== recentSeq) return; // a newer load superseded this one
                let parsed;
                try { parsed = JSON.parse(text); } catch (_) { parsed = null; }
                if (!parsed || parsed.ok !== true || !Array.isArray(parsed.rows)) {
                    recentStatusEl.textContent = 'Konnte Buchungen nicht laden.';
                    return;
                }
                renderRecent(parsed.rows);
            } catch (err) {
                if (seq !== recentSeq) return;
                recentStatusEl.textContent = 'Konnte Buchungen nicht laden.';
            } finally {
                if (seq === recentSeq) {
                    recentLoaderEl.classList.add('hidden');
                    recentEl.classList.remove('hidden');
                }
            }
        }

        refreshBtn.addEventListener('click', loadRecent);
        loadRecent(); // async on page load; never blocks the form
    </script>
</body>
</html>
