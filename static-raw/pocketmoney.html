<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d9488">
    <title>Pocket Money</title>
    <!-- Tailwind Play CDN pinned to an exact version. See the long-form note in
         multiply_kittens.html / CLAUDE.md for why floating tags are unsafe here
         (Babel 8.0.0 silently broke a page on 2026-06-16). -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        /* Keep inputs at 16px so iOS doesn't auto-zoom on focus. */
        input, select, textarea, button { font-size: 16px; }
    </style>
</head>
<body class="antialiased bg-slate-50 min-h-screen">
    <div class="max-w-md mx-auto p-4">
        <header class="mb-4">
            <h1 class="text-2xl font-bold text-slate-900">Pocket Money</h1>
            <p id="subtitle" class="text-sm text-slate-500 truncate">Your virtual account</p>
        </header>

        <!-- Parent login (shown on the base URL, i.e. no personal ?k= link). -->
        <form id="loginForm" class="hidden space-y-4 bg-white rounded-2xl shadow-sm p-4">
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Parent PIN</span>
                <input id="loginPin" type="password" inputmode="numeric" autocomplete="off"
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </label>
            <button id="loginBtn" type="submit"
                class="w-full rounded-lg bg-teal-600 text-white text-lg font-semibold px-4 py-3 hover:bg-teal-700 active:bg-teal-800 disabled:opacity-50 disabled:cursor-not-allowed">
                OK
            </button>
            <p id="loginStatus" class="text-sm text-slate-600 min-h-[1.25rem] text-center" aria-live="polite"></p>
        </form>

        <!-- Kid view: locked to one account via the ?k=<key> in the URL. -->
        <div id="kidView" class="hidden">
            <section class="bg-white rounded-2xl shadow-sm p-5 text-center mb-4">
                <p class="text-xs uppercase tracking-wide text-slate-400">Remaining balance</p>
                <p id="balance" class="text-4xl font-bold text-slate-900 mt-1">–</p>
                <p id="balanceHint" class="text-xs text-slate-400 mt-1"></p>
            </section>

            <form id="spendForm" class="space-y-4 bg-white rounded-2xl shadow-sm p-4">
                <h2 class="text-sm font-semibold text-slate-700">Spend money</h2>
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">How much did you spend?</span>
                    <div class="mt-1 flex items-stretch">
                        <span class="inline-flex items-center rounded-l-lg border border-r-0 border-slate-300 px-3 bg-slate-100 text-slate-500 text-sm">CHF</span>
                        <input id="spendAmount" type="number" inputmode="decimal" step="0.01" min="0" required
                            class="w-full rounded-r-lg border border-slate-300 px-3 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-teal-500" />
                    </div>
                </label>
                <label class="block">
                    <span class="text-sm font-medium text-slate-700">What did you buy?</span>
                    <input id="spendNote" type="text" autocomplete="off" placeholder="e.g. sweets"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
                </label>
                <button id="spendBtn" type="submit"
                    class="w-full rounded-lg bg-teal-600 text-white text-lg font-semibold px-4 py-3 hover:bg-teal-700 active:bg-teal-800 disabled:opacity-50 disabled:cursor-not-allowed">
                    Record expense
                </button>
                <p id="spendStatus" class="text-sm text-slate-600 min-h-[1.25rem] text-center" aria-live="polite"></p>
            </form>

            <section class="mt-6">
                <div class="flex items-center justify-between mb-2">
                    <h2 class="text-sm font-semibold text-slate-700">Recent activity</h2>
                    <button id="refresh" type="button" class="text-xs text-teal-600 hover:text-teal-800">Refresh</button>
                </div>
                <ul id="recent" class="space-y-2"></ul>
                <div id="recentLoader" class="hidden py-6 flex justify-center">
                    <div class="h-6 w-6 rounded-full border-2 border-slate-300 border-t-teal-600 animate-spin"></div>
                </div>
                <p id="recentStatus" class="text-xs text-slate-400 mt-2 text-center"></p>
            </section>
        </div>

        <!-- Parent panel (revealed once the PIN is accepted). -->
        <div id="adminPanel" class="hidden space-y-4">
            <div id="adminAccounts" class="bg-slate-50 rounded-2xl shadow-sm p-4">
                <p class="text-xs font-medium text-slate-500 mb-2">Balances &amp; private links</p>
                <div id="adminAccountsList" class="space-y-3 text-xs text-slate-500"></div>
            </div>

            <form id="adminForm" class="space-y-4 bg-white rounded-2xl shadow-sm p-4">
            <h2 class="text-sm font-semibold text-slate-700">Add or charge money</h2>

            <label class="block">
                <span class="text-sm font-medium text-slate-700">Action</span>
                <select id="adminMode"
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                    <option value="credit">Add money</option>
                    <option value="charge">Charge / loan (can go below 0)</option>
                </select>
            </label>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Account</span>
                <select id="adminAccount"
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                </select>
            </label>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Amount</span>
                <div class="mt-1 flex items-stretch">
                    <span class="inline-flex items-center rounded-l-lg border border-r-0 border-slate-300 px-3 bg-slate-100 text-slate-500 text-sm">CHF</span>
                    <input id="adminAmount" type="number" inputmode="decimal" step="0.01" min="0"
                        class="w-full rounded-r-lg border border-slate-300 px-3 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-teal-500" />
                </div>
            </label>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Note</span>
                <input id="adminNote" type="text" autocomplete="off" placeholder="e.g. 5 days at school"
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-3 focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </label>
            <button id="adminBtn" type="submit"
                class="w-full rounded-lg bg-emerald-600 text-white text-lg font-semibold px-4 py-3 hover:bg-emerald-700 active:bg-emerald-800 disabled:opacity-50 disabled:cursor-not-allowed">
                Add money
            </button>
            <p id="adminStatus" class="text-sm text-slate-600 min-h-[1.25rem] text-center" aria-live="polite"></p>
            </form>
        </div>

        <p id="configNotice" class="hidden text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3 mt-4"></p>
        <p class="text-[11px] text-slate-300 text-center mt-6" id="footer"></p>
    </div>

    <script>
    (function () {
        'use strict';

        // ─── Config ─────────────────────────────────────────────────────────
        // Deploy pocketmoney.gs as a Google Apps Script web app and paste its
        // /exec URL here. Until then the app runs in read-only demo mode.
        //
        // NOTE: no kids' names or keys live in this file. Each kid opens the app
        // through their own private link (…/pocketmoney.html?k=<secret>); the
        // secret→account mapping and the parent PIN live only on the server
        // (see pocketmoney.gs), so nothing here is sensitive to view-source.
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyKCfEYka8l7KoNwnbcxSy1isH9NX_j3Z4lnp9Gw8Ypitv-zMZwHEIuPhYh1IeshSF_/exec';

        // The tab/sheet inside the spreadsheet where rows are appended.
        const SHEET_NAME = 'PocketMoney';

        const CURRENCY = 'CHF';
        const VERSION = '1.8';

        // ─── Pure, DOM-free logic (also exercised by the ?test self-test) ─────

        // Round to 2 decimals, dodging binary-float drift (e.g. 0.1+0.2).
        function roundMoney(n) {
            return Math.round((Number(n) + Number.EPSILON) * 100) / 100;
        }

        // A row is { account, type: 'credit'|'expense', amount, note, date, by }.
        // Balance = sum of credits minus sum of expenses, per account.
        function computeBalances(rows) {
            const out = {};
            for (const r of (rows || [])) {
                const amt = Number(r.amount) || 0;
                const signed = r.type === 'credit' ? amt : -amt;
                out[r.account] = (out[r.account] || 0) + signed;
            }
            for (const k of Object.keys(out)) out[k] = roundMoney(out[k]);
            return out;
        }

        function balanceFrom(rows, account) {
            return computeBalances(rows)[account] || 0;
        }

        function formatMoney(n) {
            return CURRENCY + ' ' + roundMoney(n).toFixed(2);
        }

        // A kid may only spend what they actually have.
        function validateSpend(balance, amount) {
            if (!Number.isFinite(amount) || amount <= 0) {
                return { ok: false, error: 'Enter an amount greater than 0.' };
            }
            if (roundMoney(amount) > roundMoney(balance) + 1e-9) {
                return { ok: false, error: 'That is more than you have.' };
            }
            return { ok: true };
        }

        function runTests() {
            const results = [];
            const ok = (name, cond) => results.push({ name, pass: !!cond });

            ok('roundMoney fixes float drift', roundMoney(0.1 + 0.2) === 0.3);
            ok('roundMoney rounds to 2dp', roundMoney(1.005) === 1.0 || roundMoney(1.005) === 1.01);

            const rows = [
                { account: 'A', type: 'credit', amount: 5 },
                { account: 'A', type: 'expense', amount: 3 },
                { account: 'B', type: 'credit', amount: 10 },
            ];
            const bal = computeBalances(rows);
            ok('credit minus expense (5 - 3 = 2)', bal.A === 2);
            ok('separate accounts tracked', bal.B === 10);
            ok('balanceFrom reads one account', balanceFrom(rows, 'A') === 2);
            ok('balanceFrom unknown account is 0', balanceFrom(rows, 'Z') === 0);
            ok('empty rows give empty balances', Object.keys(computeBalances([])).length === 0);

            ok('formatMoney adds currency + 2dp', formatMoney(2) === 'CHF 2.00');
            ok('formatMoney handles decimals', formatMoney(2.5) === 'CHF 2.50');
            ok('formatMoney shows negative (debt)', formatMoney(-2) === 'CHF -2.00');

            ok('spend more than balance rejected', validateSpend(2, 3).ok === false);
            ok('spend exactly balance allowed', validateSpend(2, 2).ok === true);
            ok('spend part of balance allowed', validateSpend(2, 1).ok === true);
            ok('spend zero rejected', validateSpend(5, 0).ok === false);
            ok('spend negative rejected', validateSpend(5, -1).ok === false);

            const passed = results.filter((r) => r.pass).length;
            const failed = results.length - passed;
            for (const r of results) console.log((r.pass ? 'PASS' : 'FAIL') + ' \u2014 ' + r.name);
            console.log(passed + ' passed, ' + failed + ' failed');
            return { passed, failed };
        }

        // Headless (node) or ?test in the browser: run tests and stop.
        const isBrowser = typeof document !== 'undefined';
        if (!isBrowser) {
            const res = runTests();
            if (typeof process !== 'undefined') process.exit(res.failed ? 1 : 0);
            return;
        }
        if (location.search.indexOf('test') !== -1) {
            const res = runTests();
            document.body.innerHTML =
                '<pre style="padding:1rem">' + res.passed + ' passed, ' + res.failed + ' failed</pre>';
            return;
        }

        // ─── Mode + state ──────────────────────────────────────────────────────
        const params = new URLSearchParams(location.search);
        const kidKey = params.get('k') || params.get('key'); // present => locked kid mode
        let kidAccount = null;   // resolved by the server from the key; also the shown name
        let kidBalance = 0;
        let kidRows = [];

        // Parent-panel state, populated after the PIN unlocks an overview.
        let adminBalances = {};
        let adminKeys = {};      // account → secret key, for building share links
        let adminPinValue = '';  // the accepted PIN, reused for add/charge this session

        // ─── DOM refs ─────────────────────────────────────────────────────────
        const subtitle = document.getElementById('subtitle');
        const kidView = document.getElementById('kidView');
        const balanceEl = document.getElementById('balance');
        const balanceHintEl = document.getElementById('balanceHint');
        const spendForm = document.getElementById('spendForm');
        const spendAmount = document.getElementById('spendAmount');
        const spendNote = document.getElementById('spendNote');
        const spendBtn = document.getElementById('spendBtn');
        const spendStatus = document.getElementById('spendStatus');
        const loginForm = document.getElementById('loginForm');
        const loginPin = document.getElementById('loginPin');
        const loginBtn = document.getElementById('loginBtn');
        const loginStatus = document.getElementById('loginStatus');
        const adminPanel = document.getElementById('adminPanel');
        const adminForm = document.getElementById('adminForm');
        const adminAccountsWrap = document.getElementById('adminAccounts');
        const adminAccountsList = document.getElementById('adminAccountsList');
        const adminMode = document.getElementById('adminMode');
        const adminAccount = document.getElementById('adminAccount');
        const adminAmount = document.getElementById('adminAmount');
        const adminNote = document.getElementById('adminNote');
        const adminBtn = document.getElementById('adminBtn');
        const adminStatus = document.getElementById('adminStatus');
        const recentEl = document.getElementById('recent');
        const recentStatusEl = document.getElementById('recentStatus');
        const recentLoaderEl = document.getElementById('recentLoader');
        const refreshBtn = document.getElementById('refresh');
        const configNotice = document.getElementById('configNotice');
        const footer = document.getElementById('footer');

        footer.textContent = 'Pocket Money v' + VERSION;

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        function setStatus(el, text, kind) {
            const colors = { ok: 'text-green-700', err: 'text-red-700', info: 'text-slate-600' };
            el.textContent = text;
            el.className = `text-sm min-h-[1.25rem] text-center ${colors[kind] || colors.info}`;
        }

        function configured() { return !!WEB_APP_URL; }

        function showConfigNotice() {
            configNotice.classList.remove('hidden');
            configNotice.textContent =
                'Not connected yet. Deploy pocketmoney.gs as a web app and paste its ' +
                '/exec URL into WEB_APP_URL at the top of this file.';
        }

        // ─── Rendering (kid) ───────────────────────────────────────────────────
        function renderBalance() {
            balanceEl.textContent = formatMoney(kidBalance);
            let cls, hint;
            if (kidBalance < 0) {
                cls = 'text-rose-600';
                hint = 'You owe ' + formatMoney(-kidBalance) + '.';
            } else if (kidBalance === 0) {
                cls = 'text-slate-400';
                hint = 'Nothing to spend right now.';
            } else {
                cls = 'text-slate-900';
                hint = '';
            }
            balanceEl.className = 'text-4xl font-bold mt-1 ' + cls;
            balanceHintEl.textContent = hint;
        }

        // Per request, the activity list just shows the note (no "type" label);
        // a green +/red − keeps "money in" vs "money out" glanceable.
        function renderRecent() {
            recentEl.innerHTML = '';
            if (!kidRows.length) { recentStatusEl.textContent = 'No activity yet.'; return; }
            for (const r of kidRows) {
                const credit = r.type === 'credit';
                const sign = credit ? '+' : '\u2212';
                const cls = credit ? 'text-emerald-600' : 'text-rose-600';
                const label = (r.note && r.note.trim()) || (credit ? 'Pocket money' : 'Spent');
                const li = document.createElement('li');
                li.className = 'bg-white rounded-lg shadow-sm px-3 py-2 text-sm flex items-baseline justify-between gap-2';
                li.innerHTML =
                    `<div class="min-w-0">
                        <div class="text-slate-700 truncate">${escapeHtml(label)}</div>
                        <div class="text-xs text-slate-400">${escapeHtml(r.date || '')}</div>
                    </div>
                    <span class="font-semibold whitespace-nowrap ${cls}">${sign}${escapeHtml(formatMoney(Number(r.amount) || 0))}</span>`;
                recentEl.appendChild(li);
            }
            recentStatusEl.textContent = '';
        }

        function renderKid() { renderBalance(); renderRecent(); }

        // ─── Networking ─────────────────────────────────────────────────────────
        async function postOp(payload) {
            const res = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload),
            });
            const text = await res.text();
            let parsed;
            try { parsed = JSON.parse(text); } catch (_) { parsed = null; }
            if (!parsed) throw new Error('Unexpected response from server.');
            if (parsed.ok !== true) throw new Error(parsed.error || 'Server error');
            return parsed;
        }

        function applyKidState(data) {
            if (!data) return;
            if (data.account) { kidAccount = data.account; subtitle.textContent = 'Hi, ' + data.account; }
            if (typeof data.balance === 'number') kidBalance = data.balance;
            if (Array.isArray(data.rows)) kidRows = data.rows;
        }

        let loadSeq = 0;
        async function loadKid() {
            if (!configured()) { showConfigNotice(); return; }
            const seq = ++loadSeq;
            recentEl.classList.add('hidden');
            recentLoaderEl.classList.remove('hidden');
            try {
                const url = WEB_APP_URL + '?k=' + encodeURIComponent(kidKey) +
                    '&sheet=' + encodeURIComponent(SHEET_NAME);
                const res = await fetch(url, { method: 'GET' });
                const text = await res.text();
                if (seq !== loadSeq) return;
                let parsed;
                try { parsed = JSON.parse(text); } catch (_) { parsed = null; }
                if (!parsed || parsed.ok !== true) {
                    recentStatusEl.textContent =
                        parsed && parsed.error ? parsed.error : 'Could not load your balance.';
                    return;
                }
                applyKidState(parsed);
                renderKid();
            } catch (_) {
                if (seq !== loadSeq) return;
                recentStatusEl.textContent = 'Could not load your balance.';
            } finally {
                if (seq === loadSeq) {
                    recentLoaderEl.classList.add('hidden');
                    recentEl.classList.remove('hidden');
                }
            }
        }

        // ─── Kid: record an expense ─────────────────────────────────────────────
        spendForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!configured()) { showConfigNotice(); return; }
            const amount = roundMoney(parseFloat(spendAmount.value));
            const check = validateSpend(kidBalance, amount);
            if (!check.ok) { setStatus(spendStatus, check.error, 'err'); return; }

            spendBtn.disabled = true;
            setStatus(spendStatus, 'Saving…', 'info');
            try {
                const parsed = await postOp({
                    op: 'expense',
                    sheet: SHEET_NAME,
                    key: kidKey,
                    amount,
                    note: spendNote.value.trim(),
                });
                applyKidState(parsed);
                renderKid();
                setStatus(spendStatus, 'Saved \u2713', 'ok');
                spendAmount.value = '';
                spendNote.value = '';
            } catch (err) {
                setStatus(spendStatus, 'Error: ' + err.message, 'err');
            } finally {
                spendBtn.disabled = false;
            }
        });

        // ─── Parent panel ───────────────────────────────────────────────────────
        // The kid's page lives at this URL; a private link just adds ?k=<key>.
        const shareBase = location.origin + location.pathname;
        const shareLabel = ('share' in navigator) ? 'Share' : 'Copy';

        function linkFor(account) {
            const key = adminKeys && adminKeys[account];
            return key ? shareBase + '?k=' + encodeURIComponent(key) : '';
        }

        // Read-only balances overview + each kid's private link (name = shown name).
        function renderAdminAccounts() {
            const accounts = Object.keys(adminBalances || {});
            if (!accounts.length) { adminAccountsWrap.classList.add('hidden'); return; }
            adminAccountsWrap.classList.remove('hidden');
            adminAccountsList.innerHTML = accounts.map((a) => {
                const bal = adminBalances[a];
                const balCls = bal < 0 ? 'text-rose-600' : 'text-slate-700';
                const link = linkFor(a);
                const linkRow = link ? `
                    <div class="flex gap-2 mt-1">
                        <input readonly value="${escapeHtml(link)}" data-link
                            class="flex-1 min-w-0 rounded border border-slate-200 bg-white px-2 py-1 text-[11px] text-slate-500">
                        <button type="button" data-share="${escapeHtml(link)}" data-name="${escapeHtml(a)}"
                            class="shrink-0 rounded border border-slate-300 px-2 py-1 text-xs font-medium text-slate-700 hover:bg-slate-100">
                            ${shareLabel}
                        </button>
                    </div>` : '';
                return `<div>
                    <div class="flex justify-between gap-2">
                        <span class="truncate font-medium text-slate-700">${escapeHtml(a)}</span>
                        <span class="font-semibold whitespace-nowrap ${balCls}">${escapeHtml(formatMoney(bal))}</span>
                    </div>${linkRow}
                </div>`;
            }).join('');
        }

        async function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(text);
                return;
            }
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
        }

        function flashButton(btn, text) {
            const orig = btn.textContent;
            btn.textContent = text;
            setTimeout(() => { btn.textContent = orig; }, 1500);
        }

        // Tap a link field to select it; the Share button opens the native share
        // sheet where supported, otherwise copies to the clipboard.
        adminAccountsList.addEventListener('click', async (e) => {
            const field = e.target.closest('input[data-link]');
            if (field) { field.focus(); field.select(); return; }
            const btn = e.target.closest('[data-share]');
            if (!btn) return;
            const link = btn.getAttribute('data-share');
            const name = btn.getAttribute('data-name') || '';
            try {
                if (navigator.share) {
                    await navigator.share({ title: 'Pocket Money — ' + name, url: link });
                } else {
                    await copyText(link);
                    flashButton(btn, 'Copied \u2713');
                }
            } catch (_) {
                // Share cancelled or unavailable — fall back to a copy.
                try { await copyText(link); flashButton(btn, 'Copied \u2713'); } catch (_) {}
            }
        });

        function fillAccountSelect(accounts) {
            const prev = adminAccount.value;
            adminAccount.innerHTML = accounts.map((a) =>
                `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
            if (accounts.indexOf(prev) !== -1) adminAccount.value = prev;
        }

        function applyAdminState(data) {
            if (!data) return;
            if (data.balances) adminBalances = data.balances;
            if (data.keys) adminKeys = data.keys;
            renderAdminAccounts();
            if (Array.isArray(data.accounts)) fillAccountSelect(data.accounts);
        }

        // "Add money" (credit) vs "Charge / loan" (a debit that may go below 0).
        function syncAdminMode() {
            const charge = adminMode.value === 'charge';
            adminBtn.textContent = charge ? 'Charge' : 'Add money';
            adminBtn.className =
                'w-full rounded-lg text-white text-lg font-semibold px-4 py-3 ' +
                'disabled:opacity-50 disabled:cursor-not-allowed ' +
                (charge ? 'bg-amber-600 hover:bg-amber-700 active:bg-amber-800'
                        : 'bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800');
            adminNote.placeholder = charge ? 'e.g. loan for a toy' : 'e.g. 5 days at school';
        }
        adminMode.addEventListener('change', syncAdminMode);
        syncAdminMode();

        // Parent login: the PIN both proves it's the parent and loads the
        // overview. On success the login form is swapped for the full panel.
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!configured()) { showConfigNotice(); return; }
            const pin = loginPin.value.trim();
            if (!pin) { setStatus(loginStatus, 'Enter the parent PIN.', 'err'); return; }
            loginBtn.disabled = true;
            setStatus(loginStatus, 'Checking…', 'info');
            try {
                const parsed = await postOp({ op: 'overview', sheet: SHEET_NAME, pin });
                adminPinValue = pin;
                applyAdminState(parsed);
                loginForm.classList.add('hidden');
                adminPanel.classList.remove('hidden');
                subtitle.textContent = 'Parent';
            } catch (err) {
                setStatus(loginStatus, /pin/i.test(err.message) ? 'Wrong PIN.' : ('Error: ' + err.message), 'err');
            } finally {
                loginBtn.disabled = false;
            }
        });

        adminForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!configured()) { showConfigNotice(); return; }
            const account = adminAccount.value;
            if (!account) { setStatus(adminStatus, 'Pick an account first.', 'err'); return; }
            const amount = roundMoney(parseFloat(adminAmount.value));
            if (!Number.isFinite(amount) || amount <= 0) {
                setStatus(adminStatus, 'Enter an amount greater than 0.', 'err');
                return;
            }
            const pin = adminPinValue;
            if (!pin) { setStatus(adminStatus, 'Session expired — reload and enter the PIN again.', 'err'); return; }
            const charge = adminMode.value === 'charge';

            adminBtn.disabled = true;
            setStatus(adminStatus, charge ? 'Charging…' : 'Adding…', 'info');
            try {
                const parsed = await postOp({
                    op: charge ? 'charge' : 'credit',
                    sheet: SHEET_NAME,
                    account,
                    amount,
                    note: adminNote.value.trim(),
                    pin,
                });
                applyAdminState(parsed);
                setStatus(adminStatus,
                    (charge ? 'Charged ' : 'Added ') + formatMoney(amount) +
                    (charge ? ' from ' : ' to ') + account + ' \u2713', 'ok');
                adminAmount.value = '';
                adminNote.value = '';
                // If the parent is standing at this kid's device, reflect it live.
                if (kidKey) loadKid();
            } catch (err) {
                setStatus(adminStatus, 'Error: ' + err.message, 'err');
            } finally {
                adminBtn.disabled = false;
            }
        });

        // ─── Boot ─────────────────────────────────────────────────────────────
        refreshBtn.addEventListener('click', loadKid);

        if (kidKey) {
            // Locked kid mode: only this account is ever shown or spendable.
            kidView.classList.remove('hidden');
            if (!configured()) showConfigNotice();
            loadKid();
        } else {
            // Base URL = the parent's login. The PIN prompt is shown straight
            // away; entering the correct PIN reveals the full panel.
            subtitle.textContent = 'Parent';
            loginForm.classList.remove('hidden');
            if (!configured()) showConfigNotice();
            loginPin.focus();
        }
    })();
    </script>
</body>
</html>
