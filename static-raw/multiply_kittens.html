<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes coin-fly {
            0% { transform: translate(-50%, 0) scale(1) rotate(0deg); opacity: 1; }
            20% { transform: translate(-50%, -60px) scale(1.5) rotate(20deg); }
            100% { transform: translate(calc(var(--target-x) - 50%), var(--target-y)) scale(0.3) rotate(360deg); opacity: 0; }
        }
        .animate-coin-fly { animation: coin-fly 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-spin-slow { animation: spin 3s linear infinite; }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-15px); }
            80% { transform: translateX(15px); }
        }
    </style>
</head>
<body class="antialiased bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;
    
    const W = [0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01, 1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61];
    const RETENTION_TARGET = 0.85;
    const INTERVAL_MODIFIER = Math.log(RETENTION_TARGET) / Math.log(0.9);
    
    const STORAGE_KEY = 'math_kittens_fsrs_state_v7';
    const QUEUE_SIZE = 5;
    // Bump by 0.01 with every merge to master so the kid can tell builds apart.
    const VERSION = '1.11';
    // Pace metric: keep the last N answer events ({coins, ms}); skip any
    // answer that took longer than DISTRACTION_MS (likely interrupted).
    const PACE_WINDOW = 100;
    const DISTRACTION_MS = 60_000;

    // Op registry — each handler knows how to generate fresh operands, derive a
    // stable id, compute the answer, build a typed breakdown, and render the
    // prompt. Adding division or carry-addition later means adding an entry
    // here, not touching the engine.
    const OPS = {
        mul: {
            generate: () => ({
                a: Math.floor(Math.random() * 11) + 2,
                b: Math.floor(Math.random() * 11) + 2,
            }),
            idOf: (a, b) => `mul:${Math.min(a, b)}x${Math.max(a, b)}`,
            compute: (a, b) => a * b,
            label: (a, b) => `${a} × ${b}`,
            strategy: (a, b) => getMultiplicationStrategy(a, b),
            renderPrompt: ({ a, b }) => (
                <>
                    <span>{a}</span>
                    <span className="text-indigo-500 text-3xl">×</span>
                    <span>{b}</span>
                </>
            ),
        },
        add: {
            // 2-digit + 1-digit, ones digits force a carry: (a%10) + b > 10, a+b ≤ 100.
            generate: () => {
                for (let i = 0; i < 100; i++) {
                    const a = 11 + Math.floor(Math.random() * 81); // 11..91
                    const b = 2 + Math.floor(Math.random() * 8);   // 2..9
                    if ((a % 10) + b > 10 && a + b <= 100) return { a, b };
                }
                return { a: 73, b: 9 };
            },
            // Generator always produces (2-digit, 1-digit) in that order, so no commutativity rewrite needed.
            idOf: (a, b) => `add:${a}+${b}`,
            compute: (a, b) => a + b,
            label: (a, b) => `${a} + ${b}`,
            strategy: (a, b) => getAdditionStrategy(a, b),
            renderPrompt: ({ a, b }) => (
                <>
                    <span>{a}</span>
                    <span className="text-indigo-500 text-3xl">+</span>
                    <span>{b}</span>
                </>
            ),
        },
        sub: {
            // 2-digit − 1-digit with a borrow: ones digit of a is in [1, b-1] so
            // subtracting b crosses a ten. Excluding ones=0 keeps the
            // "step back to the round number" breakdown a clean two-step.
            generate: () => {
                for (let i = 0; i < 100; i++) {
                    const a = 12 + Math.floor(Math.random() * 88); // 12..99
                    const b = 2 + Math.floor(Math.random() * 8);   // 2..9
                    const ones = a % 10;
                    if (ones >= 1 && ones < b) return { a, b };
                }
                return { a: 75, b: 6 };
            },
            idOf: (a, b) => `sub:${a}-${b}`,
            compute: (a, b) => a - b,
            label: (a, b) => `${a} − ${b}`,
            strategy: (a, b) => getSubtractionStrategy(a, b),
            renderPrompt: ({ a, b }) => (
                <>
                    <span>{a}</span>
                    <span className="text-indigo-500 text-3xl">−</span>
                    <span>{b}</span>
                </>
            ),
        },
        div: {
            // Division framed as "find the missing factor": shown as a × ? = a·b.
            // Kid types b. Same operand space as mul (2..12) so it slots neatly
            // alongside multiplication facts she already practises.
            generate: () => ({
                a: Math.floor(Math.random() * 11) + 2,
                b: Math.floor(Math.random() * 11) + 2,
            }),
            // (a, b) and (b, a) are different probes (multiples-of-a vs multiples-of-b),
            // so the id is NOT commutative.
            idOf: (a, b) => `div:${a}_${b}`,
            compute: (a, b) => b,
            label: (a, b) => `${a} × ? = ${a * b}`,
            strategy: (a, b) => getDivisionStrategy(a, b),
            selfContained: true, // renderPrompt already shows the full equation
            renderPrompt: ({ a, b }) => (
                <>
                    <span>{a}</span>
                    <span className="text-indigo-500 text-3xl">×</span>
                    <span className="text-slate-400">?</span>
                    <span className="text-indigo-500 text-3xl">=</span>
                    <span>{a * b}</span>
                </>
            ),
        },
    };

    // Reward state for div cards: starts at 3, decays 3→2→1 with each first-try
    // success and resets to 3 on any miss. Mul/add/sub use the FSRS-difficulty
    // band instead.
    const DIV_REWARD_INITIAL = 3;
    const DIV_REWARD_MIN = 1;

    const makeCard = (op, a, b) => {
        const handler = OPS[op];
        const card = {
            id: handler.idOf(a, b),
            op,
            a, b,
            answer: handler.compute(a, b),
            stability: 0,
            difficulty: 5.0,
            reps: 0,
            state: 0,
            lastReview: null,
            nextReview: Date.now(),
            hasMistake: false,
            inCorrection: false,
        };
        if (op === 'div') card.reward = DIV_REWARD_INITIAL;
        return card;
    };

    const getCoinReward = (problem) => {
        if (problem.op === 'div') return problem.reward ?? DIV_REWARD_INITIAL;
        if (!problem.hasMistake) return 1;
        if (problem.difficulty <= 4) return 1;
        if (problem.difficulty <= 7) return 2;
        return 3;
    };

    // Decompose a × b into typed sub-steps the kid can solve, ending with the original answer.
    // Each step is { prompt: string, answer: number, hint?: string }.
    // hint is shown above the prompt to anchor a memorized fact (squares, mnemonics, ×11 trick, …).
    const stepOnes = (x) => [{ hint: "Anything × 1 is just itself!", prompt: `${x} × 1`, answer: x }];
    const stepTens = (x) => [{ hint: "× 10 — just add a zero", prompt: `${x} × 10`, answer: x * 10 }];
    const stepElevenDigit = (x) => [{ hint: "× 11 trick — write the digit twice (22, 33, …, 99)", prompt: `${x} × 11`, answer: x * 11 }];
    // No hint here on purpose: an 8-year-old doesn't know "square" / "N²" notation,
    // and the ×10 bridge ("9 × 10 = 90 — too much, try 9") would just leak the
    // answer. Div correction falls through to skip-count, mul mode shows no
    // hint and the kid recalls or misses.
    const stepSquare = (n) => [{ prompt: `${n} × ${n}`, answer: n * n }];
    const stepHitchhiker = () => [{ hint: "Remember: the answer is forty-two!", prompt: "6 × 7", answer: 42 }];
    const stepConsecutive = () => [{ hint: "5, 6, 7, 8 → 56 = 7 × 8", prompt: "7 × 8", answer: 56 }];
    const stepElevenSquare = () => [{ hint: "11 × 11 = 121 — memorize it!", prompt: "11 × 11", answer: 121 }];
    const stepGross = () => [{ hint: "A dozen dozen is a 'gross' — 144", prompt: "12 × 12", answer: 144 }];

    const stepDouble = (x) => [
        { hint: "Doubling!", prompt: `${x} + ${x}`, answer: x * 2 },
    ];
    const stepTimesThree = (x) => [
        { hint: "Double it first.", prompt: `${x} + ${x}`, answer: x * 2 },
        { hint: "Then add one more.", prompt: `${x * 2} + ${x}`, answer: x * 3 },
    ];
    const stepTimesFour = (x) => [
        { hint: "Double it.", prompt: `${x} + ${x}`, answer: x * 2 },
        { hint: "Double again!", prompt: `${x * 2} + ${x * 2}`, answer: x * 4 },
    ];
    const stepTimesFive = (x) => [
        { hint: "Try ×10 first — easy!", prompt: `${x} × 10`, answer: x * 10 },
        { hint: "×5 is half of ×10.", prompt: `Half of ${x * 10}`, answer: x * 5 },
    ];
    const stepTimesSix = (x) => [
        { hint: "Start with ×5.", prompt: `${x} × 5`, answer: x * 5 },
        { hint: "Then add one more.", prompt: `${x * 5} + ${x}`, answer: x * 6 },
    ];
    const stepTimesNine = (x) => [
        { hint: "Try ×10 first.", prompt: `${x} × 10`, answer: x * 10 },
        { hint: "9 is one less than 10.", prompt: `${x * 10} − ${x}`, answer: x * 9 },
    ];
    const stepTimesElevenMulti = (x) => [
        { hint: "Try ×10 first.", prompt: `${x} × 10`, answer: x * 10 },
        { hint: "Then add one more.", prompt: `${x * 10} + ${x}`, answer: x * 11 },
    ];
    const stepTimesTwelve = (x) => [
        { hint: "Try ×10 first.", prompt: `${x} × 10`, answer: x * 10 },
        { hint: "And ×2 too.", prompt: `${x} × 2`, answer: x * 2 },
        { hint: "Now add them!", prompt: `${x * 10} + ${x * 2}`, answer: x * 12 },
    ];

    const getMultiplicationStrategy = (a, b) => {
        const lo = Math.min(a, b), hi = Math.max(a, b);
        const other = (factor) => (a === factor ? b : a);

        // Tier 1 — single-step atoms (memorize / spot a pattern).
        if (lo === 1) return stepOnes(hi);
        if (lo === 10 || hi === 10) return stepTens(other(10));
        if (hi === 11 && lo >= 2 && lo <= 9) return stepElevenDigit(lo);
        // 9² intentionally excluded — the ×9 chain (10n − n) is a stronger
        // anchor than a hintless 'just remember 81' for this kid.
        if (a === b && [5, 6, 7, 8].includes(a)) return stepSquare(a);
        if (lo === 6 && hi === 7) return stepHitchhiker();
        if (lo === 7 && hi === 8) return stepConsecutive();
        if (a === 11 && b === 11) return stepElevenSquare();
        if (a === 12 && b === 12) return stepGross();

        // Tier 2 — two-step tricks, in priority order: 2, 9, 5, 11, 4, 3, 6.
        if (a === 2 || b === 2) return stepDouble(other(2));
        if (a === 9 || b === 9) return stepTimesNine(other(9));
        if (a === 5 || b === 5) return stepTimesFive(other(5));
        if (a === 11 || b === 11) return stepTimesElevenMulti(other(11));
        if (a === 4 || b === 4) return stepTimesFour(other(4));
        if (a === 3 || b === 3) return stepTimesThree(other(3));
        if (a === 6 || b === 6) return stepTimesSix(other(6));

        // Tier 3 — three-step decomposition for 7×12 and 8×12.
        if (a === 12 || b === 12) return stepTimesTwelve(other(12));

        // Unreachable for operands in 2..12, but keep a safe fallback.
        return [{ prompt: `${a} × ${b}`, answer: a * b }];
    };

    // "Make ten" breakdown for 2-digit + 1-digit with a carry.
    // 73 + 8 → split 8 into (7 + 1): first reach 80, then add the leftover 1.
    const getAdditionStrategy = (a, b) => {
        const ones = a % 10;
        const complement = 10 - ones;
        const tens = a - ones + 10;
        const leftover = b - complement;
        return [
            { hint: "Bridge to a round ten first.", prompt: `${a} + ${complement}`, answer: tens },
            { hint: "Now add what's left.", prompt: `${tens} + ${leftover}`, answer: a + b },
        ];
    };

    // "Step back to ten" breakdown for 2-digit − 1-digit with a borrow.
    // 75 − 6 → split 6 into (5 + 1): step down to 70 first, then subtract the leftover 1.
    const getSubtractionStrategy = (a, b) => {
        const ones = a % 10;
        const tens = a - ones;
        const leftover = b - ones;
        return [
            { hint: "Step back to a round ten first.", prompt: `${a} − ${ones}`, answer: tens },
            { hint: "Now subtract what's left.", prompt: `${tens} − ${leftover}`, answer: a - b },
        ];
    };

    // Division-as-multiplication breakdown.
    //
    // For single-step mul strategies (Tier 1 anchors + the lone ×2 doubling)
    // we re-use the anchor hint — those exist precisely so the kid can
    // recognise the fact and read off the missing factor.
    //
    // For everything else, the mul chain is unsuitable: it computes a × b by
    // feeding b in as an input (e.g. stepTimesThree(12) for 3 × ? = 36 ends
    // up showing "12 + 12 = ?", and the kid has no idea where 12 came from —
    // finding 12 *is* the task). Instead we collapse to a single inline
    // step whose hint lists the multiples of a, so she can skip-count her
    // way to the answer.
    //
    // `inline: true` tells the UI to substitute the typed answer into the
    // '?' slot of the prompt rather than appending '= answer'.
    const getDivisionStrategy = (a, b) => {
        const product = a * b;
        const mulSteps = getMultiplicationStrategy(a, b);

        // Single-step mul WITH an anchor hint (squares are intentionally hintless,
        // and they fall through to the skip-count path below).
        if (mulSteps.length === 1 && mulSteps[0].hint) {
            return [{
                hint: mulSteps[0].hint,
                prompt: `${a} × ? = ${product}`,
                answer: b,
                inline: true,
            }];
        }

        const multiples = [];
        for (let i = 1; i <= b; i++) multiples.push(a * i);
        return [{
            hint: `Skip-count ${a}s: ${multiples.join(", ")}. Count them!`,
            prompt: `${a} × ? = ${product}`,
            answer: b,
            inline: true,
        }];
    };

    const scheduleReview = (problem, rating) => {
        let { stability, difficulty, reps, state, hasMistake } = problem;
        const now = Date.now();

        if (rating === 1) hasMistake = true;
    
        if (state === 0) { 
            stability = W[rating === 1 ? 0 : 2];
            difficulty = W[4] - W[5] * (rating - 3);
            state = 2; 
        } else {
            difficulty = difficulty - W[6] * (rating - 3);
            difficulty = Math.max(1, Math.min(10, difficulty));
            if (rating === 1) { 
                stability = W[0] * 0.5; 
            } else { 
                const recallRate = 0.9; 
                stability = stability * (1 + Math.exp(W[8]) * (11 - difficulty) * Math.pow(stability, -W[9]) * (Math.exp(W[10] * (1 - recallRate)) - 1));
            }
        }

        const intervalInMinutes = rating === 1 ? 0.75 : (stability * INTERVAL_MODIFIER * 5);
        const nextReview = now + (intervalInMinutes * 60 * 1000); 

        return { ...problem, stability, difficulty, reps: reps + 1, state, lastReview: now, nextReview, hasMistake };
    };

    const runTests = () => {
        console.group("%c🧮 Math & Kittens: Corrected Logic Test Suite", "color: #6366f1; font-weight: bold; font-size: 1.2em;");
        let passed = 0; let failed = 0;
        const assert = (condition, message, details = "") => {
            if (condition) { console.log(`%c✅ Pass: ${message}`, "color: #10b981;"); passed++; }
            else { console.error(`%c❌ Fail: ${message}\nDetail: ${details}`, "color: #ef4444; font-weight: bold;"); failed++; }
        };

        const testCard = makeCard('mul', 7, 8);
        const reviewedGood = scheduleReview(testCard, 3);
        assert(reviewedGood.stability > 0, "Stability should increase on success");

        const cardWithBounty = { ...makeCard('mul', 9, 9), hasMistake: true, difficulty: 9.0 };
        assert(getCoinReward(cardWithBounty) === 3, "High difficulty mistakes = 3 coins bounty");

        const failedCard = scheduleReview(testCard, 1);
        assert(failedCard.nextReview < Date.now() + 60000, "Mistakes repeat in < 1 min in FSRS data");

        // Op registry sanity: ids are namespaced and commutative for mul.
        assert(makeCard('mul', 4, 6).id === 'mul:4x6', "mul ids are prefixed and lo×hi-ordered");
        assert(makeCard('mul', 6, 4).id === makeCard('mul', 4, 6).id, "mul ids are commutative");
        assert(makeCard('mul', 7, 8).op === 'mul', "card carries its op tag");

        // Strategy library: every problem in 2..12 must end with the correct final answer and use positive integers.
        let strategyBad = 0;
        for (let i = 2; i <= 12; i++) {
            for (let j = 2; j <= 12; j++) {
                const steps = getMultiplicationStrategy(i, j);
                if (!steps.length || steps[steps.length - 1].answer !== i * j) strategyBad++;
                for (const s of steps) {
                    if (!Number.isInteger(s.answer) || s.answer < 0) strategyBad++;
                }
            }
        }
        assert(strategyBad === 0, "Strategy steps end at a×b and stay non-negative integers");

        // Addition op
        assert(makeCard('add', 73, 8).id === 'add:73+8', "add ids are prefixed with a+b");
        assert(OPS.add.compute(73, 8) === 81, "add compute is plain a+b");

        // make-ten strategy: every carry-add problem ends at a+b and intermediate is the next multiple of 10.
        let addBad = 0;
        for (let a = 11; a <= 91; a++) {
            for (let b = 2; b <= 9; b++) {
                if ((a % 10) + b <= 10) continue;
                if (a + b > 100) continue;
                const steps = getAdditionStrategy(a, b);
                const tens = a - (a % 10) + 10;
                if (steps.length !== 2) addBad++;
                if (steps[0].answer !== tens) addBad++;
                if (steps[steps.length - 1].answer !== a + b) addBad++;
                for (const s of steps) {
                    if (!Number.isInteger(s.answer) || s.answer < 0) addBad++;
                }
            }
        }
        assert(addBad === 0, "make-ten strategy: step1 hits next 10, step2 = a+b, all integers");

        // Generator always produces a valid carry problem.
        let genBad = 0;
        for (let i = 0; i < 200; i++) {
            const { a, b } = OPS.add.generate();
            if (!((a % 10) + b > 10) || a + b > 100 || a < 11 || a > 91 || b < 2 || b > 9) genBad++;
        }
        assert(genBad === 0, "add generator: 2-digit + 1-digit, forces carry, sum ≤ 100");

        // Subtraction op
        assert(makeCard('sub', 75, 6).id === 'sub:75-6', "sub ids are prefixed with a-b");
        assert(OPS.sub.compute(75, 6) === 69, "sub compute is plain a-b");

        // step-back-to-ten strategy: step1 hits the lower multiple of 10, step2 = a-b.
        let subBad = 0;
        for (let a = 12; a <= 99; a++) {
            for (let b = 2; b <= 9; b++) {
                const ones = a % 10;
                if (!(ones >= 1 && ones < b)) continue;
                const steps = getSubtractionStrategy(a, b);
                const tens = a - ones;
                if (steps.length !== 2) subBad++;
                if (steps[0].answer !== tens) subBad++;
                if (steps[steps.length - 1].answer !== a - b) subBad++;
                for (const s of steps) {
                    if (!Number.isInteger(s.answer) || s.answer < 0) subBad++;
                }
            }
        }
        assert(subBad === 0, "step-back-to-ten strategy: step1 hits prev 10, step2 = a-b, all non-negative integers");

        let subGenBad = 0;
        for (let i = 0; i < 200; i++) {
            const { a, b } = OPS.sub.generate();
            const ones = a % 10;
            if (a < 12 || a > 99 || b < 2 || b > 9 || ones < 1 || ones >= b) subGenBad++;
        }
        assert(subGenBad === 0, "sub generator: 2-digit − 1-digit, forces borrow, ones in [1, b-1]");

        // Division op (framed as a × ? = product)
        const divCard = makeCard('div', 4, 6);
        assert(divCard.id === 'div:4_6', "div ids use a_b shape");
        assert(divCard.answer === 6, "div answer is the missing factor b");
        assert(divCard.reward === 3, "div cards start at reward 3");
        assert(makeCard('div', 4, 6).id !== makeCard('div', 6, 4).id, "div ids are NOT commutative");
        assert(getCoinReward({ op: 'div', reward: 2 }) === 2, "div badge shows per-card reward");
        assert(getCoinReward({ op: 'div' }) === 3, "div badge defaults to 3 when reward missing");

        // Single-step Tier 1 anchors: collapse to one inline step with the mul anchor.
        const consecutiveSteps = getDivisionStrategy(7, 8);
        assert(consecutiveSteps.length === 1 && consecutiveSteps[0].answer === 8
            && consecutiveSteps[0].inline === true
            && consecutiveSteps[0].hint.includes("5, 6, 7, 8"),
            "7 × ? = 56 → single inline step with the consecutive-digit mnemonic");
        assert(getDivisionStrategy(7, 7)[0].hint.includes("7, 14")
            && getDivisionStrategy(7, 7)[0].hint.includes("49"),
            "7 × ? = 49 → skip-count (squares are hintless; no jargon for 8-year-olds)");
        assert(getDivisionStrategy(2, 3)[0].hint === "Doubling!",
            "2 × ? = 6 → single inline step with the stepDouble 'Doubling!' anchor");

        // Non-Tier-1 strategies: single inline step with a skip-count hint
        // listing the multiples (no mul chain that uses b as input).
        const ninesSteps = getDivisionStrategy(7, 9);
        assert(ninesSteps.length === 1
            && ninesSteps[0].inline === true && ninesSteps[0].answer === 9
            && ninesSteps[0].hint.includes("7, 14")
            && ninesSteps[0].hint.includes("63"),
            "7 × ? = 63 → single skip-count step listing multiples of 7 up to 63");

        // Pace: 3 coins in 30s + 2 coins in 30s = 5 coins per minute.
        assert(computePace([{ coins: 3, ms: 30_000 }, { coins: 2, ms: 30_000 }]) === 5,
            "pace: 5 coins in 60s ⇒ 5.0 c/min");
        assert(computePace([]) === null, "pace: no events ⇒ null");

        const foursSteps = getDivisionStrategy(4, 6);
        assert(foursSteps.length === 1
            && foursSteps[0].inline === true && foursSteps[0].answer === 6
            && foursSteps[0].hint.includes("4, 8")
            && foursSteps[0].hint.includes("24"),
            "4 × ? = 24 → single skip-count step listing multiples of 4 up to 24");

        console.log(`%c\nTest Summary: ${passed} Passed, ${failed} Failed`, failed > 0 ? "color: #ef4444;" : "color: #10b981;");
        console.groupEnd();
    };

    const Icon = ({ name, className = "", size = 24 }) => {
        const ref = useRef(null);
        useEffect(() => {
            if (ref.current && window.lucide) {
                const iconName = name.charAt(0).toLowerCase() + name.slice(1).replace(/[A-Z]/g, l => `-${l.toLowerCase()}`);
                ref.current.setAttribute('data-lucide', iconName);
                lucide.createIcons();
            }
        }, [name]);
        return <i ref={ref} className={className} style={{ width: size, height: size }}></i>;
    };

    const loadSavedState = () => {
        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const parsed = JSON.parse(saved);
                return {
                    coins: parsed.coins || 0,
                    deck: parsed.deck || {},
                    queue: parsed.queue || [],
                    paceEvents: parsed.paceEvents || []
                };
            }
        } catch (e) {
            console.error("Failed to load initial state", e);
        }
        return { coins: 0, deck: {}, queue: [], paceEvents: [] };
    };

    // Average answering pace in coins/minute. Returns null when there's
    // nothing useful to display yet.
    const computePace = (events) => {
        if (!events.length) return null;
        const totalCoins = events.reduce((s, e) => s + e.coins, 0);
        const totalMs = events.reduce((s, e) => s + e.ms, 0);
        if (totalMs <= 0) return null;
        return (totalCoins / totalMs) * 60_000;
    };

    const App = () => {
        const initialState = useRef(loadSavedState()).current;
        const [coins, setCoins] = useState(initialState.coins);
        const [deck, setDeck] = useState(initialState.deck);
        const [queue, setQueue] = useState(initialState.queue);
        const [inputValue, setInputValue] = useState('');
        const [feedback, setFeedback] = useState(null);
        const [animatingCoins, setAnimatingCoins] = useState([]);
        // breakdown = { steps:[{prompt,answer}], idx, reveal } | null
        const [breakdown, setBreakdown] = useState(null);
        const [stepError, setStepError] = useState(false);
        // Rolling buffer of recent answer events used for the coins/min badge.
        const [paceEvents, setPaceEvents] = useState(initialState.paceEvents);

        const walletRef = useRef(null);
        const inputRef = useRef(null);
        // Wall-clock when the current card was first shown. Reset whenever the
        // top of the queue changes (a new problem, or the corrected card pops out).
        const cardStartRef = useRef(Date.now());

        useEffect(() => {
            runTests();
            // Restore correction state if refresh happened mid-mistake.
            if (queue.length > 0 && queue[0].inCorrection) {
                setFeedback('wrong');
                const p = queue[0];
                setBreakdown({ steps: OPS[p.op].strategy(p.a, p.b), idx: 0, reveal: false });
            }
        }, []);

        useEffect(() => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({ coins, deck, queue, paceEvents }));
        }, [coins, deck, queue, paceEvents]);

        // Restart the card timer whenever the visible problem changes.
        useEffect(() => {
            cardStartRef.current = Date.now();
        }, [queue[0]?.id]);

        const recordAnswer = (coinsEarned) => {
            const ms = Date.now() - cardStartRef.current;
            if (ms > DISTRACTION_MS) return; // probably a distraction — skip this event
            setPaceEvents(prev => [...prev.slice(-(PACE_WINDOW - 1)), { coins: coinsEarned, ms }]);
        };

        const getNextFromDeck = useCallback((currentQueue) => {
            const now = Date.now();
            const ops = Object.keys(OPS);

            // Count cards per registered op so under-represented ops get boosted.
            // Without this, a long-standing op (mul) keeps producing due cards
            // forever and a newly added op (add) never surfaces.
            const opCounts = Object.fromEntries(ops.map(op => [op, 0]));
            for (const c of Object.values(deck)) {
                if (c.op in opCounts) opCounts[c.op]++;
            }
            const minCount = Math.min(...ops.map(op => opCounts[op]));
            const rarestOps = ops.filter(op => opCounts[op] === minCount);
            const opsImbalanced = rarestOps.length < ops.length;

            // ~30% of picks force a fresh card from the rarest op when imbalanced.
            // The remaining 70% (or 100% when balanced) keep FSRS-due cards in order.
            const wantVariety = opsImbalanced && Math.random() < 0.3;

            if (!wantVariety) {
                const dueCards = Object.values(deck)
                    .filter(card => card.nextReview <= now)
                    .sort((a, b) => a.nextReview - b.nextReview);
                const card = dueCards.find(c => !currentQueue.some(q => q.id === c.id));
                if (card) return card;
            }

            // Fresh draw — restrict to rarest op when forcing variety, any op otherwise.
            const eligibleOps = wantVariety ? rarestOps : ops;
            for (let attempts = 0; attempts < 50; attempts++) {
                const op = eligibleOps[Math.floor(Math.random() * eligibleOps.length)];
                const handler = OPS[op];
                const { a, b } = handler.generate();
                const id = handler.idOf(a, b);
                if (!currentQueue.some(q => q.id === id)) {
                    return deck[id] || makeCard(op, a, b);
                }
            }
            // Last-resort fallback if every attempt collided with the queue.
            const op = eligibleOps[0];
            const { a, b } = OPS[op].generate();
            return makeCard(op, a, b);
        }, [deck]);

        // Only fill if empty and not just loaded from storage
        useEffect(() => {
            if (queue.length === 0) {
                const initial = [];
                while(initial.length < QUEUE_SIZE) {
                    const p = getNextFromDeck(initial);
                    if (!initial.find(x => x.id === p.id)) initial.push(p);
                }
                setQueue(initial);
            }
        }, [queue.length, getNextFromDeck]);

        const flashError = () => {
            setStepError(true);
            setTimeout(() => setStepError(false), 400);
        };

        const enterBreakdown = (problem) => {
            const updated = scheduleReview(problem, 1);
            updated.inCorrection = true;
            // Any miss resets the div coin-decay back to the full 3.
            if (updated.op === 'div') updated.reward = DIV_REWARD_INITIAL;
            setDeck(prev => ({ ...prev, [updated.id]: updated }));
            const nextQueue = [...queue];
            nextQueue[0] = updated;
            setQueue(nextQueue);
            setFeedback('wrong');
            setBreakdown({ steps: OPS[updated.op].strategy(updated.a, updated.b), idx: 0, reveal: false });
            setInputValue('');
        };

        const completeCorrection = () => {
            // Correction earns no coins this round (the card resets to its
            // worth-N badge for next time), but it's still an "answer" — log
            // it so the pace metric reflects time-cost of mistakes.
            recordAnswer(0);
            const nextQueue = [...queue];
            const correctedItem = { ...nextQueue.shift(), inCorrection: false };
            // Reinsert "a couple cards later" so the unaided retest happens soon.
            nextQueue.splice(2, 0, correctedItem);
            while (nextQueue.length < QUEUE_SIZE) nextQueue.push(getNextFromDeck(nextQueue));
            setQueue(nextQueue);
            setFeedback(null);
            setBreakdown(null);
            setInputValue('');
        };

        const handleSubmit = (e) => {
            e.preventDefault();
            if (!inputValue) return;
            const userVal = parseInt(inputValue);

            // Breakdown mode: each step is its own typed check.
            if (breakdown) {
                const step = breakdown.steps[breakdown.idx];
                if (userVal === step.answer) {
                    if (breakdown.idx + 1 >= breakdown.steps.length) {
                        completeCorrection();
                    } else {
                        setBreakdown({ ...breakdown, idx: breakdown.idx + 1, attempts: 0, reveal: false });
                        setInputValue('');
                    }
                } else {
                    // Reveal the step's answer after two misses so she isn't stuck.
                    const attempts = (breakdown.attempts || 0) + 1;
                    setBreakdown({ ...breakdown, attempts, reveal: attempts >= 2 });
                    setInputValue('');
                    flashError();
                }
                return;
            }

            const currentProblem = queue[0];
            const isCorrect = userVal === currentProblem.answer;
            if (isCorrect) {
                // First-try success
                setFeedback('correct');
                const updated = scheduleReview(currentProblem, 3);
                const reward = getCoinReward(currentProblem);
                // Decay div coin reward for next appearance: 3 → 2 → 1, floor at 1.
                if (updated.op === 'div') {
                    updated.reward = Math.max(DIV_REWARD_MIN, (currentProblem.reward ?? DIV_REWARD_INITIAL) - 1);
                }
                recordAnswer(reward);
                triggerCoinAnimation(reward);
                setTimeout(() => {
                    setCoins(prev => prev + reward);
                    setDeck(prev => ({ ...prev, [updated.id]: updated }));
                    const nextQueue = [...queue.slice(1)];
                    while (nextQueue.length < QUEUE_SIZE) nextQueue.push(getNextFromDeck(nextQueue));
                    setQueue(nextQueue);
                    setFeedback(null);
                    setInputValue('');
                }, 1000);
            } else {
                enterBreakdown(currentProblem);
            }
        };

        const handleIDontKnow = () => {
            enterBreakdown(queue[0]);
            inputRef.current?.focus();
        };

        const triggerCoinAnimation = (count) => {
            const rect = inputRef.current?.getBoundingClientRect();
            const walletRect = walletRef.current?.getBoundingClientRect();
            if (!rect || !walletRect) return;
            const newCoins = Array.from({ length: Math.min(count, 5) }).map((_, i) => ({
                id: Math.random(),
                startLeft: rect.left + rect.width / 2,
                startTop: rect.top,
                targetX: walletRect.left - (rect.left + rect.width / 2) + (walletRect.width / 2),
                targetY: walletRect.top - rect.top + (walletRect.height / 2)
            }));
            setAnimatingCoins(prev => [...prev, ...newCoins]);
            setTimeout(() => setAnimatingCoins(prev => prev.filter(c => !newCoins.find(nc => nc.id === c.id))), 1100);
        };

        if (queue.length === 0) return null;
        const currentProblem = queue[0];

        return (
            <div className="min-h-screen p-4 md:p-8 font-sans text-slate-800 bg-slate-50">
                <div className="max-w-4xl mx-auto flex justify-between items-center mb-8 bg-white p-4 rounded-3xl shadow-sm border border-purple-200">
                    <div className="flex items-center gap-2">
                        <div className="bg-indigo-100 p-2 rounded-xl"><Icon name="Trophy" className="text-indigo-600" /></div>
                        <div>
                            <h1 className="font-bold text-lg leading-tight">Math</h1>
                            <p className="text-xs text-slate-400 uppercase tracking-widest font-bold">v{VERSION}</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        {(() => {
                            const pace = computePace(paceEvents);
                            return (
                                <div className="flex flex-col items-end bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl font-bold text-sm leading-tight border border-indigo-100">
                                    <span className="text-base font-black">{pace === null ? '—' : pace.toFixed(1)}</span>
                                    <span className="text-[10px] text-indigo-400 uppercase tracking-widest font-bold">c/min</span>
                                </div>
                            );
                        })()}
                        <div ref={walletRef} className="flex items-center gap-3 bg-yellow-400 px-5 py-2 rounded-2xl shadow-md transition-transform hover:scale-105">
                            <Icon name="Wallet" className="text-yellow-900" />
                            <span className="font-black text-2xl text-yellow-900">{coins}</span>
                            <Icon name="Coins" className="text-yellow-700 animate-bounce" />
                        </div>
                    </div>
                </div>

                <main className="max-w-xl mx-auto">
                    <div className={`bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 border-b-[12px] border-slate-200 transition-all duration-300 relative overflow-hidden ${feedback === 'correct' ? 'scale-105 border-green-400' : feedback === 'wrong' ? 'shake border-red-400' : ''}`}>
                        <div className="absolute top-6 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-yellow-100 text-yellow-700 px-4 py-1 rounded-full text-xs font-black uppercase tracking-tight">
                            <Icon name="Coins" size={14} className="mt-[-2px]" /> 
                            Worth {getCoinReward(currentProblem)} {getCoinReward(currentProblem) === 1 ? 'Coin' : 'Coins'}
                        </div>

                        <div className={`font-black text-slate-700 flex items-center justify-center gap-4 ${breakdown ? 'text-4xl my-4' : 'text-7xl md:text-9xl my-8'}`}>
                            {OPS[currentProblem.op].renderPrompt(currentProblem)}
                            {breakdown && !OPS[currentProblem.op].selfContained && <span className="text-slate-400">= ?</span>}
                        </div>

                        {breakdown && (() => {
                            const step = breakdown.steps[breakdown.idx];
                            // Steps marked inline (e.g. div: "a × ? = product") already contain
                            // their own '?'. Render the prompt with '?' or the answer in place.
                            const stepLine = step.inline
                                ? (breakdown.reveal
                                    ? <span className="underline">{step.prompt.replace('?', step.answer)}</span>
                                    : step.prompt)
                                : <>{step.prompt} = {breakdown.reveal ? <span className="underline">{step.answer}</span> : '?'}</>;
                            return (
                                <div className="mb-6 p-4 bg-indigo-50 rounded-2xl border-2 border-indigo-200">
                                    <p className="text-indigo-500 text-xs font-black uppercase tracking-widest mb-2">
                                        {`Solving ${OPS[currentProblem.op].label(currentProblem.a, currentProblem.b)}`}
                                        {breakdown.steps.length > 1 && ` — step ${breakdown.idx + 1} of ${breakdown.steps.length}`}
                                    </p>
                                    {breakdown.steps.slice(0, breakdown.idx).map((s, i) => (
                                        <p key={i} className="text-slate-400 text-base font-bold">
                                            {s.inline ? s.prompt.replace('?', s.answer) : `${s.prompt} = ${s.answer}`} ✓
                                        </p>
                                    ))}
                                    {step.hint && (
                                        <p className="text-indigo-600 text-sm italic mb-1">💡 {step.hint}</p>
                                    )}
                                    <p className="text-indigo-700 text-2xl font-black mt-1">{stepLine}</p>
                                    {breakdown.reveal && <p className="text-indigo-400 text-xs font-medium mt-1">Type it to keep learning!</p>}
                                </div>
                            );
                        })()}

                        <form onSubmit={handleSubmit} className="relative z-10">
                            <input ref={inputRef} type="number" inputMode="numeric" pattern="[0-9]*"
                                   value={inputValue} onChange={(e) => setInputValue(e.target.value)}
                                   placeholder={breakdown && breakdown.reveal ? breakdown.steps[breakdown.idx].answer : "?"} autoFocus
                                   autoComplete="off" autoCorrect="off" spellCheck="false"
                                   className={`w-full text-center text-6xl font-black p-6 rounded-3xl bg-slate-50 border-4 outline-none transition-all ${feedback === 'correct' ? 'border-green-500 bg-green-50 text-green-600' : stepError ? 'border-red-500 bg-red-50 text-red-600 shake' : breakdown ? 'border-indigo-300 focus:border-indigo-500' : 'border-slate-100 focus:border-indigo-400'}`} />

                            <div className="mt-6 flex gap-3">
                                <button type="submit" disabled={!inputValue || feedback === 'correct'} className="flex-[2] bg-slate-800 hover:bg-slate-900 disabled:bg-slate-200 text-white text-2xl font-black py-5 rounded-3xl shadow-lg transition-all">
                                    {breakdown ? (breakdown.idx + 1 === breakdown.steps.length ? 'FINISH' : 'NEXT') : 'GO!'}
                                </button>
                                {!feedback && (
                                    <button type="button" onClick={handleIDontKnow} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-500 font-bold py-5 rounded-3xl flex items-center justify-center gap-2">
                                        <Icon name="HelpCircle" size={18} /> IDK
                                    </button>
                                )}
                            </div>
                        </form>
                    </div>
                </main>

                {animatingCoins.map(coin => (
                    <div key={coin.id} className="fixed pointer-events-none z-[100] animate-coin-fly"
                         style={{ left: coin.startLeft, top: coin.startTop, '--target-x': `${coin.targetX}px`, '--target-y': `${coin.targetY}px` }}>
                        <svg className="w-10 h-10 drop-shadow-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                            <circle cx="8" cy="8" r="6" fill="#fbbf24" stroke="#d97706"/><path d="M8 5v6M5 8h6" stroke="#d97706" />
                        </svg>
                    </div>
                ))}
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
