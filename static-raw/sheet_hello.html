<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Hello World</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="antialiased bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-1">Hello, Google Sheet</h1>
        <p class="text-sm text-slate-500 mb-6">Submits a row to a Google Sheet via an Apps Script Web App. No backend on this side.</p>

        <form id="form" class="space-y-3">
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Name</span>
                <input id="name" type="text" required
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </label>
            <label class="block">
                <span class="text-sm font-medium text-slate-700">Message</span>
                <textarea id="message" rows="3" required
                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
            </label>
            <button id="submit" type="submit"
                class="w-full rounded-lg bg-indigo-600 text-white font-medium px-4 py-2 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
                Send
            </button>
        </form>

        <p id="status" class="mt-4 text-sm text-slate-600 min-h-[1.25rem]" aria-live="polite"></p>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzAgpky5AwFCMIu6qMAEjvuDz6x4znz7jKLJ9EcSohUD2e-tzB4Wwilq3a16uDPgIJp/exec';

        const form = document.getElementById('form');
        const statusEl = document.getElementById('status');
        const submitBtn = document.getElementById('submit');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                message: document.getElementById('message').value,
            };

            submitBtn.disabled = true;
            statusEl.textContent = 'Sending…';
            statusEl.className = 'mt-4 text-sm text-slate-600 min-h-[1.25rem]';

            try {
                // text/plain avoids a CORS preflight; Apps Script reads e.postData.contents.
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                statusEl.textContent = 'Saved. Server said: ' + text;
                statusEl.className = 'mt-4 text-sm text-green-700 min-h-[1.25rem]';
                form.reset();
            } catch (err) {
                statusEl.textContent = 'Error: ' + err.message;
                statusEl.className = 'mt-4 text-sm text-red-700 min-h-[1.25rem]';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
