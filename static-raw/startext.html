      const frac = u.transit.dwellStart != null
        ? EDGE_TIME + Math.min(state.time - u.transit.dwellStart, dwellPer)
        : u.transit.progress;
      return s + done + frac;
    }, 0) / group.length;
    const eta = Math.max(0, Math.round(totalTime - avgDone));
    // Show current position if dwelling at an intermediate node.
    const dwelling = group.filter(u => u.transit.dwellStart != null && u.transit.pathIdx < hops);
    const atNote = dwelling.length ? ` · at ${nodeName(dwelling[0].node)}` : "";
    html += `<div class="transit-row">
        <div class="transit-info">
          <div class="name">${label}${modeLabel} → ${nodeName(parseInt(to))}${atNote}</div>
          <div class="meta">ETA ${eta}s</div>
          ${progBar(Math.min(avgDone, totalTime), totalTime)}
        </div>
        <button class="transit-cancel" onclick="cancelTransit(${to})">✕</button>
      </div>`;
  }
  wrap.innerHTML = html;
}

/* ---------------------------- Action sheet --------------------------- */
function openSheet(sel) { ui.sheet = sel; renderSheet(); }
function closeSheet() {
  ui.sheet = null;
  $("sheet").className = "";
  $("sheet-backdrop").className = "";
}

// Reachable destinations from `node` for the human, nearest first.
const sendDests = node => [...reachableSet(HUMAN)]
  .filter(d => d !== node)
  .sort((a, b) => hopDist(node, a) - hopDist(node, b) || a - b);

// One "Send n → Sector X (ETA)" button per reachable destination.
function destButtonsHtml(node, n, poolLen) {
  const dests = sendDests(node);
  if (!dests.length) return `<div class="sheet-sub" style="margin-top:8px">No reachable destinations — explore a neighbour first.</div>`;
  return dests.map(d => {
    const eta = hopDist(node, d) * EDGE_TIME;
    return `<button class="act secondary" id="dest-${d}" ${poolLen ? "" : "disabled"}>
        Send ${n} → ${nodeName(d)} <span class="cost">— ${eta}s travel</span>
      </button>`;
  }).join("");
}
function bindDestButtons(node, onSend) {
  for (const d of sendDests(node)) bind(`dest-${d}`, () => onSend(d));
}

function renderSheet() {
  const sel = ui.sheet;
  const sheet = $("sheet");
  $("sheet-backdrop").className = "open";
  sheet.className = "open";
  const mineNow = Math.floor(state.minerals[HUMAN]);

  if (sel.kind === "cc") {
    const cc = state.buildings.find(b => b.id === sel.ref);
    if (!cc) { closeSheet(); return; }
    const inQ = (cc.train ? 1 : 0) + cc.queued;
    const supplyOK = supplyUsed(HUMAN) < supplyCap(HUMAN);
    const afford = mineNow >= C.cc.trainCost;
    const dis = cc.construct || inQ >= C.cc.queueMax || !afford;
    const note = cc.construct ? "Under construction."
      : inQ >= C.cc.queueMax ? `Queue full (${C.cc.queueMax} max).`
      : !afford ? `Need ${C.cc.trainCost} 💎.`
      : !supplyOK ? "Supply blocked — SCV will train when supply is free." : "";
    const rallyMining = cc.rally === "mining";
    sheet.innerHTML = `
      <h2>Command Center</h2>
      <div class="sheet-sub">${nodeName(sel.node)} · HP ${Math.ceil(cc.hp)}/${cc.maxHp} · Queue ${inQ}/${C.cc.queueMax}</div>
      <button class="act" ${dis ? "disabled" : ""} id="a-train">
        Train SCV <span class="cost">— ${C.cc.trainCost} 💎 · ${C.cc.trainTime}s · +1 supply</span>
      </button>
      ${note ? `<div class="sheet-sub" style="margin-top:8px">${note}</div>` : ""}
      <button class="act secondary" id="a-rally">
        Rally: ${rallyMining ? "⛏️ Mine" : "🛑 Idle"} <span class="cost">— new SCVs ${rallyMining ? "go mining" : "stay idle"}</span>
      </button>
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-train", () => { queueSCV(HUMAN, cc.node); refreshSheet(); });
    bind("a-rally", () => { cc.rally = rallyMining ? "idle" : "mining"; refreshSheet(); });

  } else if (sel.kind === "barracks" || sel.kind === "barracks-group") {
    const allRax = buildingsOf(HUMAN, sel.node).filter(b => b.type === "barracks" && !b.construct);
    if (!allRax.length) { closeSheet(); return; }
    const totalQ = allRax.reduce((s, b) => s + (b.train ? 1 : 0) + (b.queued || 0), 0);
    const maxQ = allRax.length * C.marine.queueMax;
    const supplyOK = supplyUsed(HUMAN) < supplyCap(HUMAN);
    const afford = mineNow >= C.marine.cost;
    const dis = totalQ >= maxQ || !afford;
    const note = totalQ >= maxQ ? `All queues full (${maxQ} max).`
      : !afford ? `Need ${C.marine.cost} 💎.`
      : !supplyOK ? "Supply blocked — marines will train when supply is free." : "";
    const trainingRax = allRax.filter(b => b.train).sort((a, b) => b.train.progress - a.train.progress);
    const eta = trainingRax.length ? C.marine.build - trainingRax[0].train.progress : 0;
    const label = allRax.length > 1 ? `Barracks ×${allRax.length}` : "Barracks";
    const rallyNode = allRax[0].rally;
    const rallyLabel = typeof rallyNode === "number" ? `→ ${nodeName(rallyNode)}` : "Stay here";
    sheet.innerHTML = `
      <h2>${label}</h2>
      <div class="sheet-sub">${nodeName(sel.node)} · ${totalQ} training${trainingRax.length ? ` · next ready in ${eta}s` : ""}</div>
      <button class="act" ${dis ? "disabled" : ""} id="a-marine">
        Train Marine <span class="cost">— ${C.marine.cost} 💎 · ${C.marine.build}s · +1 supply</span>
      </button>
      ${note ? `<div class="sheet-sub" style="margin-top:8px">${note}</div>` : ""}
      <button class="act secondary" id="a-set-rally">
        Rally: ${rallyLabel} <span class="cost">— new marines auto-move here</span>
      </button>
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-marine", () => { queueMarine(HUMAN, sel.node, null); refreshSheet(); });
    bind("a-set-rally", () => openSheet({ kind: "barracks-rally", node: sel.node }));

  } else if (sel.kind === "barracks-rally") {
    const allRax = buildingsOf(HUMAN, sel.node).filter(b => b.type === "barracks" && !b.construct);
    if (!allRax.length) { closeSheet(); return; }
    const dests = sendDests(sel.node);
    const setRally = dest => { allRax.forEach(b => b.rally = dest); openSheet({ kind: "barracks-group", node: sel.node }); };
    sheet.innerHTML = `
      <h2>Set Rally Point</h2>
      <div class="sheet-sub">New marines from ${nodeName(sel.node)} auto-move to the rally node</div>
      <button class="act secondary" id="rally-home">Stay here — no rally</button>
      ${dests.map(d => `<button class="act secondary" id="rally-${d}">→ ${nodeName(d)} <span class="cost">— ${hopDist(sel.node, d) * EDGE_TIME}s travel</span></button>`).join("")}
      <button class="act-close" id="a-close">Close</button>`;
    bind("rally-home", () => setRally(null));
    for (const d of dests) bind(`rally-${d}`, () => setRally(d));

  } else if (sel.kind === "marine") {
    const node = sel.node;
    const pool = idleMarines(HUMAN, node);
    const max = Math.max(1, pool.length);
    sel.n = Math.min(Math.max(1, sel.n || pool.length), max);
    sel.mode = sel.mode || "attack"; // marines default to attack mode
    const n = sel.n;
    const mAtk = sel.mode === "attack";
    sheet.innerHTML = `
      <h2>Marines at ${nodeName(node)}</h2>
      <div class="sheet-sub">${pool.length} ready · pick a destination</div>
      <div class="stepper">
        <button id="n-minus">−</button>
        <div class="count" id="n-count">${n}</div>
        <button id="n-plus">+</button>
        <div class="label">selected</div>
      </div>
      <input type="range" id="n-range" min="1" max="${max}" value="${n}">
      <div class="mode-toggle">
        <button id="mode-move" class="${!mAtk ? "sel" : ""}">📦 Move</button>
        <button id="mode-attack" class="${mAtk ? "sel" : ""}">⚔️ Move &amp; Attack</button>
      </div>
      ${destButtonsHtml(node, n, pool.length)}
      <button class="act-close" id="a-close">Close</button>`;
    const setN = v => { sel.n = Math.min(Math.max(1, v), max); renderSheet(); };
    bind("n-minus", () => setN(sel.n - 1));
    bind("n-plus", () => setN(sel.n + 1));
    $("n-range").oninput = e => setN(parseInt(e.target.value, 10));
    bind("mode-move",   () => { sel.mode = "move";   renderSheet(); });
    bind("mode-attack", () => { sel.mode = "attack"; renderSheet(); });
    bindDestButtons(node, dest => { sendUnits(HUMAN, node, sel.n, "marine", dest, sel.mode); closeSheet(); render(); });

  } else {
    // SCV group sheet — split into Move / Build / Mine submenus to avoid clutter.
    const node = sel.node;
    const all = controllable(HUMAN, node);
    const idleN   = unitsOf(HUMAN, node, "idle",   "scv").length;
    const miningN = unitsOf(HUMAN, node, "mining", "scv").length;
    const gasN    = unitsOf(HUMAN, node, "gas",    "scv").length;
    const max = Math.max(1, all.length);
    sel.n = Math.min(Math.max(1, sel.n || 1), max);
    const n = sel.n;
    const ccAtNode    = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "cc");
    const hasCc       = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "cc" && !b.construct);
    const ccOK        = all.length >= 1 && mineNow >= C.cc.cost && !ccAtNode;
    const depotOK     = all.length >= 1 && mineNow >= C.depot.cost;
    const raxOK       = all.length >= 1 && mineNow >= C.barracks.cost;
    const hasRef      = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "refinery" && !b.construct);
    const refBuilding = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "refinery");
    const gasAvail    = state.gasField[node] > 0;
    const refOK       = all.length >= 1 && mineNow >= C.refinery.cost && !refBuilding && gasAvail;
    const minSatPct   = mineralSatPct(miningN, state.field[node]);
    const gasSatPct   = Math.round(gasN / GAS_OPT * 100);
    const hasMinerals = state.field[node] > 0;
    const canMineHere = hasMinerals && hasCc;  // minerals + completed CC = can mine
    const canMine     = canMineHere || hasRef;
    const tab = sel.tab || "root";

    const needCcNote = hasMinerals && !hasCc ? " · ⚠️ Need CC to mine" : "";
    const summary = `<div class="sheet-sub">${all.length} available · ${idleN} idle${canMineHere || miningN ? ` · ${miningN} mining (${minSatPct}% sat)` : ""}${gasN ? ` · ${gasN} gas (${gasSatPct}% sat)` : ""}${needCcNote}</div>`;
    let title = `SCVs at ${nodeName(node)}`, body;

    // Actions available right now (enabled). Used both to build the root body and to wire bindings.
    const mineActs = [];
    if (canMineHere && idleN > 0)
      mineActs.push({ id: "a-mf0", html: `⛏ Set ${idleN} idle → mining`,
        fn: () => { setTask(HUMAN, node, idleN, "idle", "mining", "scv"); refreshSheet(); } });
    if (canMineHere && miningN > 0)
      mineActs.push({ id: "a-mf1", html: `⛏ Set ${miningN} mining → idle`,
        fn: () => { setTask(HUMAN, node, miningN, "mining", "idle", "scv"); refreshSheet(); } });
    if (hasRef && idleN + miningN > 0 && gasN < GAS_OPT)
      mineActs.push({ id: "a-mf2", html: `⛏ Assign 1 SCV → gas <span class="cost">— ${gasN}/${GAS_OPT} optimal</span>`,
        fn: () => { const scv = unitsOf(HUMAN, node, "idle", "scv")[0] || unitsOf(HUMAN, node, "mining", "scv")[0];
                    if (scv) { scv.task = "gas"; refreshSheet(); } } });
    if (hasRef && gasN > 0)
      mineActs.push({ id: "a-mf3", html: `⛏ Pull 1 gas SCV → mining`,
        fn: () => { const scv = unitsOf(HUMAN, node, "gas", "scv")[0];
                    if (scv) { scv.task = "mining"; refreshSheet(); } } });

    const buildActs = [];
    if (depotOK) buildActs.push({ id: "a-bf0", html: `🏗 Build Supply Depot <span class="cost">— ${C.depot.cost} 💎 · ${C.depot.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "depot"); refreshSheet(); } });
    if (raxOK)   buildActs.push({ id: "a-bf1", html: `🏗 Build Barracks <span class="cost">— ${C.barracks.cost} 💎 · ${C.barracks.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "barracks"); refreshSheet(); } });
    if (refOK)   buildActs.push({ id: "a-bf2", html: `🏗 Build Refinery <span class="cost">— ${C.refinery.cost} 💎 · ${C.refinery.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "refinery"); refreshSheet(); } });
    if (ccOK)    buildActs.push({ id: "a-bf3", html: `🏗 Build Command Center <span class="cost">— ${C.cc.cost} 💎 · ${C.cc.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "cc"); refreshSheet(); } });

    if (tab === "move") {
      sel.mode = sel.mode || "move"; // SCVs default to move mode
      title = `Move · ${nodeName(node)}`;
      const mAtk = sel.mode === "attack";
      body = `
        <div class="stepper">
          <button id="n-minus">−</button>
          <div class="count" id="n-count">${n}</div>
          <button id="n-plus">+</button>
          <div class="label">SCVs<br>selected</div>
        </div>
        <input type="range" id="n-range" min="1" max="${max}" value="${n}">
        <div class="mode-toggle">
          <button id="mode-move" class="${!mAtk ? "sel" : ""}">📦 Move</button>
          <button id="mode-attack" class="${mAtk ? "sel" : ""}">⚔️ Move &amp; Attack</button>
        </div>
        ${destButtonsHtml(node, n, all.length)}
        <button class="act-close" id="a-back">‹ Back</button>`;
    } else if (tab === "build") {
      title = `Build · ${nodeName(node)}`;
      body = `
        <button class="act secondary" id="a-depot" ${depotOK ? "" : "disabled"}>
          Build Supply Depot <span class="cost">— ${C.depot.cost} 💎 · ${C.depot.build}s</span>
        </button>
        <button class="act secondary" id="a-rax" ${raxOK ? "" : "disabled"}>
          Build Barracks <span class="cost">— ${C.barracks.cost} 💎 · ${C.barracks.build}s</span>
        </button>
        ${gasAvail ? `
        <button class="act secondary" id="a-ref" ${refOK ? "" : "disabled"}>
          Build Refinery <span class="cost">— ${C.refinery.cost} 💎 · ${C.refinery.build}s · unlock gas</span>
        </button>` : ""}
        <button class="act secondary" id="a-cc" ${ccOK ? "" : "disabled"}>
          Build Command Center <span class="cost">— ${C.cc.cost} 💎 · ${C.cc.build}s · +${C.cc.supply} supply</span>
        </button>
        <button class="act-close" id="a-back">‹ Back</button>`;
    } else if (tab === "mine") {
      title = `Mine & Gas · ${nodeName(node)}`;
      body = `
        ${canMineHere ? `
        <button class="act secondary" id="a-mine-all" ${idleN ? "" : "disabled"}>
          Set ALL ${idleN} idle → mining
        </button>
        <button class="act secondary" id="a-idle-all" ${miningN ? "" : "disabled"}>
          Set ALL ${miningN} mining → idle
        </button>` : hasMinerals ? `<div class="sheet-sub">Build a Command Center here to mine minerals.</div>` : ""}
        ${hasRef ? `
        <button class="act secondary" id="a-gas-add" ${idleN + miningN > 0 && gasN < GAS_OPT ? "" : "disabled"}>
          ⛽ Assign 1 SCV → gas <span class="cost">— ${gasN}/${GAS_OPT} optimal</span>
        </button>
        <button class="act secondary" id="a-gas-rem" ${gasN ? "" : "disabled"}>
          ⛽ Pull 1 gas SCV → mining
        </button>` : ""}
        <button class="act-close" id="a-back">‹ Back</button>`;
    } else {
      const flat = acts => acts.length === 1
        ? `<button class="act secondary" id="${acts[0].id}">${acts[0].html}</button>` : "";
      body = `
        <button class="act" id="m-move">🚶 Move <span class="cost">— send SCVs to another node</span></button>
        ${buildActs.length > 1
          ? `<button class="act secondary" id="m-build">🏗 Build <span class="cost">— depot, barracks${gasAvail ? ", refinery" : ""}</span></button>`
          : flat(buildActs)}
        ${mineActs.length > 1
          ? `<button class="act secondary" id="m-mine">⛏ Mine & Gas <span class="cost">— assign workers to resources</span></button>`
          : flat(mineActs)}
        <button class="act-close" id="a-close">Close</button>`;
    }
    sheet.innerHTML = `<h2>${title}</h2>${summary}${body}`;

    const setTab = t => { sel.tab = t; renderSheet(); };
    bind("m-move",  () => setTab("move"));
    bind("m-build", () => setTab("build"));
    bind("m-mine",  () => setTab("mine"));
    bind("a-back",  () => setTab(null));
    // Root-level flat shortcuts when a submenu would have only one option.
    if (tab === "root") [...mineActs, ...buildActs].forEach(a => bind(a.id, a.fn));

    if (tab === "move") {
      const setN = v => { sel.n = Math.min(Math.max(1, v), max); renderSheet(); };
      bind("n-minus", () => setN(sel.n - 1));
      bind("n-plus", () => setN(sel.n + 1));
      const rng = $("n-range"); if (rng) rng.oninput = e => setN(parseInt(e.target.value, 10));
      bind("mode-move",   () => { sel.mode = "move";   renderSheet(); });
      bind("mode-attack", () => { sel.mode = "attack"; renderSheet(); });
      bindDestButtons(node, dest => { sendUnits(HUMAN, node, sel.n, "scv", dest, sel.mode); closeSheet(); render(); });
    } else if (tab === "build") {
      bind("a-cc",    () => { startBuilding(HUMAN, node, "cc"); refreshSheet(); });
      bind("a-depot", () => { startBuilding(HUMAN, node, "depot"); refreshSheet(); });
      bind("a-rax",   () => { startBuilding(HUMAN, node, "barracks"); refreshSheet(); });
      bind("a-ref",   () => { startBuilding(HUMAN, node, "refinery"); refreshSheet(); });
    } else if (tab === "mine") {
      bind("a-mine-all", () => { setTask(HUMAN, node, idleN, "idle", "mining", "scv"); refreshSheet(); });
      bind("a-idle-all", () => { setTask(HUMAN, node, miningN, "mining", "idle", "scv"); refreshSheet(); });
      bind("a-gas-add", () => {
        const scv = unitsOf(HUMAN, node, "idle", "scv")[0] || unitsOf(HUMAN, node, "mining", "scv")[0];
        if (scv) { scv.task = "gas"; refreshSheet(); }
      });
      bind("a-gas-rem", () => {
        const scv = unitsOf(HUMAN, node, "gas", "scv")[0];
        if (scv) { scv.task = "mining"; refreshSheet(); }
      });
    }
  }
  bind("a-close", closeSheet);
}

function refreshSheet() { render(); if (ui.sheet) renderSheet(); }
function bind(id, fn) { const el = $(id); if (el) el.onclick = fn; }

/* ------------------------------- Loop -------------------------------- */
function startLoop() { clearInterval(timer); timer = setInterval(() => { if (!state.paused) tick(); }, TICK_MS); }
function stopLoop() { clearInterval(timer); }
function setPaused(p) {
  state.paused = p;
  const btn = $("pause-btn");
  if (btn) btn.textContent = p ? "▶ Resume" : "⏸ Pause";
  if (p) render(); // reflect paused label immediately
}
function togglePause() { setPaused(!state.paused); }

/* ------------------------------- Tests ------------------------------- */
// In-file test harness. Pure sim only (no DOM): resetState(seed) then drive tick().
// Run headless:  node -e "<extract script>; process.exit(runTests()?0:1)"
// Or in a browser: open startext.html?test to see the report instead of the game.
function runTests() {
  let pass = 0, fail = 0;
  const log = [];
  const ok = (cond, msg) => { cond ? pass++ : (fail++, log.push("FAIL: " + msg)); };
  const eq = (a, b, msg) => ok(a === b, `${msg} — got ${a}, expected ${b}`);
  const near = (a, b, eps, msg) => ok(Math.abs(a - b) <= eps, `${msg} — got ${a}, expected ~${b}`);
  // Run n ticks (capped so a broken end-condition can't loop forever).
  const run = n => { for (let i = 0; i < n && !state.over; i++) tick(); };
  const cc = o => state.buildings.find(b => b.owner === o && b.type === "cc");
  const rax = o => state.buildings.find(b => b.owner === o && b.type === "barracks" && !b.construct);
  const cheat = (o, m) => { state.minerals[o] = m; };

  const T = {
    "starting state is canon"() {
      resetState(1);
      eq(state.minerals.human, 50, "start minerals");
      eq(unitsOf(HUMAN, HOME, null, "scv").length, 4, "start SCVs");
      eq(supplyUsed(HUMAN), 4, "start supply used");
      eq(supplyCap(HUMAN), 10, "start supply cap");
      eq(state.field[HOME], FIELD_TOTAL, "home field");
    },
    "mining yields ~0.7/sec/SCV"() {
      resetState(1);
      unitsOf(HUMAN, HOME, "idle", "scv").forEach(u => u.task = "mining"); // 4 miners
      const before = state.minerals.human;
      tick();
      near(state.minerals.human - before, 4 * MINE_RATE, 0.01, "4 miners income/sec");
    },
    "SCV training costs, takes 12s, +1 supply"() {
      resetState(1);
      cheat(HUMAN, 50);
      queueSCV(HUMAN, HOME);
      eq(state.minerals.human, 0, "minerals spent on SCV");
      run(C.cc.trainTime);
      eq(unitsOf(HUMAN, HOME, null, "scv").length, 5, "SCV produced after 12s");
    },
    "CC rally=mining sends newborn SCVs to mine; rally=idle keeps them idle"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const cc1 = cc(HUMAN);
      eq(cc1.rally, "mining", "rally defaults to mining");
      queueSCV(HUMAN, HOME);
      run(C.cc.trainTime);
      ok(unitsOf(HUMAN, HOME, "mining", "scv").length >= 1, "newborn auto-mines on rally=mining");
      cc1.rally = "idle";
      const idleBefore = unitsOf(HUMAN, HOME, "idle", "scv").length;
      queueSCV(HUMAN, HOME);
      run(C.cc.trainTime);
      eq(unitsOf(HUMAN, HOME, "idle", "scv").length, idleBefore + 1, "newborn stays idle on rally=idle");
    },
    "CC rally=mining yields idle SCV when patch is dry"() {
      resetState(1);
      cheat(HUMAN, 9999);
      state.field[HOME] = 0; // dry
      queueSCV(HUMAN, HOME);
      run(C.cc.trainTime);
      ok(unitsOf(HUMAN, HOME, "mining", "scv").length === 0, "no mining when field empty");
    },
    "CC queue caps at 5 and reserves supply"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // raise cap so supply isn't the limiter
      state.buildings.push({ id: idSeq++, owner: HUMAN, node: HOME, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      for (let i = 0; i < 8; i++) queueSCV(HUMAN, HOME);
      eq((cc(HUMAN).train ? 1 : 0) + cc(HUMAN).queued, 5, "queue capped at 5");
    },
    "supply hard-caps at 200"() {
      resetState(1);
      for (let i = 0; i < 30; i++) state.buildings.push({ id: idSeq++, owner: HUMAN,
        node: HOME, type: "depot", hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      eq(supplyCap(HUMAN), SUPPLY_MAX, "cap clamps to 200");
    },
    "supply blocks training when full"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // fill supply: 4 SCVs + queue to 10
      for (let i = 0; i < 20; i++) queueSCV(HUMAN, HOME);
      ok(supplyUsed(HUMAN) <= supplyCap(HUMAN), "never overshoot supply cap");
    },
    "mining SCV can be pulled to build (regression)"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // set all SCVs to mining — no idle SCVs
      unitsOf(HUMAN, HOME, null, "scv").forEach(u => u.task = "mining");
      ok(startBuilding(HUMAN, HOME, "depot"), "startBuilding succeeds with only miners");
      const builder = state.units.find(u => u.owner === HUMAN && u.task === "building");
      ok(builder != null, "one SCV pulled off mining to build");
    },
    "Barracks can be built without a Supply Depot"() {
      resetState(1);
      cheat(HUMAN, 9999);
      ok(startBuilding(HUMAN, HOME, "barracks"), "barracks allowed without depot");
    },
    "Command Center can be built for 400 minerals"() {
      resetState(1);
      cheat(HUMAN, 399);
      ok(!startBuilding(HUMAN, HOME, "cc"), "can't afford at 399");
      cheat(HUMAN, 400);
      ok(startBuilding(HUMAN, HOME, "cc"), "builds CC with exactly 400 minerals");
      const newCC = state.buildings.find(b => b.owner === HUMAN && b.type === "cc" && b.construct);
      ok(newCC != null, "new CC starts under construction");
      eq(state.minerals.human, 0, "400 deducted");
      run(C.cc.build);
      ok(!newCC.construct, "CC completes after build time");
    },
    "win requires all enemy buildings destroyed, not just CC"() {
      resetState(1);
      state.units = []; // no combat — drive checkEnd directly via tick
      // Remove bot CC; give bot a depot so it still has a building
      state.buildings = state.buildings.filter(b => !(b.owner === BOT && b.type === "cc"));
      state.buildings.push({ id: idSeq++, owner: BOT, node: AWAY, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      tick();
      ok(state.over !== "win", "CC gone but depot keeps the bot alive");
      // Destroy the last bot building — game must end
      state.buildings = state.buildings.filter(b => b.owner !== BOT);
      tick();
      eq(state.over, "win", "no bot buildings left → win");
    },
    "setTask with unitType=scv does not affect marines"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const m = newMarine(HUMAN, HOME); m.task = "idle";
      setTask(HUMAN, HOME, 10, "idle", "mining", "scv");
      eq(m.task, "idle", "marine task unchanged");
      ok(unitsOf(HUMAN, HOME, "mining", "scv").length > 0, "SCVs set to mining");
    },
    "Marine trains from Barracks (40hp), +1 supply"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const b = { id: idSeq++, owner: HUMAN, node: HOME, type: "barracks",
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 };
      state.buildings.push(b);
      state.buildings.push({ id: idSeq++, owner: HUMAN, node: HOME, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      queueMarine(HUMAN, HOME, b.id);
      run(C.marine.build);
      const m = unitsOf(HUMAN, HOME, null, "marine");
      eq(m.length, 1, "1 marine produced");
      eq(m[0].hp, C.marine.hp, "marine hp = 40");
    },
    "two Barracks train independently (regression)"() {
      resetState(1);
      cheat(HUMAN, 9999);
      state.buildings.push({ id: idSeq++, owner: HUMAN, node: HOME, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      const r1 = { id: idSeq++, owner: HUMAN, node: HOME, type: "barracks",
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 };
      const r2 = { id: idSeq++, owner: HUMAN, node: HOME, type: "barracks",
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 };
      state.buildings.push(r1, r2);
      queueMarine(HUMAN, HOME, r1.id);
      queueMarine(HUMAN, HOME, r2.id);
      ok(r1.train && r2.train, "both barracks training at once");
    },
    "barracks group shows under-construction even when others are training (regression)"() {
      const train = { progress: 5, total: C.marine.build };
      const ready = [
        { type: "barracks", hp: 1000, maxHp: 1000, construct: null, train, queued: 1 },
        { type: "barracks", hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 },
      ];
      const building = [
        { type: "barracks", hp: 500, maxHp: 1000, construct: { progress: 10, total: C.barracks.build } },
        { type: "barracks", hp: 200, maxHp: 1000, construct: { progress: 3, total: C.barracks.build } },
      ];
      const segs = barracksMeta(ready.concat(building), true);
      ok(segs.some(s => /building/.test(s)), "under-construction barracks reported alongside training");
      ok(segs.some(s => /2 building/.test(s)), "counts both in-construction barracks");
      ok(segs.some(s => /Training/.test(s)), "still reports the training ones");
      // Only construction in progress → must still report it.
      const onlyBuilding = barracksMeta(building, true);
      ok(onlyBuilding.some(s => /2 building/.test(s)), "all-building group shows count");
    },
    "Marine and SCV deal their canon damage per hit"() {
      resetState(1);
      // 1 human marine vs 1 high-HP bot dummy, both idle at AWAY (no other units).
      const m = newMarine(HUMAN, AWAY); m.task = "idle";
      const e = { id: idSeq++, owner: BOT, node: AWAY, type: "scv", task: "idle",
        hp: 1000, maxHp: 1000, atkCd: 0, buildingId: null, transit: null };
      state.units = [m, e];
      state.buildings = []; // isolate: no CCs so the duel is the only combat
      m.engaged = ENGAGE_DELAY + 1; // pre-close the windup so the first tick lands a hit
      tick();
      const dealt = 1000 - e.hp;
      ok(dealt > 0 && dealt % C.marine.dmg === 0, `marine damage is a multiple of 6 (got ${dealt})`);
    },
    "travel takes EDGE_TIME per hop and hides unit in transit"() {
      resetState(1);
      const dest = state.map.adj[HOME][0]; // a neighbour of your base (1 hop)
      sendUnits(HUMAN, HOME, 1, "scv", dest);
      const u = state.units.find(x => x.task === "moving");
      eq(u.node, -1, "in transit: off-map");
      ok(u.transit && u.transit.path.length === 2 && u.transit.to === dest, "1-hop path correct");
      run(EDGE_TIME);
      eq(u.node, dest, "arrived at the neighbouring node after EDGE_TIME ticks");
      eq(u.task, "idle", "arrives idle");
      ok(state.visited.human[dest], "arrival marks the node explored");
    },
    "can't send beyond the explored frontier"() {
      resetState(1);
      // The enemy base is multiple hops away and unexplored at the start.
      if (hopDist(HOME, AWAY) > 1) ok(!canSendTo(HUMAN, AWAY), "enemy base not reachable until scouted");
      // The immediate neighbours of your base are always reachable.
      ok(canSendTo(HUMAN, state.map.adj[HOME][0]), "a neighbour is reachable");
    },
    "map: connected, sized 5–6, start bases full, expansions placed symmetrically"() {
      for (const seed of [1, 7, 42, 99, 256]) {
        resetState(seed);
        const m = state.map;
        ok(m.n >= MAP_MIN_NODES && m.n <= MAP_MAX_NODES, `node count in range (got ${m.n})`);
        ok(HOME !== AWAY, "two distinct start nodes");
        const reach = bfsDist(0, m.adj, m.n);
        ok(reach.every(d => d < Infinity), "graph is fully connected");
        // Start nodes carry full resources.
        eq(state.field[HOME], FIELD_TOTAL, "HOME minerals full");
        eq(state.field[AWAY], FIELD_TOTAL, "AWAY minerals full");
        eq(state.gasField[HOME], GAS_TOTAL, "HOME gas full");
        eq(state.gasField[AWAY], GAS_TOTAL, "AWAY gas full");
        // Each non-start node: minerals and gas are each either EXPANSION_FIELD/GAS or 0.
        for (let i = 0; i < m.n; i++) {
          if (i === HOME || i === AWAY) continue;
          ok(state.field[i] === 0 || state.field[i] === EXPANSION_FIELD,
            `field at node ${i} is 0 or EXPANSION_FIELD (seed ${seed})`);
          ok(state.gasField[i] === 0 || state.gasField[i] === EXPANSION_GAS,
            `gasField at node ${i} is 0 or EXPANSION_GAS (seed ${seed})`);
        }
      }
    },
    "expansion resources are symmetric — both sides have equal access"() {
      for (const seed of [1, 7, 42, 99, 256]) {
        resetState(seed);
        const m = state.map;
        for (let i = 0; i < m.n; i++) {
          if (i === HOME || i === AWAY) continue;
          const dh = m.dist[HOME][i], da = m.dist[AWAY][i];
          if (dh === da) continue; // equidistant nodes are inherently fair
          // Asymmetric node: minerals and gas must each match the symmetric mirror.
          const mirror = [...Array(m.n).keys()].find(
            j => j !== HOME && j !== AWAY && j !== i &&
                 m.dist[HOME][j] === da && m.dist[AWAY][j] === dh);
          if (mirror !== undefined) {
            ok(state.field[i] === state.field[mirror],
              `minerals symmetric at nodes ${i}↔${mirror} (seed ${seed})`);
            ok(state.gasField[i] === state.gasField[mirror],
              `gas symmetric at nodes ${i}↔${mirror} (seed ${seed})`);

      resetState(1);
      const dest = state.map.adj[HOME][0];
      state.visited.human[dest] = true;
      // Build a barracks at HOME and set its rally.
      cheat(HUMAN, 300);
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1);
      const rax = state.buildings.find(b => b.type === "barracks" && !b.construct && b.owner === HUMAN);
      ok(rax, "barracks completed");
      rax.rally = dest;
      // Queue and complete a marine.
      cheat(HUMAN, 100);
      queueMarine(HUMAN, HOME, rax.id);
      run(C.marine.build + 1);
      // The new marine should be in transit toward dest, not idle at HOME.
      const inTransit = state.units.some(u =>
        u.owner === HUMAN && u.type === "marine" && u.transit && u.transit.to === dest);
      ok(inTransit, "new marine auto-dispatched to rally node");
    },

    bot_mines_expansion_after_cc() {
      resetState(7);
      // Find a non-home resource node.
      let expNode = -1;
      for (let n = 0; n < state.map.n; n++) {
        if (n !== HOME && n !== AWAY && state.field[n] > 0) { expNode = n; break; }
      }
      if (expNode === -1) { ok(true, "no expansion node on this seed — skip"); return; }
      // Place a completed CC at the expansion.
      state.buildings.push({ id: idSeq++, owner: BOT, type: "cc", node: expNode,
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0, rally: "mining" });
      state.visited[BOT][expNode] = true;
      // Place an idle SCV at the expansion.
      newSCV(BOT, expNode);
      state.minerals[BOT] = 0;
      state.underAttack = Array(state.map.n).fill(false);
      botEval();
      const mining = unitsOf(BOT, expNode, "mining", "scv").length;
      ok(mining >= 1, "bot sets expansion SCV to mining when CC is complete");
    },

    "queue marine when supply-capped; trains automatically when depot finishes"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // Fill supply to cap.
      while (supplyUsed(HUMAN) < supplyCap(HUMAN)) {
        state.units.push({ id: idSeq++, owner: HUMAN, type: "marine", node: HOME,
          task: "idle", hp: 40, maxHp: 40, atkCd: 0, engaged: 0, buildingId: null, transit: null });
      }
      ok(supplyUsed(HUMAN) >= supplyCap(HUMAN), "supply is at cap");
      // Queuing a marine should still succeed (minerals deducted, queued not training yet).
      const before = state.minerals[HUMAN];
      const rax = state.buildings.find(b => b.type === "barracks" && !b.construct && b.owner === HUMAN);
      if (!rax) { ok(true, "no barracks on this seed — skip"); return; }
      queueMarine(HUMAN, HOME, rax.id);
      ok(state.minerals[HUMAN] < before, "minerals deducted despite supply cap");
      eq(rax.queued, 1, "marine is queued (not training) while supply-blocked");
      eq(rax.train, null, "no active training slot while supply-blocked");
      // Build a supply depot to clear the block.
      startBuilding(HUMAN, HOME, "depot");
      run(C.depot.build + 1);
      ok(rax.train !== null || rax.queued === 0, "training started after supply freed");
    },

    "new barracks inherits rally from sibling at same node"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const dest = state.map.adj[HOME][0];
      state.visited.human[dest] = true;
      // Build first barracks and set a rally.
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1);
      const rax1 = state.buildings.find(b => b.type === "barracks" && !b.construct && b.owner === HUMAN);
      ok(rax1, "first barracks done");
      rax1.rally = dest;
      // Build a second barracks.
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1);
      const rax2 = state.buildings.filter(b => b.type === "barracks" && !b.construct && b.owner === HUMAN)
        .find(b => b.id !== rax1.id);
      ok(rax2, "second barracks done");
      eq(rax2.rally, dest, "second barracks inherited rally from first");
    },
  };

  for (const name in T) {
    try { T[name](); }
    catch (e) { fail++; log.push("THREW: " + name + " — " + (e && e.message)); }
  }

  // Stress-test: run 30 seeded games to completion.
  // Checks that every game ends (win or loss), no crash, no stall, no negative resources.
  const MAX_TICKS = 20000;
  let stressPass = 0, stressFail = 0;
  for (let seed = 0; seed < 30; seed++) {
    try {
      resetState(seed);
      let ticks = 0;
      while (!state.over && ticks < MAX_TICKS) { tick(); ticks++; }
      if (!state.over) {
        fail++; stressFail++;
        log.push(`STRESS seed=${seed}: game did not end within ${MAX_TICKS} ticks`);
      } else if (state.minerals[HUMAN] < 0 || state.minerals[BOT] < 0) {
        fail++; stressFail++;
        log.push(`STRESS seed=${seed}: negative minerals (human=${state.minerals[HUMAN].toFixed(2)}, bot=${state.minerals[BOT].toFixed(2)})`);
      } else if (state.gas[HUMAN] < 0 || state.gas[BOT] < 0) {
        fail++; stressFail++;
        log.push(`STRESS seed=${seed}: negative gas`);
      } else {
        pass++; stressPass++;
      }
    } catch (e) {
      fail++; stressFail++;
      log.push(`STRESS seed=${seed} THREW: ${e && e.message}`);
    }
  }
  if (stressFail === 0 && typeof console !== "undefined")
    console.log(`  Stress: ${stressPass}/30 games completed cleanly`);
  const summary = `StarText tests: ${pass} passed, ${fail} failed`;
  if (typeof console !== "undefined") { console.log(summary); log.forEach(l => console.log("  " + l)); }
  return { pass, fail, log, summary };
}

/* ------------------------------- Boot -------------------------------- */
const HEADLESS = typeof document === "undefined";
if (HEADLESS) {
  // Node entry: run tests and exit non-zero on failure.
  const r = runTests();
  if (typeof module !== "undefined") module.exports = { runTests };
  if (typeof process !== "undefined") process.exit(r.fail ? 1 : 0);
} else if (location.search.indexOf("test") !== -1) {
  // Browser ?test mode: show the report instead of booting the game.
  const r = runTests();
  document.body.innerHTML =
    `<pre style="padding:16px;font-size:14px;color:${r.fail ? "#f87171" : "#4ade80"}">` +
    `${r.summary}\n\n${r.log.join("\n") || "All green."}</pre>`;
} else {
  $("sheet-backdrop").onclick = closeSheet;
  $("end-again").onclick = init;
  $("pause-btn").onclick = togglePause;
  init();
  startLoop();
}
</script>
</body>
</html>
