<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StarText — Mini RTS</title>
<style>
  :root {
    --bg: #0c1018;
    --panel: #161c28;
    --panel2: #1d2533;
    --line: #2a3445;
    --txt: #d7e0ec;
    --dim: #8090a4;
    --accent: #4ea1ff;
    --mineral: #41d6ff;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --enemy: #ff7a7a;
  --gas: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.35;
    overscroll-behavior: none;
  }
  #app { max-width: 1000px; margin: 0 auto; padding: 8px 8px 96px; }

  /* Top status bar */
  #statusbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .stat { display: flex; flex-direction: column; min-width: 70px; }
  .stat b { font-size: 18px; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .stat.minerals b { color: var(--mineral); }
  .stat.gas b { color: var(--gas); }
  .stat.supply.blocked b { color: var(--warn); }
  #supply-warn {
    display: none; flex: 0 0 100%; margin-top: 4px;
    background: #3d2e00; border: 1px solid var(--warn); border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-weight: 600;
    color: var(--warn); text-align: center;
  }
  #idle-scv-warn {
    display: none; flex: 0 0 100%; margin-top: 4px;
    background: #1a2e14; border: 1px solid #6abf5e; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; font-weight: 600;
    color: #6abf5e; text-align: center; cursor: pointer;
  }

  h1 { font-size: 15px; margin: 0; letter-spacing: .04em; }

  /* Board: map graph on top, focused-node detail below */
  #board { display: flex; flex-direction: column; gap: 10px; }
  @media (min-width: 640px) {
    #board { flex-direction: row; align-items: flex-start; }
    #board .map { flex: 0 0 260px; max-width: 260px; }
    #board .map svg { max-height: none; }
    #board > .node { flex: 1; min-width: 0; }
  }

  /* Map graph */
  .map { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .map svg { width: 100%; height: auto; display: block; max-height: 320px; }
  .map .edge { stroke: #3a465c; stroke-width: 1.1; }
  .map-legend { font-size: 10px; color: var(--dim); text-align: center; margin-top: 4px; }
  .gnode { cursor: pointer; }
  .gnode .ncircle { fill: var(--panel2); stroke: var(--line); stroke-width: 1.4; transition: stroke .1s; }
  .gnode .glyph { fill: var(--txt); font-size: 6px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .gnode .ncount { fill: var(--accent); font-size: 4.2px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .gnode.home .ncircle  { fill: #1d3350; stroke: var(--accent); }
  .gnode.foe .ncircle   { fill: #4a1f28; stroke: var(--enemy); }
  .gnode.owned .ncircle { fill: #21304a; stroke: #3a5170; }
  .gnode.unknown .ncircle { fill: #141a26; stroke: var(--dim); stroke-dasharray: 2.2 2; }
  .gnode.unknown .glyph { fill: var(--dim); }
  .gnode.threat .ncircle { stroke: var(--bad); stroke-width: 2.4; }
  .gnode.selected .ncircle { stroke: var(--warn); stroke-width: 2.8; }
  .gnode:active .ncircle { fill: #2b3a55; }

  .node {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
  }
  .node.home { border-color: #2f4a6b; }
  .node.away { border-color: #5a2f3a; }
  .node.neutral { border-color: var(--line); opacity: .96; }
  .node-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .node-head h1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .node-head .field { font-size: 12px; color: var(--mineral); white-space: nowrap; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 6px; border-radius: 6px; }
  .badge.you { background: #1d3350; color: #9ec1ff; }
  .badge.foe { background: #4a1f28; color: #ffb4b4; }
  .paths { font-size: 11px; color: var(--dim); margin-bottom: 8px; }

  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 10px 0 4px;
  }
  .force-mine .section-label { color: var(--accent); }
  .force-enemy .section-label { color: var(--enemy); }

  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; margin-bottom: 6px;
    min-height: 48px; width: 100%; text-align: left;
    color: var(--txt); font: inherit; cursor: pointer;
  }
  .row.static { cursor: default; }
  .row.seen { opacity: .6; border-style: dashed; }
  .row .icon { width: 26px; height: 26px; flex: 0 0 26px; }
  .row .body { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 14px; }
  .row .meta { font-size: 12px; color: var(--dim); }
  .row .chev { color: var(--dim); font-size: 18px; }
  button.row:active { background: #243049; }

  .bar { height: 6px; background: #0a0f17; border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .bar.hp > i { background: var(--good); }
  .bar.hp.mid > i { background: var(--warn); }
  .bar.hp.low > i { background: var(--bad); }
  .bar.prog > i { background: var(--accent); }

  .unknown {
    color: var(--dim); font-style: italic; font-size: 13px;
    padding: 12px; text-align: center;
    background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px;
  }

  /* Transit */
  #transit { margin-top: 10px; }
  .transit-row {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; margin-bottom: 6px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .transit-info { flex: 1; }
  .transit-row .name { font-size: 14px; font-weight: 600; }
  .transit-row .meta { font-size: 12px; color: var(--dim); }
  .transit-cancel {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--dim); font-size: 13px; padding: 3px 8px; cursor: pointer; flex-shrink: 0;
  }
  .transit-cancel:hover { color: var(--bad); border-color: var(--bad); }

  /* Notifications */
  #notes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #notes:empty { display: none; }
  .note {
    padding: 11px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .note.loss { background: #3a1d24; border: 1px solid var(--bad); color: #ffd7d7; }
  .note.ok   { background: #0d2b1a; border: 1px solid var(--good); color: #c8ffd0; }
  .note.link { cursor: pointer; }
  .note.link:active { filter: brightness(1.15); }
  .note.alert {
    background: #5a1414; border: 1px solid #ff5a5a; color: #fff;
    font-size: 17px; letter-spacing: .03em;
    animation: alertpulse .7s ease-in-out infinite alternate;
  }
  @keyframes alertpulse {
    from { box-shadow: 0 0 0 0 rgba(255,70,70,.65); }
    to   { box-shadow: 0 0 0 9px rgba(255,70,70,0); }
  }

  /* Action sheet */
  #sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; z-index: 20;
  }
  #sheet-backdrop.open { display: block; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .18s ease-out;
    max-width: 1000px; margin: 0 auto;
  }
  #sheet.open { transform: translateY(0); }
  #sheet h2 { font-size: 16px; margin: 0 0 2px; }
  #sheet .sheet-sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }

  .stepper { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
  .stepper button {
    width: 48px; height: 48px; border-radius: 12px; font-size: 24px;
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
  }
  .stepper button:active { background: #243049; }
  .stepper .count { font-size: 22px; font-weight: 700; min-width: 40px; text-align: center; }
  .stepper .label { color: var(--dim); font-size: 12px; }
  input[type=range] { width: 100%; height: 40px; }

  .act {
    display: block; width: 100%; min-height: 50px; margin-top: 8px;
    border-radius: 12px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #06101f; border: none;
  }
  .act.secondary { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); }
  .act:disabled { opacity: .4; }
  .act:active:not(:disabled) { filter: brightness(.9); }
  .act .cost { font-weight: 400; font-size: 12px; opacity: .8; }
  .act-close { background: transparent; color: var(--dim); border: none; font-size: 14px; margin-top: 12px; width: 100%; padding: 10px; }

  .mode-toggle { display: flex; gap: 6px; margin: 10px 0 4px; }
  .mode-toggle button {
    flex: 1; min-height: 42px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
  }
  .mode-toggle button.sel { background: var(--accent); color: #06101f; border-color: transparent; }

  /* End screen */
  #end {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(6,9,15,.94); text-align: center; padding: 24px;
  }
  #end.open { display: flex; }
  #end .big { font-size: 40px; font-weight: 800; margin-bottom: 6px; }
  #end.win .big { color: var(--good); }
  #end.loss .big { color: var(--bad); }
  #end p { color: var(--dim); margin: 4px 0 24px; }
  #end button {
    min-height: 54px; padding: 0 28px; border-radius: 14px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #06101f; border: none;
  }
  .hint { color: var(--dim); font-size: 11px; text-align: center; margin-top: 14px; }

  .pause {
    align-self: center; min-height: 44px; padding: 0 16px; border-radius: 10px;
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  .pause:active { background: #243049; }
  body.paused #board { opacity: .6; }

  /* Pause menu (opening it pauses; Resume / tap-outside closes it) */
  #menu {
    position: fixed; inset: 0; z-index: 28; display: none;
    align-items: center; justify-content: center;
    background: rgba(6,9,15,.82); padding: 24px;
  }
  #menu.open { display: flex; }
  .menu-card {
    width: 100%; max-width: 340px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    text-align: center;
  }
  .menu-title { font-size: 26px; font-weight: 800; margin-bottom: 18px; }
  .menu-label { color: var(--dim); font-size: 12px; text-align: left; margin-bottom: 6px; }
  .speed-seg { display: flex; gap: 6px; margin-bottom: 18px; }
  .speed-seg button {
    flex: 1; min-height: 46px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
  }
  .speed-seg button.sel { background: var(--accent); color: #06101f; border-color: transparent; }
  .menu-primary {
    display: block; width: 100%; min-height: 54px; border-radius: 14px;
    font-size: 17px; font-weight: 700; background: var(--accent); color: #06101f; border: none;
  }
  .menu-primary:active { filter: brightness(.9); }
  .menu-danger {
    display: block; width: 100%; min-height: 48px; margin-top: 10px; border-radius: 12px;
    font-size: 14px; font-weight: 600; background: var(--panel2);
    color: #ff9a9a; border: 1px solid #5a2a2a;
  }
  .menu-danger:active { background: #3a1f24; }
</style>
</head>
<body>
<div id="app">
  <div id="statusbar">
    <div class="stat minerals"><b id="s-min">50</b><span>Minerals</span></div>
    <div class="stat gas"><b id="s-gas">0</b><span>Gas</span></div>
    <div class="stat supply" id="s-supwrap"><b id="s-sup">4 / 10</b><span>Supply</span></div>
    <div style="flex:1"></div>
    <button id="menu-btn" class="pause">☰</button>
    <div id="supply-warn">⚠️ Additional supply depots required</div>
    <div id="idle-scv-warn"></div>
  </div>

  <div id="notes"></div>
  <div id="board"></div>
  <div id="transit"></div>
  <div class="hint">Tap Command Center, Barracks, SCVs, or Marines to give orders.</div>
</div>

<div id="sheet-backdrop"></div>
<div id="sheet"></div>

<div id="end">
  <div class="big" id="end-big">Victory</div>
  <p id="end-msg"></p>
  <button id="end-copy" style="display:none">Copy replay log</button>
  <button id="end-again">Play again</button>
</div>

<div id="menu">
  <div class="menu-card">
    <div class="menu-title" id="menu-title">StarText</div>
    <div class="menu-label">Game speed</div>
    <div class="speed-seg">
      <button data-speed="slow">🐢 Slow</button>
      <button data-speed="normal">▶ Normal</button>
      <button data-speed="fast">⚡ Fast</button>
    </div>
    <button id="menu-resume" class="menu-primary">▶ Start game</button>
    <button id="menu-surrender" class="menu-danger">🏳️ Surrender</button>
  </div>
</div>

<script>
"use strict";

// ── StarText — single-file mini-RTS ──────────────────────────────────────────
// The simulation (resetState + tick and everything it calls) is DOM-free and
// deterministic under a seed, so it runs headless in Node for fast tests.
//
//   Run tests:  sed -n '/<script>/,/<\/script>/p' startext.html | sed '1d;$d' \
//                 | node -   →  prints "N passed, M failed", exits non-zero on fail
//   In browser: open startext.html?test to see the same report instead of the game.
//
// Map: a random connected graph of 5–6 nodes (genMap). Only the two farthest-apart
// nodes (the players' bases) hold resources. Movement is exploration-gated — you can
// only send units to a node adjacent to one you've already visited (canSendTo) — and
// travel is hop-by-hop: EDGE_TIME per segment + DWELL_TIME pause at each intermediate
// node (where units can scout and fight before moving on). Two modes: "move" (leave
// after DWELL_TIME regardless) and "attack" (stay until the node is clear).
//
// See runTests() near the bottom. Add an assert there whenever you add behaviour.
// ─────────────────────────────────────────────────────────────────────────────

// Seedable RNG (mulberry32) so the sim is deterministic under test. Tests call
// seedRng(n) for reproducible runs; the live game seeds from Date.now().
let _rngState = 0;
function seedRng(n) { _rngState = n >>> 0; }
function rng() {
  _rngState = (_rngState + 0x6D2B79F5) | 0;
  let t = _rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ----------------------------- Constants ----------------------------- */
const TICK_MS = 1000;       // baseline: 1 tick / second (the "normal" speed)
// Player-selectable game speed. Early game is sparse so you may want it fast;
// late game gets busy, so slow gives time to issue orders. Lower ms = faster.
const SPEEDS = {
  slow:   { ms: 2000, label: "🐢 Slow" },
  normal: { ms: 1000, label: "▶ Normal" },
  fast:   { ms: 400,  label: "⚡ Fast" },
};
const DEFAULT_SPEED = "normal";
const tickMs = () => (SPEEDS[state.speed] || SPEEDS[DEFAULT_SPEED]).ms;
const EDGE_TIME = 14;       // seconds to traverse one map edge (multi-hop trips cost more)
const MAP_MIN_NODES = 5, MAP_MAX_NODES = 6; // random map size range
const MINE_RATE = 0.7;      // minerals per mining SCV per second (below saturation)
const FIELD_TOTAL = 12000;  // 8 patches × 1500 — standard BW main base
const MINERAL_PATCHES = 8;  // patches per base; 2 SCVs/patch = full efficiency (16 total)
const PATCH_SIZE = FIELD_TOTAL / MINERAL_PATCHES; // 1500 minerals per patch
const SUPPLY_MAX = 200;     // BW hard cap

// Vespene gas: 1 geyser per base, optimal at GAS_OPT SCVs (100% utilisation).
// Beyond that the extra SCVs add nothing (hard cap, like BW 3-worker optimum).
const GAS_TOTAL  = 5000;    // gas units per geyser (main base)
const GAS_RATE   = 0.55;    // gas per collecting SCV per second at full efficiency
const GAS_OPT    = 4;       // SCVs for 100% gas utilisation (capped — extras waste time)

// Expansion nodes: symmetric mineral/gas fields placed at non-start nodes that have
// a matching mirror node equidistant from the other player (so neither side is favoured).
const EXPANSION_FIELD = 5000;  // minerals at each expansion
const EXPANSION_GAS   = 5000;  // gas at each expansion

// Combat windup: when two forces first meet at a node they spend ENGAGE_DELAY
// seconds closing the distance before any blows land. This represents the armies
// marching toward each other, gives you a few seconds to react to an "under attack"
// alert, and — crucially — lets a lone scout record what it sees (fogStep runs every
// tick) before it gets cut down.
const ENGAGE_DELAY = 5;
// A unit born straight into a fight has no distance to close, so it sidesteps the
// windup: its engaged counter starts past any possible closeDelay. Transit and the
// no-foes case both reset engaged to 0, so units that march in (or armies meeting
// fresh) still pay the symmetric closing windup.
const WARMED_ENGAGED = 999;
const DWELL_TIME  = 10; // seconds spent at each intermediate node in "move" mode (explore + fight window)

// `range` adds asymmetry on top of that windup: a unit waits an *extra*
// max(0, enemyRange - ownRange) ticks, so a ranged unit (marine) lands free hits
// while a melee unit (SCV, range 0) is still closing. Buildings have no range → 0.
const C = {
  scv:      { hp: 60,  dmg: 5,  atk: 1.5, cost: 50,  build: 12, range: 0 }, // melee
  // Marine: BW stats — 40 HP, 6 dmg, 15-frame cooldown (~0.9 s at our tick rate)
  marine:   { hp: 40,  dmg: 6,  atk: 0.9, cost: 50,  build: 24, queueMax: 5, range: 3 }, // ranged
  // Firebat: melee splash unit — hits 2 targets per swing; requires Academy
  firebat:  { hp: 50,  dmg: 16, atk: 1.5, cost: 50,  gasCost: 25, build: 24, queueMax: 5, range: 0, splash: 2 },
  cc:       { hp: 1500, supply: 10, trainCost: 50, trainTime: 12, queueMax: 5, cost: 400, build: 60 },
  depot:    { hp: 400,  cost: 100, build: 25, supply: 8 },
  barracks: { hp: 1000, cost: 150, build: 46 },
  refinery: { hp: 500,  cost: 75,  build: 20 }, // builds on the geyser; no train queue
  academy:  { hp: 600,  cost: 150, build: 80 }, // unlocks firebat + U-238 Shells research
  bunker:   { hp: 350,  cost: 100, build: 30, capacity: 4 }, // shelters up to 4 infantry
  engBay:   { hp: 850,  cost: 150, build: 60 }, // unlocks infantry weapon/armor upgrades
};
// Bot behaviour parameters — every numeric threshold lives here so the
// evolutionary optimizer can tune them without touching logic.
const BOT_CONFIG_DEFAULT = {
  scvCapBase: 16,
  scvCapSkilled: 12,
  scvExpCap: 6,
  expandMinScv: 11,
  keepMining: 6,
  reserveBase: 12,
  reserveSkilled: 3,
  waveIntervalInit: 94,
  waveIntervalMin: 54,
  waveIntervalMax: 130,
  waveMin: 12,
  waveMultiplier: 1.38,
  waveOffset: 3,
  blindAttackMin: 27,
  raxCapBase: 3,
  raxCapSkilled: 7,
  raxTimeBase: 74,
  raxTimeSkilled: 83,
  uScv: 1,
  uMarine: 1,
  uFirebat: 2,
  uRax: 1.08,
  uAcademy: 1.41,
  uBunker: 1.31,
  uEngBay: 2,
  uInfWeapons: 0.20,
  uInfArmor: 0.20,
  uExpand: 0.80,
  uDepot: 1,
  uU238: 1.22,
};
let BOT_CONFIG   = { ...BOT_CONFIG_DEFAULT };
let HUMAN_CONFIG = { ...BOT_CONFIG_DEFAULT };
// Set to true in the evolutionary script so tick() also drives the human side.
let ENABLE_HUMAN_BOT = false;

// Tech upgrades researched at the Academy.
const UPGRADES = {
  u238:         { building: "academy", minerals: 150, gas: 150, time: 100,
                  label: "U-238 Shells (+1 Marine range)",
                  notify: "🔬 U-238 Shells complete! Marines have +1 range." },
  infWeapons1:  { building: "engBay", minerals: 100, gas: 100, time: 100,
                  requires: null,          label: "Infantry Weapons 1 (+1 attack)",
                  notify: "🔧 Infantry Weapons 1 complete! +1 attack damage." },
  infWeapons2:  { building: "engBay", minerals: 175, gas: 175, time: 150,
                  requires: "infWeapons1", label: "Infantry Weapons 2 (+2 attack)",
                  notify: "🔧 Infantry Weapons 2 complete! +2 attack damage." },
  infWeapons3:  { building: "engBay", minerals: 250, gas: 250, time: 200,
                  requires: "infWeapons2", label: "Infantry Weapons 3 (+3 attack)",
                  notify: "🔧 Infantry Weapons 3 complete! +3 attack damage." },
  infArmor1:    { building: "engBay", minerals: 100, gas: 100, time: 100,
                  requires: null,          label: "Infantry Armor 1 (+1 armor)",
                  notify: "🛡 Infantry Armor 1 complete! Marines/Firebats take -1 damage." },
  infArmor2:    { building: "engBay", minerals: 175, gas: 175, time: 150,
                  requires: "infArmor1",   label: "Infantry Armor 2 (+2 armor)",
                  notify: "🛡 Infantry Armor 2 complete! Marines/Firebats take -2 damage." },
  infArmor3:    { building: "engBay", minerals: 250, gas: 250, time: 200,
                  requires: "infArmor2",   label: "Infantry Armor 3 (+3 armor)",
                  notify: "🛡 Infantry Armor 3 complete! Marines/Firebats take -3 damage." },
};

// HOME/AWAY are the human's and bot's start-node ids on the generated map.
// They (and NODE_NAMES) are filled in by resetState once the map exists.
let HOME = 0, AWAY = 1;
let NODE_NAMES = [];
const HUMAN = "human", BOT = "bot";

/* ------------------------------- Map --------------------------------- */
// The map is a small connected graph (5–6 nodes). Only the two start nodes
// (farthest-apart pair) carry resources. Movement is gated by exploration:
// you may send units to any node adjacent to a node you've already visited.

// BFS hop-distances from `src` to every node.
function bfsDist(src, adj, n) {
  const dist = new Array(n).fill(Infinity);
  dist[src] = 0;
  const q = [src];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    for (const v of adj[u]) if (dist[v] === Infinity) { dist[v] = dist[u] + 1; q.push(v); }
  }
  return dist;
}

// BFS shortest path (list of node ids) from a to b.
function bfsPath(a, b, adj, n) {
  const prev = new Array(n).fill(-1);
  const seen = new Array(n).fill(false);
  seen[a] = true;
  const q = [a];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    if (u === b) break;
    for (const v of adj[u]) if (!seen[v]) { seen[v] = true; prev[v] = u; q.push(v); }
  }
  const path = [];
  for (let cur = b; cur !== -1; cur = prev[cur]) { path.unshift(cur); if (cur === a) break; }
  return path[0] === a ? path : [a]; // unreachable → just the origin (can't happen: graph is connected)
}

// BFS shortest path that only traverses nodes the owner has already visited.
// The destination itself may be unvisited (frontier). Returns [] if unreachable.
function bfsPathVisited(owner, src, dst, adj, n) {
  const vis = state.visited[owner];
  const prev = new Array(n).fill(-1);
  const seen = new Array(n).fill(false);
  seen[src] = true;
  const q = [src];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    if (u === dst) break;
    for (const v of adj[u]) {
      if (seen[v]) continue;
      if (!vis[v] && v !== dst) continue; // only traverse explored territory
      seen[v] = true;
      prev[v] = u;
      q.push(v);
    }
  }
  if (!seen[dst]) return [];
  const path = [];
  for (let cur = dst; cur !== -1; cur = prev[cur]) { path.unshift(cur); if (cur === src) break; }
  return path[0] === src ? path : [];
}

// Build a random connected map: spanning tree (guarantees no islands) + a few
// extra edges for loops. Deterministic under the active rng seed.
function genMap() {
  const n = MAP_MIN_NODES + ((rng() * (MAP_MAX_NODES - MAP_MIN_NODES + 1)) | 0);
  const adj = Array.from({ length: n }, () => new Set());
  const link = (a, b) => { adj[a].add(b); adj[b].add(a); };
  for (let i = 1; i < n; i++) link(i, (rng() * i) | 0); // tree: each node joins an earlier one
  const extra = 1 + ((rng() * 2) | 0);                   // 1–2 extra edges
  for (let k = 0; k < extra; k++) {
    const a = (rng() * n) | 0, b = (rng() * n) | 0;
    if (a !== b && !adj[a].has(b)) link(a, b);
  }
  const adjArr = adj.map(s => [...s].sort((x, y) => x - y));
  const dist = adjArr.map((_, i) => bfsDist(i, adjArr, n));
  // Start nodes = the farthest-apart pair (graph diameter endpoints).
  let starts = [0, 1], best = -1;
  for (let i = 0; i < n; i++)
    for (let j = i + 1; j < n; j++)
      if (dist[i][j] > best) { best = dist[i][j]; starts = [i, j]; }
  const names = Array.from({ length: n }, (_, i) => "Sector " + String.fromCharCode(65 + i));
  const pos = layoutNodes(n, adjArr, dist, starts);
  return { n, adj: adjArr, dist, starts, names, pos };
}

// Stable, readable graph layout: columns by hop-distance from the human base
// (your base on the left, the enemy base on the right), nodes in each column
// spread vertically. Positions are normalised to [0,1] and fixed at map-gen time
// so revealed nodes never jump around. Returns [{x,y}, …] per node id.
function layoutNodes(n, adj, dist, starts) {
  const d = dist[starts[0]];
  const maxD = Math.max(1, ...d.filter(x => x < Infinity));
  const layers = {};
  for (let i = 0; i < n; i++) (layers[d[i]] = layers[d[i]] || []).push(i);
  const pos = new Array(n);
  for (const dl in layers) {
    const group = layers[dl].sort((a, b) => a - b);
    const x = (+dl) / maxD;
    group.forEach((node, k) => {
      const y = group.length === 1 ? 0.5 : k / (group.length - 1);
      pos[node] = { x, y };
    });
  }
  return pos;
}

// Nodes an owner may currently send units to: every visited node and each of
// their neighbours (the explored frontier). Reinforcing held nodes is allowed.
function reachableSet(owner) {
  const vis = state.visited[owner], out = new Set();
  for (let i = 0; i < state.map.n; i++) if (vis[i]) {
    out.add(i);
    for (const j of state.map.adj[i]) out.add(j);
  }
  return out;
}
const canSendTo = (owner, dest) => reachableSet(owner).has(dest);
const hopDist = (a, b) => state.map.dist[a][b];

/* ----------------------------- Game state ---------------------------- */
let state, ui, timer, idSeq;

// Pure: build a fresh game state with no DOM/timer side effects. Tests call this
// directly (optionally seeded) and then drive tick() in a loop.
function resetState(seed) {
  const _seed = seed === undefined ? (typeof Date !== "undefined" ? Date.now() : 1) : seed;
  seedRng(_seed);
  if (typeof document !== 'undefined')
    BOT_CONFIG = { ...BOT_CONFIG_DEFAULT };
  idSeq = 1;
  const map = genMap();
  HOME = map.starts[0];
  AWAY = map.starts[1];
  NODE_NAMES = map.names;
  const n = map.n;
  // Resources live only at the two start nodes.
  const field = new Array(n).fill(0), gasField = new Array(n).fill(0);
  field[HOME] = field[AWAY] = FIELD_TOTAL;
  gasField[HOME] = gasField[AWAY] = GAS_TOTAL;
  // Expansion resources: ~25% chance per slot, fairness enforced.
  // Symmetric pairs (one node close to HOME, its mirror close to AWAY) are rolled
  // together — both get resources or neither does. Equidistant mid nodes roll solo.
  // Asymmetric unpaired nodes are never given resources (would favour one side).
  // Minerals and gas are rolled independently (~25% each), so a node can have
  // minerals only, gas only, both, or neither. Symmetric pairs share the same
  // roll so both sides always receive identical resources.
  const expUsed = new Set();
  for (let i = 0; i < n; i++) {
    if (i === HOME || i === AWAY || expUsed.has(i)) continue;
    const dh = map.dist[HOME][i], da = map.dist[AWAY][i];
    if (dh === da) {
      if (rng() < 0.25) { field[i] = EXPANSION_FIELD; }
      if (rng() < 0.25) { gasField[i] = EXPANSION_GAS; }
      expUsed.add(i);
    } else {
      const mirror = [...Array(n).keys()].find(
        j => j !== HOME && j !== AWAY && !expUsed.has(j) && j !== i &&
             map.dist[HOME][j] === da && map.dist[AWAY][j] === dh);
      if (mirror !== undefined) {
        if (rng() < 0.25) { field[i] = EXPANSION_FIELD; field[mirror] = EXPANSION_FIELD; }
        if (rng() < 0.25) { gasField[i] = EXPANSION_GAS; gasField[mirror] = EXPANSION_GAS; }
        expUsed.add(i); expUsed.add(mirror);
      }
    }
  }
  // Explored set per owner: each starts knowing only its own base.
  const visited = { human: new Array(n).fill(false), bot: new Array(n).fill(false) };
  visited.human[HOME] = true;
  visited.bot[AWAY]   = true;
  state = {
    time: 0,
    over: null,                 // null | "win" | "loss"
    paused: false,
    speed: DEFAULT_SPEED,       // "slow" | "normal" | "fast" — drives the tick interval
    map,
    field, gasField,
    visited,
    labels: new Array(n).fill(null),  // display names, assigned in the order you discover nodes
    minerals: { human: 50, bot: 50 },
    gas:      { human: 0,  bot: 0  },    // gas collected (future: spent on advanced units)
    units: [],
    buildings: [],
    notes: [],                  // transient on-screen notifications
    underAttack: new Array(n).fill(false), // per-node edge-trigger for the "under attack" alert
    seen: new Array(n).fill(null),      // per-node last-seen enemy buildings (null = never scouted)
    seenUnits: new Array(n).fill(null), // per-node last-seen enemy units (fades after a few s)
    upgrades: { human: [], bot: [] }, // researched upgrade keys per owner
    _seed,
    gameLog: [],                   // replay entries; populated only in browser sessions
    bot:     { lastEval: 0, lastWave: 30, waveInterval: BOT_CONFIG.waveIntervalInit,
               enemyBase: null, enemyArmy: 0, scoutTime: null,
               attackTarget: null, waveFailed: false },
    humanAI: { lastEval: 0, lastWave: 30, waveInterval: HUMAN_CONFIG.waveIntervalInit,
               enemyBase: null, enemyArmy: 0, scoutTime: null,
               attackTarget: null, waveFailed: false },
  };
  // Each side: 1 Command Center + 4 idle SCVs at its home node.
  spawnBase(HUMAN, HOME);
  spawnBase(BOT, AWAY);
  ui = { sheet: null, selectedNode: HOME };  // sheet: { kind, node, ref, n }; selectedNode = map focus
}

function init() {
  resetState();
  closeSheet();
  document.getElementById("end").className = "";
  openMenu(); // new game starts paused with the menu up — player taps Start
  render();
}

function spawnBase(owner, node) {
  state.buildings.push({
    id: idSeq++, owner, node, type: "cc",
    hp: C.cc.hp, maxHp: C.cc.hp, construct: null, train: null, queued: 0,
    rally: "mining", // newborn SCVs auto-mine by default; toggle to "idle" in the CC sheet
  });
  for (let i = 0; i < 4; i++) newSCV(owner, node);
}

function newSCV(owner, node) {
  const u = { id: idSeq++, type: "scv", owner, node, task: "idle",
    hp: C.scv.hp, maxHp: C.scv.hp, atkCd: 0, engaged: 0, buildingId: null, transit: null };
  state.units.push(u); return u;
}

function newMarine(owner, node) {
  const u = { id: idSeq++, type: "marine", owner, node, task: "idle",
    hp: C.marine.hp, maxHp: C.marine.hp, atkCd: 0, engaged: 0, buildingId: null, transit: null };
  state.units.push(u); return u;
}
function newFirebat(owner, node) {
  const u = { id: idSeq++, type: "firebat", owner, node, task: "idle",
    hp: C.firebat.hp, maxHp: C.firebat.hp, atkCd: 0, engaged: 0, buildingId: null, transit: null };
  state.units.push(u); return u;
}

/* ----------------------------- Queries ------------------------------- */
const unitsOf = (owner, node, task, type) => state.units.filter(u =>
  u.owner === owner && u.node === node &&
  (task ? u.task === task : true) && (type ? u.type === type : true));
const buildingsOf = (owner, node) => state.buildings.filter(b =>
  b.owner === owner && (node === undefined || b.node === node));
const enemy = o => (o === HUMAN ? BOT : HUMAN);
// A completed refinery at a node — required for SCVs to collect gas there.
const refineryReady = (owner, node) => state.buildings.some(b =>
  b.owner === owner && b.node === node && b.type === "refinery" && !b.construct);

// SCVs at a node that can be re-tasked or sent (not building, not moving).
const controllable = (owner, node) => state.units.filter(u =>
  u.owner === owner && u.node === node && u.type === "scv" &&
  (u.task === "idle" || u.task === "mining"));
// Idle marines at a node ready to be sent.
const idleMarines = (owner, node) => state.units.filter(u =>
  u.owner === owner && u.node === node && u.type === "marine" && u.task === "idle");
const idleFirebats = (owner, node) => state.units.filter(u =>
  u.owner === owner && u.node === node && u.type === "firebat" && u.task === "idle");

function supplyCap(owner) {
  let cap = 0;
  for (const b of buildingsOf(owner)) {
    if (b.construct) continue;
    if (b.type === "cc")    cap += C.cc.supply;
    if (b.type === "depot") cap += C.depot.supply;
  }
  return Math.min(cap, SUPPLY_MAX); // BW hard cap
}
function supplyUsed(owner) {
  // Every unit uses 1; active + queued trainees in CC and Barracks are reserved up front.
  let used = state.units.filter(u => u.owner === owner).length;
  for (const b of buildingsOf(owner)) {
    if (b.type === "cc" || b.type === "barracks")
      used += (b.train ? 1 : 0) + (b.queued || 0) + (b.queuedFirebats || 0);
  }
  return used;
}
const hasCompletedDepot = owner =>
  state.buildings.some(b => b.owner === owner && b.type === "depot" && !b.construct);
const hasBarracks = owner =>
  state.buildings.some(b => b.owner === owner && b.type === "barracks");

/* ----------------------------- Simulation ---------------------------- */
function tick() {
  if (state.over) return;
  state.time++;
  state.notes = state.notes.filter(n => n.until > state.time); // expire old toasts

  mineStep();
  buildingStep();
  unitStep();
  combatStep();
  cleanupDead();
  alertStep();
  fogStep();
  if (state.time - state.bot.lastEval >= 3)     { botEval();      state.bot.lastEval     = state.time; }
  if (ENABLE_HUMAN_BOT && state.humanAI &&
      state.time - state.humanAI.lastEval >= 3) { humanBotEval(); state.humanAI.lastEval = state.time; }

  if (state.time % 50 === 0 && state.time > 0) logSnapshot();
  checkEnd();
  render();
}

function notify(text, kind, ttl = 5, node = null) {
  state.notes.push({ id: idSeq++, text, kind, until: state.time + ttl, node });
}

function logEvent(entry) {
  if (typeof document === "undefined") return;
  state.gameLog.push({ t: state.time, ...entry });
}

function armyCount(owner) {
  return state.units.filter(u => u.owner === owner &&
    (u.type === "marine" || u.type === "firebat")).length;
}

function logSnapshot() {
  if (typeof document === "undefined") return;
  state.gameLog.push({
    t: state.time,
    snap: true,
    hm: state.minerals.human, bm: state.minerals.bot,
    ha: armyCount(HUMAN), ba: armyCount(BOT),
  });
}

// Fire a prominent alert the moment enemies appear at any node you hold — your base
// or a forward position. Edge-triggered per node, so it re-fires for each fresh wave
// rather than spamming every tick, and carries the node so the toast can link to it.
function alertStep() {
  for (let node = 0; node < state.map.n; node++) {
    const mine = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                 state.buildings.some(b => b.owner === HUMAN && b.node === node);
    const foe = state.units.some(u => u.owner === BOT && u.node === node);
    const contested = mine && foe;
    if (contested && !state.underAttack[node]) notify("⚠️ UNDER ATTACK", "alert", 6, node);
    state.underAttack[node] = contested;
  }
}

const SEEN_UNITS_TTL = 5; // seconds a last-seen enemy unit count lingers after we lose vision

// Fog memory: while we have a unit/building at a node, remember a frozen snapshot of
// the enemy *buildings* there. Enemy unit counts are also captured but only linger a
// few seconds (SEEN_UNITS_TTL) so a scout that dies still reports what it saw.
function fogStep() {
  for (let node = 0; node < state.map.n; node++) {
    // Vision/exploration is symmetric: each side remembers nodes it occupies.
    for (const me of [HUMAN, BOT]) {
      const present = state.units.some(u => u.owner === me && u.node === node) ||
                      state.buildings.some(b => b.owner === me && b.node === node);
      if (present) state.visited[me][node] = true;
    }
    // Player's fog memory of the bot at this node (only the human side is rendered).
    const present = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                    state.buildings.some(b => b.owner === HUMAN && b.node === node);
    if (!present) continue;
    state.seen[node] = state.buildings
      .filter(b => b.owner === BOT && b.node === node)
      .map(b => ({ type: b.type, hp: b.hp, maxHp: b.maxHp,
                   construct: b.construct ? { ...b.construct } : null }));
    const foes = state.units.filter(u => u.owner === BOT && u.node === node);
    state.seenUnits[node] = {
      time: state.time,
      marines: foes.filter(u => u.type === "marine").length,
      scvs:    foes.filter(u => u.type === "scv" && u.task !== "gas").length,
      gasScvs: foes.filter(u => u.type === "scv" && u.task === "gas").length,
    };
  }
}

// Active patch count shrinks as the field depletes — patches go dry one by one.
// Using ceil so the last partial patch still counts (it still has minerals to mine).
const activePatchCount = field => Math.max(1, Math.ceil(field / PATCH_SIZE));

// Mineral yield for a group of n miners at one base, given current field amount.
// As patches deplete, the optimal miner count shrinks with them so sat% stays meaningful.
// 2 SCVs/patch = full efficiency; a 3rd per patch adds ~33% (BW data); beyond 3/patch: zero.
function mineralYield(n, field) {
  const patches = activePatchCount(field);
  const opt  = patches * 2; // full-efficiency threshold (dynamic)
  const semi = patches;     // extra SCVs at 33% efficiency
  return Math.min(n, opt) * MINE_RATE
       + Math.max(0, Math.min(n - opt, semi)) * MINE_RATE * 0.33;
}

// Sat% = how close we are to the optimal miner count for current field conditions.
const mineralSatPct = (n, field) =>
  Math.min(100, Math.round(n / (activePatchCount(field) * 2) * 100));

function mineStep() {
  // Minerals: process per (owner, node). Mining requires a completed CC at the node.
  for (const owner of [HUMAN, BOT]) {
    const ccNodes = new Set(
      state.buildings.filter(b => b.owner === owner && b.type === "cc" && !b.construct)
                     .map(b => b.node));
    const activeMiners = state.units.filter(u =>
      u.owner === owner && u.task === "mining" && u.node >= 0);
    const miningNodes = new Set(activeMiners.map(u => u.node));
    for (const node of miningNodes) {
      const miners = activeMiners.filter(u => u.node === node);
      if (!ccNodes.has(node) || state.field[node] <= 0) {
        miners.forEach(u => u.task = "idle"); continue;
      }
      const got = Math.min(mineralYield(miners.length, state.field[node]), state.field[node]);
      state.field[node] = Math.max(0, state.field[node] - got);
      state.minerals[owner] += got;
    }
  }

  // Gas collection from completed refineries.
  for (const ref of state.buildings.filter(b => b.type === "refinery" && !b.construct)) {
    const gasScvs = state.units.filter(u =>
      u.owner === ref.owner && u.node === ref.node && u.task === "gas");
    if (!gasScvs.length) continue;
    if (state.gasField[ref.node] <= 0) { gasScvs.forEach(u => u.task = "idle"); continue; }
    // Cap at GAS_OPT — beyond that SCVs are wasted (hard cap like BW 3-worker optimum).
    const got = Math.min(Math.min(gasScvs.length, GAS_OPT) * GAS_RATE, state.gasField[ref.node]);
    state.gasField[ref.node] = Math.max(0, state.gasField[ref.node] - got);
    state.gas[ref.owner] += got;
  }
}

function buildingStep() {
  for (const b of state.buildings) {
    if (b.construct) {
      b.construct.progress++;
      if (b.construct.progress >= b.construct.total) {
        b.construct = null;
        // New barracks inherits the rally node already set on siblings at this node.
        if (b.type === "barracks") {
          const sibling = state.buildings.find(s =>
            s.id !== b.id && s.owner === b.owner && s.node === b.node &&
            s.type === "barracks" && !s.construct && typeof s.rally === "number");
          if (sibling) b.rally = sibling.rally;
        }
        const scv = state.units.find(u => u.buildingId === b.id);
        if (scv) { scv.task = "idle"; scv.buildingId = null; }
      }
    }
    if (b.train) {
      b.train.progress++;
      if (b.train.progress >= b.train.total) {
        const unitType = b.train.unitType || (b.type === "cc" ? "scv" : "marine");
        b.train = null;
        if (unitType === "scv") {
          const scv = newSCV(b.owner, b.node);
          scv.engaged = WARMED_ENGAGED; // born here — fights immediately if attacked
          if (b.rally === "mining" && state.field[b.node] > 0) scv.task = "mining";
          else if (b.rally === "gas" && refineryReady(b.owner, b.node)) scv.task = "gas";
        } else {
          // marine or firebat — same spawn + rally logic
          const unit = unitType === "firebat" ? newFirebat(b.owner, b.node) : newMarine(b.owner, b.node);
          // Born at the node: skip the closing windup (no distance to cover). If it
          // rallies elsewhere, the transit leg resets engaged so it pays the windup
          // on arrival like any other marching unit.
          unit.engaged = WARMED_ENGAGED;
          if (typeof b.rally === "number" && b.rally !== b.node) {
            const path = bfsPathVisited(b.owner, b.node, b.rally, state.map.adj, state.map.n);
            if (path && path.length > 1) {
              unit.transit = { to: b.rally, path, pathIdx: 1, progress: 0, mode: "move", dwellStart: null };
              unit.task = "moving"; unit.node = -1;
            }
          }
        }
      }
    }
    // Research buildings (academy, engBay): advance research.
    if (!b.construct && b.research) {
      b.research.progress++;
      if (b.research.progress >= b.research.total) {
        const key = b.research.type;
        if (!state.upgrades[b.owner].includes(key))
          state.upgrades[b.owner].push(key);
        b.research = null;
        if (b.owner === HUMAN)
          notify(UPGRADES[key]?.notify || `✅ ${key} complete.`, "ok", 6);
      }
    }
    // Dequeue the next waiting unit into the training slot whenever it is free and
    // supply allows. Marines/SCVs dequeue before firebats.
    if (!b.train && b.construct === null && supplyUsed(b.owner) < supplyCap(b.owner)) {
      if (b.queued > 0) {
        b.queued--;
        const tt = b.type === "cc" ? C.cc.trainTime : C.marine.build;
        b.train = { progress: 0, total: tt, unitType: b.type === "cc" ? "scv" : "marine" };
      } else if ((b.queuedFirebats || 0) > 0) {
        b.queuedFirebats--;
        b.train = { progress: 0, total: C.firebat.build, unitType: "firebat" };
      }
    }
  }
}

function unitStep() {
  for (const u of state.units) {
    if (!u.transit) continue;
    const tr = u.transit;

    if (tr.dwellStart !== null) {
      // Unit is stationed at an intermediate node — decide when to advance.
      const atFinal = tr.pathIdx >= tr.path.length - 1;
      if (atFinal) { u.task = "idle"; u.transit = null; continue; }
      const dwellTime = state.time - tr.dwellStart;
      const foes = targetsAt(enemy(u.owner), u.node);
      const shouldAdvance = tr.mode === "move"
        ? dwellTime >= DWELL_TIME
        : foes.length === 0 && dwellTime >= ENGAGE_DELAY; // attack: clear the node first
      if (shouldAdvance) {
        tr.pathIdx++;
        tr.progress = 0;
        tr.dwellStart = null;
        u.task = "moving";
        u.node = -1;
        u.atkCd = 0;
        u.engaged = 0;
      }
      continue;
    }

    // Traveling between nodes — advance progress and check arrival.
    tr.progress++;
    if (tr.progress >= EDGE_TIME) {
      u.node = tr.path[tr.pathIdx];
      state.visited[u.owner][u.node] = true;
      tr.progress = 0;
      const atFinal = tr.pathIdx >= tr.path.length - 1;
      if (atFinal) {
        u.task = "idle";
        u.transit = null;
      } else {
        tr.dwellStart = state.time;
        u.task = "idle"; // allow combatStep and fogStep to engage at this node
      }
    }
  }
}

// A unit's weapon reach. U-238 Shells adds +1 to marines; bunker adds +1 to all occupants.
const unitRange = u => {
  let r = (C[u.type] && C[u.type].range) || 0;
  if (u.type === "marine" && state.upgrades && state.upgrades[u.owner].includes("u238")) r++;
  if (u.task === "bunker") r++; // bunker elevation bonus
  return r;
};
// Infantry Weapons upgrade bonus (marines + firebats, applied to attacker).
const unitWeapons = u => {
  if (u.type !== "marine" && u.type !== "firebat") return 0;
  const ups = state.upgrades[u.owner];
  return ups.includes("infWeapons3") ? 3 : ups.includes("infWeapons2") ? 2 : ups.includes("infWeapons1") ? 1 : 0;
};
// Infantry Armor damage reduction (marines + firebats, applied to defender).
const unitArmor = u => {
  if (u.type !== "marine" && u.type !== "firebat") return 0;
  const ups = state.upgrades[u.owner];
  return ups.includes("infArmor3") ? 3 : ups.includes("infArmor2") ? 2 : ups.includes("infArmor1") ? 1 : 0;
};

function combatStep() {
  // Idle units (and bunker occupants) auto-attack, focusing whatever can shoot back.
  // Closing the distance: once engaged, a unit can't strike until it has spent
  // ENGAGE_DELAY + max(0, enemyRange - ownRange) ticks closing — a shared windup
  // when the forces meet, plus a ranged bonus so marines fire while melee advances.
  // Units born straight into a fight skip this (engaged starts at WARMED_ENGAGED),
  // so defenders spawning mid-battle trade blows immediately instead of being shot
  // for free during a windup the already-engaged attackers have long since paid.
  // Firebats hit up to `splash` targets per swing (good against crowds).
  for (const u of state.units) {
    if ((u.task !== "idle" && u.task !== "bunker") || u.node < 0) { u.atkCd = 0; u.engaged = 0; continue; }
    const foes = targetsAt(enemy(u.owner), u.node);
    if (!foes.length) { u.atkCd = 0; u.engaged = 0; continue; }
    u.engaged = (u.engaged || 0) + 1;
    const enemyRange = foes.reduce((m, o) => Math.max(m, unitRange(o)), 0);
    const closeDelay = ENGAGE_DELAY + Math.max(0, enemyRange - unitRange(u));
    if (u.engaged <= closeDelay) continue; // still closing — can't strike yet
    const cfg = C[u.type] || C.scv;
    u.atkCd -= 1;
    let guard = 0;
    while (u.atkCd <= 0 && guard++ < 3) {
      const t = pickTarget(enemy(u.owner), u.node);
      if (!t) break;
      const dmg = Math.max(1, cfg.dmg + unitWeapons(u) - unitArmor(t));
      t.hp -= dmg;
      // Firebat splash: deal damage to a second random target too.
      if (cfg.splash && cfg.splash > 1) {
        const t2 = pickTarget(enemy(u.owner), u.node);
        if (t2 && t2 !== t) t2.hp -= Math.max(1, cfg.dmg + unitWeapons(u) - unitArmor(t2));
      }
      u.atkCd += cfg.atk;
    }
  }
}

// A target shoots back if it's an idle fighter or a bunker with a garrison —
// either way it gets priority over passive buildings/workers.
const isThreatTarget = o =>
  o.task === "idle" || (o.type === "bunker" && o.loaded && o.loaded.length > 0);

// Engine targeting: prioritise enemies that can deal damage back.
function pickTarget(owner, node) {
  const live = targetsAt(owner, node);
  if (!live.length) return null;
  const threats = live.filter(isThreatTarget);
  const pool = threats.length ? threats : live;
  return pool[(rng() * pool.length) | 0];
}

// Enemy units (any task except bunker) + buildings present at a node.
// Bunker occupants can't be targeted directly — attackers must destroy the bunker first.
function targetsAt(owner, node) {
  const us = state.units.filter(u => u.owner === owner && u.node === node && u.hp > 0 && u.task !== "bunker");
  const bs = state.buildings.filter(b => b.owner === owner && b.node === node && b.hp > 0);
  return us.concat(bs);
}

function cleanupDead() {
  // Remove dead buildings; free or cancel anything tied to them.
  state.buildings = state.buildings.filter(b => {
    if (b.hp > 0) return true;
    const scv = state.units.find(u => u.buildingId === b.id && u.task === "building");
    if (scv) { scv.task = "idle"; scv.buildingId = null; }
    if (b.type === "refinery") {
      state.units.filter(u => u.owner === b.owner && u.node === b.node && u.task === "gas")
        .forEach(u => u.task = "idle");
    }
    if (b.type === "cc") {
      state.units.filter(u => u.owner === b.owner && u.node === b.node && u.task === "mining")
        .forEach(u => u.task = "idle");
    }
    // Bunker destroyed: eject loaded infantry (they fight on, exposed).
    if (b.type === "bunker" && b.loaded) {
      for (const uid of b.loaded) {
        const u = state.units.find(u => u.id === uid);
        if (u) { u.task = "idle"; u.buildingId = null; }
      }
    }
    if (b.owner === HUMAN)
      notify(`💥 Your ${BUILDING_LABEL[b.type]} was destroyed!`, "loss", 6);
    return false;
  });
  // Remove dead units; a builder dying cancels its building (no refund).
  const deadBuilds = [];
  let scvLost = 0, marineLost = 0, firebatLost = 0;
  state.units = state.units.filter(u => {
    if (u.hp > 0) return true;
    if (u.task === "building" && u.buildingId) deadBuilds.push(u.buildingId);
    // Dead bunker occupant: clean it out of the bunker's loaded list.
    if (u.task === "bunker" && u.buildingId) {
      const bunk = state.buildings.find(b => b.id === u.buildingId);
      if (bunk && bunk.loaded) bunk.loaded = bunk.loaded.filter(id => id !== u.id);
    }
    if (u.owner === HUMAN) {
      if (u.type === "marine") marineLost++;
      else if (u.type === "firebat") firebatLost++;
      else scvLost++;
    }
    return false;
  });
  if (scvLost)      notify(`Lost ${scvLost} SCV${scvLost > 1 ? "s" : ""}.`, "loss", 4);
  if (marineLost)   notify(`Lost ${marineLost} Marine${marineLost > 1 ? "s" : ""}.`, "loss", 4);
  if (firebatLost)  notify(`Lost ${firebatLost} Firebat${firebatLost > 1 ? "s" : ""}.`, "loss", 4);
  if (deadBuilds.length) {
    state.buildings = state.buildings.filter(b =>
      !(deadBuilds.includes(b.id) && b.construct));
  }
}

function checkEnd() {
  const humanBuildings = state.buildings.some(b => b.owner === HUMAN);
  const botBuildings = state.buildings.some(b => b.owner === BOT);
  if (!botBuildings) endGame("win");
  else if (!humanBuildings) endGame("loss");
}

function endGame(result, reason) {
  state.over = result;
  state.overReason = reason || null;
  if (typeof document === "undefined") return; // headless test: state only, no DOM
  stopLoop();
  closeSheet();
  const menuEl = document.getElementById("menu");
  if (menuEl) menuEl.className = ""; // dismiss the pause menu if the game ended from it
  const el = document.getElementById("end");
  el.className = "open " + result;
  document.getElementById("end-big").textContent = result === "win" ? "Victory!" : "Defeat";
  document.getElementById("end-msg").textContent = result === "win"
    ? "You destroyed all enemy buildings."
    : reason === "surrender"
      ? "You surrendered the match."
      : "All your buildings were destroyed.";
  const copyBtn = document.getElementById("end-copy");
  copyBtn.style.display = result === "win" ? "" : "none";
  copyBtn.textContent = "Copy replay log";
}

function formatReplayLog() {
  const seed = state._seed !== undefined ? state._seed : "?";
  const lines = [`seed=${seed} ticks=${state.time} WIN`];
  lines.push("t    act          detail                   h-army h-min  b-army b-min");
  for (const e of state.gameLog) {
    if (e.snap) {
      lines.push(`${String(e.t).padStart(4)} snap                                  ${String(e.ha).padStart(5)} ${String(e.hm).padStart(6)} ${String(e.ba).padStart(6)} ${String(e.bm).padStart(5)}`);
      continue;
    }
    let detail = "";
    if (e.act === "build")    detail = `${e.type}@${e.node}`;
    if (e.act === "train")    detail = e.type;
    if (e.act === "research") detail = e.type;
    if (e.act === "attack")   detail = `${e.n}×${e.utype}→${e.dest} (h:${e.ha} b:${e.ba})`;
    lines.push(`${String(e.t).padStart(4)} ${e.act.padEnd(12)} ${detail}`);
  }
  return lines.join("\n");
}

function fallbackCopy(text, cb) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand("copy"); cb(); } catch (_) {}
  document.body.removeChild(ta);
}

// Concede the match. Ends immediately as a loss (with a confirm so a stray tap
// doesn't throw the game).
function surrender() {
  if (state.over) return;
  if (typeof confirm === "function" && !confirm("Surrender this game?")) return;
  endGame("loss", "surrender");
}

/* ------------------------------- Actions ----------------------------- */
// All actions are validated again here so the UI can never force an illegal move.
// Queue an SCV at the CC. Minerals + supply are reserved up front, so a queued
// SCV is guaranteed to build. maxQueue lets the bot train only when truly idle.
function queueSCV(owner, node, maxQueue = C.cc.queueMax) {
  const cc = state.buildings
    .filter(b => b.owner === owner && b.type === "cc" && !b.construct && b.node === node)
    .sort((a, b) => ((a.train ? 1 : 0) + a.queued) - ((b.train ? 1 : 0) + b.queued))[0];
  if (!cc) return;
  const inQueue = (cc.train ? 1 : 0) + cc.queued; // active + waiting
  if (inQueue >= maxQueue) return;
  if (state.minerals[owner] < C.cc.trainCost) return;
  state.minerals[owner] -= C.cc.trainCost;
  // Start training immediately if the slot is free and supply allows; otherwise queue.
  if (!cc.train && supplyUsed(owner) < supplyCap(owner))
    cc.train = { progress: 0, total: C.cc.trainTime, unitType: "scv" };
  else
    cc.queued++;
}

function freeIdle(owner, node) {
  // Get an idle SCV, pulling one off mining or gas collection if necessary.
  let scv = unitsOf(owner, node, "idle", "scv")[0];
  if (!scv) { scv = unitsOf(owner, node, "mining", "scv")[0]; if (scv) scv.task = "idle"; }
  if (!scv) { scv = unitsOf(owner, node, "gas",    "scv")[0]; if (scv) scv.task = "idle"; }
  return scv;
}

// Tech that needs a completed Barracks somewhere on the owner's side (SC1 tree).
const hasFinishedBarracks = owner =>
  state.buildings.some(b => b.owner === owner && b.type === "barracks" && !b.construct);

function startBuilding(owner, node, type) {
  const cfg = C[type];
  if (!cfg || state.minerals[owner] < cfg.cost) return false;
  // Academy, Bunker, and Engineering Bay require a finished Barracks first.
  if ((type === "academy" || type === "bunker" || type === "engBay") && !hasFinishedBarracks(owner)) {
    if (owner === HUMAN) notify("Requires a completed Barracks first.", "warn", 4);
    return false;
  }
  // Refinery: max 1 per node (1 geyser) and geyser must have gas.
  if (type === "refinery") {
    if (state.gasField[node] <= 0) return false;
    if (state.buildings.some(b => b.owner === owner && b.node === node && b.type === "refinery")) return false;
  }
  const scv = freeIdle(owner, node);
  if (!scv) {
    if (owner === HUMAN) notify("No SCV available to build — free one first.", "warn", 4);
    return false;
  }
  state.minerals[owner] -= cfg.cost;
  const b = {
    id: idSeq++, owner, node, type,
    hp: cfg.hp, maxHp: cfg.hp,
    construct: { progress: 0, total: cfg.build }, train: null, queued: 0,
    queuedFirebats: 0,
    rally: type === "cc" ? "mining" : null,
    loaded: type === "bunker" ? [] : undefined,
    research: null,
  };
  state.buildings.push(b);
  scv.task = "building";
  scv.buildingId = b.id;
  if (owner === HUMAN) {
    notify(`🏗 ${BUILDING_LABEL[type] || type} ordered`, "ok", 3);
    logEvent({ act: "build", type, node });
  }
  return true;
}

// Queue a Marine. With raxId, queue at that specific Barracks (player taps one);
// otherwise pick the least-busy completed Barracks at the node (used by the bot).
function queueMarine(owner, node, raxId) {
  let rax;
  if (raxId != null) {
    rax = state.buildings.find(b => b.id === raxId && !b.construct && b.type === "barracks");
  } else {
    rax = state.buildings
      .filter(b => b.owner === owner && b.node === node && b.type === "barracks" && !b.construct)
      .sort((a, b) => ((a.train ? 1 : 0) + a.queued) - ((b.train ? 1 : 0) + b.queued))[0];
  }
  if (!rax) return;
  const inQueue = (rax.train ? 1 : 0) + rax.queued;
  if (inQueue >= C.marine.queueMax) return;
  if (state.minerals[owner] < C.marine.cost) return;
  state.minerals[owner] -= C.marine.cost;
  // Start training immediately if the slot is free and supply allows; otherwise queue.
  if (!rax.train && supplyUsed(owner) < supplyCap(owner))
    rax.train = { progress: 0, total: C.marine.build, unitType: "marine" };
  else
    rax.queued++;
  if (owner === HUMAN) logEvent({ act: "train", type: "marine" });
}

function queueFirebat(owner, node, raxId) {
  if (!state.buildings.some(b => b.owner === owner && b.type === "academy" && !b.construct)) return;
  let rax;
  if (raxId != null) {
    rax = state.buildings.find(b => b.id === raxId && !b.construct && b.type === "barracks");
  } else {
    rax = state.buildings
      .filter(b => b.owner === owner && b.node === node && b.type === "barracks" && !b.construct)
      .sort((a, b) => ((a.train ? 1 : 0) + a.queued + (a.queuedFirebats || 0))
                    - ((b.train ? 1 : 0) + b.queued + (b.queuedFirebats || 0)))[0];
  }
  if (!rax) return;
  const inQueue = (rax.train ? 1 : 0) + (rax.queued || 0) + (rax.queuedFirebats || 0);
  if (inQueue >= C.firebat.queueMax) return;
  if (state.minerals[owner] < C.firebat.cost) return;
  if (state.gas[owner] < C.firebat.gasCost) return;
  state.minerals[owner] -= C.firebat.cost;
  state.gas[owner] -= C.firebat.gasCost;
  if (!rax.train && supplyUsed(owner) < supplyCap(owner))
    rax.train = { progress: 0, total: C.firebat.build, unitType: "firebat" };
  else
    rax.queuedFirebats = (rax.queuedFirebats || 0) + 1;
  if (owner === HUMAN) logEvent({ act: "train", type: "firebat" });
}

function startResearch(owner, upgradeType) {
  if (state.upgrades[owner].includes(upgradeType)) return false;
  const up = UPGRADES[upgradeType];
  if (!up) return false;
  if (up.requires && !state.upgrades[owner].includes(up.requires)) return false;
  const bldType = up.building || "academy";
  const bld = state.buildings.find(b =>
    b.owner === owner && b.type === bldType && !b.construct && !b.research);
  if (!bld) return false;
  if (state.minerals[owner] < up.minerals || state.gas[owner] < up.gas) return false;
  state.minerals[owner] -= up.minerals;
  state.gas[owner] -= up.gas;
  bld.research = { type: upgradeType, progress: 0, total: up.time };
  if (owner === HUMAN) logEvent({ act: "research", type: upgradeType });
  return true;
}

function loadBunker(owner, node, bunkerId) {
  const bunker = state.buildings.find(b =>
    b.id === bunkerId && b.owner === owner && b.type === "bunker" && !b.construct);
  if (!bunker) return;
  const freeSlots = C.bunker.capacity - bunker.loaded.length;
  if (freeSlots <= 0) return;
  const avail = state.units.filter(u =>
    u.owner === owner && u.node === node && u.task === "idle" &&
    (u.type === "marine" || u.type === "firebat") && !u.transit
  ).slice(0, freeSlots);
  for (const u of avail) {
    u.task = "bunker";
    u.buildingId = bunkerId;
    bunker.loaded.push(u.id);
  }
}

function unloadBunker(owner, bunkerId) {
  const bunker = state.buildings.find(b =>
    b.id === bunkerId && b.owner === owner && b.type === "bunker");
  if (!bunker) return;
  for (const uid of bunker.loaded) {
    const u = state.units.find(u => u.id === uid);
    if (u) { u.task = "idle"; u.buildingId = null; }
  }
  bunker.loaded = [];
}

function sendUnits(owner, node, n, unitType = "scv", dest, mode = "move") {
  let pool;
  if (unitType === "marine")  pool = idleMarines(owner, node);
  else if (unitType === "firebat") pool = idleFirebats(owner, node);
  else { pool = controllable(owner, node); }
  // For SCVs, send idle ones before pulling miners off duty.
  if (unitType === "scv") pool.sort((a, b) => (a.task === "idle" ? 0 : 1) - (b.task === "idle" ? 0 : 1));
  // Default destination keeps old call sites working: nearest reachable enemy-ward node.
  if (dest === undefined) dest = node === HOME ? AWAY : HOME;
  if (dest === node) return;
  const path = bfsPathVisited(owner, node, dest, state.map.adj, state.map.n);
  if (path.length < 2) return; // no path through explored territory
  const sent = pool.slice(0, n);
  for (const u of sent) {
    u.task = "moving";
    u.node = -1; // off-map until the first hop completes
    u.transit = { to: dest, path, pathIdx: 1, progress: 0, mode, dwellStart: null };
  }
  if (owner === HUMAN && sent.length) {
    const label = unitType === "marine" ? "Marine" : unitType === "firebat" ? "Firebat" : "SCV";
    const modeIcon = mode === "attack" ? " ⚔️" : "";
    notify(`${sent.length} ${label}${sent.length > 1 ? "s" : ""}${modeIcon} → ${nodeName(dest)}`, "ok", 3);
    if (mode === "attack") logEvent({ act: "attack", n: sent.length, utype: unitType, dest,
      ha: armyCount(HUMAN), ba: armyCount(BOT) });
  }
}

function cancelTransit(to) {
  to = parseInt(to);
  const group = state.units.filter(u => u.owner === HUMAN && u.transit && u.transit.to === to);
  for (const u of group) {
    const tr = u.transit;
    if (tr.dwellStart !== null) {
      u.task = "idle"; u.transit = null;
    } else {
      const prev = tr.path[tr.pathIdx - 1];
      const next = tr.path[tr.pathIdx];
      if (tr.progress >= EDGE_TIME / 2) {
        u.node = next; state.visited[u.owner][next] = true;
      } else {
        u.node = prev;
      }
      u.task = "idle"; u.transit = null;
    }
  }
  render();
}

// Stop units dwelling at `node` that are en route to `finalDest`, leaving them idle there.
function stopTransitHere(node, finalDest) {
  node = parseInt(node); finalDest = parseInt(finalDest);
  state.units
    .filter(u => u.owner === HUMAN && u.node === node && u.transit &&
                 u.transit.to === finalDest && u.transit.dwellStart !== null)
    .forEach(u => { u.transit = null; });
  refreshSheet();
}

function setTask(owner, node, n, from, to, unitType) {
  const pool = unitsOf(owner, node, from, unitType).slice(0, n);
  for (const u of pool) u.task = to;
}

/* -------------------------------- Bot -------------------------------- */

function sendFirebats(owner, node, dest, mode) {
  const n = idleFirebats(owner, node).length;
  if (n > 0) sendUnits(owner, node, n, "firebat", dest, mode);
}

// Generic AI driver — works for either player.
// owner/home/oppHome/opp identify the perspective; ai is the per-side intel object;
// cfg is the tunable parameter set (BOT_CONFIG or HUMAN_CONFIG).
function evalSide(owner, home, oppHome, opp, ai, cfg) {
  const min = () => state.minerals[owner];
  const gas = () => state.gas[owner];

  // ── TOPOLOGY ─────────────────────────────────────────────────────────────
  const adj = state.map.adj;
  const mapN = state.map.n;
  const distE = state.map.dist[oppHome];          // distance from each node → enemy home
  const distFromHome = bfsDist(home, adj, mapN);

  // Forward node: home's neighbour closest to the enemy (natural choke / rally line).
  const homeNeighbours = [...adj[home]];
  const fwd = homeNeighbours.length
    ? homeNeighbours.reduce((best, nb) => distE[nb] < distE[best] ? nb : best, homeNeighbours[0])
    : home;
  const fwdVisited = fwd !== home && !!state.visited[owner][fwd];

  // Weakest-path strike target: prefer the enemy-adjacent node with fewest defenders.
  function strikeTarget() {
    const base = ai.enemyBase;
    if (base === null || !canSendTo(owner, base)) return base;
    const candidates = [...adj[oppHome]].filter(n => canSendTo(owner, n));
    if (!candidates.length) return base;
    const defScore = n =>
      state.units.filter(u => u.owner === opp && u.node === n &&
        (u.type === "marine" || u.type === "firebat")).length +
      state.buildings.filter(b => b.owner === opp && b.node === n &&
        b.type === "bunker" && !b.construct).length * 4;
    const weakest = candidates.reduce((a, b) => defScore(a) <= defScore(b) ? a : b);
    return defScore(weakest) < defScore(oppHome) ? weakest : base;
  }

  // ── RELATIVE STRENGTH ────────────────────────────────────────────────────
  // Update enemy army from *all* currently visible enemy combatants (not just base
  // visits) so the estimate tracks the live game rather than stale snapshots.
  const visEnemy = state.units.filter(u => u.owner === opp &&
    (u.type === "marine" || u.type === "firebat")).length;
  ai.enemyArmy = Math.max(Math.floor(ai.enemyArmy * 0.997), visEnemy);
  const myArmy  = state.units.filter(u => u.owner === owner &&
    (u.type === "marine" || u.type === "firebat")).length;
  const relStr  = myArmy / Math.max(1, ai.enemyArmy); // > 1 = we are ahead

  // Detect when a launched wave has concluded (all attackers gone from target area).
  if (ai.attackTarget !== null) {
    const stillThere = state.units.some(u => u.owner === owner &&
      (u.node === ai.attackTarget ||
       (u.transit && u.transit.path.includes(ai.attackTarget))));
    if (!stillThere) {
      // Wave over: if enemy CC still stands we failed — reset timer to avoid
      // immediately re-attacking into the same defence that just wiped us.
      const enemyCCStands = state.buildings.some(b =>
        b.owner === opp && b.type === "cc" && !b.construct);
      if (enemyCCStands) {
        ai.waveFailed = true;
        ai.lastWave = state.time; // cooldown: wait full interval before next wave
      }
      ai.attackTarget = null;
    }
  }

  // ── INTEL ────────────────────────────────────────────────────────────────
  if (ai.enemyBase === null) {
    for (let n = 0; n < mapN; n++) {
      if (state.visited[owner][n] && state.buildings.some(b => b.owner === opp && b.node === n)) {
        ai.enemyBase = n; break;
      }
    }
  }
  const target = ai.enemyBase;
  if (target !== null && state.units.some(u => u.owner === owner && u.node === target)) {
    ai.enemyArmy = state.units.filter(u =>
      u.owner === opp && u.node === target &&
      (u.type === "marine" || u.type === "scv")).length;
    ai.scoutTime = state.time;
    if (!state.buildings.some(b => b.owner === opp && b.node === target))
      ai.enemyBase = null;
  }
  const intelFresh = ai.scoutTime != null && state.time - ai.scoutTime <= 120;

  // ── ADAPTIVE DIFFICULTY ──────────────────────────────────────────────────
  if (state.time % 30 === 0 && state.time > 0) {
    const oppMarines = state.units.filter(u => u.owner === opp && u.type === "marine").length;
    const oppTotal   = state.units.filter(u => u.owner === opp).length;
    const iv = ai.waveInterval;
    if (oppMarines >= 5) ai.waveInterval = Math.max(cfg.waveIntervalMin, iv - 6);
    else if (oppMarines >= 2 && state.time < 200) ai.waveInterval = Math.max(cfg.waveIntervalMin + 5, iv - 4);
    if (oppTotal <= 3) ai.waveInterval = Math.min(cfg.waveIntervalMax, iv + 8);
  }
  const skilled = ai.waveInterval <= 60;
  const reserve = skilled ? cfg.reserveSkilled : cfg.reserveBase;

  // ── THREAT DETECTION ─────────────────────────────────────────────────────
  const enemyAtHome = state.units.some(u => u.owner === opp && u.node === home);
  const enemyAtFwd  = fwdVisited && state.units.some(u => u.owner === opp && u.node === fwd);
  const underAttack = enemyAtHome || enemyAtFwd;
  const threatNode  = enemyAtHome ? home : fwd;

  // Forward bunker (finished) at the choke, if any — the garrison anchor.
  const fwdBunker = () => state.buildings.find(b =>
    b.owner === owner && b.node === fwd && b.type === "bunker" && !b.construct);

  // ── DEFENSE ──────────────────────────────────────────────────────────────
  if (underAttack) {
    const attackers = state.units.filter(u =>
      u.owner === opp && u.node === threatNode && u.hp > 0).length;
    const defenders = state.units.filter(u =>
      u.owner === owner && u.node === threatNode && !u.transit &&
      (u.type === "marine" || u.type === "firebat")).length;
    const miners = unitsOf(owner, home, "mining", "scv");
    if (defenders < attackers) {
      const need = Math.min(attackers - defenders, Math.max(0, miners.length - cfg.keepMining));
      miners.slice(0, need).forEach(u => u.task = "idle");
    } else {
      if (state.field[home] > 0)
        unitsOf(owner, home, "idle", "scv").forEach(u => u.task = "mining");
    }
    // Choke held: stuff idle infantry into the forward bunker (protected, +1 range).
    if (enemyAtFwd) {
      const bk = fwdBunker();
      if (bk && bk.loaded.length < C.bunker.capacity && idleMarines(owner, fwd).length)
        loadBunker(owner, fwd, bk.id);
    }
    // Threat reached home — the choke is moot, so release the forward garrison to help.
    if (enemyAtHome) {
      const bk = fwdBunker();
      if (bk && bk.loaded.length) {
        unloadBunker(owner, bk.id);
        const back = idleMarines(owner, fwd).length;
        if (back) sendUnits(owner, fwd, back, "marine", home, "attack");
        sendFirebats(owner, fwd, home, "attack");
      }
    }
  } else {
    // ── EXPLORATION & ATTACK ─────────────────────────────────────────────
    let launched = false;
    const homeMarines = idleMarines(owner, home);
    const fwdMarines  = idleMarines(owner, fwd);
    const waveDue = state.time - ai.lastWave >= ai.waveInterval;
    const scoutOut = state.units.some(u =>
      u.owner === owner && u.transit && u.transit.to !== home && u.transit.to !== fwd);

    let frontier = -1, frontierDist = Infinity;
    for (let n = 0; n < mapN; n++) {
      if (!state.visited[owner][n] && distFromHome[n] < frontierDist) {
        frontierDist = distFromHome[n]; frontier = n;
      }
    }
    const targetReachable = target !== null && canSendTo(owner, target);

    if (!targetReachable && frontier !== -1) {
      const atFrontier = state.units.some(u => u.owner === owner && u.node === frontier);
      const headed = state.units.some(u =>
        u.owner === owner && u.transit && u.transit.path.includes(frontier));
      if (!atFrontier && !headed) {
        if (homeMarines.length > 1) sendUnits(owner, home, 1, "marine", frontier);
        else {
          const scvsHome = state.units.filter(u =>
            u.owner === owner && u.node === home && u.type === "scv" &&
            (u.task === "idle" || u.task === "mining"));
          if (scvsHome.length >= cfg.expandMinScv) sendUnits(owner, home, 1, "scv", frontier);
        }
      }
    } else if (targetReachable) {
      // Garrisoned infantry count as available army — they're released on launch.
      const bunkerLoaded = (fwdBunker()?.loaded.length) || 0;
      const allStrike = homeMarines.length + fwdMarines.length + bunkerLoaded;
      const surplus   = allStrike - reserve;
      const dest      = strikeTarget() ?? target;
      const needed    = Math.max(cfg.waveMin, Math.ceil(ai.enemyArmy * 1.4) + cfg.waveOffset);
      // Standard: timer fired + have enough army (blind or intel-confirmed).
      // Opportunistic: clearly dominant force — attack without waiting for timer.
      // After a failed wave, waveFailed flag extends the effective cooldown.
      const dominantAttack = !ai.waveFailed && relStr >= 2.0 && surplus >= cfg.waveMin;
      const launch    = dominantAttack ||
                        (waveDue && !intelFresh && surplus >= cfg.blindAttackMin) ||
                        (waveDue && intelFresh  && surplus >= needed);

      if (launch) {
        launched = true;
        ai.waveFailed = false;
        // Commit the forward garrison to the wave — empty the bunker first.
        const bk = fwdBunker();
        if (bk && bk.loaded.length) unloadBunker(owner, bk.id);
        const fwdStrike = idleMarines(owner, fwd).length; // recount post-unload
        if (fwdStrike > 0)
          sendUnits(owner, fwd, fwdStrike, "marine", dest, "attack");
        const homeStrike = homeMarines.length - reserve;
        if (homeStrike > 0)
          sendUnits(owner, home, homeStrike, "marine", dest, "attack");
        sendFirebats(owner, fwd,  dest, "attack");
        sendFirebats(owner, home, dest, "attack");
        ai.attackTarget = dest;
        ai.lastWave = state.time;
      } else if (!intelFresh && !scoutOut && allStrike > reserve) {
        sendUnits(owner, home, 1, "marine", target); // scout
      }
    }

    // ── FORWARD STAGING ─────────────────────────────────────────────────
    // Move surplus home marines to the forward node (natural defensive line).
    if (fwdVisited) {
      const surplus = homeMarines.length - reserve;
      if (surplus > 0) sendUnits(owner, home, surplus, "marine", fwd, "move");

      // Keep the forward bunker garrisoned as a standing anchor (not while attacking).
      if (!launched) {
        const bk = fwdBunker();
        if (bk && bk.loaded.length < C.bunker.capacity && idleMarines(owner, fwd).length)
          loadBunker(owner, fwd, bk.id);
      }
    }
  }

  // ── MOP-UP ───────────────────────────────────────────────────────────────
  // Idle combat units at non-home, non-fwd nodes march toward enemy or rally to fwd.
  for (let n = 0; n < mapN; n++) {
    if (n === home || n === fwd) continue;
    const idle = state.units.filter(u =>
      u.owner === owner && u.node === n && !u.transit && u.task === "idle" &&
      (u.type === "marine" || u.type === "firebat"));
    if (!idle.length) continue;
    const mopDest = (target !== null && canSendTo(owner, target)) ? target
                  : fwdVisited ? fwd : home;
    if (mopDest === n) continue;
    const mode = mopDest === target ? "attack" : "move";
    const marines  = idle.filter(u => u.type === "marine").length;
    const firebats = idle.filter(u => u.type === "firebat").length;
    if (marines)  sendUnits(owner, n, marines,  "marine",  mopDest, mode);
    if (firebats) sendFirebats(owner, n, mopDest, mode);
  }

  // ── ECONOMY STATE ────────────────────────────────────────────────────────
  const scvCount  = state.units.filter(u => u.owner === owner && u.type === "scv").length;
  const scvCap    = skilled ? cfg.scvCapSkilled : cfg.scvCapBase;
  const raxCount  = state.buildings.filter(b => b.owner === owner && b.type === "barracks").length;
  const raxTarget = skilled ? Math.min(cfg.raxCapSkilled, 1 + Math.floor(state.time / cfg.raxTimeSkilled))
                            : Math.min(cfg.raxCapBase,    1 + Math.floor(state.time / cfg.raxTimeBase));
  const raxDone       = hasFinishedBarracks(owner);
  const academyExists = state.buildings.some(b => b.owner === owner && b.type === "academy");
  const academyReady  = state.buildings.find(b =>
    b.owner === owner && b.type === "academy" && !b.construct && !b.research);
  const hasAcademy    = state.buildings.some(b =>
    b.owner === owner && b.type === "academy" && !b.construct);

  // ── EXPANSION ────────────────────────────────────────────────────────────
  let savingForCC = false;
  if (!underAttack) {
    const noExpanding = !state.buildings.some(
      b => b.owner === owner && b.type === "cc" && b.construct && b.node !== home);
    if (noExpanding) {
      let expNode = -1, expDist = Infinity;
      for (let n = 0; n < mapN; n++) {
        if (n === home || !state.visited[owner][n] || state.field[n] <= 0) continue;
        if (state.buildings.some(b => b.owner === owner && b.node === n && b.type === "cc")) continue;
        if (distFromHome[n] < expDist) { expDist = distFromHome[n]; expNode = n; }
      }
      if (expNode !== -1) {
        const scvThere = unitsOf(owner, expNode, null, "scv").length > 0;
        const scvEnRoute = state.units.some(u =>
          u.owner === owner && u.type === "scv" && u.transit && u.transit.to === expNode);
        if (scvThere) {
          startBuilding(owner, expNode, "cc");
          savingForCC = min() < C.cc.cost;
        } else if (scvEnRoute) {
          savingForCC = min() < C.cc.cost;
        } else {
          const homeScvAvail = state.units.filter(u =>
            u.owner === owner && u.node === home && u.type === "scv" &&
            (u.task === "idle" || u.task === "mining")).length;
          if (homeScvAvail > cfg.expandMinScv) {
            sendUnits(owner, home, 1, "scv", expNode);
            const escort = Math.min(2, idleMarines(owner, home).length);
            if (escort > 0) sendUnits(owner, home, escort, "marine", expNode, "move");
            savingForCC = min() < C.cc.cost;
          }
        }
      }
    }
    for (const ccB of state.buildings.filter(
        b => b.owner === owner && b.type === "cc" && !b.construct && b.node !== home)) {
      if (state.field[ccB.node] <= 0) continue;
      const expMiners = unitsOf(owner, ccB.node, "mining", "scv").length;
      const enRoute = state.units.filter(u =>
        u.owner === owner && u.type === "scv" && u.transit && u.transit.to === ccB.node).length;
      const homeScvAvail = state.units.filter(u =>
        u.owner === owner && u.node === home && u.type === "scv" &&
        (u.task === "idle" || u.task === "mining")).length;
      const send = Math.min(Math.max(0, cfg.scvExpCap - expMiners - enRoute),
                            Math.max(0, homeScvAvail - cfg.keepMining));
      if (send > 0) sendUnits(owner, home, send, "scv", ccB.node);
    }
  }

  // ── UTILITY BUILD SYSTEM ─────────────────────────────────────────────────
  // Each candidate action gets a utility score; build/tech actions fire one per
  // eval (highest score wins), train actions all fire while affordable.
  const supplyP   = Math.max(0, (supplyUsed(owner) - supplyCap(owner) + 6) / 6);
  const armyRatio = Math.max(0.1, 1 - scvCount / Math.max(1, scvCount + raxCount * 3));

  // State-adaptive multipliers.
  // floatMult: minerals piling up → spend faster (waste is bad).
  // armyMult:  behind on army → prioritise units over tech/expand.
  // techMult:  ahead on army → invest in upgrades; behind → defer them.
  const floatMult = min() > 400 ? 1.7 : min() > 250 ? 1.2 : 1.0;
  const behind    = relStr < 0.75 && myArmy >= 3; // outgunned and past early game
  const ahead     = relStr >= 1.5;
  const armyMult  = behind ? 1.4 : 1.0;
  const techMult  = ahead ? 1.3 : behind ? 0.5 : 1.0;

  const builds = [];
  const add = (score, exec, kind = "build") => { if (score > 0) builds.push({ score, exec, kind }); };

  if (supplyCap(owner) < SUPPLY_MAX &&
      !state.buildings.some(b => b.owner === owner && b.type === "depot" && b.construct))
    add(cfg.uDepot * 10 * supplyP * supplyP,
        () => startBuilding(owner, home, "depot"));

  if (raxDone && !academyExists && !underAttack)
    add(cfg.uAcademy * 5 * techMult,
        () => startBuilding(owner, home, "academy"));

  if (academyReady && !state.upgrades[owner].includes("u238"))
    add(cfg.uU238 * 4 * techMult, () => startResearch(owner, "u238"), "tech");

  // Engineering Bay + weapon/armor research
  const engBayExists = state.buildings.some(b => b.owner === owner && b.type === "engBay");
