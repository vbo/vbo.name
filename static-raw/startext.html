  if (raxDone && !engBayExists && !underAttack)
    add(cfg.uEngBay * 5 * techMult, () => startBuilding(owner, home, "engBay"));
  const engBayReady = state.buildings.find(b =>
    b.owner === owner && b.type === "engBay" && !b.construct && !b.research);
  if (engBayReady) {
    const ups = state.upgrades[owner];
    const wpnLvl = ups.includes("infWeapons3") ? 3 : ups.includes("infWeapons2") ? 2 : ups.includes("infWeapons1") ? 1 : 0;
    const armLvl = ups.includes("infArmor3")   ? 3 : ups.includes("infArmor2")   ? 2 : ups.includes("infArmor1")   ? 1 : 0;
    if (wpnLvl < 3) add(cfg.uInfWeapons * 4 * techMult, () => startResearch(owner, "infWeapons" + (wpnLvl + 1)), "tech");
    if (armLvl < 3) add(cfg.uInfArmor   * 3 * techMult, () => startResearch(owner, "infArmor"   + (armLvl + 1)), "tech");
  }

  if (!state.buildings.some(b => b.owner === owner && b.type === "barracks" && b.construct))
    add(cfg.uRax * 6 * Math.max(0, 1 - raxCount / raxTarget),
        () => startBuilding(owner, home, "barracks"));

  if (raxDone && fwdVisited && !underAttack &&
      !state.buildings.some(b => b.owner === owner && b.node === fwd && b.type === "bunker"))
    add(cfg.uBunker * 4, () => startBuilding(owner, fwd, "bunker"));

  add(cfg.uScv * 8 * Math.max(0.1, 1 - scvCount / scvCap),
      () => queueSCV(owner, home, 1), "train");

  if (!savingForCC && raxDone) {
    for (let i = 0; i < raxCount; i++) {
      if (hasAcademy && gas() >= C.firebat.gasCost * 3)
        add(cfg.uFirebat * 7 * armyRatio * armyMult * floatMult, () => queueFirebat(owner, home), "train");
      else
        add(cfg.uMarine  * 7 * armyRatio * armyMult * floatMult, () => queueMarine(owner, home),  "train");
    }
  }

  builds.sort((a, b) => b.score - a.score);
  let builtOne = false;
  for (const bld of builds) {
    if (supplyUsed(owner) >= supplyCap(owner) && bld.kind === "train") continue;
    if (bld.kind !== "train") {
      if (builtOne) continue;
      const before = min();
      bld.exec();
      if (min() < before) builtOne = true;
    } else {
      const before = min();
      bld.exec();
      if (min() === before) break;
    }
  }

  // ── SCV TASKS ────────────────────────────────────────────────────────────
  for (const ccB of state.buildings.filter(b => b.owner === owner && b.type === "cc" && !b.construct)) {
    if (state.field[ccB.node] <= 0) continue;
    if (underAttack && ccB.node === home) continue;
    unitsOf(owner, ccB.node, "idle", "scv").forEach(u => u.task = "mining");
  }
}

function botEval() {
  evalSide(BOT, AWAY, HOME, HUMAN, state.bot, BOT_CONFIG);
}
function humanBotEval() {
  if (state.humanAI) evalSide(HUMAN, HOME, AWAY, BOT, state.humanAI, HUMAN_CONFIG);
}

/* ------------------------------ Rendering ---------------------------- */
const $ = id => document.getElementById(id);
const BUILDING_LABEL = { cc: "Command Center", depot: "Supply Depot", barracks: "Barracks", refinery: "Refinery", academy: "Academy", bunker: "Bunker", engBay: "Engineering Bay" };

// Display names, assigned the first time the player sees a node. Naming by discovery
// order (not the underlying node id) means the labels never hint at how many unseen
// nodes exist beyond the explored frontier. nodeLetter is the short graph label.
function nodeLetter(node) {
  if (state.labels[node] == null)
    state.labels[node] = String.fromCharCode(65 + state.labels.filter(Boolean).length);
  return state.labels[node];
}
const nodeName = node => "Sector " + nodeLetter(node);

function svgIcon(kind) {
  if (kind === "cc")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M7 9V6h10v3M12 13v3"/></svg>`;
  if (kind === "depot")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="4" y="8" width="16" height="10" rx="2"/><path d="M4 12h16"/></svg>`;
  if (kind === "barracks")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><path d="M4 18V8l8-4 8 4v10"/><path d="M9 18v-5h6v5"/></svg>`;
  if (kind === "scv")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ffd27a" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 5v3M12 16v3M5 12h3M16 12h3"/></svg>`;
  if (kind === "marine")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ff9a9a" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M6 21v-1a6 6 0 0112 0v1"/><path d="M17 13l4 1.5-4 1.5"/></svg>`;
  if (kind === "refinery")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><rect x="5" y="13" width="14" height="8" rx="1"/><path d="M8 13V9l4-3 4 3v4M10 21v-3h4v3"/><path d="M9 6V4M15 6V4"/></svg>`;
  if (kind === "gas")
    return `<svg class="icon" viewBox="0 0 24 24" fill="#4ade80" stroke="#0a2211" stroke-width="0.5"><path d="M12 3c0 0-4 5.5-4 10a4 4 0 008 0c0-2.5-1-4-2-5-.1 2-1.5 3-2 3-.5 0-1-1-1-2.5 1.5-1 2.5-3 1-5.5z"/></svg>`;
  if (kind === "mineral")
    return `<svg class="icon" viewBox="0 0 24 24" fill="#41d6ff" stroke="#0a1a22" stroke-width="1"><path d="M12 3l4 6-4 12-4-12z"/></svg>`;
  if (kind === "academy")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><path d="M12 3l9 5v2H3V8z"/><rect x="5" y="10" width="14" height="9" rx="1"/><path d="M9 19v-5h6v5"/><path d="M12 6v2"/></svg>`;
  if (kind === "bunker")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="3" y="10" width="18" height="10" rx="2"/><path d="M7 10V7h10v3"/><path d="M8 14h2M14 14h2"/></svg>`;
  if (kind === "engBay")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="2" y="11" width="20" height="10" rx="1"/><path d="M6 11V7h12v4"/><circle cx="12" cy="8" r="2"/><path d="M9 16h6"/></svg>`;
  if (kind === "firebat")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ff9a9a" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M6 21v-1a6 6 0 0112 0v1"/><path d="M9 14c1 1 2 3 3 3s2-2 3-3"/></svg>`;
  return "";
}

function hpBar(hp, maxHp) {
  const p = Math.max(0, hp / maxHp);
  const cls = p > 0.5 ? "" : p > 0.25 ? "mid" : "low";
  return `<div class="bar hp ${cls}"><i style="width:${(p * 100).toFixed(0)}%"></i></div>`;
}
function progBar(progress, total) {
  return `<div class="bar prog"><i style="width:${((progress / total) * 100).toFixed(0)}%"></i></div>`;
}

function render() {
  if (typeof document === "undefined") return; // headless test: no DOM to paint
  // Status bar (human numbers).
  $("s-min").textContent = Math.floor(state.minerals[HUMAN]);
  $("s-gas").textContent = Math.floor(state.gas[HUMAN]);
  const used = supplyUsed(HUMAN), cap = supplyCap(HUMAN);
  $("s-sup").textContent = `${used} / ${cap}`;
  $("s-supwrap").className = "stat supply" + (used >= cap ? " blocked" : "");
  $("supply-warn").style.display = (used >= cap && cap < SUPPLY_MAX) ? "block" : "none";
  const idleScvs = state.units.filter(u => u.owner === HUMAN && u.type === "scv" && u.task === "idle" && u.node >= 0);
  const idleWarn = $("idle-scv-warn");
  if (idleScvs.length) {
    const idleNode = idleScvs[0].node;
    idleWarn.textContent = `⚙️ ${idleScvs.length} idle worker${idleScvs.length > 1 ? "s" : ""} · tap to assign`;
    idleWarn.style.display = "block";
    idleWarn.onclick = () => { ui.selectedNode = idleNode; openSheet({ kind: "scv", node: idleNode, n: 1 }); render(); };
  } else {
    idleWarn.style.display = "none";
  }
  if (typeof document.body !== "undefined" && document.body)
    document.body.classList.toggle("paused", !!state.paused);

  // Map — drawn as a node-link graph. You only see nodes you've explored plus the
  // immediate neighbours of explored nodes (the frontier); the rest stays hidden,
  // so the map's shape is revealed only as you scout outward. Tap a node to focus
  // it; its details (forces, resources, orders) show in the panel below.
  const board = $("board");
  board.innerHTML = "";
  const visible = new Set(reachableSet(HUMAN));
  if (!visible.has(ui.selectedNode)) ui.selectedNode = HOME;
  // Assign display letters in proximity order so your base is "A", then outward.
  [...visible].sort((a, b) => state.map.dist[HOME][a] - state.map.dist[HOME][b] || a - b).forEach(nodeLetter);
  board.appendChild(renderGraph(visible));
  board.appendChild(renderNode(ui.selectedNode));

  renderTransit();
  const notesEl = $("notes");
  notesEl.innerHTML = state.notes.map(n => {
    const linked = n.node != null;
    const where = linked ? ` at <b>${nodeName(n.node)}</b> · tap to view →` : "";
    return `<div class="note ${n.kind}${linked ? " link" : ""}"${linked ? ` data-node="${n.node}"` : ""}>${n.text}${where}</div>`;
  }).join("");
  notesEl.querySelectorAll(".note.link").forEach(el =>
    el.onclick = () => { ui.selectedNode = +el.dataset.node; render(); });
  if (ui.sheet) renderSheet();
  persist(); // every state change reaches here — checkpoint it for tab-refresh survival
}

// Draw the explored map as a node-link graph (SVG). Only `visible` nodes are drawn;
// edges appear only when at least one endpoint is visited (so frontier-to-frontier
// links stay hidden). Tapping a node focuses it for the detail panel below.
function renderGraph(visible) {
  const wrap = document.createElement("div");
  wrap.className = "map";
  const { n, adj, pos } = state.map;

  // Stable height from the tallest column so revealed nodes never reflow.
  const colCount = {};
  for (let i = 0; i < n; i++) { const k = pos[i].x.toFixed(3); colCount[k] = (colCount[k] || 0) + 1; }
  const maxLayer = Math.max(1, ...Object.values(colCount));
  const H = Math.max(48, 24 + (maxLayer - 1) * 26);
  const PADX = 14, PADY = 14;
  const X = x => (PADX + x * (100 - 2 * PADX)).toFixed(1);
  const Y = y => (PADY + y * (H - 2 * PADY)).toFixed(1);

  let edges = "";
  for (let u = 0; u < n; u++) if (visible.has(u))
    for (const v of adj[u]) if (v > u && visible.has(v) && (state.visited.human[u] || state.visited.human[v]))
      edges += `<line class="edge" x1="${X(pos[u].x)}" y1="${Y(pos[u].y)}" x2="${X(pos[v].x)}" y2="${Y(pos[v].y)}"/>`;

  let nodes = "";
  for (let id = 0; id < n; id++) if (visible.has(id)) {
    const cx = X(pos[id].x), cy = Y(pos[id].y);
    const isHome = id === HOME;
    const present = state.units.some(u => u.owner === HUMAN && u.node === id) ||
                    state.buildings.some(b => b.owner === HUMAN && b.node === id);
    const visited = state.visited.human[id];
    // Enemy-held = we've seen enemy buildings here (live or remembered). No node id
    // is special: any node turns up as enemy territory once you scout its base.
    const enemyHeld = present
      ? state.buildings.some(b => b.owner === BOT && b.node === id)
      : (Array.isArray(state.seen[id]) && state.seen[id].length > 0);
    const su = state.seenUnits[id];
    const enemyHere = present
      ? state.units.some(u => u.owner === BOT && u.node === id)
      : !!(su && state.time - su.time <= SEEN_UNITS_TTL && (su.marines || su.scvs || su.gasScvs));
    let cls = isHome ? "home" : enemyHeld ? "foe" : visited ? "owned" : "unknown";
    if (enemyHere) cls += " threat";
    if (id === ui.selectedNode) cls += " selected";
    const army = state.units.filter(u => u.owner === HUMAN && u.node === id).length;
    const below = army ? `<text class="ncount" x="${cx}" y="${(+cy + 12).toFixed(1)}">▲${army}</text>` : "";
    const hasMin = visited && state.field[id] > 0;
    const hasGas = visited && state.gasField[id] > 0;
    let resRow = "";
    if (hasMin || hasGas) {
      const ry = (+cy - 9.8).toFixed(1);
      if (hasMin && hasGas)
        resRow = `<circle cx="${(+cx - 1.8).toFixed(1)}" cy="${ry}" r="1.4" fill="#41d6ff"/>` +
                 `<circle cx="${(+cx + 1.8).toFixed(1)}" cy="${ry}" r="1.4" fill="#4ade80"/>`;
      else if (hasMin)
        resRow = `<circle cx="${cx}" cy="${ry}" r="1.4" fill="#41d6ff"/>`;
      else
        resRow = `<circle cx="${cx}" cy="${ry}" r="1.4" fill="#4ade80"/>`;
    }
    nodes += `<g class="gnode ${cls}" data-id="${id}">
        <circle class="ncircle" cx="${cx}" cy="${cy}" r="7"/>
        <text class="glyph" x="${cx}" y="${(+cy + 2.3).toFixed(1)}">${nodeLetter(id)}</text>
        ${resRow}${below}
      </g>`;
  }

  wrap.innerHTML =
    `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="xMidYMid meet" role="img">${edges}${nodes}</svg>` +
    `<div class="map-legend">Tap a node to focus · <b style="color:var(--accent)">blue</b> your base · <b style="color:var(--enemy)">red</b> enemy · dashed = unexplored · ▲ forces · <b style="color:#41d6ff">●</b> minerals · <b style="color:#4ade80">●</b> gas</div>`;
  wrap.querySelectorAll(".gnode").forEach(g =>
    g.onclick = () => { ui.selectedNode = +g.dataset.id; render(); });
  return wrap;
}

function renderNode(node) {
  const el = document.createElement("div");
  const isHome = node === HOME;
  const present = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                  state.buildings.some(b => b.owner === HUMAN && b.node === node);
  const visited = state.visited.human[node];
  // Enemy-held = enemy buildings seen here (live or remembered). No node is special;
  // a base is just a node where you've spotted the enemy's buildings.
  const enemyHeld = present
    ? state.buildings.some(b => b.owner === BOT && b.node === node)
    : (Array.isArray(state.seen[node]) && state.seen[node].length > 0);
  el.className = "node " + (isHome ? "home" : enemyHeld ? "away" : "neutral");

  // Header: name + resources for any node you can see that has them.
  let resStr = "";
  if (present && (state.field[node] > 0 || state.gasField[node] > 0)) {
    const hasRefinery = state.buildings.some(b => b.node === node && b.type === "refinery" && !b.construct);
    resStr = `💎 ${Math.ceil(state.field[node])} · ⛽ ${Math.ceil(state.gasField[node])}${hasRefinery ? " left" : ""}`;
  }
  // Paths are only known for nodes you've actually visited — an unexplored frontier
  // node shows that it exists, but not what it connects to.
  const pathsLine = visited
    ? `<div class="paths">↔ ${state.map.adj[node].map(nodeName).join(", ")}</div>`
    : `<div class="paths">↔ ?</div>`;
  el.innerHTML = `<div class="node-head">
      <h1>${nodeName(node)}</h1>
      <span class="field" style="color:var(--dim)">${resStr}</span>
    </div>
    ${pathsLine}`;

  // --- Your forces (only when you have something here) ---
  const mine = document.createElement("div");
  mine.className = "force-mine";
  if (appendForces(mine, HUMAN, node, true)) {
    mine.insertAdjacentHTML("afterbegin", `<div class="section-label">Your forces</div>`);
    el.appendChild(mine);
  }

  // --- Enemy forces (fog of war) ---
  const en = document.createElement("div");
  en.className = "force-enemy";
  if (present) {
    // Full vision: show live enemy forces if any.
    if (appendForces(en, BOT, node, false)) {
      en.insertAdjacentHTML("afterbegin", `<div class="section-label">Enemy forces</div>`);
      el.appendChild(en);
    }
  } else {
    const snap = state.seen[node];
    if (snap) {
      // Build the remembered rows first; only add the header if something shows,
      // so a scouted-but-empty node doesn't display a lone "last seen" label.
      let any = false;
      if (snap.length) { appendSeenBuildings(en, snap); any = true; }
      if (appendSeenUnits(en, state.seenUnits[node])) any = true;
      en.innerHTML = any
        ? `<div class="section-label">Enemy forces — last seen</div>${en.innerHTML}`
        : `<div class="unknown">${visited ? "No enemy forces seen here." : "Unexplored."}</div>`;
    } else {
      en.innerHTML = `<div class="unknown">${visited ? "No vision here." : "Unexplored."}</div>`;
    }
    el.appendChild(en);
  }
  return el;
}

// Pure: is a last-seen unit snapshot worth showing? Fresh (within SEEN_UNITS_TTL,
// since units move and stale counts mislead) and actually counting something.
function seenUnitsFresh(snap) {
  if (!snap || state.time - snap.time > SEEN_UNITS_TTL) return false;
  return !!(snap.marines || snap.scvs || snap.gasScvs);
}

// Render a fading last-seen enemy unit count (marines/SCVs). Returns true if shown.
function appendSeenUnits(container, snap) {
  if (!seenUnitsFresh(snap)) return false;
  const age = state.time - snap.time;
  const totalScvs = (snap.scvs || 0) + (snap.gasScvs || 0);
  const rows = [
    snap.marines && ["marine", `Marines — ~${snap.marines}`],
    totalScvs && ["scv", `SCVs — ~${totalScvs}`],
  ].filter(Boolean);
  for (const [icon, name] of rows) {
    const row = document.createElement("div");
    row.className = "row static seen";
    row.innerHTML = `${svgIcon(icon)}<div class="body">
        <div class="name">${name}</div>
        <div class="meta">Last seen ${age}s ago</div>
      </div>`;
    container.appendChild(row);
  }
  return true;
}

// Render remembered (frozen) enemy buildings from a fog snapshot — info only, dimmed.
// Grouped like live forces (CC individual; depots and barracks collapsed) so a big
// enemy base doesn't become an overwhelming wall of rows.
function appendSeenBuildings(container, snap) {
  const mkRow = (icon, name, meta, hp, maxHp) => {
    const row = document.createElement("div");
    row.className = "row static seen";
    row.innerHTML = `${svgIcon(icon)}<div class="body">
        <div class="name">${name}</div>
        <div class="meta">${meta}</div>
        ${hp != null ? hpBar(hp, maxHp) : ""}
      </div>`;
    container.appendChild(row);
  };

  // Command Centers — individual (there's normally just one).
  for (const b of snap.filter(b => b.type === "cc")) {
    const meta = b.construct
      ? `Was building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`
      : `Last seen · HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    mkRow("cc", "Command Center", meta, b.hp, b.maxHp);
  }

  // Supply Depots, Barracks, and Refineries — one summary row each.
  for (const [type, label] of [["depot", "Supply Depot"], ["barracks", "Barracks"], ["refinery", "Refinery"]]) {
    const group = snap.filter(b => b.type === type);
    if (!group.length) continue;
    const underC = group.filter(b => b.construct).length;
    const done = group.length - underC;
    const parts = [];
    if (done) parts.push(`${done} seen`);
    if (underC) parts.push(`${underC} building`);
    mkRow(type, `${label}${group.length > 1 ? ` ×${group.length}` : ""}`, parts.join(" · ") || "Last seen");
  }
}

// Pure: describe a group of barracks as text segments. Completed and
// under-construction barracks are reported *independently*, so newly-started
// barracks stay visible even while finished ones are busy training.
function barracksMeta(allRax, interactive) {
  const readyRax = allRax.filter(b => !b.construct);
  const underC = allRax.filter(b => b.construct);
  const segs = [];
  if (readyRax.length) {
    if (interactive) {
      const totalQ = readyRax.reduce((s, b) => s + (b.train ? 1 : 0) + (b.queued || 0) + (b.queuedFirebats || 0), 0);
      segs.push(totalQ ? `Training · ${totalQ} queued` : "Idle · tap to train");
    } else {
      const totHP = readyRax.reduce((s, b) => s + Math.ceil(b.hp), 0);
      const totMax = readyRax.reduce((s, b) => s + b.maxHp, 0);
      segs.push(`HP ${totHP}/${totMax}`);
    }
  }
  if (underC.length) {
    // Closest-to-done builder represents the in-construction group.
    const lead = underC.slice().sort((a, b) =>
      (b.construct.progress / b.construct.total) - (a.construct.progress / a.construct.total))[0];
    const pct = Math.floor(lead.construct.progress / lead.construct.total * 100);
    segs.push(`${underC.length} building… ${pct}%`);
  }
  return segs;
}

// Returns true if anything was rendered. `interactive` enables tap-to-order.
function appendForces(container, owner, node, interactive) {
  let any = false;
  const buildings = buildingsOf(owner, node);
  // "Useless" passive/finished buildings (supply depots, refineries, fully-researched
  // academy/engBay) are deferred here and appended at the very bottom of the list.
  const tail = document.createDocumentFragment();

  // Command Center — always individual.
  for (const b of buildings.filter(b => b.type === "cc")) {
    any = true;
    const tappable = interactive;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%${interactive ? progBar(b.construct.progress, b.construct.total) : ""}`;
    } else if (b.train && interactive) {
      meta = `Training SCV ${Math.floor(b.train.progress / b.train.total * 100)}%${b.queued ? ` (+${b.queued} queued)` : ""}${progBar(b.train.progress, b.train.total)}`;
    } else {
      meta = interactive ? `Idle · supply +${C.cc.supply}` : `HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    }
    row.innerHTML = `${svgIcon("cc")}<div class="body">
        <div class="name">Command Center</div>
        <div class="meta">${meta}</div>
        ${hpBar(b.hp, b.maxHp)}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "cc", node, ref: b.id });
    container.appendChild(row);
  }

  // Supply Depots — one summary row for all depots at this node.
  const depots = buildings.filter(b => b.type === "depot");
  if (depots.length) {
    any = true;
    const depotsDone  = depots.filter(b => !b.construct);
    const depotsUnderC = depots.filter(b => b.construct);
    const parts = [];
    if (depotsDone.length) {
      const dHp = depotsDone.reduce((s, b) => s + Math.ceil(b.hp), 0);
      const dMax = depotsDone.reduce((s, b) => s + b.maxHp, 0);
      parts.push(`${depotsDone.length} complete · +${depotsDone.length * C.depot.supply} supply · HP ${dHp}/${dMax}`);
    }
    let depotBar = "";
    if (depotsUnderC.length) {
      const lead = depotsUnderC.slice().sort((a, b) =>
        (b.construct.progress / b.construct.total) - (a.construct.progress / a.construct.total))[0];
      const pct = Math.floor(lead.construct.progress / lead.construct.total * 100);
      parts.push(`${depotsUnderC.length} building… ${pct}%`);
      if (interactive) depotBar = progBar(lead.construct.progress, lead.construct.total);
    }
    const dHp = depotsDone.reduce((s, b) => s + b.hp, 0);
    const dMax = depotsDone.reduce((s, b) => s + b.maxHp, 0);
    const row = document.createElement("div");
    row.className = "row static";
    row.innerHTML = `${svgIcon("depot")}<div class="body">
        <div class="name">Supply Depot${depots.length > 1 ? ` ×${depots.length}` : ""}</div>
        <div class="meta">${parts.join(" · ") || "—"}</div>
        ${depotsDone.length ? hpBar(dHp, dMax) : depotBar}
      </div>`;
    // Depots under construction stay in place; completed ones drop to the bottom.
    (depotsUnderC.length ? container : tail).appendChild(row);
  }

  // Barracks — grouped; tap queues in the next-free barracks.
  const allRax = buildings.filter(b => b.type === "barracks");
  if (allRax.length) {
    any = true;
    const readyRax = allRax.filter(b => !b.construct);
    const tappable = interactive && readyRax.length > 0;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta = barracksMeta(allRax, interactive).join(" · ");
    // Progress bar: prefer the leading trainee, else the leading builder.
    const underC = allRax.filter(b => b.construct);
    if (interactive) {
      const trainLead = readyRax.filter(b => b.train).sort((a, b) => b.train.progress - a.train.progress)[0];
      if (trainLead) meta += progBar(trainLead.train.progress, trainLead.train.total);
      else if (underC.length) {
        const bl = underC.slice().sort((a, b) => b.construct.progress - a.construct.progress)[0];
        meta += progBar(bl.construct.progress, bl.construct.total);
      }
    }
    const raxHp = readyRax.reduce((s, b) => s + b.hp, 0);
    const raxMax = readyRax.reduce((s, b) => s + b.maxHp, 0);
    row.innerHTML = `${svgIcon("barracks")}<div class="body">
        <div class="name">Barracks${allRax.length > 1 ? ` ×${allRax.length}` : ""}</div>
        <div class="meta">${meta}</div>
        ${readyRax.length ? hpBar(raxHp, raxMax) : ""}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "barracks-group", node });
    container.appendChild(row);
  }

  // Refinery — one row per refinery (normally just one per base).
  for (const b of buildings.filter(b => b.type === "refinery")) {
    any = true;
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`;
      if (interactive) meta += progBar(b.construct.progress, b.construct.total);
    } else {
      const gasScvs = state.units.filter(u => u.owner === owner && u.node === node && u.task === "gas").length;
      const satPct = Math.round(gasScvs / GAS_OPT * 100);
      meta = interactive
        ? `${gasScvs}/${GAS_OPT} gas SCVs · ${satPct}% util · ⛽ ${Math.ceil(state.gasField[node])} left`
        : `HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    }
    const row = document.createElement("div");
    row.className = "row static";
    row.innerHTML = `${svgIcon("refinery")}<div class="body">
        <div class="name">Refinery</div>
        <div class="meta">${meta}</div>
        ${b.construct ? "" : hpBar(b.hp, b.maxHp)}
      </div>`;
    // Refineries under construction stay in place; completed ones drop to the bottom.
    (b.construct ? container : tail).appendChild(row);
  }

  // SCVs — grouped; show mining/gas utilisation to help the player saturate.
  const scvs = unitsOf(owner, node, null, "scv");
  if (scvs.length) {
    any = true;
    const miningN  = scvs.filter(u => u.task === "mining").length;
    const gasN     = scvs.filter(u => u.task === "gas").length;
    const idleN    = scvs.filter(u => u.task === "idle" && !u.transit).length;
    const buildN   = scvs.filter(u => u.task === "building").length;
    const transitN = scvs.filter(u => u.transit).length;
    const parts = [];
    if (miningN) {
      if (interactive) {
        const mineOpt = activePatchCount(state.field[node]) * 2;
        const oversat = miningN > mineOpt;
        parts.push(`${miningN}/${mineOpt} mining${oversat ? " ⚠" : ""}`);
      } else {
        parts.push(`${miningN} mining`);
      }
    }
    if (gasN)     parts.push(`${gasN} gas`);
    if (idleN)    parts.push(`${idleN} idle`);
    if (buildN)   parts.push(`${buildN} building`);
    if (transitN) parts.push(`${transitN} → passing`);
    const sHp = scvs.reduce((s, u) => s + u.hp, 0), sMax = scvs.reduce((s, u) => s + u.maxHp, 0);
    const row = document.createElement(interactive ? "button" : "div");
    row.className = "row" + (interactive ? "" : " static");
    row.innerHTML = `${svgIcon("scv")}<div class="body">
        <div class="name">SCVs — ${scvs.length}</div>
        <div class="meta">${parts.join(", ") || "—"}</div>
        ${hpBar(sHp, sMax)}
      </div>${interactive ? '<span class="chev">›</span>' : ""}`;
    if (interactive) row.onclick = () => openSheet({ kind: "scv", node, n: 1 });
    container.appendChild(row);
  }

  // Marines — exclude bunker occupants (task="bunker"); moving ones have node=-1 so already absent.
  // Dwelling transit marines (idle+transit!=null) shown as a separate "passing through" row.
  const marines = unitsOf(owner, node, null, "marine").filter(u => u.task !== "bunker");
  if (marines.length) {
    any = true;
    const stopped  = marines.filter(u => !u.transit);
    const passing  = marines.filter(u =>  u.transit);
    if (stopped.length) {
      const mHp = stopped.reduce((s, u) => s + u.hp, 0), mMax = stopped.reduce((s, u) => s + u.maxHp, 0);
      const row = document.createElement(interactive ? "button" : "div");
      row.className = "row" + (interactive ? "" : " static");
      row.innerHTML = `${svgIcon("marine")}<div class="body">
          <div class="name">Marines — ${stopped.length}</div>
          <div class="meta">idle</div>
          ${hpBar(mHp, mMax)}
        </div>${interactive ? '<span class="chev">›</span>' : ""}`;
      if (interactive) row.onclick = () => openSheet({ kind: "marine", node, n: 1 });
      container.appendChild(row);
    }
    // Group passing-through marines by final destination.
    const mByDest = {};
    for (const u of passing) (mByDest[u.transit.to] = mByDest[u.transit.to] || []).push(u);
    for (const [to, grp] of Object.entries(mByDest)) {
      const tHp = grp.reduce((s, u) => s + u.hp, 0), tMax = grp.reduce((s, u) => s + u.maxHp, 0);
      const row = document.createElement(interactive ? "button" : "div");
      row.className = "row" + (interactive ? "" : " static");
      row.innerHTML = `${svgIcon("marine")}<div class="body">
          <div class="name">Marines — ${grp.length} <span style="color:var(--dim)">→ ${nodeName(parseInt(to))}</span></div>
          <div class="meta">in transit</div>
          ${hpBar(tHp, tMax)}
        </div>${interactive ? '<span style="padding-right:10px;color:var(--dim)">→</span>' : ""}`;
      if (interactive) row.onclick = () => openSheet({ kind: "marine", node, n: 1 });
      container.appendChild(row);
    }
  }

  // Firebats — exclude bunker occupants; moving ones have node=-1 so already absent.
  const firebats = unitsOf(owner, node, null, "firebat").filter(u => u.task !== "bunker");
  if (firebats.length) {
    any = true;
    const fStopped = firebats.filter(u => !u.transit);
    const fPassing = firebats.filter(u =>  u.transit);
    if (fStopped.length) {
      const fHp = fStopped.reduce((s, u) => s + u.hp, 0), fMax = fStopped.reduce((s, u) => s + u.maxHp, 0);
      const row = document.createElement(interactive ? "button" : "div");
      row.className = "row" + (interactive ? "" : " static");
      row.innerHTML = `${svgIcon("firebat")}<div class="body">
          <div class="name">Firebats — ${fStopped.length}</div>
          <div class="meta">idle · splash dmg</div>
          ${hpBar(fHp, fMax)}
        </div>${interactive ? '<span class="chev">›</span>' : ""}`;
      if (interactive) row.onclick = () => openSheet({ kind: "firebat", node, n: 1 });
      container.appendChild(row);
    }
    const fByDest = {};
    for (const u of fPassing) (fByDest[u.transit.to] = fByDest[u.transit.to] || []).push(u);
    for (const [to, grp] of Object.entries(fByDest)) {
      const tHp = grp.reduce((s, u) => s + u.hp, 0), tMax = grp.reduce((s, u) => s + u.maxHp, 0);
      const row = document.createElement(interactive ? "button" : "div");
      row.className = "row" + (interactive ? "" : " static");
      row.innerHTML = `${svgIcon("firebat")}<div class="body">
          <div class="name">Firebats — ${grp.length} <span style="color:var(--dim)">→ ${nodeName(parseInt(to))}</span></div>
          <div class="meta">in transit</div>
          ${hpBar(tHp, tMax)}
        </div>${interactive ? '<span style="padding-right:10px;color:var(--dim)">→</span>' : ""}`;
      if (interactive) row.onclick = () => openSheet({ kind: "firebat", node, n: 1 });
      container.appendChild(row);
    }
  }

  // Academy — tappable to research upgrades.
  for (const b of buildings.filter(b => b.type === "academy")) {
    any = true;
    const tappable = interactive && !b.construct;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`;
      if (interactive) meta += progBar(b.construct.progress, b.construct.total);
    } else if (b.research) {
      const up = UPGRADES[b.research.type];
      meta = `Researching ${up ? up.label : b.research.type} ${Math.floor(b.research.progress / b.research.total * 100)}%`;
      if (interactive) meta += progBar(b.research.progress, b.research.total);
    } else {
      const done = state.upgrades[owner].includes("u238");
      meta = interactive ? (done ? "✓ U-238 complete · tap to view" : "Idle · tap to research") : `HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    }
    row.innerHTML = `${svgIcon("academy")}<div class="body">
        <div class="name">Academy</div>
        <div class="meta">${meta}</div>
        ${b.construct ? "" : hpBar(b.hp, b.maxHp)}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "academy", node, ref: b.id });
    // Once U-238 is done (nothing left to research), drop to the bottom.
    const acDone = !b.construct && !b.research && state.upgrades[owner].includes("u238");
    (acDone ? tail : container).appendChild(row);
  }

  // Engineering Bay — tappable to research weapon/armor upgrades.
  for (const b of buildings.filter(b => b.type === "engBay")) {
    any = true;
    const tappable = interactive && !b.construct;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`;
      if (interactive) meta += progBar(b.construct.progress, b.construct.total);
    } else if (b.research) {
      const up = UPGRADES[b.research.type];
      meta = `Researching ${up ? up.label : b.research.type} ${Math.floor(b.research.progress / b.research.total * 100)}%`;
      if (interactive) meta += progBar(b.research.progress, b.research.total);
    } else {
      const ups = state.upgrades[owner];
      const wpn = ups.includes("infWeapons3") ? 3 : ups.includes("infWeapons2") ? 2 : ups.includes("infWeapons1") ? 1 : 0;
      const arm = ups.includes("infArmor3")   ? 3 : ups.includes("infArmor2")   ? 2 : ups.includes("infArmor1")   ? 1 : 0;
      meta = interactive
        ? `Weapons +${wpn} / Armor +${arm} · tap to upgrade`
        : `HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    }
    row.innerHTML = `${svgIcon("engBay")}<div class="body">
        <div class="name">Engineering Bay</div>
        <div class="meta">${meta}</div>
        ${b.construct ? "" : hpBar(b.hp, b.maxHp)}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "engBay", node, ref: b.id });
    // Once all weapon/armor levels are maxed, drop to the bottom.
    const ebUps = state.upgrades[owner];
    const ebDone = !b.construct && !b.research &&
      ebUps.includes("infWeapons3") && ebUps.includes("infArmor3");
    (ebDone ? tail : container).appendChild(row);
  }

  // Bunker — non-full bunkers are individual tappable rows; fully loaded bunkers
  // collapse into a single summary row (nothing to do — they're already full).
  const allBunkers = buildings.filter(b => b.type === "bunker");
  const actionableBunkers = allBunkers.filter(b => b.construct || (b.loaded || []).length < C.bunker.capacity);
  const fullBunkers       = allBunkers.filter(b => !b.construct && (b.loaded || []).length >= C.bunker.capacity);

  for (const b of actionableBunkers) {
    any = true;
    const tappable = interactive && !b.construct;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`;
      if (interactive) meta += progBar(b.construct.progress, b.construct.total);
    } else {
      const loaded = (b.loaded || []).length;
      meta = interactive
        ? `${loaded}/${C.bunker.capacity} loaded · tap to manage`
        : `HP ${Math.ceil(b.hp)}/${b.maxHp} · ${loaded} inside`;
    }
    row.innerHTML = `${svgIcon("bunker")}<div class="body">
        <div class="name">Bunker</div>
        <div class="meta">${meta}</div>
        ${b.construct ? "" : hpBar(b.hp, b.maxHp)}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "bunker", node, ref: b.id });
    container.appendChild(row);
  }

  if (fullBunkers.length) {
    any = true;
    const tappable = interactive;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    const totalHp  = fullBunkers.reduce((s, b) => s + b.hp, 0);
    const totalMax = fullBunkers.reduce((s, b) => s + b.maxHp, 0);
    const meta = interactive
      ? `${fullBunkers.length > 1 ? `×${fullBunkers.length} · ` : ""}${C.bunker.capacity}/${C.bunker.capacity} loaded · tap to unload`
      : `HP ${Math.ceil(totalHp)}/${totalMax} · full`;
    row.innerHTML = `${svgIcon("bunker")}<div class="body">
        <div class="name">Bunker${fullBunkers.length > 1 ? ` ×${fullBunkers.length}` : ""}</div>
        <div class="meta">${meta}</div>
        ${hpBar(totalHp, totalMax)}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "bunker", node, ref: fullBunkers[0].id });
    tail.appendChild(row);
  }

  // Passive/finished buildings deferred above land here, at the bottom of the list.
  container.appendChild(tail);

  return any;
}

function renderTransit() {
  const wrap = $("transit");
  // Show all player units with active transit (traveling or dwelling at intermediate node).
  const mine = state.units.filter(u => u.owner === HUMAN && u.transit != null);
  if (!mine.length) { wrap.innerHTML = ""; return; }
  const byDir = {};
  for (const u of mine) {
    const k = u.transit.to;
    (byDir[k] = byDir[k] || []).push(u);
  }
  let html = `<div class="section-label">In transit</div>`;
  for (const to in byDir) {
    const group = byDir[to];
    const scvN = group.filter(u => u.type === "scv").length;
    const marN = group.filter(u => u.type === "marine").length;
    const fbtN = group.filter(u => u.type === "firebat").length;
    const label = [scvN && `${scvN} SCV${scvN > 1 ? "s" : ""}`,
                   marN && `${marN} Marine${marN > 1 ? "s" : ""}`,
                   fbtN && `${fbtN} Firebat${fbtN > 1 ? "s" : ""}`].filter(Boolean).join(", ");
    const mode = group[0].transit.mode;
    const modeLabel = mode === "attack" ? " ⚔️" : " 📦";
    const hops = group[0].transit.path.length - 1;
    const dwellPer = mode === "attack" ? ENGAGE_DELAY : DWELL_TIME;
    const totalTime = hops * EDGE_TIME + Math.max(0, hops - 1) * dwellPer;
    // Estimate overall progress as completed hops + current segment/dwell fraction.
    const avgDone = group.reduce((s, u) => {
      const done = (u.transit.pathIdx - 1) * (EDGE_TIME + dwellPer);
      const frac = u.transit.dwellStart != null
        ? EDGE_TIME + Math.min(state.time - u.transit.dwellStart, dwellPer)
        : u.transit.progress;
      return s + done + frac;
    }, 0) / group.length;
    const eta = Math.max(0, Math.round(totalTime - avgDone));
    // Show current position if dwelling at an intermediate node.
    const dwelling = group.filter(u => u.transit.dwellStart != null && u.transit.pathIdx < hops);
    const atNote = dwelling.length ? ` · at ${nodeName(dwelling[0].node)}` : "";
    html += `<div class="transit-row">
        <div class="transit-info">
          <div class="name">${label}${modeLabel} → ${nodeName(parseInt(to))}${atNote}</div>
          <div class="meta">ETA ${eta}s</div>
          ${progBar(Math.min(avgDone, totalTime), totalTime)}
        </div>
        <button class="transit-cancel" onclick="cancelTransit(${to})">✕</button>
      </div>`;
  }
  wrap.innerHTML = html;
}

/* ---------------------------- Action sheet --------------------------- */
function openSheet(sel) { ui.sheet = sel; renderSheet(); }
function closeSheet() {
  ui.sheet = null;
  $("sheet").className = "";
  $("sheet-backdrop").className = "";
}

// Reachable destinations from `node` for the human, nearest first.
const sendDests = node => [...reachableSet(HUMAN)]
  .filter(d => d !== node)
  .sort((a, b) => hopDist(node, a) - hopDist(node, b) || a - b);

// One "Send n → Sector X (ETA)" button per reachable destination.
function destButtonsHtml(node, n, poolLen) {
  const dests = sendDests(node);
  if (!dests.length) return `<div class="sheet-sub" style="margin-top:8px">No reachable destinations — explore a neighbour first.</div>`;
  return dests.map(d => {
    const eta = hopDist(node, d) * EDGE_TIME;
    return `<button class="act secondary" id="dest-${d}" ${poolLen ? "" : "disabled"}>
        Send ${n} → ${nodeName(d)} <span class="cost">— ${eta}s travel</span>
      </button>`;
  }).join("");
}
function bindDestButtons(node, onSend) {
  for (const d of sendDests(node)) bind(`dest-${d}`, () => onSend(d));
}

function renderSheet() {
  const sel = ui.sheet;
  const sheet = $("sheet");
  $("sheet-backdrop").className = "open";
  sheet.className = "open";
  const mineNow = Math.floor(state.minerals[HUMAN]);

  if (sel.kind === "cc") {
    const cc = state.buildings.find(b => b.id === sel.ref);
    if (!cc) { closeSheet(); return; }
    const inQ = (cc.train ? 1 : 0) + cc.queued;
    const supplyOK = supplyUsed(HUMAN) < supplyCap(HUMAN);
    const afford = mineNow >= C.cc.trainCost;
    const dis = cc.construct || inQ >= C.cc.queueMax || !afford;
    const note = cc.construct ? "Under construction."
      : inQ >= C.cc.queueMax ? `Queue full (${C.cc.queueMax} max).`
      : !afford ? `Need ${C.cc.trainCost} 💎.`
      : !supplyOK ? "Supply blocked — SCV will train when supply is free." : "";
    const rally = cc.rally;
    // Offer Gas only where a refinery stands (or it's already the active rally, so
    // a player whose refinery was destroyed can still see/change the setting).
    const gasHere = refineryReady(HUMAN, cc.node) || rally === "gas";
    const rallySel = r => rally === r ? "sel" : "";
    sheet.innerHTML = `
      <h2>Command Center</h2>
      <div class="sheet-sub">${nodeName(sel.node)} · HP ${Math.ceil(cc.hp)}/${cc.maxHp} · Queue ${inQ}/${C.cc.queueMax}</div>
      <button class="act" ${dis ? "disabled" : ""} id="a-train">
        Train SCV <span class="cost">— ${C.cc.trainCost} 💎 · ${C.cc.trainTime}s · +1 supply</span>
      </button>
      ${note ? `<div class="sheet-sub" style="margin-top:8px">${note}</div>` : ""}
      <div class="sheet-sub" style="margin-top:10px">Rally — new SCVs:</div>
      <div class="mode-toggle">
        <button id="a-rally-mine" class="${rallySel("mining")}">⛏️ Mine</button>
        ${gasHere ? `<button id="a-rally-gas" class="${rallySel("gas")}">⚡ Gas</button>` : ""}
        <button id="a-rally-idle" class="${rallySel("idle")}">🛑 Idle</button>
      </div>
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-train", () => { queueSCV(HUMAN, cc.node); refreshSheet(); });
    bind("a-rally-mine", () => { cc.rally = "mining"; refreshSheet(); });
    bind("a-rally-gas",  () => { cc.rally = "gas";    refreshSheet(); });
    bind("a-rally-idle", () => { cc.rally = "idle";   refreshSheet(); });

  } else if (sel.kind === "barracks" || sel.kind === "barracks-group") {
    const allRax = buildingsOf(HUMAN, sel.node).filter(b => b.type === "barracks" && !b.construct);
    if (!allRax.length) { closeSheet(); return; }
    const totalQ = allRax.reduce((s, b) => s + (b.train ? 1 : 0) + (b.queued || 0) + (b.queuedFirebats || 0), 0);
    const maxQ = allRax.length * C.marine.queueMax;
    const supplyOK = supplyUsed(HUMAN) < supplyCap(HUMAN);
    const afford = mineNow >= C.marine.cost;
    const dis = totalQ >= maxQ || !afford;
    const note = totalQ >= maxQ ? `All queues full (${maxQ} max).`
      : !afford ? `Need ${C.marine.cost} 💎.`
      : !supplyOK ? "Supply blocked — marines will train when supply is free." : "";
    const trainingRax = allRax.filter(b => b.train).sort((a, b) => b.train.progress - a.train.progress);
    const eta = trainingRax.length ? C.marine.build - trainingRax[0].train.progress : 0;
    const label = allRax.length > 1 ? `Barracks ×${allRax.length}` : "Barracks";
    const rallyNode = allRax[0].rally;
    const rallyLabel = typeof rallyNode === "number" ? `→ ${nodeName(rallyNode)}` : "Stay here";
    const hasAcad = state.buildings.some(b => b.owner === HUMAN && b.type === "academy" && !b.construct);
    const gasNow = Math.floor(state.gas[HUMAN]);
    const canFirebat = hasAcad && totalQ < maxQ && mineNow >= C.firebat.cost && gasNow >= C.firebat.gasCost;
    const fbNote = !hasAcad ? "Requires Academy." : gasNow < C.firebat.gasCost ? `Need ${C.firebat.gasCost} ⛽.` : "";
    sheet.innerHTML = `
      <h2>${label}</h2>
      <div class="sheet-sub">${nodeName(sel.node)} · ${totalQ} training${trainingRax.length ? ` · next ready in ${eta}s` : ""}</div>
      <button class="act" ${dis ? "disabled" : ""} id="a-marine">
        Train Marine <span class="cost">— ${C.marine.cost} 💎 · ${C.marine.build}s · +1 supply</span>
      </button>
      <button class="act" ${canFirebat ? "" : "disabled"} id="a-firebat">
        Train Firebat <span class="cost">— ${C.firebat.cost} 💎 ${C.firebat.gasCost} ⛽ · ${C.firebat.build}s · splash</span>
      </button>
      ${fbNote ? `<div class="sheet-sub" style="margin-top:2px">${fbNote}</div>` : ""}
      ${note ? `<div class="sheet-sub" style="margin-top:8px">${note}</div>` : ""}
      <button class="act secondary" id="a-set-rally">
        Rally: ${rallyLabel} <span class="cost">— new units auto-move here</span>
      </button>
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-marine",  () => { queueMarine(HUMAN, sel.node, null);  refreshSheet(); });
    bind("a-firebat", () => { queueFirebat(HUMAN, sel.node, null); refreshSheet(); });
    bind("a-set-rally", () => openSheet({ kind: "barracks-rally", node: sel.node }));

  } else if (sel.kind === "barracks-rally") {
    const allRax = buildingsOf(HUMAN, sel.node).filter(b => b.type === "barracks" && !b.construct);
    if (!allRax.length) { closeSheet(); return; }
    const dests = sendDests(sel.node);
    const setRally = dest => { allRax.forEach(b => b.rally = dest); openSheet({ kind: "barracks-group", node: sel.node }); };
    sheet.innerHTML = `
      <h2>Set Rally Point</h2>
      <div class="sheet-sub">New marines from ${nodeName(sel.node)} auto-move to the rally node</div>
      <button class="act secondary" id="rally-home">Stay here — no rally</button>
      ${dests.map(d => `<button class="act secondary" id="rally-${d}">→ ${nodeName(d)} <span class="cost">— ${hopDist(sel.node, d) * EDGE_TIME}s travel</span></button>`).join("")}
      <button class="act-close" id="a-close">Close</button>`;
    bind("rally-home", () => setRally(null));
    for (const d of dests) bind(`rally-${d}`, () => setRally(d));

  } else if (sel.kind === "marine") {
    const node = sel.node;
    const allIdle = idleMarines(HUMAN, node);
    const pool    = allIdle.filter(u => !u.transit);      // truly stopped here
    const passing = allIdle.filter(u =>  u.transit);      // dwelling en route elsewhere
    const max = Math.max(1, pool.length);
    sel.n = Math.min(Math.max(1, sel.n || pool.length), max);
    sel.mode = sel.mode || "attack";
    const n = sel.n;
    const mAtk = sel.mode === "attack";
    // Group passing-through units by final destination.
    const byDest = {};
    for (const u of passing) (byDest[u.transit.to] = byDest[u.transit.to] || []).push(u);
    const passingHtml = Object.entries(byDest).map(([to, grp]) =>
      `<div class="sheet-sub" style="margin-top:6px;display:flex;align-items:center;justify-content:space-between">
         <span>${grp.length} Marine${grp.length > 1 ? "s" : ""} → ${nodeName(parseInt(to))} <em style="color:var(--dim)">(in transit)</em></span>
         <button onclick="stopTransitHere(${node},${to})">Stop here</button>
       </div>`
    ).join("");
    const readySub = pool.length
      ? `${pool.length} ready · pick a destination`
      : passing.length ? "No marines stopped here — all passing through" : "No marines";
    sheet.innerHTML = `
      <h2>Marines at ${nodeName(node)}</h2>
      <div class="sheet-sub">${readySub}</div>
      ${passingHtml}
      ${pool.length ? `
      <div class="stepper">
        <button id="n-minus">−</button>
        <div class="count" id="n-count">${n}</div>
        <button id="n-plus">+</button>
        <div class="label">selected</div>
      </div>
      <input type="range" id="n-range" min="1" max="${max}" value="${n}">
      <div class="mode-toggle">
        <button id="mode-move" class="${!mAtk ? "sel" : ""}">📦 Move</button>
        <button id="mode-attack" class="${mAtk ? "sel" : ""}">⚔️ Move &amp; Attack</button>
      </div>
      ${destButtonsHtml(node, n, pool.length)}` : ""}
      <button class="act-close" id="a-close">Close</button>`;
    if (pool.length) {
      const setN = v => { sel.n = Math.min(Math.max(1, v), max); renderSheet(); };
      bind("n-minus", () => setN(sel.n - 1));
      bind("n-plus", () => setN(sel.n + 1));
      $("n-range").oninput = e => setN(parseInt(e.target.value, 10));
      bind("mode-move",   () => { sel.mode = "move";   renderSheet(); });
      bind("mode-attack", () => { sel.mode = "attack"; renderSheet(); });
      bindDestButtons(node, dest => { sendUnits(HUMAN, node, sel.n, "marine", dest, sel.mode); closeSheet(); render(); });
    }

  } else if (sel.kind === "firebat") {
    const node = sel.node;
    const allIdle2 = idleFirebats(HUMAN, node);
    const pool    = allIdle2.filter(u => !u.transit);
    const passing = allIdle2.filter(u =>  u.transit);
    const max = Math.max(1, pool.length);
    sel.n = Math.min(Math.max(1, sel.n || pool.length), max);
    sel.mode = sel.mode || "attack";
    const n = sel.n;
    const mAtk = sel.mode === "attack";
    const byDest2 = {};
    for (const u of passing) (byDest2[u.transit.to] = byDest2[u.transit.to] || []).push(u);
    const passingHtml2 = Object.entries(byDest2).map(([to, grp]) =>
      `<div class="sheet-sub" style="margin-top:6px;display:flex;align-items:center;justify-content:space-between">
         <span>${grp.length} Firebat${grp.length > 1 ? "s" : ""} → ${nodeName(parseInt(to))} <em style="color:var(--dim)">(in transit)</em></span>
         <button onclick="stopTransitHere(${node},${to})">Stop here</button>
       </div>`
    ).join("");
    const readySub2 = pool.length
      ? `${pool.length} ready · splash damage vs crowds`
      : passing.length ? "No firebats stopped here — all passing through" : "No firebats";
    sheet.innerHTML = `
      <h2>Firebats at ${nodeName(node)}</h2>
      <div class="sheet-sub">${readySub2}</div>
      ${passingHtml2}
      ${pool.length ? `
      <div class="stepper">
        <button id="n-minus">−</button>
        <div class="count" id="n-count">${n}</div>
        <button id="n-plus">+</button>
        <div class="label">selected</div>
      </div>
      <input type="range" id="n-range" min="1" max="${max}" value="${n}">
      <div class="mode-toggle">
        <button id="mode-move" class="${!mAtk ? "sel" : ""}">📦 Move</button>
        <button id="mode-attack" class="${mAtk ? "sel" : ""}">⚔️ Move &amp; Attack</button>
      </div>
      ${destButtonsHtml(node, n, pool.length)}` : ""}
      <button class="act-close" id="a-close">Close</button>`;
    if (pool.length) {
      const setN2 = v => { sel.n = Math.min(Math.max(1, v), max); renderSheet(); };
      bind("n-minus", () => setN2(sel.n - 1));
      bind("n-plus",  () => setN2(sel.n + 1));
      $("n-range").oninput = e => setN2(parseInt(e.target.value, 10));
      bind("mode-move",   () => { sel.mode = "move";   renderSheet(); });
      bind("mode-attack", () => { sel.mode = "attack"; renderSheet(); });
      bindDestButtons(node, dest => { sendUnits(HUMAN, node, sel.n, "firebat", dest, sel.mode); closeSheet(); render(); });
    }

  } else if (sel.kind === "academy") {
    const b = state.buildings.find(b => b.id === sel.ref);
    if (!b) { closeSheet(); return; }
    const done = state.upgrades[HUMAN].includes("u238");
    const up = UPGRADES.u238;
    const gasNow = Math.floor(state.gas[HUMAN]);
    const canResearch = !done && !b.research && mineNow >= up.minerals && gasNow >= up.gas;
    const resNote = done ? "✓ Already researched."
      : b.research ? `Researching… ${Math.floor(b.research.progress / b.research.total * 100)}%`
      : mineNow < up.minerals ? `Need ${up.minerals} 💎.`
      : gasNow < up.gas ? `Need ${up.gas} ⛽.` : "";
    sheet.innerHTML = `
      <h2>Academy</h2>
      <div class="sheet-sub">${nodeName(sel.node)} · HP ${Math.ceil(b.hp)}/${b.maxHp}</div>
      ${hpBar(b.hp, b.maxHp)}
      <button class="act" ${canResearch ? "" : "disabled"} id="a-u238">
        Research U-238 Shells <span class="cost">— ${up.minerals} 💎 ${up.gas} ⛽ · ${up.time}s · Marines +1 range</span>
      </button>
      ${resNote ? `<div class="sheet-sub" style="margin-top:8px">${resNote}</div>` : ""}
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-u238", () => { startResearch(HUMAN, "u238"); refreshSheet(); });

  } else if (sel.kind === "engBay") {
    const b = state.buildings.find(b => b.id === sel.ref);
    if (!b) { closeSheet(); return; }
    const gasNow = Math.floor(state.gas[HUMAN]);
    const ups = state.upgrades[HUMAN];
    const resNote = b.research
      ? `<div class="sheet-sub" style="margin-top:8px">Researching ${UPGRADES[b.research.type]?.label}… ${Math.floor(b.research.progress / b.research.total * 100)}%${progBar(b.research.progress, b.research.total)}</div>`
      : "";
    const resBtn = key => {
      const up = UPGRADES[key];
      const done = ups.includes(key);
      const prereqOK = !up.requires || ups.includes(up.requires);
      const elsewhere = !done && state.buildings.some(eb =>
        eb.owner === HUMAN && eb.type === "engBay" && eb.id !== b.id &&
        eb.research && eb.research.type === key);
      const canRes = !done && prereqOK && !b.research && !elsewhere && mineNow >= up.minerals && gasNow >= up.gas;
      const note = done ? "✓ done" : elsewhere ? "in progress (other bay)"
        : !prereqOK ? "requires previous level"
        : b.research ? "busy" : mineNow < up.minerals ? `need ${up.minerals}💎` : gasNow < up.gas ? `need ${up.gas}⛽` : "";
      return `<button class="act secondary" ${canRes ? "" : "disabled"} id="a-${key}">
        ${up.label} <span class="cost">— ${up.minerals}💎 ${up.gas}⛽ · ${up.time}s${note ? " · " + note : ""}</span>
      </button>`;
    };
    const wpnLvl = ups.includes("infWeapons3") ? 3 : ups.includes("infWeapons2") ? 2 : ups.includes("infWeapons1") ? 1 : 0;
    const armLvl = ups.includes("infArmor3")   ? 3 : ups.includes("infArmor2")   ? 2 : ups.includes("infArmor1")   ? 1 : 0;
    const maxNote = `<div class="sheet-sub" style="padding:4px 0;opacity:.6">Max level reached</div>`;
    sheet.innerHTML = `
      <h2>Engineering Bay</h2>
      <div class="sheet-sub">${nodeName(sel.node)} · HP ${Math.ceil(b.hp)}/${b.maxHp}</div>
      ${hpBar(b.hp, b.maxHp)}${resNote}
      <div class="sheet-sub" style="margin-top:8px">⚔️ Infantry Weapons (${wpnLvl}/3)</div>
      ${wpnLvl < 3 ? resBtn("infWeapons" + (wpnLvl + 1)) : maxNote}
      <div class="sheet-sub" style="margin-top:8px">🛡 Infantry Armor (${armLvl}/3)</div>
      ${armLvl < 3 ? resBtn("infArmor" + (armLvl + 1)) : maxNote}
      <button class="act-close" id="a-close">Close</button>`;
    ["infWeapons1","infWeapons2","infWeapons3","infArmor1","infArmor2","infArmor3"]
      .forEach(key => bind("a-"+key, () => { startResearch(HUMAN, key); refreshSheet(); }));

  } else if (sel.kind === "bunker") {
    const b = state.buildings.find(b => b.id === sel.ref);
    if (!b) { closeSheet(); return; }
    const node = sel.node;
    const loaded = b.loaded || [];
    const loadedUnits = loaded.map(id => state.units.find(u => u.id === id)).filter(Boolean);
    const avail = state.units.filter(u =>
      u.owner === HUMAN && u.node === node && u.task === "idle" &&
      (u.type === "marine" || u.type === "firebat")).length;
    const full = loaded.length >= C.bunker.capacity;
    sheet.innerHTML = `
      <h2>Bunker</h2>
      <div class="sheet-sub">${nodeName(node)} · ${loaded.length}/${C.bunker.capacity} loaded · HP ${Math.ceil(b.hp)}/${b.maxHp}</div>
      ${hpBar(b.hp, b.maxHp)}
      ${loadedUnits.length ? `<div class="sheet-sub" style="margin-top:8px">Inside: ${loadedUnits.map(u => `${u.type} HP ${Math.ceil(u.hp)}/${u.maxHp}`).join(", ")}</div>` : ""}
      <button class="act" ${full || !avail ? "disabled" : ""} id="a-load">
        Load infantry <span class="cost">— fills from ${avail} idle here</span>
      </button>
      <button class="act secondary" ${!loaded.length ? "disabled" : ""} id="a-unload">
        Unload all <span class="cost">— ${loaded.length} ejected</span>
      </button>
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-load",   () => { loadBunker(HUMAN, node, b.id);  refreshSheet(); });
    bind("a-unload", () => { unloadBunker(HUMAN, b.id);      refreshSheet(); });

  } else {
    // SCV group sheet — split into Move / Build / Mine submenus to avoid clutter.
    const node = sel.node;
    const all = controllable(HUMAN, node);
    const idleN   = unitsOf(HUMAN, node, "idle",   "scv").length;
    const miningN = unitsOf(HUMAN, node, "mining", "scv").length;
    const gasN    = unitsOf(HUMAN, node, "gas",    "scv").length;
    const max = Math.max(1, all.length);
    sel.n = Math.min(Math.max(1, sel.n || 1), max);
    const n = sel.n;
    const ccAtNode    = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "cc");
    const hasCc       = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "cc" && !b.construct);
    const ccOK        = all.length >= 1 && mineNow >= C.cc.cost && !ccAtNode;
    const depotOK     = all.length >= 1 && mineNow >= C.depot.cost;
    const raxOK       = all.length >= 1 && mineNow >= C.barracks.cost;
    const hasRef      = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "refinery" && !b.construct);
    const refBuilding = state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "refinery");
    const gasAvail    = state.gasField[node] > 0;
    const refOK       = all.length >= 1 && mineNow >= C.refinery.cost && !refBuilding && gasAvail;
    const raxDone     = hasFinishedBarracks(HUMAN); // Academy/Bunker prerequisite
    const acadOK      = all.length >= 1 && mineNow >= C.academy.cost && raxDone &&
                        !state.buildings.some(b => b.owner === HUMAN && b.node === node && b.type === "academy");
    const bunkerOK    = all.length >= 1 && mineNow >= C.bunker.cost && raxDone;
    const engBayOK    = all.length >= 1 && mineNow >= C.engBay.cost && raxDone;
    const minSatPct   = mineralSatPct(miningN, state.field[node]);
    const gasSatPct   = Math.round(gasN / GAS_OPT * 100);
    const hasMinerals = state.field[node] > 0;
    const canMineHere = hasMinerals && hasCc;  // minerals + completed CC = can mine
    const canMine     = canMineHere || hasRef;
    const tab = sel.tab || "root";

    const needCcNote = hasMinerals && !hasCc ? " · ⚠️ Need CC to mine" : "";
    const summary = `<div class="sheet-sub">${all.length} available · ${idleN} idle${canMineHere || miningN ? ` · ${miningN} mining (${minSatPct}% sat)` : ""}${gasN ? ` · ${gasN} gas (${gasSatPct}% sat)` : ""}${needCcNote}</div>`;
    let title = `SCVs at ${nodeName(node)}`, body;

    // Actions available right now (enabled). Used both to build the root body and to wire bindings.
    const mineActs = [];
    if (canMineHere && idleN > 0)
      mineActs.push({ id: "a-mf0", html: `⛏ Set ${idleN} idle → mining`,
        fn: () => { setTask(HUMAN, node, idleN, "idle", "mining", "scv"); refreshSheet(); } });
    if (canMineHere && miningN > 0)
      mineActs.push({ id: "a-mf1", html: `⛏ Set ${miningN} mining → idle`,
        fn: () => { setTask(HUMAN, node, miningN, "mining", "idle", "scv"); refreshSheet(); } });
    if (hasRef && idleN + miningN > 0 && gasN < GAS_OPT)
      mineActs.push({ id: "a-mf2", html: `⛏ Assign 1 SCV → gas <span class="cost">— ${gasN}/${GAS_OPT} optimal</span>`,
        fn: () => { const scv = unitsOf(HUMAN, node, "idle", "scv")[0] || unitsOf(HUMAN, node, "mining", "scv")[0];
                    if (scv) { scv.task = "gas"; refreshSheet(); } } });
    if (hasRef && gasN > 0)
      mineActs.push({ id: "a-mf3", html: `⛏ Pull 1 gas SCV → mining`,
        fn: () => { const scv = unitsOf(HUMAN, node, "gas", "scv")[0];
                    if (scv) { scv.task = "mining"; refreshSheet(); } } });

    const buildActs = [];
    if (depotOK)  buildActs.push({ id: "a-bf0", html: `🏗 Build Supply Depot <span class="cost">— ${C.depot.cost} 💎 · ${C.depot.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "depot"); refreshSheet(); } });
    if (raxOK)    buildActs.push({ id: "a-bf1", html: `🏗 Build Barracks <span class="cost">— ${C.barracks.cost} 💎 · ${C.barracks.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "barracks"); refreshSheet(); } });
    if (refOK)    buildActs.push({ id: "a-bf2", html: `🏗 Build Refinery <span class="cost">— ${C.refinery.cost} 💎 · ${C.refinery.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "refinery"); refreshSheet(); } });
    if (ccOK)     buildActs.push({ id: "a-bf3", html: `🏗 Build Command Center <span class="cost">— ${C.cc.cost} 💎 · ${C.cc.build}s</span>`,
      fn: () => { startBuilding(HUMAN, node, "cc"); refreshSheet(); } });
    if (acadOK)   buildActs.push({ id: "a-bf4", html: `🏗 Build Academy <span class="cost">— ${C.academy.cost} 💎 · ${C.academy.build}s · unlocks Firebat + research</span>`,
      fn: () => { startBuilding(HUMAN, node, "academy"); refreshSheet(); } });
    if (bunkerOK) buildActs.push({ id: "a-bf5", html: `🏗 Build Bunker <span class="cost">— ${C.bunker.cost} 💎 · ${C.bunker.build}s · shelters ${C.bunker.capacity} infantry</span>`,
      fn: () => { startBuilding(HUMAN, node, "bunker"); refreshSheet(); } });
    if (engBayOK) buildActs.push({ id: "a-bf6", html: `🏗 Build Engineering Bay <span class="cost">— ${C.engBay.cost} 💎 · ${C.engBay.build}s · weapon &amp; armor upgrades</span>`,
      fn: () => { startBuilding(HUMAN, node, "engBay"); refreshSheet(); } });

    if (tab === "move") {
      sel.mode = sel.mode || "move"; // SCVs default to move mode
      title = `Move · ${nodeName(node)}`;
      const mAtk = sel.mode === "attack";
      body = `
        <div class="stepper">
          <button id="n-minus">−</button>
          <div class="count" id="n-count">${n}</div>
          <button id="n-plus">+</button>
          <div class="label">SCVs<br>selected</div>
        </div>
        <input type="range" id="n-range" min="1" max="${max}" value="${n}">
        <div class="mode-toggle">
          <button id="mode-move" class="${!mAtk ? "sel" : ""}">📦 Move</button>
          <button id="mode-attack" class="${mAtk ? "sel" : ""}">⚔️ Move &amp; Attack</button>
        </div>
        ${destButtonsHtml(node, n, all.length)}
        <button class="act-close" id="a-back">‹ Back</button>`;
    } else if (tab === "build") {
      title = `Build · ${nodeName(node)}`;
      body = `
        <button class="act secondary" id="a-depot" ${depotOK ? "" : "disabled"}>
          Build Supply Depot <span class="cost">— ${C.depot.cost} 💎 · ${C.depot.build}s</span>
        </button>
        <button class="act secondary" id="a-rax" ${raxOK ? "" : "disabled"}>
          Build Barracks <span class="cost">— ${C.barracks.cost} 💎 · ${C.barracks.build}s</span>
        </button>
        ${gasAvail ? `
        <button class="act secondary" id="a-ref" ${refOK ? "" : "disabled"}>
          Build Refinery <span class="cost">— ${C.refinery.cost} 💎 · ${C.refinery.build}s · unlock gas</span>
        </button>` : ""}
        <button class="act secondary" id="a-cc" ${ccOK ? "" : "disabled"}>
          Build Command Center <span class="cost">— ${C.cc.cost} 💎 · ${C.cc.build}s · +${C.cc.supply} supply</span>
        </button>
        <button class="act secondary" id="a-academy" ${acadOK ? "" : "disabled"}>
          Build Academy <span class="cost">— ${C.academy.cost} 💎 · ${C.academy.build}s · unlocks Firebat + research</span>
        </button>
        <button class="act secondary" id="a-bunker" ${bunkerOK ? "" : "disabled"}>
          Build Bunker <span class="cost">— ${C.bunker.cost} 💎 · ${C.bunker.build}s · shelters ${C.bunker.capacity} infantry</span>
        </button>
        <button class="act secondary" id="a-engbay" ${engBayOK ? "" : "disabled"}>
          Build Engineering Bay <span class="cost">— ${C.engBay.cost} 💎 · ${C.engBay.build}s · weapon &amp; armor upgrades</span>
        </button>
        <button class="act-close" id="a-back">‹ Back</button>`;
    } else if (tab === "mine") {
      title = `Mine & Gas · ${nodeName(node)}`;
      body = `
        ${canMineHere ? `
        <button class="act secondary" id="a-mine-all" ${idleN ? "" : "disabled"}>
          Set ALL ${idleN} idle → mining
        </button>
        <button class="act secondary" id="a-idle-all" ${miningN ? "" : "disabled"}>
          Set ALL ${miningN} mining → idle
        </button>` : hasMinerals ? `<div class="sheet-sub">Build a Command Center here to mine minerals.</div>` : ""}
        ${hasRef ? `
        <button class="act secondary" id="a-gas-add" ${idleN + miningN > 0 && gasN < GAS_OPT ? "" : "disabled"}>
          ⛽ Assign 1 SCV → gas <span class="cost">— ${gasN}/${GAS_OPT} optimal</span>
        </button>
        <button class="act secondary" id="a-gas-rem" ${gasN ? "" : "disabled"}>
          ⛽ Pull 1 gas SCV → mining
        </button>` : ""}
        <button class="act-close" id="a-back">‹ Back</button>`;
    } else {
      const flat = acts => acts.length === 1
        ? `<button class="act secondary" id="${acts[0].id}">${acts[0].html}</button>` : "";
      body = `
        <button class="act" id="m-move">🚶 Move <span class="cost">— send SCVs to another node</span></button>
        ${buildActs.length > 1
          ? `<button class="act secondary" id="m-build">🏗 Build <span class="cost">— depot, barracks${gasAvail ? ", refinery" : ""}</span></button>`
          : flat(buildActs)}
        ${mineActs.length > 1
          ? `<button class="act secondary" id="m-mine">⛏ Mine & Gas <span class="cost">— assign workers to resources</span></button>`
          : flat(mineActs)}
        <button class="act-close" id="a-close">Close</button>`;
    }
    sheet.innerHTML = `<h2>${title}</h2>${summary}${body}`;

    const setTab = t => { sel.tab = t; renderSheet(); };
    bind("m-move",  () => setTab("move"));
    bind("m-build", () => setTab("build"));
    bind("m-mine",  () => setTab("mine"));
    bind("a-back",  () => setTab(null));
    // Root-level flat shortcuts when a submenu would have only one option.
    if (tab === "root") [...mineActs, ...buildActs].forEach(a => bind(a.id, a.fn));

    if (tab === "move") {
      const setN = v => { sel.n = Math.min(Math.max(1, v), max); renderSheet(); };
      bind("n-minus", () => setN(sel.n - 1));
      bind("n-plus", () => setN(sel.n + 1));
      const rng = $("n-range"); if (rng) rng.oninput = e => setN(parseInt(e.target.value, 10));
      bind("mode-move",   () => { sel.mode = "move";   renderSheet(); });
      bind("mode-attack", () => { sel.mode = "attack"; renderSheet(); });
      bindDestButtons(node, dest => { sendUnits(HUMAN, node, sel.n, "scv", dest, sel.mode); closeSheet(); render(); });
    } else if (tab === "build") {
      bind("a-cc",      () => { startBuilding(HUMAN, node, "cc");       refreshSheet(); });
      bind("a-depot",   () => { startBuilding(HUMAN, node, "depot");    refreshSheet(); });
      bind("a-rax",     () => { startBuilding(HUMAN, node, "barracks"); refreshSheet(); });
      bind("a-ref",     () => { startBuilding(HUMAN, node, "refinery"); refreshSheet(); });
      bind("a-academy", () => { startBuilding(HUMAN, node, "academy");  refreshSheet(); });
      bind("a-bunker",  () => { startBuilding(HUMAN, node, "bunker");   refreshSheet(); });
      bind("a-engbay",  () => { startBuilding(HUMAN, node, "engBay");   refreshSheet(); });
    } else if (tab === "mine") {
      bind("a-mine-all", () => { setTask(HUMAN, node, idleN, "idle", "mining", "scv"); refreshSheet(); });
      bind("a-idle-all", () => { setTask(HUMAN, node, miningN, "mining", "idle", "scv"); refreshSheet(); });
      bind("a-gas-add", () => {
        const scv = unitsOf(HUMAN, node, "idle", "scv")[0] || unitsOf(HUMAN, node, "mining", "scv")[0];
        if (scv) { scv.task = "gas"; refreshSheet(); }
      });
      bind("a-gas-rem", () => {
        const scv = unitsOf(HUMAN, node, "gas", "scv")[0];
        if (scv) { scv.task = "mining"; refreshSheet(); }
      });
    }
  }
  bind("a-close", closeSheet);
}

function refreshSheet() { render(); if (ui.sheet) renderSheet(); }
function bind(id, fn) { const el = $(id); if (el) el.onclick = fn; }

/* ------------------------------- Loop -------------------------------- */
function startLoop() { clearInterval(timer); timer = setInterval(() => { if (!state.paused) tick(); }, tickMs()); }
function stopLoop() { clearInterval(timer); }

// The game has no separate pause button: the menu IS the pause. Opening the menu
// freezes the sim; closing it (Resume) lets it run. It opens by default on a new
// game, so the player starts the match deliberately.
function openMenu() {
  if (state.over) return; // end screen owns the post-game flow
  state.paused = true;
  const el = $("menu");
  if (el) el.className = "open";
  renderMenu();
  render(); // dim the board immediately
}
function closeMenu() {
  state.paused = false;
  const el = $("menu");
  if (el) el.className = "";
  render();
}
function setSpeed(s) {
  if (!SPEEDS[s]) return;
  state.speed = s;
  startLoop();   // re-arm the interval at the new cadence
  renderMenu();
  persist();
}
// Paint the menu overlay's dynamic bits (resume label, active speed, surrender).
function renderMenu() {
  if (typeof document === "undefined") return;
  const fresh = state.time === 0;
  const title = $("menu-title"); if (title) title.textContent = fresh ? "StarText" : "Paused";
  const resume = $("menu-resume"); if (resume) resume.textContent = fresh ? "▶ Start game" : "▶ Resume";
  const surr = $("menu-surrender"); if (surr) surr.style.display = fresh ? "none" : "block";
  document.querySelectorAll("#menu .speed-seg button").forEach(b =>
    b.classList.toggle("sel", b.dataset.speed === state.speed));
}

/* ---------------------------- Persistence ---------------------------- */
// The whole simulation is plain JSON-able data (map = arrays, sheet.ref holds
// ids not object refs, the RNG is one int), so a tab refresh can resume an
// in-progress game from localStorage instead of restarting.
const SAVE_KEY = "startext.save.v1";
const SAVE_VERSION = 1;

// Pure (DOM/localStorage-free, so tests can round-trip it): snapshot every
// global the sim reads or writes into a JSON string.
function serializeState() {
  // rng is stored unsigned so the same 32-bit value always serializes identically
  // (rng() leaves it signed via |0, seedRng/restore use >>> 0).
  return JSON.stringify({ v: SAVE_VERSION, state, idSeq, rng: _rngState >>> 0, ui });
}

// Pure inverse of serializeState: rebuild the globals from a snapshot string.
// Returns true on success, false if the blob is missing / corrupt / wrong-version
// (in which case the globals are left untouched and the caller starts fresh).
function deserializeState(raw) {
  if (!raw) return false;
  let data;
  try { data = JSON.parse(raw); } catch (e) { return false; }
  if (!data || data.v !== SAVE_VERSION || !data.state || !data.state.map) return false;
  state = data.state;
  idSeq = data.idSeq;
  _rngState = data.rng >>> 0;
  ui = data.ui || { sheet: null, selectedNode: state.map.starts[0] };
  ui.sheet = null; // resume on the map view rather than a half-painted sheet
  HOME = state.map.starts[0];
  AWAY = state.map.starts[1];
  NODE_NAMES = state.map.names;
  if (!state.humanAI)
    state.humanAI = { lastEval: 0, lastWave: 30, waveInterval: 90, enemyBase: null, enemyArmy: 0, scoutTime: null };
  return true;
}

// Write the current game to localStorage. Cheap; called on every paint. Wrapped
// so private-mode / quota errors can never break the game.
function persist() {
  if (typeof localStorage === "undefined") return;
  try { localStorage.setItem(SAVE_KEY, serializeState()); } catch (e) {}
}

// Boot-time restore. Resumes paused so a refresh never drops the player into a
// live fight, and re-shows the end screen if the saved game was already over.
// Returns true if a game was restored.
function restore() {
  if (typeof localStorage === "undefined") return false;
  let raw;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  if (!deserializeState(raw)) return false;
  closeSheet();
  document.getElementById("end").className = "";
  if (!SPEEDS[state.speed]) state.speed = DEFAULT_SPEED; // tolerate old/garbled saves
  if (state.over) { render(); endGame(state.over, state.overReason); }
  else { openMenu(); render(); } // resume paused with the menu up
  return true;
}

/* ------------------------------- Tests ------------------------------- */
// In-file test harness. Pure sim only (no DOM): resetState(seed) then drive tick().
// Run headless:  node -e "<extract script>; process.exit(runTests()?0:1)"
// Or in a browser: open startext.html?test to see the report instead of the game.
function runTests() {
  let pass = 0, fail = 0;
  const log = [];
  const ok = (cond, msg) => { cond ? pass++ : (fail++, log.push("FAIL: " + msg)); };
  const eq = (a, b, msg) => ok(a === b, `${msg} — got ${a}, expected ${b}`);
  const near = (a, b, eps, msg) => ok(Math.abs(a - b) <= eps, `${msg} — got ${a}, expected ~${b}`);
  // Run n ticks (capped so a broken end-condition can't loop forever).
  const run = n => { for (let i = 0; i < n && !state.over; i++) tick(); };
  const cc = o => state.buildings.find(b => b.owner === o && b.type === "cc");
  const rax = o => state.buildings.find(b => b.owner === o && b.type === "barracks" && !b.construct);
  const cheat = (o, m) => { state.minerals[o] = m; };

  const T = {
    "starting state is canon"() {
      resetState(1);
      eq(state.minerals.human, 50, "start minerals");
      eq(unitsOf(HUMAN, HOME, null, "scv").length, 4, "start SCVs");
      eq(supplyUsed(HUMAN), 4, "start supply used");
      eq(supplyCap(HUMAN), 10, "start supply cap");
      eq(state.field[HOME], FIELD_TOTAL, "home field");
    },
    "mining yields ~0.7/sec/SCV"() {
      resetState(1);
      unitsOf(HUMAN, HOME, "idle", "scv").forEach(u => u.task = "mining"); // 4 miners
      const before = state.minerals.human;
      tick();
      near(state.minerals.human - before, 4 * MINE_RATE, 0.01, "4 miners income/sec");
    },
    "SCV training costs, takes 12s, +1 supply"() {
      resetState(1);
      cheat(HUMAN, 50);
      queueSCV(HUMAN, HOME);
      eq(state.minerals.human, 0, "minerals spent on SCV");
      run(C.cc.trainTime);
      eq(unitsOf(HUMAN, HOME, null, "scv").length, 5, "SCV produced after 12s");
    },
    "CC rally=mining sends newborn SCVs to mine; rally=idle keeps them idle"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const cc1 = cc(HUMAN);
      eq(cc1.rally, "mining", "rally defaults to mining");
      queueSCV(HUMAN, HOME);
      run(C.cc.trainTime);
      ok(unitsOf(HUMAN, HOME, "mining", "scv").length >= 1, "newborn auto-mines on rally=mining");
      cc1.rally = "idle";
      const idleBefore = unitsOf(HUMAN, HOME, "idle", "scv").length;
      queueSCV(HUMAN, HOME);
      run(C.cc.trainTime);
      eq(unitsOf(HUMAN, HOME, "idle", "scv").length, idleBefore + 1, "newborn stays idle on rally=idle");
    },
    "CC rally=gas sends newborn SCVs to gas only with a refinery"() {
      resetState(1);
      cheat(HUMAN, 9999);

    "map: connected, sized 5–6, start bases full, expansions placed symmetrically"() {
      for (const seed of [1, 7, 42, 99, 256]) {
        resetState(seed);
        const m = state.map;
        ok(m.n >= MAP_MIN_NODES && m.n <= MAP_MAX_NODES, `node count in range (got ${m.n})`);
        ok(HOME !== AWAY, "two distinct start nodes");
        const reach = bfsDist(0, m.adj, m.n);
        ok(reach.every(d => d < Infinity), "graph is fully connected");
        // Start nodes carry full resources.
        eq(state.field[HOME], FIELD_TOTAL, "HOME minerals full");
        eq(state.field[AWAY], FIELD_TOTAL, "AWAY minerals full");
        eq(state.gasField[HOME], GAS_TOTAL, "HOME gas full");
        eq(state.gasField[AWAY], GAS_TOTAL, "AWAY gas full");
        // Each non-start node: minerals and gas are each either EXPANSION_FIELD/GAS or 0.
        for (let i = 0; i < m.n; i++) {
          if (i === HOME || i === AWAY) continue;
          ok(state.field[i] === 0 || state.field[i] === EXPANSION_FIELD,
            `field at node ${i} is 0 or EXPANSION_FIELD (seed ${seed})`);
          ok(state.gasField[i] === 0 || state.gasField[i] === EXPANSION_GAS,
            `gasField at node ${i} is 0 or EXPANSION_GAS (seed ${seed})`);
        }
      }
    },
    "expansion resources are symmetric — both sides have equal access"() {
      for (const seed of [1, 7, 42, 99, 256]) {
        resetState(seed);
        const m = state.map;
        for (let i = 0; i < m.n; i++) {
          if (i === HOME || i === AWAY) continue;
          const dh = m.dist[HOME][i], da = m.dist[AWAY][i];
          if (dh === da) continue; // equidistant nodes are inherently fair
          // Asymmetric node: minerals and gas must each match the symmetric mirror.
          const mirror = [...Array(m.n).keys()].find(
            j => j !== HOME && j !== AWAY && j !== i &&
                 m.dist[HOME][j] === da && m.dist[AWAY][j] === dh);
          if (mirror !== undefined) {
            ok(state.field[i] === state.field[mirror],
              `minerals symmetric at nodes ${i}↔${mirror} (seed ${seed})`);
            ok(state.gasField[i] === state.gasField[mirror],
              `gas symmetric at nodes ${i}↔${mirror} (seed ${seed})`);
          }
        }
      }
    },

    "fog: enemy buildings unknown until scouted, then remembered"() {
      resetState(1);
      eq(state.seen[AWAY], null, "AWAY unknown at start");
      // Pre-visit intermediate nodes so the scouts can reach AWAY (this test is about fog
      // memory, not exploration mechanics; exploration is tested separately).
      const fullPath = bfsPath(HOME, AWAY, state.map.adj, state.map.n);
      fullPath.slice(1, -1).forEach(nd => state.visited.human[nd] = true);
      sendUnits(HUMAN, HOME, 2, "scv", AWAY); // march straight to the enemy base
      // Multi-hop travel: each hop takes EDGE_TIME, plus DWELL_TIME at each intermediate node.
      const hops = hopDist(HOME, AWAY);
      run(hops * EDGE_TIME + Math.max(0, hops - 1) * DWELL_TIME + 2);
      ok(Array.isArray(state.seen[AWAY]) && state.seen[AWAY].length >= 1, "scouted: CC remembered");
      const snapLen = state.seen[AWAY].length;
      // remove our scouts; bot snapshot must freeze
      state.units = state.units.filter(u => !(u.owner === HUMAN && u.node === AWAY));
      state.buildings.push({ id: idSeq++, owner: BOT, node: AWAY, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      run(5);
      eq(state.seen[AWAY].length, snapLen, "snapshot frozen while unseen");
    },
