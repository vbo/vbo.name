      near(mineralYield(1,  FIELD_TOTAL), 0.7,  0.001, "1 miner = MINE_RATE");
      near(mineralYield(8,  FIELD_TOTAL), 5.6,  0.001, "8 miners = 8 × 0.7");
      near(mineralYield(16, FIELD_TOTAL), 11.2, 0.001, "16 miners = full sat, 16 × 0.7");
    },
    "mineralYield: diminishing returns above saturation at full field"() {
      const at16 = mineralYield(16, FIELD_TOTAL);
      const at24 = mineralYield(24, FIELD_TOTAL);
      ok(at24 > at16, "24 miners gives more than 16");
      ok(at24 < at16 * 1.5, "but less than 50% more (diminishing)");
      near(mineralYield(25, FIELD_TOTAL), mineralYield(24, FIELD_TOTAL), 0.001, "no return beyond 24 miners");
    },
    "mineralYield: optimal count shrinks as patches deplete"() {
      // 4 patches left (half-depleted field): optimal = 4 × 2 = 8 miners.
      const halfField = FIELD_TOTAL / 2;
      near(mineralYield(8, halfField), 5.6, 0.001, "8 miners = full efficiency on 4 patches");
      // 9 miners on 4 patches → one over the semi-sat threshold (4 patches × 3 = 12 cap).
      ok(mineralYield(9, halfField) > mineralYield(8, halfField), "9th miner still adds yield (semi-sat)");
      near(mineralYield(13, halfField), mineralYield(12, halfField), 0.001, "no return beyond 3/patch (12 for 4 patches)");
    },
    "refinery can be built and gas field is present"() {
      resetState(1);
      ok(state.gasField[HOME] === GAS_TOTAL, "gas field starts full");
      ok(state.gas.human === 0, "no gas collected yet");
    },
    "gas SCVs collect gas from a completed refinery"() {
      resetState(1);
      cheat(HUMAN, 500);
      startBuilding(HUMAN, HOME, "refinery");
      // Fast-forward past build time so refinery completes.
      run(C.refinery.build + 1);
      const ref = state.buildings.find(b => b.owner === HUMAN && b.type === "refinery" && !b.construct);
      ok(ref != null, "refinery completed");
      // Assign 3 SCVs to gas.
      const gasScvs = unitsOf(HUMAN, HOME, null, "scv").slice(0, 3);
      gasScvs.forEach(u => u.task = "gas");
      const gasBefore = state.gas.human;
      const fieldBefore = state.gasField[HOME];
      tick();
      ok(state.gas.human > gasBefore, "gas collected after assigning SCVs");
      ok(state.gasField[HOME] < fieldBefore, "gas field depleted");
    },
    "gas capped at GAS_OPT SCVs — extra SCVs add nothing"() {
      resetState(1);
      cheat(HUMAN, 500);
      startBuilding(HUMAN, HOME, "refinery");
      run(C.refinery.build + 1);
      // Collect with exactly GAS_OPT SCVs.
      const all = unitsOf(HUMAN, HOME, null, "scv");
      all.slice(0, GAS_OPT).forEach(u => u.task = "gas");
      tick(); const gasAt4 = state.gas.human;
      all.forEach(u => u.task = "idle");
      state.gas.human = 0;
      // Collect with GAS_OPT+2 SCVs (over-staff).
      all.slice(0, GAS_OPT + 2).forEach(u => u.task = "gas");
      tick(); const gasAtMore = state.gas.human;
      near(gasAt4, gasAtMore, 0.001, "extra SCVs beyond GAS_OPT add no gas");
    },
    "can't build a second refinery at the same node"() {
      resetState(1);
      cheat(HUMAN, 500);
      const r1 = startBuilding(HUMAN, HOME, "refinery");
      const r2 = startBuilding(HUMAN, HOME, "refinery");
      ok(r1 === true,  "first refinery starts");
      ok(r2 === false, "second refinery at same node rejected");
    },
    "cancelTransit: early cancel snaps unit back to origin"() {
      resetState(1);
      const dest = state.map.adj[HOME][0];
      sendUnits(HUMAN, HOME, 1, "scv", dest);
      const u = state.units.find(x => x.transit);
      eq(u.node, -1, "unit in transit");
      // progress starts at 0, well below EDGE_TIME/2 — should snap back
      cancelTransit(dest);
      eq(u.node, HOME, "snapped back to origin");
      eq(u.transit, null, "transit cleared");
      eq(u.task, "idle", "idle after cancel");
    },
    "cancelTransit: late cancel snaps unit forward and marks visited"() {
      resetState(1);
      const dest = state.map.adj[HOME][0];
      sendUnits(HUMAN, HOME, 1, "scv", dest);
      const u = state.units.find(x => x.transit);
      u.transit.progress = Math.ceil(EDGE_TIME / 2); // past midpoint
      cancelTransit(dest);
      eq(u.node, dest, "snapped forward to next node");
      ok(state.visited.human[dest], "forward node marked visited");
      eq(u.transit, null, "transit cleared");
    },
    "cancelTransit: dwelling unit stays at intermediate node"() {
      resetState(1);
      const path = bfsPath(HOME, AWAY, state.map.adj, state.map.n);
      if (path.length < 3) { ok(true, "trivial 1-hop map — skip"); return; }
      const mid = path[1];
      path.slice(1, -1).forEach(nd => state.visited.human[nd] = true);
      sendUnits(HUMAN, HOME, 1, "scv", AWAY);
      const u = state.units.find(x => x.transit);
      run(EDGE_TIME + 1); // arrives at first intermediate and starts dwelling
      ok(u.transit && u.transit.dwellStart !== null, "unit is dwelling");
      eq(u.node, mid, "at intermediate node");
      cancelTransit(AWAY);
      eq(u.node, mid, "stays at the intermediate node");
      eq(u.transit, null, "transit cleared");
    },
    "gas SCVs go idle when refinery is destroyed"() {
      resetState(1);
      cheat(HUMAN, 500);
      startBuilding(HUMAN, HOME, "refinery");
      run(C.refinery.build + 1);
      unitsOf(HUMAN, HOME, null, "scv").slice(0, 2).forEach(u => u.task = "gas");
      eq(unitsOf(HUMAN, HOME, "gas", "scv").length, 2, "2 gas SCVs assigned");
      // Destroy the refinery.
      const ref = state.buildings.find(b => b.owner === HUMAN && b.type === "refinery");
      ref.hp = 0;
      cleanupDead();
      eq(unitsOf(HUMAN, HOME, "gas", "scv").length, 0, "gas SCVs freed when refinery dies");
    },

    bot_sends_scv_to_expand() {
      resetState(7);
      // Give BOT plenty of minerals and SCVs so expansion condition is met.
      state.minerals[BOT] = C.cc.cost + 400;
      // Ensure bot has 12 SCVs at home.
      while (state.units.filter(u => u.owner === BOT && u.node === AWAY && u.type === "scv").length < 12) {
        newSCV(BOT, AWAY);
      }
      // Mark a non-home node with minerals as visited by bot (simulate scout).
      let expNode = -1;
      for (let n = 0; n < state.map.n; n++) {
        if (n !== HOME && n !== AWAY && state.field[n] > 0) { expNode = n; break; }
      }
      if (expNode === -1) { ok(true, "no expansion node on this seed — skip"); return; }
      state.visited[BOT][expNode] = true;
      // Bot not under attack.
      state.underAttack = Array(state.map.n).fill(false);
      botEval();
      const scvGoing = state.units.some(u =>
        u.owner === BOT && u.type === "scv" && u.transit && u.transit.to === expNode);
      ok(scvGoing, "bot sends SCV toward expansion node");
    },

    bot_builds_cc_at_expansion() {
      resetState(7);
      state.minerals[BOT] = C.cc.cost + 400;
      // SCV already at the expansion node.
      let expNode = -1;
      for (let n = 0; n < state.map.n; n++) {
        if (n !== HOME && n !== AWAY && state.field[n] > 0) { expNode = n; break; }
      }
      if (expNode === -1) { ok(true, "no expansion node on this seed — skip"); return; }
      state.visited[BOT][expNode] = true;
      newSCV(BOT, expNode);
      state.underAttack = Array(state.map.n).fill(false);
      botEval();
      const ccStarted = state.buildings.some(b => b.owner === BOT && b.node === expNode && b.type === "cc");
      ok(ccStarted, "bot starts CC at expansion when SCV is present");
    },

    "queueSCV uses least-busy CC when multiple exist"() {
      resetState(1);
      // Add a second CC at HOME with an empty queue.
      const cc2 = { id: idSeq++, owner: HUMAN, type: "cc", node: HOME,
        hp: C.cc.hp, maxHp: C.cc.hp, construct: null, train: null, queued: 0, rally: "mining" };
      state.buildings.push(cc2);
      // Fill the first CC's queue to max.
      const cc1 = state.buildings.find(b => b.type === "cc" && b.id !== cc2.id && b.owner === HUMAN);
      cc1.train = { progress: 0, total: C.cc.trainTime };
      for (let i = 0; i < C.cc.queueMax - 1; i++) cc1.queued++;
      cheat(HUMAN, 200);
      queueSCV(HUMAN, HOME);
      eq(cc2.train && cc2.train.progress >= 0, true, "queueSCV routes to the idle CC");
      eq(cc1.queued, C.cc.queueMax - 1, "busy CC queue unchanged");
    },

    "barracks rally auto-dispatches new marines"() {
      resetState(1);
      const dest = state.map.adj[HOME][0];
      state.visited.human[dest] = true;
      // Build a barracks at HOME and set its rally.
      cheat(HUMAN, 300);
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1);
      const rax = state.buildings.find(b => b.type === "barracks" && !b.construct && b.owner === HUMAN);
      ok(rax, "barracks completed");
      rax.rally = dest;
      // Queue and complete a marine.
      cheat(HUMAN, 100);
      queueMarine(HUMAN, HOME, rax.id);
      run(C.marine.build + 1);
      // The new marine should be in transit toward dest, not idle at HOME.
      const inTransit = state.units.some(u =>
        u.owner === HUMAN && u.type === "marine" && u.transit && u.transit.to === dest);
      ok(inTransit, "new marine auto-dispatched to rally node");
    },

    bot_mines_expansion_after_cc() {
      resetState(7);
      // Find a non-home resource node.
      let expNode = -1;
      for (let n = 0; n < state.map.n; n++) {
        if (n !== HOME && n !== AWAY && state.field[n] > 0) { expNode = n; break; }
      }
      if (expNode === -1) { ok(true, "no expansion node on this seed — skip"); return; }
      // Place a completed CC at the expansion.
      state.buildings.push({ id: idSeq++, owner: BOT, type: "cc", node: expNode,
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0, rally: "mining" });
      state.visited[BOT][expNode] = true;
      // Place an idle SCV at the expansion.
      newSCV(BOT, expNode);
      state.minerals[BOT] = 0;
      state.underAttack = Array(state.map.n).fill(false);
      botEval();
      const mining = unitsOf(BOT, expNode, "mining", "scv").length;
      ok(mining >= 1, "bot sets expansion SCV to mining when CC is complete");
    },

    "queue marine when supply-capped; trains automatically when depot finishes"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // Fill supply to cap.
      while (supplyUsed(HUMAN) < supplyCap(HUMAN)) {
        state.units.push({ id: idSeq++, owner: HUMAN, type: "marine", node: HOME,
          task: "idle", hp: 40, maxHp: 40, atkCd: 0, engaged: 0, buildingId: null, transit: null });
      }
      ok(supplyUsed(HUMAN) >= supplyCap(HUMAN), "supply is at cap");
      // Queuing a marine should still succeed (minerals deducted, queued not training yet).
      const before = state.minerals[HUMAN];
      const rax = state.buildings.find(b => b.type === "barracks" && !b.construct && b.owner === HUMAN);
      if (!rax) { ok(true, "no barracks on this seed — skip"); return; }
      queueMarine(HUMAN, HOME, rax.id);
      ok(state.minerals[HUMAN] < before, "minerals deducted despite supply cap");
      eq(rax.queued, 1, "marine is queued (not training) while supply-blocked");
      eq(rax.train, null, "no active training slot while supply-blocked");
      // Build a supply depot to clear the block.
      startBuilding(HUMAN, HOME, "depot");
      run(C.depot.build + 1);
      ok(rax.train !== null || rax.queued === 0, "training started after supply freed");
    },

    "new barracks inherits rally from sibling at same node"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const dest = state.map.adj[HOME][0];
      state.visited.human[dest] = true;
      // Build first barracks and set a rally.
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1);
      const rax1 = state.buildings.find(b => b.type === "barracks" && !b.construct && b.owner === HUMAN);
      ok(rax1, "first barracks done");
      rax1.rally = dest;
      // Build a second barracks.
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1);
      const rax2 = state.buildings.filter(b => b.type === "barracks" && !b.construct && b.owner === HUMAN)
        .find(b => b.id !== rax1.id);
      ok(rax2, "second barracks done");
      eq(rax2.rally, dest, "second barracks inherited rally from first");
    },

    "persistence: serialize/deserialize round-trips the whole game": () => {
      resetState(777);
      run(40);
      cheat(HUMAN, 1234);
      const before = { time: state.time, units: state.units.length,
                       min: state.minerals[HUMAN], idSeq };
      const blob = serializeState();
      // Clobber the globals with a different game, then restore from the blob.
      resetState(1);
      eq(state.time, 0, "reset wiped the game before restore");
      ok(deserializeState(blob), "deserialize accepts a valid blob");
      eq(state.time, before.time, "restored time matches");
      eq(state.units.length, before.units, "restored unit count matches");
      eq(state.minerals[HUMAN], before.min, "restored minerals match");
      eq(idSeq, before.idSeq, "restored idSeq matches");
    },

    "persistence: a restored game replays deterministically": () => {
      resetState(31);
      run(60);
      const snap = serializeState();
      run(25); const future = serializeState();
      ok(deserializeState(snap), "restored to the snapshot point");
      run(25); const future2 = serializeState();
      eq(future, future2, "same 25 ticks from a restored state produce identical results");
    },

    "persistence: deserialize rejects garbage and stale versions": () => {
      resetState(5);
      const guard = state.time;
      ok(!deserializeState("not json"), "rejects non-JSON");
      ok(!deserializeState(""), "rejects empty string");
      ok(!deserializeState(JSON.stringify({ v: 999, state, idSeq, rng: 0 })),
         "rejects a wrong save version");
      eq(state.time, guard, "globals untouched when a blob is rejected");
    },

    "sendUnits firebat: moves a firebat, not an SCV": () => {
      resetState(5);
      state.minerals[HUMAN] = 500; state.gas[HUMAN] = 200;
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1); // Academy needs a *finished* barracks
      startBuilding(HUMAN, HOME, "academy");
      run(C.academy.build + 1);
      queueFirebat(HUMAN, HOME);
      run(C.firebat.build + 1);
      const fb = state.units.find(u => u.owner === HUMAN && u.type === "firebat");
      ok(fb, "firebat trained");
      const scvsBefore = state.units.filter(u => u.owner === HUMAN && u.type === "scv" && u.task !== "moving").length;
      const dest = state.map.adj[HOME][0];
      state.visited[HUMAN][dest] = true;
      sendUnits(HUMAN, HOME, 1, "firebat", dest);
      const scvsAfter = state.units.filter(u => u.owner === HUMAN && u.type === "scv" && u.task !== "moving").length;
      eq(scvsAfter, scvsBefore, "no SCV was moved when sending a firebat");
      eq(fb.task, "moving", "the firebat is now moving");
    },

    "bunker: garrisoned units hidden from the forces panel": () => {
      resetState(5);
      state.minerals[HUMAN] = 999; state.gas[HUMAN] = 200;
      startBuilding(HUMAN, HOME, "barracks");
      run(C.barracks.build + 1);
      queueMarine(HUMAN, HOME);
      run(C.marine.build + 1);
      startBuilding(HUMAN, HOME, "bunker");
      run(C.bunker.build + 1);
      const bunk = state.buildings.find(b => b.owner === HUMAN && b.type === "bunker");
      ok(bunk && !bunk.construct, "bunker ready");
      loadBunker(HUMAN, HOME, bunk.id);
      const m = state.units.find(u => u.owner === HUMAN && u.type === "marine");
      ok(m && m.task === "bunker", "marine is loaded");
      // Marines shown in forces panel should exclude bunker occupants.
      const visibleMarines = unitsOf(HUMAN, HOME, null, "marine").filter(u => u.task !== "bunker");
      eq(visibleMarines.length, 0, "loaded marine not shown as idle in forces panel");
    },

    "bot expands to mineral nodes": function () {
      // Across 20 seeded games, on maps that have non-home mineral nodes, the bot
      // should establish a second CC in at least 70% of eligible cases.
      const TICKS = 6000;
      let eligible = 0, expanded = 0;
      for (let seed = 0; seed < 20; seed++) {
        resetState(seed);
        const botHome = AWAY;
        const hasExpNodes = Array.from({length: state.map.n}, (_, n) => n)
          .some(n => n !== HOME && n !== botHome && state.field[n] > 0);
        if (!hasExpNodes) continue;
        eligible++;
        let botExpanded = false;
        for (let t = 0; t < TICKS && !botExpanded; t++) {
          tick();
          botExpanded = state.buildings.some(b =>
            b.owner === BOT && b.type === "cc" && b.node !== botHome);
        }
        if (botExpanded) expanded++;
      }
      ok(eligible >= 5, `need ≥5 expansion-eligible seeds in first 20 (got ${eligible})`);
      ok(expanded >= Math.ceil(eligible * 0.7),
        `bot expanded in ${expanded}/${eligible} eligible seeds (need ≥70%)`);
    },
  };

  for (const name in T) {
    try { T[name](); }
    catch (e) { fail++; log.push("THREW: " + name + " — " + (e && e.message)); }
  }

  // Stress-test: run 30 seeded games to completion.
  // Checks that every game ends (win or loss), no crash, no stall, no negative resources.
  const MAX_TICKS = 20000;
  let stressPass = 0, stressFail = 0;
  for (let seed = 0; seed < 30; seed++) {
    try {
      resetState(seed);
      let ticks = 0;
      while (!state.over && ticks < MAX_TICKS) { tick(); ticks++; }
      if (!state.over) {
        fail++; stressFail++;
        log.push(`STRESS seed=${seed}: game did not end within ${MAX_TICKS} ticks`);
      } else if (state.minerals[HUMAN] < 0 || state.minerals[BOT] < 0) {
        fail++; stressFail++;
        log.push(`STRESS seed=${seed}: negative minerals (human=${state.minerals[HUMAN].toFixed(2)}, bot=${state.minerals[BOT].toFixed(2)})`);
      } else if (state.gas[HUMAN] < 0 || state.gas[BOT] < 0) {
        fail++; stressFail++;
        log.push(`STRESS seed=${seed}: negative gas`);
      } else {
        pass++; stressPass++;
      }
    } catch (e) {
      fail++; stressFail++;
      log.push(`STRESS seed=${seed} THREW: ${e && e.message}`);
    }
  }
  if (stressFail === 0 && typeof console !== "undefined")
    console.log(`  Stress: ${stressPass}/30 games completed cleanly`);
  const summary = `StarText tests: ${pass} passed, ${fail} failed`;
  if (typeof console !== "undefined") { console.log(summary); log.forEach(l => console.log("  " + l)); }
  return { pass, fail, log, summary };
}

/* ------------------------------- Boot -------------------------------- */
const HEADLESS = typeof document === "undefined";
if (HEADLESS) {
  // Node entry: run tests and exit non-zero on failure.
  const r = runTests();
  if (typeof module !== "undefined") module.exports = { runTests };
  if (typeof process !== "undefined") process.exit(r.fail ? 1 : 0);
} else if (location.search.indexOf("test") !== -1) {
  // Browser ?test mode: show the report instead of booting the game.
  const r = runTests();
  document.body.innerHTML =
    `<pre style="padding:16px;font-size:14px;color:${r.fail ? "#f87171" : "#4ade80"}">` +
    `${r.summary}\n\n${r.log.join("\n") || "All green."}</pre>`;
} else {
  $("sheet-backdrop").onclick = closeSheet;
  $("end-again").onclick = init;
  $("end-copy").onclick = () => {
    const btn = $("end-copy");
    const text = formatReplayLog();
    // Always show a textarea so the user can see and copy manually.
    let ta = $("end-log");
    if (!ta) {
      ta = document.createElement("textarea");
      ta.id = "end-log";
      ta.readOnly = true;
      ta.style.cssText = "display:block;width:100%;height:160px;font-size:11px;" +
        "font-family:monospace;resize:vertical;margin-top:8px;box-sizing:border-box";
      btn.insertAdjacentElement("afterend", ta);
    }
    ta.value = text;
    ta.style.display = "block";
    ta.focus();
    ta.select();
    const onCopied = () => {
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = "Copy replay log"; }, 1500);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(onCopied).catch(() => fallbackCopy(text, onCopied));
    } else {
      fallbackCopy(text, onCopied);
    }
  };
  $("menu-btn").onclick = openMenu;
  $("menu-resume").onclick = closeMenu;
  $("menu-surrender").onclick = surrender;
  // Tap the dimmed area outside the card to resume.
  $("menu").onclick = e => { if (e.target.id === "menu") closeMenu(); };
  document.querySelectorAll("#menu .speed-seg button").forEach(b =>
    b.onclick = () => setSpeed(b.dataset.speed));
  if (!restore()) init(); // resume a saved game across refresh, else start fresh
  startLoop();
}
</script>
</body>
</html>
