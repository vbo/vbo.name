      for (let i = 0; i < 5; i++) { const a = newMarine(HUMAN, AWAY); a.task = "idle"; } // 5 attackers
      botEval();
      // need = min(5-1, 10-6) = 4 pulled; a 6-miner core stays on the minerals.
      eq(unitsOf(BOT, AWAY, "mining", "scv").length, 6, "keeps a 6-miner income core");
      eq(unitsOf(BOT, AWAY, "idle", "scv").length, 4, "pulls exactly the 4-SCV shortfall");
    },
    "pause flag freezes simulation in the loop"() {
      resetState(1);
      state.paused = true;
      const t0 = state.time;
      // emulate the loop's guard
      if (!state.paused) tick();
      eq(state.time, t0, "no tick while paused");
    },

    // ── Gas + utilisation ───────────────────────────────────────────────
    "mineralYield: linear below saturation (< 16 miners) at full field"() {
      near(mineralYield(1,  FIELD_TOTAL), 0.7,  0.001, "1 miner = MINE_RATE");
      near(mineralYield(8,  FIELD_TOTAL), 5.6,  0.001, "8 miners = 8 × 0.7");
      near(mineralYield(16, FIELD_TOTAL), 11.2, 0.001, "16 miners = full sat, 16 × 0.7");
    },
    "mineralYield: diminishing returns above saturation at full field"() {
      const at16 = mineralYield(16, FIELD_TOTAL);
      const at24 = mineralYield(24, FIELD_TOTAL);
      ok(at24 > at16, "24 miners gives more than 16");
      ok(at24 < at16 * 1.5, "but less than 50% more (diminishing)");
      near(mineralYield(25, FIELD_TOTAL), mineralYield(24, FIELD_TOTAL), 0.001, "no return beyond 24 miners");
    },
    "mineralYield: optimal count shrinks as patches deplete"() {
      // 4 patches left (half-depleted field): optimal = 4 × 2 = 8 miners.
      const halfField = FIELD_TOTAL / 2;
      near(mineralYield(8, halfField), 5.6, 0.001, "8 miners = full efficiency on 4 patches");
      // 9 miners on 4 patches → one over the semi-sat threshold (4 patches × 3 = 12 cap).
      ok(mineralYield(9, halfField) > mineralYield(8, halfField), "9th miner still adds yield (semi-sat)");
      near(mineralYield(13, halfField), mineralYield(12, halfField), 0.001, "no return beyond 3/patch (12 for 4 patches)");
    },
    "refinery can be built and gas field is present"() {
      resetState(1);
      ok(state.gasField[HOME] === GAS_TOTAL, "gas field starts full");
      ok(state.gas.human === 0, "no gas collected yet");
    },
    "gas SCVs collect gas from a completed refinery"() {
      resetState(1);
      cheat(HUMAN, 500);
      startBuilding(HUMAN, HOME, "refinery");
      // Fast-forward past build time so refinery completes.
      run(C.refinery.build + 1);
      const ref = state.buildings.find(b => b.owner === HUMAN && b.type === "refinery" && !b.construct);
      ok(ref != null, "refinery completed");
      // Assign 3 SCVs to gas.
      const gasScvs = unitsOf(HUMAN, HOME, null, "scv").slice(0, 3);
      gasScvs.forEach(u => u.task = "gas");
      const gasBefore = state.gas.human;
      const fieldBefore = state.gasField[HOME];
      tick();
      ok(state.gas.human > gasBefore, "gas collected after assigning SCVs");
      ok(state.gasField[HOME] < fieldBefore, "gas field depleted");
    },
    "gas capped at GAS_OPT SCVs — extra SCVs add nothing"() {
      resetState(1);
      cheat(HUMAN, 500);
      startBuilding(HUMAN, HOME, "refinery");
      run(C.refinery.build + 1);
      // Collect with exactly GAS_OPT SCVs.
      const all = unitsOf(HUMAN, HOME, null, "scv");
      all.slice(0, GAS_OPT).forEach(u => u.task = "gas");
      tick(); const gasAt4 = state.gas.human;
      all.forEach(u => u.task = "idle");
      state.gas.human = 0;
      // Collect with GAS_OPT+2 SCVs (over-staff).
      all.slice(0, GAS_OPT + 2).forEach(u => u.task = "gas");
      tick(); const gasAtMore = state.gas.human;
      near(gasAt4, gasAtMore, 0.001, "extra SCVs beyond GAS_OPT add no gas");
    },
    "can't build a second refinery at the same node"() {
      resetState(1);
      cheat(HUMAN, 500);
      const r1 = startBuilding(HUMAN, HOME, "refinery");
      const r2 = startBuilding(HUMAN, HOME, "refinery");
      ok(r1 === true,  "first refinery starts");
      ok(r2 === false, "second refinery at same node rejected");
    },
    "gas SCVs go idle when refinery is destroyed"() {
      resetState(1);
      cheat(HUMAN, 500);
      startBuilding(HUMAN, HOME, "refinery");
      run(C.refinery.build + 1);
      unitsOf(HUMAN, HOME, null, "scv").slice(0, 2).forEach(u => u.task = "gas");
      eq(unitsOf(HUMAN, HOME, "gas", "scv").length, 2, "2 gas SCVs assigned");
      // Destroy the refinery.
      const ref = state.buildings.find(b => b.owner === HUMAN && b.type === "refinery");
      ref.hp = 0;
      cleanupDead();
      eq(unitsOf(HUMAN, HOME, "gas", "scv").length, 0, "gas SCVs freed when refinery dies");
    },
  };

  for (const name in T) {
    try { T[name](); }
    catch (e) { fail++; log.push("THREW: " + name + " — " + (e && e.message)); }
  }
  const summary = `StarText tests: ${pass} passed, ${fail} failed`;
  if (typeof console !== "undefined") { console.log(summary); log.forEach(l => console.log("  " + l)); }
  return { pass, fail, log, summary };
}

/* ------------------------------- Boot -------------------------------- */
const HEADLESS = typeof document === "undefined";
if (HEADLESS) {
  // Node entry: run tests and exit non-zero on failure.
  const r = runTests();
  if (typeof module !== "undefined") module.exports = { runTests };
  if (typeof process !== "undefined") process.exit(r.fail ? 1 : 0);
} else if (location.search.indexOf("test") !== -1) {
  // Browser ?test mode: show the report instead of booting the game.
  const r = runTests();
  document.body.innerHTML =
    `<pre style="padding:16px;font-size:14px;color:${r.fail ? "#f87171" : "#4ade80"}">` +
    `${r.summary}\n\n${r.log.join("\n") || "All green."}</pre>`;
} else {
  $("sheet-backdrop").onclick = closeSheet;
  $("end-again").onclick = init;
  $("pause-btn").onclick = togglePause;
  init();
  startLoop();
}
</script>
</body>
</html>
