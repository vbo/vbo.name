<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StarText — Mini RTS</title>
<style>
  :root {
    --bg: #0c1018;
    --panel: #161c28;
    --panel2: #1d2533;
    --line: #2a3445;
    --txt: #d7e0ec;
    --dim: #8090a4;
    --accent: #4ea1ff;
    --mineral: #41d6ff;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --enemy: #ff7a7a;
  --gas: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.35;
    overscroll-behavior: none;
  }
  #app { max-width: 1000px; margin: 0 auto; padding: 8px 8px 96px; }

  /* Top status bar */
  #statusbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .stat { display: flex; flex-direction: column; min-width: 70px; }
  .stat b { font-size: 18px; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .stat.minerals b { color: var(--mineral); }
  .stat.gas b { color: var(--gas); }
  .stat.supply.blocked b { color: var(--warn); }

  h1 { font-size: 15px; margin: 0; letter-spacing: .04em; }

  /* Board: map graph on top, focused-node detail below */
  #board { display: flex; flex-direction: column; gap: 10px; }
  @media (min-width: 640px) {
    #board { flex-direction: row; align-items: flex-start; }
    #board .map { flex: 0 0 260px; max-width: 260px; }
    #board .map svg { max-height: none; }
    #board > .node { flex: 1; min-width: 0; }
  }

  /* Map graph */
  .map { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .map svg { width: 100%; height: auto; display: block; max-height: 320px; }
  .map .edge { stroke: #3a465c; stroke-width: 1.1; }
  .map-legend { font-size: 10px; color: var(--dim); text-align: center; margin-top: 4px; }
  .gnode { cursor: pointer; }
  .gnode .ncircle { fill: var(--panel2); stroke: var(--line); stroke-width: 1.4; transition: stroke .1s; }
  .gnode .glyph { fill: var(--txt); font-size: 6px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .gnode .ncount { fill: var(--accent); font-size: 4.2px; font-weight: 700; text-anchor: middle; pointer-events: none; }
  .gnode.home .ncircle  { fill: #1d3350; stroke: var(--accent); }
  .gnode.foe .ncircle   { fill: #4a1f28; stroke: var(--enemy); }
  .gnode.owned .ncircle { fill: #21304a; stroke: #3a5170; }
  .gnode.unknown .ncircle { fill: #141a26; stroke: var(--dim); stroke-dasharray: 2.2 2; }
  .gnode.unknown .glyph { fill: var(--dim); }
  .gnode.threat .ncircle { stroke: var(--bad); stroke-width: 2.4; }
  .gnode.selected .ncircle { stroke: var(--warn); stroke-width: 2.8; }
  .gnode:active .ncircle { fill: #2b3a55; }

  .node {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
  }
  .node.home { border-color: #2f4a6b; }
  .node.away { border-color: #5a2f3a; }
  .node.neutral { border-color: var(--line); opacity: .96; }
  .node-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .node-head h1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .node-head .field { font-size: 12px; color: var(--mineral); white-space: nowrap; }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 6px; border-radius: 6px; }
  .badge.you { background: #1d3350; color: #9ec1ff; }
  .badge.foe { background: #4a1f28; color: #ffb4b4; }
  .paths { font-size: 11px; color: var(--dim); margin-bottom: 8px; }

  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 10px 0 4px;
  }
  .force-mine .section-label { color: var(--accent); }
  .force-enemy .section-label { color: var(--enemy); }

  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; margin-bottom: 6px;
    min-height: 48px; width: 100%; text-align: left;
    color: var(--txt); font: inherit; cursor: pointer;
  }
  .row.static { cursor: default; }
  .row.seen { opacity: .6; border-style: dashed; }
  .row .icon { width: 26px; height: 26px; flex: 0 0 26px; }
  .row .body { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 14px; }
  .row .meta { font-size: 12px; color: var(--dim); }
  .row .chev { color: var(--dim); font-size: 18px; }
  button.row:active { background: #243049; }

  .bar { height: 6px; background: #0a0f17; border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .bar.hp > i { background: var(--good); }
  .bar.hp.mid > i { background: var(--warn); }
  .bar.hp.low > i { background: var(--bad); }
  .bar.prog > i { background: var(--accent); }

  .unknown {
    color: var(--dim); font-style: italic; font-size: 13px;
    padding: 12px; text-align: center;
    background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px;
  }

  /* Transit */
  #transit { margin-top: 10px; }
  .transit-row {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; margin-bottom: 6px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .transit-info { flex: 1; }
  .transit-row .name { font-size: 14px; font-weight: 600; }
  .transit-row .meta { font-size: 12px; color: var(--dim); }
  .transit-cancel {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--dim); font-size: 13px; padding: 3px 8px; cursor: pointer; flex-shrink: 0;
  }
  .transit-cancel:hover { color: var(--bad); border-color: var(--bad); }

  /* Notifications */
  #notes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #notes:empty { display: none; }
  .note {
    padding: 11px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .note.loss { background: #3a1d24; border: 1px solid var(--bad); color: #ffd7d7; }
  .note.ok   { background: #0d2b1a; border: 1px solid var(--good); color: #c8ffd0; }
  .note.link { cursor: pointer; }
  .note.link:active { filter: brightness(1.15); }
  .note.alert {
    background: #5a1414; border: 1px solid #ff5a5a; color: #fff;
    font-size: 17px; letter-spacing: .03em;
    animation: alertpulse .7s ease-in-out infinite alternate;
  }
  @keyframes alertpulse {
    from { box-shadow: 0 0 0 0 rgba(255,70,70,.65); }
    to   { box-shadow: 0 0 0 9px rgba(255,70,70,0); }
  }

  /* Action sheet */
  #sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; z-index: 20;
  }
  #sheet-backdrop.open { display: block; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .18s ease-out;
    max-width: 1000px; margin: 0 auto;
  }
  #sheet.open { transform: translateY(0); }
  #sheet h2 { font-size: 16px; margin: 0 0 2px; }
  #sheet .sheet-sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }

  .stepper { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
  .stepper button {
    width: 48px; height: 48px; border-radius: 12px; font-size: 24px;
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
  }
  .stepper button:active { background: #243049; }
  .stepper .count { font-size: 22px; font-weight: 700; min-width: 40px; text-align: center; }
  .stepper .label { color: var(--dim); font-size: 12px; }
  input[type=range] { width: 100%; height: 40px; }

  .act {
    display: block; width: 100%; min-height: 50px; margin-top: 8px;
    border-radius: 12px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #06101f; border: none;
  }
  .act.secondary { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); }
  .act:disabled { opacity: .4; }
  .act:active:not(:disabled) { filter: brightness(.9); }
  .act .cost { font-weight: 400; font-size: 12px; opacity: .8; }
  .act-close { background: transparent; color: var(--dim); border: none; font-size: 14px; margin-top: 12px; width: 100%; padding: 10px; }

  .mode-toggle { display: flex; gap: 6px; margin: 10px 0 4px; }
  .mode-toggle button {
    flex: 1; min-height: 42px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
  }
  .mode-toggle button.sel { background: var(--accent); color: #06101f; border-color: transparent; }

  /* End screen */
  #end {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(6,9,15,.94); text-align: center; padding: 24px;
  }
  #end.open { display: flex; }
  #end .big { font-size: 40px; font-weight: 800; margin-bottom: 6px; }
  #end.win .big { color: var(--good); }
  #end.loss .big { color: var(--bad); }
  #end p { color: var(--dim); margin: 4px 0 24px; }
  #end button {
    min-height: 54px; padding: 0 28px; border-radius: 14px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #06101f; border: none;
  }
  .hint { color: var(--dim); font-size: 11px; text-align: center; margin-top: 14px; }

  .pause {
    align-self: center; min-height: 44px; padding: 0 16px; border-radius: 10px;
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  .pause:active { background: #243049; }
  body.paused #board { opacity: .6; }
</style>
</head>
<body>
<div id="app">
  <div id="statusbar">
    <div class="stat minerals"><b id="s-min">50</b><span>Minerals</span></div>
    <div class="stat gas"><b id="s-gas">0</b><span>Gas</span></div>
    <div class="stat supply" id="s-supwrap"><b id="s-sup">4 / 10</b><span>Supply</span></div>
    <div class="stat"><b id="s-time">0:00</b><span>Time</span></div>
    <div style="flex:1"></div>
    <button id="pause-btn" class="pause">⏸ Pause</button>
  </div>

  <div id="notes"></div>
  <div id="board"></div>
  <div id="transit"></div>
  <div class="hint">Tap Command Center, Barracks, SCVs, or Marines to give orders.</div>
</div>

<div id="sheet-backdrop"></div>
<div id="sheet"></div>

<div id="end">
  <div class="big" id="end-big">Victory</div>
  <p id="end-msg"></p>
  <button id="end-again">Play again</button>
</div>

<script>
"use strict";

// ── StarText — single-file mini-RTS ──────────────────────────────────────────
// The simulation (resetState + tick and everything it calls) is DOM-free and
// deterministic under a seed, so it runs headless in Node for fast tests.
//
//   Run tests:  sed -n '/<script>/,/<\/script>/p' startext.html | sed '1d;$d' \
//                 | node -   →  prints "N passed, M failed", exits non-zero on fail
//   In browser: open startext.html?test to see the same report instead of the game.
//
// Map: a random connected graph of 5–6 nodes (genMap). Only the two farthest-apart
// nodes (the players' bases) hold resources. Movement is exploration-gated — you can
// only send units to a node adjacent to one you've already visited (canSendTo) — and
// travel is hop-by-hop: EDGE_TIME per segment + DWELL_TIME pause at each intermediate
// node (where units can scout and fight before moving on). Two modes: "move" (leave
// after DWELL_TIME regardless) and "attack" (stay until the node is clear).
//
// See runTests() near the bottom. Add an assert there whenever you add behaviour.
// ─────────────────────────────────────────────────────────────────────────────

// Seedable RNG (mulberry32) so the sim is deterministic under test. Tests call
// seedRng(n) for reproducible runs; the live game seeds from Date.now().
let _rngState = 0;
function seedRng(n) { _rngState = n >>> 0; }
function rng() {
  _rngState = (_rngState + 0x6D2B79F5) | 0;
  let t = _rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ----------------------------- Constants ----------------------------- */
const TICK_MS = 1000;       // simulation runs at 1 tick / second
const EDGE_TIME = 14;       // seconds to traverse one map edge (multi-hop trips cost more)
const MAP_MIN_NODES = 5, MAP_MAX_NODES = 6; // random map size range
const MINE_RATE = 0.7;      // minerals per mining SCV per second (below saturation)
const FIELD_TOTAL = 12000;  // 8 patches × 1500 — standard BW main base
const MINERAL_PATCHES = 8;  // patches per base; 2 SCVs/patch = full efficiency (16 total)
const PATCH_SIZE = FIELD_TOTAL / MINERAL_PATCHES; // 1500 minerals per patch
const SUPPLY_MAX = 200;     // BW hard cap

// Vespene gas: 1 geyser per base, optimal at GAS_OPT SCVs (100% utilisation).
// Beyond that the extra SCVs add nothing (hard cap, like BW 3-worker optimum).
const GAS_TOTAL  = 5000;    // gas units per geyser (main base)
const GAS_RATE   = 0.55;    // gas per collecting SCV per second at full efficiency
const GAS_OPT    = 4;       // SCVs for 100% gas utilisation (capped — extras waste time)

// Expansion nodes: symmetric mineral/gas fields placed at non-start nodes that have
// a matching mirror node equidistant from the other player (so neither side is favoured).
const EXPANSION_FIELD = 5000;  // minerals at each expansion
const EXPANSION_GAS   = 5000;  // gas at each expansion

// Combat windup: when two forces first meet at a node they spend ENGAGE_DELAY
// seconds closing the distance before any blows land. This represents the armies
// marching toward each other, gives you a few seconds to react to an "under attack"
// alert, and — crucially — lets a lone scout record what it sees (fogStep runs every
// tick) before it gets cut down.
const ENGAGE_DELAY = 5;
const DWELL_TIME  = 10; // seconds spent at each intermediate node in "move" mode (explore + fight window)

// `range` adds asymmetry on top of that windup: a unit waits an *extra*
// max(0, enemyRange - ownRange) ticks, so a ranged unit (marine) lands free hits
// while a melee unit (SCV, range 0) is still closing. Buildings have no range → 0.
const C = {
  scv:      { hp: 60,  dmg: 5, atk: 1.5, cost: 50, build: 12, range: 0 }, // melee
  // Marine: BW stats — 40 HP, 6 dmg, 15-frame cooldown (~0.9 s at our tick rate)
  marine:   { hp: 40,  dmg: 6, atk: 0.9, cost: 50, build: 24, queueMax: 5, range: 3 }, // ranged
  cc:       { hp: 1500, supply: 10, trainCost: 50, trainTime: 12, queueMax: 5, cost: 400, build: 60 },
  depot:    { hp: 400,  cost: 100, build: 25, supply: 8 },
  barracks: { hp: 1000, cost: 150, build: 46 },
  refinery: { hp: 500,  cost: 75,  build: 20 }, // builds on the geyser; no train queue
};

// HOME/AWAY are the human's and bot's start-node ids on the generated map.
// They (and NODE_NAMES) are filled in by resetState once the map exists.
let HOME = 0, AWAY = 1;
let NODE_NAMES = [];
const HUMAN = "human", BOT = "bot";

/* ------------------------------- Map --------------------------------- */
// The map is a small connected graph (5–6 nodes). Only the two start nodes
// (farthest-apart pair) carry resources. Movement is gated by exploration:
// you may send units to any node adjacent to a node you've already visited.

// BFS hop-distances from `src` to every node.
function bfsDist(src, adj, n) {
  const dist = new Array(n).fill(Infinity);
  dist[src] = 0;
  const q = [src];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    for (const v of adj[u]) if (dist[v] === Infinity) { dist[v] = dist[u] + 1; q.push(v); }
  }
  return dist;
}

// BFS shortest path (list of node ids) from a to b.
function bfsPath(a, b, adj, n) {
  const prev = new Array(n).fill(-1);
  const seen = new Array(n).fill(false);
  seen[a] = true;
  const q = [a];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    if (u === b) break;
    for (const v of adj[u]) if (!seen[v]) { seen[v] = true; prev[v] = u; q.push(v); }
  }
  const path = [];
  for (let cur = b; cur !== -1; cur = prev[cur]) { path.unshift(cur); if (cur === a) break; }
  return path[0] === a ? path : [a]; // unreachable → just the origin (can't happen: graph is connected)
}

// BFS shortest path that only traverses nodes the owner has already visited.
// The destination itself may be unvisited (frontier). Returns [] if unreachable.
function bfsPathVisited(owner, src, dst, adj, n) {
  const vis = state.visited[owner];
  const prev = new Array(n).fill(-1);
  const seen = new Array(n).fill(false);
  seen[src] = true;
  const q = [src];
  for (let h = 0; h < q.length; h++) {
    const u = q[h];
    if (u === dst) break;
    for (const v of adj[u]) {
      if (seen[v]) continue;
      if (!vis[v] && v !== dst) continue; // only traverse explored territory
      seen[v] = true;
      prev[v] = u;
      q.push(v);
    }
  }
  if (!seen[dst]) return [];
  const path = [];
  for (let cur = dst; cur !== -1; cur = prev[cur]) { path.unshift(cur); if (cur === src) break; }
  return path[0] === src ? path : [];
}

// Build a random connected map: spanning tree (guarantees no islands) + a few
// extra edges for loops. Deterministic under the active rng seed.
function genMap() {
  const n = MAP_MIN_NODES + ((rng() * (MAP_MAX_NODES - MAP_MIN_NODES + 1)) | 0);
  const adj = Array.from({ length: n }, () => new Set());
  const link = (a, b) => { adj[a].add(b); adj[b].add(a); };
  for (let i = 1; i < n; i++) link(i, (rng() * i) | 0); // tree: each node joins an earlier one
  const extra = 1 + ((rng() * 2) | 0);                   // 1–2 extra edges
  for (let k = 0; k < extra; k++) {
    const a = (rng() * n) | 0, b = (rng() * n) | 0;
    if (a !== b && !adj[a].has(b)) link(a, b);
  }
  const adjArr = adj.map(s => [...s].sort((x, y) => x - y));
  const dist = adjArr.map((_, i) => bfsDist(i, adjArr, n));
  // Start nodes = the farthest-apart pair (graph diameter endpoints).
  let starts = [0, 1], best = -1;
  for (let i = 0; i < n; i++)
    for (let j = i + 1; j < n; j++)
      if (dist[i][j] > best) { best = dist[i][j]; starts = [i, j]; }
  const names = Array.from({ length: n }, (_, i) => "Sector " + String.fromCharCode(65 + i));
  const pos = layoutNodes(n, adjArr, dist, starts);
  return { n, adj: adjArr, dist, starts, names, pos };
}

// Stable, readable graph layout: columns by hop-distance from the human base
// (your base on the left, the enemy base on the right), nodes in each column
// spread vertically. Positions are normalised to [0,1] and fixed at map-gen time
// so revealed nodes never jump around. Returns [{x,y}, …] per node id.
function layoutNodes(n, adj, dist, starts) {
  const d = dist[starts[0]];
  const maxD = Math.max(1, ...d.filter(x => x < Infinity));
  const layers = {};
  for (let i = 0; i < n; i++) (layers[d[i]] = layers[d[i]] || []).push(i);
  const pos = new Array(n);
  for (const dl in layers) {
    const group = layers[dl].sort((a, b) => a - b);
    const x = (+dl) / maxD;
    group.forEach((node, k) => {
      const y = group.length === 1 ? 0.5 : k / (group.length - 1);
      pos[node] = { x, y };
    });
  }
  return pos;
}

// Nodes an owner may currently send units to: every visited node and each of
// their neighbours (the explored frontier). Reinforcing held nodes is allowed.
function reachableSet(owner) {
  const vis = state.visited[owner], out = new Set();
  for (let i = 0; i < state.map.n; i++) if (vis[i]) {
    out.add(i);
    for (const j of state.map.adj[i]) out.add(j);
  }
  return out;
}
const canSendTo = (owner, dest) => reachableSet(owner).has(dest);
const hopDist = (a, b) => state.map.dist[a][b];

/* ----------------------------- Game state ---------------------------- */
let state, ui, timer, idSeq;

// Pure: build a fresh game state with no DOM/timer side effects. Tests call this
// directly (optionally seeded) and then drive tick() in a loop.
function resetState(seed) {
  seedRng(seed === undefined ? (typeof Date !== "undefined" ? Date.now() : 1) : seed);
  idSeq = 1;
  const map = genMap();
  HOME = map.starts[0];
  AWAY = map.starts[1];
  NODE_NAMES = map.names;
  const n = map.n;
  // Resources live only at the two start nodes.
  const field = new Array(n).fill(0), gasField = new Array(n).fill(0);
  field[HOME] = field[AWAY] = FIELD_TOTAL;
  gasField[HOME] = gasField[AWAY] = GAS_TOTAL;
  // Expansion resources: ~25% chance per slot, fairness enforced.
  // Symmetric pairs (one node close to HOME, its mirror close to AWAY) are rolled
  // together — both get resources or neither does. Equidistant mid nodes roll solo.
  // Asymmetric unpaired nodes are never given resources (would favour one side).
  // Minerals and gas are rolled independently (~25% each), so a node can have
  // minerals only, gas only, both, or neither. Symmetric pairs share the same
  // roll so both sides always receive identical resources.
  const expUsed = new Set();
  for (let i = 0; i < n; i++) {
    if (i === HOME || i === AWAY || expUsed.has(i)) continue;
    const dh = map.dist[HOME][i], da = map.dist[AWAY][i];
    if (dh === da) {
      if (rng() < 0.25) { field[i] = EXPANSION_FIELD; }
      if (rng() < 0.25) { gasField[i] = EXPANSION_GAS; }
      expUsed.add(i);
    } else {
      const mirror = [...Array(n).keys()].find(
        j => j !== HOME && j !== AWAY && !expUsed.has(j) && j !== i &&
             map.dist[HOME][j] === da && map.dist[AWAY][j] === dh);
      if (mirror !== undefined) {
        if (rng() < 0.25) { field[i] = EXPANSION_FIELD; field[mirror] = EXPANSION_FIELD; }
        if (rng() < 0.25) { gasField[i] = EXPANSION_GAS; gasField[mirror] = EXPANSION_GAS; }
        expUsed.add(i); expUsed.add(mirror);
      }
    }
  }
  // Explored set per owner: each starts knowing only its own base.
  const visited = { human: new Array(n).fill(false), bot: new Array(n).fill(false) };
  visited.human[HOME] = true;
  visited.bot[AWAY]   = true;
  state = {
    time: 0,
    over: null,                 // null | "win" | "loss"
    paused: false,
    map,
    field, gasField,
    visited,
    labels: new Array(n).fill(null),  // display names, assigned in the order you discover nodes
    minerals: { human: 50, bot: 50 },
    gas:      { human: 0,  bot: 0  },    // gas collected (future: spent on advanced units)
    units: [],
    buildings: [],
    notes: [],                  // transient on-screen notifications
    underAttack: new Array(n).fill(false), // per-node edge-trigger for the "under attack" alert
    seen: new Array(n).fill(null),      // per-node last-seen enemy buildings (null = never scouted)
    seenUnits: new Array(n).fill(null), // per-node last-seen enemy units (fades after a few s)
    bot: {
      lastEval: 0, lastWave: 30, waveInterval: 90, // adaptive; starts at 90s between waves
      enemyBase: null, // null until a bot unit visits a node with enemy buildings
      enemyArmy: 0,    // player army size last scouted at enemyBase
      scoutTime: null, // tick of that last sighting; null = never scouted
    },
  };
  // Each side: 1 Command Center + 4 idle SCVs at its home node.
  spawnBase(HUMAN, HOME);
  spawnBase(BOT, AWAY);
  ui = { sheet: null, selectedNode: HOME };  // sheet: { kind, node, ref, n }; selectedNode = map focus
}

function init() {
  resetState();
  closeSheet();
  document.getElementById("end").className = "";
  setPaused(false);
  render();
}

function spawnBase(owner, node) {
  state.buildings.push({
    id: idSeq++, owner, node, type: "cc",
    hp: C.cc.hp, maxHp: C.cc.hp, construct: null, train: null, queued: 0,
    rally: "mining", // newborn SCVs auto-mine by default; toggle to "idle" in the CC sheet
  });
  for (let i = 0; i < 4; i++) newSCV(owner, node);
}

function newSCV(owner, node) {
  const u = { id: idSeq++, type: "scv", owner, node, task: "idle",
    hp: C.scv.hp, maxHp: C.scv.hp, atkCd: 0, engaged: 0, buildingId: null, transit: null };
  state.units.push(u); return u;
}

function newMarine(owner, node) {
  const u = { id: idSeq++, type: "marine", owner, node, task: "idle",
    hp: C.marine.hp, maxHp: C.marine.hp, atkCd: 0, engaged: 0, buildingId: null, transit: null };
  state.units.push(u); return u;
}

/* ----------------------------- Queries ------------------------------- */
const unitsOf = (owner, node, task, type) => state.units.filter(u =>
  u.owner === owner && u.node === node &&
  (task ? u.task === task : true) && (type ? u.type === type : true));
const buildingsOf = (owner, node) => state.buildings.filter(b =>
  b.owner === owner && (node === undefined || b.node === node));
const enemy = o => (o === HUMAN ? BOT : HUMAN);

// SCVs at a node that can be re-tasked or sent (not building, not moving).
const controllable = (owner, node) => state.units.filter(u =>
  u.owner === owner && u.node === node && u.type === "scv" &&
  (u.task === "idle" || u.task === "mining"));
// Idle marines at a node ready to be sent.
const idleMarines = (owner, node) => state.units.filter(u =>
  u.owner === owner && u.node === node && u.type === "marine" && u.task === "idle");

function supplyCap(owner) {
  let cap = 0;
  for (const b of buildingsOf(owner)) {
    if (b.construct) continue;
    if (b.type === "cc")    cap += C.cc.supply;
    if (b.type === "depot") cap += C.depot.supply;
  }
  return Math.min(cap, SUPPLY_MAX); // BW hard cap
}
function supplyUsed(owner) {
  // Every unit uses 1; active + queued trainees in CC and Barracks are reserved up front.
  let used = state.units.filter(u => u.owner === owner).length;
  for (const b of buildingsOf(owner)) {
    if (b.type === "cc" || b.type === "barracks")
      used += (b.train ? 1 : 0) + (b.queued || 0);
  }
  return used;
}
const hasCompletedDepot = owner =>
  state.buildings.some(b => b.owner === owner && b.type === "depot" && !b.construct);
const hasBarracks = owner =>
  state.buildings.some(b => b.owner === owner && b.type === "barracks");

/* ----------------------------- Simulation ---------------------------- */
function tick() {
  if (state.over) return;
  state.time++;
  state.notes = state.notes.filter(n => n.until > state.time); // expire old toasts

  mineStep();
  buildingStep();
  unitStep();
  combatStep();
  cleanupDead();
  alertStep();
  fogStep();
  if (state.time - state.bot.lastEval >= 3) { botEval(); state.bot.lastEval = state.time; }

  checkEnd();
  render();
}

function notify(text, kind, ttl = 5, node = null) {
  state.notes.push({ id: idSeq++, text, kind, until: state.time + ttl, node });
}

// Fire a prominent alert the moment enemies appear at any node you hold — your base
// or a forward position. Edge-triggered per node, so it re-fires for each fresh wave
// rather than spamming every tick, and carries the node so the toast can link to it.
function alertStep() {
  for (let node = 0; node < state.map.n; node++) {
    const mine = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                 state.buildings.some(b => b.owner === HUMAN && b.node === node);
    const foe = state.units.some(u => u.owner === BOT && u.node === node);
    const contested = mine && foe;
    if (contested && !state.underAttack[node]) notify("⚠️ UNDER ATTACK", "alert", 6, node);
    state.underAttack[node] = contested;
  }
}

const SEEN_UNITS_TTL = 5; // seconds a last-seen enemy unit count lingers after we lose vision

// Fog memory: while we have a unit/building at a node, remember a frozen snapshot of
// the enemy *buildings* there. Enemy unit counts are also captured but only linger a
// few seconds (SEEN_UNITS_TTL) so a scout that dies still reports what it saw.
function fogStep() {
  for (let node = 0; node < state.map.n; node++) {
    // Vision/exploration is symmetric: each side remembers nodes it occupies.
    for (const me of [HUMAN, BOT]) {
      const present = state.units.some(u => u.owner === me && u.node === node) ||
                      state.buildings.some(b => b.owner === me && b.node === node);
      if (present) state.visited[me][node] = true;
    }
    // Player's fog memory of the bot at this node (only the human side is rendered).
    const present = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                    state.buildings.some(b => b.owner === HUMAN && b.node === node);
    if (!present) continue;
    state.seen[node] = state.buildings
      .filter(b => b.owner === BOT && b.node === node)
      .map(b => ({ type: b.type, hp: b.hp, maxHp: b.maxHp,
                   construct: b.construct ? { ...b.construct } : null }));
    const foes = state.units.filter(u => u.owner === BOT && u.node === node);
    state.seenUnits[node] = {
      time: state.time,
      marines: foes.filter(u => u.type === "marine").length,
      scvs:    foes.filter(u => u.type === "scv" && u.task !== "gas").length,
      gasScvs: foes.filter(u => u.type === "scv" && u.task === "gas").length,
    };
  }
}

// Active patch count shrinks as the field depletes — patches go dry one by one.
// Using ceil so the last partial patch still counts (it still has minerals to mine).
const activePatchCount = field => Math.max(1, Math.ceil(field / PATCH_SIZE));

// Mineral yield for a group of n miners at one base, given current field amount.
// As patches deplete, the optimal miner count shrinks with them so sat% stays meaningful.
// 2 SCVs/patch = full efficiency; a 3rd per patch adds ~33% (BW data); beyond 3/patch: zero.
function mineralYield(n, field) {
  const patches = activePatchCount(field);
  const opt  = patches * 2; // full-efficiency threshold (dynamic)
  const semi = patches;     // extra SCVs at 33% efficiency
  return Math.min(n, opt) * MINE_RATE
       + Math.max(0, Math.min(n - opt, semi)) * MINE_RATE * 0.33;
}

// Sat% = how close we are to the optimal miner count for current field conditions.
const mineralSatPct = (n, field) =>
  Math.min(100, Math.round(n / (activePatchCount(field) * 2) * 100));

function mineStep() {
  // Minerals: process per (owner, node). Mining requires a completed CC at the node.
  for (const owner of [HUMAN, BOT]) {
    const ccNodes = new Set(
      state.buildings.filter(b => b.owner === owner && b.type === "cc" && !b.construct)
                     .map(b => b.node));
    const activeMiners = state.units.filter(u =>
      u.owner === owner && u.task === "mining" && u.node >= 0);
    const miningNodes = new Set(activeMiners.map(u => u.node));
    for (const node of miningNodes) {
      const miners = activeMiners.filter(u => u.node === node);
      if (!ccNodes.has(node) || state.field[node] <= 0) {
        miners.forEach(u => u.task = "idle"); continue;
      }
      const got = Math.min(mineralYield(miners.length, state.field[node]), state.field[node]);
      state.field[node] = Math.max(0, state.field[node] - got);
      state.minerals[owner] += got;
    }
  }

  // Gas collection from completed refineries.
  for (const ref of state.buildings.filter(b => b.type === "refinery" && !b.construct)) {
    const gasScvs = state.units.filter(u =>
      u.owner === ref.owner && u.node === ref.node && u.task === "gas");
    if (!gasScvs.length) continue;
    if (state.gasField[ref.node] <= 0) { gasScvs.forEach(u => u.task = "idle"); continue; }
    // Cap at GAS_OPT — beyond that SCVs are wasted (hard cap like BW 3-worker optimum).
    const got = Math.min(Math.min(gasScvs.length, GAS_OPT) * GAS_RATE, state.gasField[ref.node]);
    state.gasField[ref.node] = Math.max(0, state.gasField[ref.node] - got);
    state.gas[ref.owner] += got;
  }
}

function buildingStep() {
  for (const b of state.buildings) {
    if (b.construct) {
      b.construct.progress++;
      if (b.construct.progress >= b.construct.total) {
        b.construct = null;
        // New barracks inherits the rally node already set on siblings at this node.
        if (b.type === "barracks") {
          const sibling = state.buildings.find(s =>
            s.id !== b.id && s.owner === b.owner && s.node === b.node &&
            s.type === "barracks" && !s.construct && typeof s.rally === "number");
          if (sibling) b.rally = sibling.rally;
        }
        const scv = state.units.find(u => u.buildingId === b.id);
        if (scv) { scv.task = "idle"; scv.buildingId = null; }
      }
    }
    if (b.train) {
      b.train.progress++;
      if (b.train.progress >= b.train.total) {
        b.train = null;
        if (b.type === "cc") {
          const scv = newSCV(b.owner, b.node);
          // Rally: send the newborn to mine unless the patch is dry or rally is "idle".
          if (b.rally === "mining" && state.field[b.node] > 0) scv.task = "mining";
        } else if (b.type === "barracks") {
          const marine = newMarine(b.owner, b.node);
          if (typeof b.rally === "number" && b.rally !== b.node) {
            const path = bfsPathVisited(b.owner, b.node, b.rally, state.map.adj, state.map.n);
            if (path && path.length > 1) {
              marine.transit = { to: b.rally, path, pathIdx: 1, progress: 0, mode: "move", dwellStart: null };
              marine.task = "moving"; marine.node = -1;
            }
          }
        }
      }
    }
    // Dequeue the next waiting unit into the training slot whenever it is free and
    // supply allows. This runs every tick so supply-blocked queues self-resolve as
    // soon as a depot finishes.
    if (!b.train && b.construct === null && b.queued > 0 &&
        supplyUsed(b.owner) < supplyCap(b.owner)) {
      b.queued--;
      b.train = { progress: 0, total: b.type === "cc" ? C.cc.trainTime : C.marine.build };
    }
  }
}

function unitStep() {
  for (const u of state.units) {
    if (!u.transit) continue;
    const tr = u.transit;

    if (tr.dwellStart !== null) {
      // Unit is stationed at an intermediate node — decide when to advance.
      const atFinal = tr.pathIdx >= tr.path.length - 1;
      if (atFinal) { u.task = "idle"; u.transit = null; continue; }
      const dwellTime = state.time - tr.dwellStart;
      const foes = targetsAt(enemy(u.owner), u.node);
      const shouldAdvance = tr.mode === "move"
        ? dwellTime >= DWELL_TIME
        : foes.length === 0 && dwellTime >= ENGAGE_DELAY; // attack: clear the node first
      if (shouldAdvance) {
        tr.pathIdx++;
        tr.progress = 0;
        tr.dwellStart = null;
        u.task = "moving";
        u.node = -1;
        u.atkCd = 0;
        u.engaged = 0;
      }
      continue;
    }

    // Traveling between nodes — advance progress and check arrival.
    tr.progress++;
    if (tr.progress >= EDGE_TIME) {
      u.node = tr.path[tr.pathIdx];
      state.visited[u.owner][u.node] = true;
      tr.progress = 0;
      const atFinal = tr.pathIdx >= tr.path.length - 1;
      if (atFinal) {
        u.task = "idle";
        u.transit = null;
      } else {
        tr.dwellStart = state.time;
        u.task = "idle"; // allow combatStep and fogStep to engage at this node
      }
    }
  }
}

// A unit's weapon reach; buildings (no entry) and melee units are 0.
const unitRange = u => (C[u.type] && C[u.type].range) || 0;

function combatStep() {
  // Idle units (SCVs and Marines) auto-attack, focusing whatever can shoot back.
  // Closing the distance: once engaged, a unit can't strike until it has spent
  // ENGAGE_DELAY + max(0, enemyRange - ownRange) ticks closing — a shared windup
  // when the forces meet, plus a ranged bonus so marines fire while melee advances.
  for (const u of state.units) {
    if (u.task !== "idle" || u.node < 0) { u.atkCd = 0; u.engaged = 0; continue; }
    const foes = targetsAt(enemy(u.owner), u.node);
    if (!foes.length) { u.atkCd = 0; u.engaged = 0; continue; }
    u.engaged = (u.engaged || 0) + 1;
    const enemyRange = foes.reduce((m, o) => Math.max(m, unitRange(o)), 0);
    const closeDelay = ENGAGE_DELAY + Math.max(0, enemyRange - unitRange(u));
    if (u.engaged <= closeDelay) continue; // still closing — can't strike yet
    const cfg = u.type === "marine" ? C.marine : C.scv;
    u.atkCd -= 1;
    let guard = 0;
    while (u.atkCd <= 0 && guard++ < 3) {
      const t = pickTarget(enemy(u.owner), u.node);
      if (!t) break;
      t.hp -= cfg.dmg;
      u.atkCd += cfg.atk;
    }
  }
}

// Engine targeting: prioritise enemies that can deal damage back (idle units = fighters).
function pickTarget(owner, node) {
  const live = targetsAt(owner, node);
  if (!live.length) return null;
  const threats = live.filter(o => o.task === "idle");
  const pool = threats.length ? threats : live;
  return pool[(rng() * pool.length) | 0];
}

// Enemy units (any task) + buildings present at a node — all are valid targets.
function targetsAt(owner, node) {
  const us = state.units.filter(u => u.owner === owner && u.node === node && u.hp > 0);
  const bs = state.buildings.filter(b => b.owner === owner && b.node === node && b.hp > 0);
  return us.concat(bs);
}

function cleanupDead() {
  // Remove dead buildings; free or cancel anything tied to them.
  state.buildings = state.buildings.filter(b => {
    if (b.hp > 0) return true;
    const scv = state.units.find(u => u.buildingId === b.id);
    if (scv) { scv.task = "idle"; scv.buildingId = null; }
    // When a refinery is destroyed its gas collectors are freed.
    if (b.type === "refinery") {
      state.units.filter(u => u.owner === b.owner && u.node === b.node && u.task === "gas")
        .forEach(u => u.task = "idle");
    }
    // When a CC is destroyed miners at that node have nowhere to bring minerals.
    if (b.type === "cc") {
      state.units.filter(u => u.owner === b.owner && u.node === b.node && u.task === "mining")
        .forEach(u => u.task = "idle");
    }
    if (b.owner === HUMAN)
      notify(`💥 Your ${BUILDING_LABEL[b.type]} was destroyed!`, "loss", 6);
    return false;
  });
  // Remove dead units; a builder dying cancels its building (no refund).
  const deadBuilds = [];
  let scvLost = 0, marineLost = 0;
  state.units = state.units.filter(u => {
    if (u.hp > 0) return true;
    if (u.buildingId) deadBuilds.push(u.buildingId);
    if (u.owner === HUMAN) u.type === "marine" ? marineLost++ : scvLost++;
    return false;
  });
  if (scvLost)    notify(`Lost ${scvLost} SCV${scvLost > 1 ? "s" : ""}.`, "loss", 4);
  if (marineLost) notify(`Lost ${marineLost} Marine${marineLost > 1 ? "s" : ""}.`, "loss", 4);
  if (deadBuilds.length) {
    state.buildings = state.buildings.filter(b =>
      !(deadBuilds.includes(b.id) && b.construct));
  }
}

function checkEnd() {
  const humanBuildings = state.buildings.some(b => b.owner === HUMAN);
  const botBuildings = state.buildings.some(b => b.owner === BOT);
  if (!botBuildings) endGame("win");
  else if (!humanBuildings) endGame("loss");
}

function endGame(result) {
  state.over = result;
  if (typeof document === "undefined") return; // headless test: state only, no DOM
  stopLoop();
  closeSheet();
  const el = document.getElementById("end");
  el.className = "open " + result;
  document.getElementById("end-big").textContent = result === "win" ? "Victory!" : "Defeat";
  document.getElementById("end-msg").textContent = result === "win"
    ? "You destroyed all enemy buildings."
    : "All your buildings were destroyed.";
}

/* ------------------------------- Actions ----------------------------- */
// All actions are validated again here so the UI can never force an illegal move.
// Queue an SCV at the CC. Minerals + supply are reserved up front, so a queued
// SCV is guaranteed to build. maxQueue lets the bot train only when truly idle.
function queueSCV(owner, node, maxQueue = C.cc.queueMax) {
  const cc = state.buildings
    .filter(b => b.owner === owner && b.type === "cc" && !b.construct && b.node === node)
    .sort((a, b) => ((a.train ? 1 : 0) + a.queued) - ((b.train ? 1 : 0) + b.queued))[0];
  if (!cc) return;
  const inQueue = (cc.train ? 1 : 0) + cc.queued; // active + waiting
  if (inQueue >= maxQueue) return;
  if (state.minerals[owner] < C.cc.trainCost) return;
  state.minerals[owner] -= C.cc.trainCost;
  // Start training immediately if the slot is free and supply allows; otherwise queue.
  if (!cc.train && supplyUsed(owner) < supplyCap(owner))
    cc.train = { progress: 0, total: C.cc.trainTime };
  else
    cc.queued++;
}

function freeIdle(owner, node) {
  // Get an idle SCV, pulling one off mining or gas collection if necessary.
  let scv = unitsOf(owner, node, "idle", "scv")[0];
  if (!scv) { scv = unitsOf(owner, node, "mining", "scv")[0]; if (scv) scv.task = "idle"; }
  if (!scv) { scv = unitsOf(owner, node, "gas",    "scv")[0]; if (scv) scv.task = "idle"; }
  return scv;
}

function startBuilding(owner, node, type) {
  const cfg = C[type];
  if (!cfg || state.minerals[owner] < cfg.cost) return false;
  // Refinery: max 1 per node (1 geyser) and geyser must have gas.
  if (type === "refinery") {
    if (state.gasField[node] <= 0) return false;
    if (state.buildings.some(b => b.owner === owner && b.node === node && b.type === "refinery")) return false;
  }
  const scv = freeIdle(owner, node);
  if (!scv) {
    if (owner === HUMAN) notify("No SCV available to build — free one first.", "warn", 4);
    return false;
  }
  state.minerals[owner] -= cfg.cost;
  const b = {
    id: idSeq++, owner, node, type,
    hp: cfg.hp, maxHp: cfg.hp,
    construct: { progress: 0, total: cfg.build }, train: null, queued: 0,
    rally: type === "cc" ? "mining" : null,
  };
  state.buildings.push(b);
  scv.task = "building";
  scv.buildingId = b.id;
  if (owner === HUMAN) notify(`🏗 ${BUILDING_LABEL[type] || type} ordered`, "ok", 3);
  return true;
}

// Queue a Marine. With raxId, queue at that specific Barracks (player taps one);
// otherwise pick the least-busy completed Barracks at the node (used by the bot).
function queueMarine(owner, node, raxId) {
  let rax;
  if (raxId != null) {
    rax = state.buildings.find(b => b.id === raxId && !b.construct && b.type === "barracks");
  } else {
    rax = state.buildings
      .filter(b => b.owner === owner && b.node === node && b.type === "barracks" && !b.construct)
      .sort((a, b) => ((a.train ? 1 : 0) + a.queued) - ((b.train ? 1 : 0) + b.queued))[0];
  }
  if (!rax) return;
  const inQueue = (rax.train ? 1 : 0) + rax.queued;
  if (inQueue >= C.marine.queueMax) return;
  if (state.minerals[owner] < C.marine.cost) return;
  state.minerals[owner] -= C.marine.cost;
  // Start training immediately if the slot is free and supply allows; otherwise queue.
  if (!rax.train && supplyUsed(owner) < supplyCap(owner))
    rax.train = { progress: 0, total: C.marine.build };
  else
    rax.queued++;
}

function sendUnits(owner, node, n, unitType = "scv", dest, mode = "move") {
  const pool = unitType === "marine" ? idleMarines(owner, node) : controllable(owner, node);
  // For SCVs, send idle ones before pulling miners off duty.
  if (unitType === "scv") pool.sort((a, b) => (a.task === "idle" ? 0 : 1) - (b.task === "idle" ? 0 : 1));
  // Default destination keeps old call sites working: nearest reachable enemy-ward node.
  if (dest === undefined) dest = node === HOME ? AWAY : HOME;
  if (dest === node) return;
  const path = bfsPathVisited(owner, node, dest, state.map.adj, state.map.n);
  if (path.length < 2) return; // no path through explored territory
  const sent = pool.slice(0, n);
  for (const u of sent) {
    u.task = "moving";
    u.node = -1; // off-map until the first hop completes
    u.transit = { to: dest, path, pathIdx: 1, progress: 0, mode, dwellStart: null };
  }
  if (owner === HUMAN && sent.length) {
    const label = unitType === "marine" ? "Marine" : "SCV";
    const modeIcon = mode === "attack" ? " ⚔️" : "";
    notify(`${sent.length} ${label}${sent.length > 1 ? "s" : ""}${modeIcon} → ${nodeName(dest)}`, "ok", 3);
  }
}

function cancelTransit(to) {
  to = parseInt(to);
  const group = state.units.filter(u => u.owner === HUMAN && u.transit && u.transit.to === to);
  for (const u of group) {
    const tr = u.transit;
    if (tr.dwellStart !== null) {
      u.task = "idle"; u.transit = null;
    } else {
      const prev = tr.path[tr.pathIdx - 1];
      const next = tr.path[tr.pathIdx];
      if (tr.progress >= EDGE_TIME / 2) {
        u.node = next; state.visited[u.owner][next] = true;
      } else {
        u.node = prev;
      }
      u.task = "idle"; u.transit = null;
    }
  }
  render();
}

function setTask(owner, node, n, from, to, unitType) {
  const pool = unitsOf(owner, node, from, unitType).slice(0, n);
  for (const u of pool) u.task = to;
}

/* -------------------------------- Bot -------------------------------- */
function botEval() {
  const home = AWAY;
  const min = () => state.minerals[BOT];
  const underAttack = state.units.some(u => u.owner === HUMAN && u.node === home);
  const botRax = state.buildings.find(b =>
    b.owner === BOT && b.type === "barracks" && !b.construct);

  // Adaptive difficulty: check player pace every 30s and nudge wave frequency.
  if (state.time % 30 === 0 && state.time > 0) {
    const humanMarines = state.units.filter(u => u.owner === HUMAN && u.type === "marine").length;
    const humanTotal = state.units.filter(u => u.owner === HUMAN).length;
    const iv = state.bot.waveInterval;
    if (humanMarines >= 5) state.bot.waveInterval = Math.max(50, iv - 6);
    else if (humanMarines >= 2 && state.time < 200) state.bot.waveInterval = Math.max(55, iv - 4);
    if (humanTotal <= 3) state.bot.waveInterval = Math.min(120, iv + 8); // player struggling → ease off
  }

  // "Skilled" = adaptive difficulty has ramped the bot up against a strong player.
  const skilled = state.bot.waveInterval <= 60;

  if (underAttack) {
    // Marines defend automatically (they're idle and auto-fight). Only pull SCVs
    // off mining when the marines alone can't hold — and only enough to cover the
    // shortfall, always keeping a core of miners so income never fully stops.
    // (Throwing the whole worker line at every attack was what killed the bot's
    // economy: it lost all SCVs in wave 1 and couldn't rebuild for wave 2.)
    const attackers = state.units.filter(u =>
      u.owner === HUMAN && u.node === home && u.hp > 0).length;
    const defenders = idleMarines(BOT, home).length;
    const miners = unitsOf(BOT, home, "mining", "scv");
    const KEEP_MINING = 6; // protect income: never conscript below this many miners
    if (defenders < attackers) {
      const need = Math.min(attackers - defenders, Math.max(0, miners.length - KEEP_MINING));
      miners.slice(0, need).forEach(u => u.task = "idle");
    } else {
      // Marines have it covered — return any panicked SCVs to mining.
      if (state.field[home] > 0)
        unitsOf(BOT, home, "idle", "scv").forEach(u => u.task = "mining");
    }
  } else {
    // Not under attack. Bot explores outward (toward any unvisited frontier node) until
    // it discovers the enemy base; once found and reachable, it scouts then attacks.
    const marines = idleMarines(BOT, home);
    const reserve = skilled ? 8 : 14; // marines held back to defend
    const waveDue = state.time - state.bot.lastWave >= state.bot.waveInterval;

    // Discover enemy base: first visited node that has enemy buildings.
    if (state.bot.enemyBase === null) {
      for (let n = 0; n < state.map.n; n++) {
        if (state.visited[BOT][n] && state.buildings.some(b => b.owner === HUMAN && b.node === n)) {
          state.bot.enemyBase = n; break;
        }
      }
    }
    const target = state.bot.enemyBase;

    // Update intel whenever any bot unit stands at the discovered enemy base.
    if (target !== null && state.units.some(u => u.owner === BOT && u.node === target)) {
      state.bot.enemyArmy = state.units.filter(u => u.owner === HUMAN && u.node === target &&
        (u.type === "marine" || u.type === "scv")).length;
      state.bot.scoutTime = state.time;
      // Base cleared — reset so the discovery loop can find a new enemy base next eval.
      if (!state.buildings.some(b => b.owner === HUMAN && b.node === target))
        state.bot.enemyBase = null;
    }
    const intelFresh = state.bot.scoutTime != null && state.time - state.bot.scoutTime <= 120;
    // Any bot unit with a transit heading away from home (scout or attack wave).
    const scoutOut = state.units.some(u => u.owner === BOT && u.transit != null && u.transit.to !== home);

    // Frontier: nearest unvisited node (any direction, not hard-coded toward HOME).
    const distFromHome = bfsDist(home, state.map.adj, state.map.n);
    let frontier = -1, frontierDist = Infinity;
    for (let n = 0; n < state.map.n; n++) {
      if (!state.visited[BOT][n] && distFromHome[n] < frontierDist) {
        frontierDist = distFromHome[n]; frontier = n;
      }
    }
    const targetReachable = target !== null && canSendTo(BOT, target);

    if (!targetReachable && frontier !== -1) {
      // Claim the frontier: send one marine (or a spare SCV early) if nobody is
      // there or already heading there.
      const atFrontier = state.units.some(u => u.owner === BOT && u.node === frontier);
      const headed = state.units.some(u =>
        u.owner === BOT && u.transit && u.transit.path.includes(frontier));
      if (!atFrontier && !headed) {
        if (marines.length > 1) sendUnits(BOT, home, 1, "marine", frontier);
        else {
          const scvsHome = state.units.filter(u => u.owner === BOT && u.node === home &&
            u.type === "scv" && (u.task === "idle" || u.task === "mining"));
          if (scvsHome.length >= 10) sendUnits(BOT, home, 1, "scv", frontier);
        }
      }
    } else if (targetReachable) {
      // Enemy base discovered and reachable — scout for intel, then commit a real wave.
      // If the wave is overdue and overwhelming force is available, commit blind rather
      // than drip-feeding scouts that keep dying en route.
      const strike = marines.length - reserve;
      const blindAttack = waveDue && !intelFresh && strike >= 20;
      if (blindAttack) {
        sendUnits(BOT, home, strike, "marine", target, "attack");
        state.bot.lastWave = state.time;
      } else if (!intelFresh && !scoutOut && marines.length > reserve) {
        sendUnits(BOT, home, 1, "marine", target); // scout — move mode, observe then leave
      } else if (waveDue && intelFresh) {
        const needed = Math.max(12, Math.ceil(state.bot.enemyArmy * 1.4) + 4);
        if (strike >= needed) {
          sendUnits(BOT, home, strike, "marine", target, "attack"); // attack wave
          state.bot.lastWave = state.time;
        }
      }
    }

    // Expansion: send an SCV to claim visited resource nodes without a bot CC.
    if (!underAttack && min() >= C.cc.cost + 200) {
      const noExpanding = !state.buildings.some(
        b => b.owner === BOT && b.type === "cc" && b.construct && b.node !== home);
      if (noExpanding) {
        let expNode = -1, expDist = Infinity;
        for (let n = 0; n < state.map.n; n++) {
          if (n === home || !state.visited[BOT][n] || state.field[n] <= 0) continue;
          if (state.buildings.some(b => b.owner === BOT && b.node === n && b.type === "cc")) continue;
          if (distFromHome[n] < expDist) { expDist = distFromHome[n]; expNode = n; }
        }
        if (expNode !== -1) {
          const scvThere = unitsOf(BOT, expNode, null, "scv").length > 0;
          const scvEnRoute = state.units.some(u =>
            u.owner === BOT && u.type === "scv" && u.transit && u.transit.to === expNode);
          if (scvThere) {
            startBuilding(BOT, expNode, "cc");
          } else if (!scvEnRoute) {
            const homeScvAvail = state.units.filter(u =>
              u.owner === BOT && u.node === home && u.type === "scv" &&
              (u.task === "idle" || u.task === "mining")).length;
            if (homeScvAvail > 10) sendUnits(BOT, home, 1, "scv", expNode);
          }
        }
      }
    }
  }

  // Mop-up: idle bot marines at non-home nodes march toward the current enemy base (or home).
  {
    const mopTarget = state.bot.enemyBase;
    for (let n = 0; n < state.map.n; n++) {
      if (n === home) continue;
      const idle = state.units.filter(u =>
        u.owner === BOT && u.node === n && !u.transit && u.task === "idle" && u.type === "marine");
      if (!idle.length) continue;
      const dest = mopTarget !== null && canSendTo(BOT, mopTarget) ? mopTarget : home;
      if (dest !== n) {
        const mode = dest === mopTarget ? "attack" : "move";
        sendUnits(BOT, n, idle.length, "marine", dest, mode);
      }
    }
  }

  // Supply: build depots with a healthy buffer so production never stalls.
  if (supplyUsed(BOT) >= supplyCap(BOT) - 4 && supplyCap(BOT) < SUPPLY_MAX &&
      min() >= C.depot.cost &&
      !state.buildings.some(b => b.owner === BOT && b.type === "depot" && b.construct)) {
    startBuilding(BOT, home, "depot");
  }

  // Economy: keep SCVs coming (bigger cap than before so the army is funded).
  const botSCVs = state.units.filter(u => u.owner === BOT && u.type === "scv").length;
  const scvCap = skilled ? 18 : 12;
  if (min() >= C.cc.trainCost && supplyUsed(BOT) < supplyCap(BOT) &&
      (botSCVs < scvCap || !botRax)) {
    queueSCV(BOT, home, 1);
  }

  // Tech: expand barracks over time so marine output scales with the player's.
  const raxCount = state.buildings.filter(b => b.owner === BOT && b.type === "barracks").length;
  const raxTarget = skilled ? Math.min(6, 1 + Math.floor(state.time / 60))
                            : Math.min(3, 1 + Math.floor(state.time / 120));
  const raxBuilding = state.buildings.some(b => b.owner === BOT && b.type === "barracks" && b.construct);
  if (raxCount < raxTarget && min() >= C.barracks.cost && !raxBuilding) {
    startBuilding(BOT, home, "barracks");
  }

  // Pump marines from every idle barracks (one top-up per barracks per eval).
  let guard = raxCount;
  while (botRax && min() >= C.marine.cost && supplyUsed(BOT) < supplyCap(BOT) && guard-- > 0) {
    const before = min();
    queueMarine(BOT, home);
    if (min() === before) break; // all barracks queues full
  }

  // Set idle SCVs to mining at every completed bot CC node.
  for (const ccB of state.buildings.filter(b => b.owner === BOT && b.type === "cc" && !b.construct)) {
    if (state.field[ccB.node] <= 0) continue;
    if (underAttack && ccB.node === home) continue;
    unitsOf(BOT, ccB.node, "idle", "scv").forEach(u => u.task = "mining");
  }
  // Trickle extra SCVs to undermanned expansion nodes (up to 8 miners, keep 10+ at home).
  if (!underAttack) {
    for (const ccB of state.buildings.filter(
        b => b.owner === BOT && b.type === "cc" && !b.construct && b.node !== home)) {
      if (state.field[ccB.node] <= 0) continue;
      const expMiners = unitsOf(BOT, ccB.node, "mining", "scv").length;
      const enRoute = state.units.filter(u =>
        u.owner === BOT && u.type === "scv" && u.transit && u.transit.to === ccB.node).length;
      const homeScvAvail = state.units.filter(u =>
        u.owner === BOT && u.node === home && u.type === "scv" &&
        (u.task === "idle" || u.task === "mining")).length;
      const send = Math.min(Math.max(0, 8 - expMiners - enRoute), Math.max(0, homeScvAvail - 10));
      if (send > 0) sendUnits(BOT, home, send, "scv", ccB.node);
    }
  }
}

/* ------------------------------ Rendering ---------------------------- */
const $ = id => document.getElementById(id);
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const BUILDING_LABEL = { cc: "Command Center", depot: "Supply Depot", barracks: "Barracks", refinery: "Refinery" };

// Display names, assigned the first time the player sees a node. Naming by discovery
// order (not the underlying node id) means the labels never hint at how many unseen
// nodes exist beyond the explored frontier. nodeLetter is the short graph label.
function nodeLetter(node) {
  if (state.labels[node] == null)
    state.labels[node] = String.fromCharCode(65 + state.labels.filter(Boolean).length);
  return state.labels[node];
}
const nodeName = node => "Sector " + nodeLetter(node);

function svgIcon(kind) {
  if (kind === "cc")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M7 9V6h10v3M12 13v3"/></svg>`;
  if (kind === "depot")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="4" y="8" width="16" height="10" rx="2"/><path d="M4 12h16"/></svg>`;
  if (kind === "barracks")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><path d="M4 18V8l8-4 8 4v10"/><path d="M9 18v-5h6v5"/></svg>`;
  if (kind === "scv")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ffd27a" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 5v3M12 16v3M5 12h3M16 12h3"/></svg>`;
  if (kind === "marine")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ff9a9a" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M6 21v-1a6 6 0 0112 0v1"/><path d="M17 13l4 1.5-4 1.5"/></svg>`;
  if (kind === "refinery")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2"><rect x="5" y="13" width="14" height="8" rx="1"/><path d="M8 13V9l4-3 4 3v4M10 21v-3h4v3"/><path d="M9 6V4M15 6V4"/></svg>`;
  if (kind === "gas")
    return `<svg class="icon" viewBox="0 0 24 24" fill="#4ade80" stroke="#0a2211" stroke-width="0.5"><path d="M12 3c0 0-4 5.5-4 10a4 4 0 008 0c0-2.5-1-4-2-5-.1 2-1.5 3-2 3-.5 0-1-1-1-2.5 1.5-1 2.5-3 1-5.5z"/></svg>`;
  if (kind === "mineral")
    return `<svg class="icon" viewBox="0 0 24 24" fill="#41d6ff" stroke="#0a1a22" stroke-width="1"><path d="M12 3l4 6-4 12-4-12z"/></svg>`;
  return "";
}

function hpBar(hp, maxHp) {
  const p = Math.max(0, hp / maxHp);
  const cls = p > 0.5 ? "" : p > 0.25 ? "mid" : "low";
  return `<div class="bar hp ${cls}"><i style="width:${(p * 100).toFixed(0)}%"></i></div>`;
}
function progBar(progress, total) {
  return `<div class="bar prog"><i style="width:${((progress / total) * 100).toFixed(0)}%"></i></div>`;
}

function render() {
  if (typeof document === "undefined") return; // headless test: no DOM to paint
  // Status bar (human numbers).
  $("s-min").textContent = Math.floor(state.minerals[HUMAN]);
  $("s-gas").textContent = Math.floor(state.gas[HUMAN]);
  const used = supplyUsed(HUMAN), cap = supplyCap(HUMAN);
  $("s-sup").textContent = `${used} / ${cap}`;
  $("s-supwrap").className = "stat supply" + (used >= cap ? " blocked" : "");
  $("s-time").textContent = fmtTime(state.time);
  if (typeof document.body !== "undefined" && document.body)
    document.body.classList.toggle("paused", !!state.paused);

  // Map — drawn as a node-link graph. You only see nodes you've explored plus the
  // immediate neighbours of explored nodes (the frontier); the rest stays hidden,
  // so the map's shape is revealed only as you scout outward. Tap a node to focus
  // it; its details (forces, resources, orders) show in the panel below.
  const board = $("board");
  board.innerHTML = "";
  const visible = new Set(reachableSet(HUMAN));
  if (!visible.has(ui.selectedNode)) ui.selectedNode = HOME;
  // Assign display letters in proximity order so your base is "A", then outward.
  [...visible].sort((a, b) => state.map.dist[HOME][a] - state.map.dist[HOME][b] || a - b).forEach(nodeLetter);
  board.appendChild(renderGraph(visible));
  board.appendChild(renderNode(ui.selectedNode));

  renderTransit();
  const notesEl = $("notes");
  notesEl.innerHTML = state.notes.map(n => {
    const linked = n.node != null;
    const where = linked ? ` at <b>${nodeName(n.node)}</b> · tap to view →` : "";
    return `<div class="note ${n.kind}${linked ? " link" : ""}"${linked ? ` data-node="${n.node}"` : ""}>${n.text}${where}</div>`;
  }).join("");
  notesEl.querySelectorAll(".note.link").forEach(el =>
    el.onclick = () => { ui.selectedNode = +el.dataset.node; render(); });
  if (ui.sheet) renderSheet();
}

// Draw the explored map as a node-link graph (SVG). Only `visible` nodes are drawn;
// edges appear only when at least one endpoint is visited (so frontier-to-frontier
// links stay hidden). Tapping a node focuses it for the detail panel below.
function renderGraph(visible) {
  const wrap = document.createElement("div");
  wrap.className = "map";
  const { n, adj, pos } = state.map;

  // Stable height from the tallest column so revealed nodes never reflow.
  const colCount = {};
  for (let i = 0; i < n; i++) { const k = pos[i].x.toFixed(3); colCount[k] = (colCount[k] || 0) + 1; }
  const maxLayer = Math.max(1, ...Object.values(colCount));
  const H = Math.max(48, 24 + (maxLayer - 1) * 26);
  const PADX = 14, PADY = 14;
  const X = x => (PADX + x * (100 - 2 * PADX)).toFixed(1);
  const Y = y => (PADY + y * (H - 2 * PADY)).toFixed(1);

  let edges = "";
  for (let u = 0; u < n; u++) if (visible.has(u))
    for (const v of adj[u]) if (v > u && visible.has(v) && (state.visited.human[u] || state.visited.human[v]))
      edges += `<line class="edge" x1="${X(pos[u].x)}" y1="${Y(pos[u].y)}" x2="${X(pos[v].x)}" y2="${Y(pos[v].y)}"/>`;

  let nodes = "";
  for (let id = 0; id < n; id++) if (visible.has(id)) {
    const cx = X(pos[id].x), cy = Y(pos[id].y);
    const isHome = id === HOME;
    const present = state.units.some(u => u.owner === HUMAN && u.node === id) ||
                    state.buildings.some(b => b.owner === HUMAN && b.node === id);
    const visited = state.visited.human[id];
    // Enemy-held = we've seen enemy buildings here (live or remembered). No node id
    // is special: any node turns up as enemy territory once you scout its base.
    const enemyHeld = present
      ? state.buildings.some(b => b.owner === BOT && b.node === id)
      : (Array.isArray(state.seen[id]) && state.seen[id].length > 0);
    const su = state.seenUnits[id];
    const enemyHere = present
      ? state.units.some(u => u.owner === BOT && u.node === id)
      : !!(su && state.time - su.time <= SEEN_UNITS_TTL && (su.marines || su.scvs || su.gasScvs));
    let cls = isHome ? "home" : enemyHeld ? "foe" : visited ? "owned" : "unknown";
    if (enemyHere) cls += " threat";
    if (id === ui.selectedNode) cls += " selected";
    const army = state.units.filter(u => u.owner === HUMAN && u.node === id).length;
    const below = army ? `<text class="ncount" x="${cx}" y="${(+cy + 12).toFixed(1)}">▲${army}</text>` : "";
    const hasMin = visited && state.field[id] > 0;
    const hasGas = visited && state.gasField[id] > 0;
    let resRow = "";
    if (hasMin || hasGas) {
      const ry = (+cy - 9.8).toFixed(1);
      if (hasMin && hasGas)
        resRow = `<circle cx="${(+cx - 1.8).toFixed(1)}" cy="${ry}" r="1.4" fill="#41d6ff"/>` +
                 `<circle cx="${(+cx + 1.8).toFixed(1)}" cy="${ry}" r="1.4" fill="#4ade80"/>`;
      else if (hasMin)
        resRow = `<circle cx="${cx}" cy="${ry}" r="1.4" fill="#41d6ff"/>`;
      else
        resRow = `<circle cx="${cx}" cy="${ry}" r="1.4" fill="#4ade80"/>`;
    }
    nodes += `<g class="gnode ${cls}" data-id="${id}">
        <circle class="ncircle" cx="${cx}" cy="${cy}" r="7"/>
        <text class="glyph" x="${cx}" y="${(+cy + 2.3).toFixed(1)}">${nodeLetter(id)}</text>
        ${resRow}${below}
      </g>`;
  }

  wrap.innerHTML =
    `<svg viewBox="0 0 100 ${H}" preserveAspectRatio="xMidYMid meet" role="img">${edges}${nodes}</svg>` +
    `<div class="map-legend">Tap a node to focus · <b style="color:var(--accent)">blue</b> your base · <b style="color:var(--enemy)">red</b> enemy · dashed = unexplored · ▲ forces · <b style="color:#41d6ff">●</b> minerals · <b style="color:#4ade80">●</b> gas</div>`;
  wrap.querySelectorAll(".gnode").forEach(g =>
    g.onclick = () => { ui.selectedNode = +g.dataset.id; render(); });
  return wrap;
}

function renderNode(node) {
  const el = document.createElement("div");
  const isHome = node === HOME;
  const present = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                  state.buildings.some(b => b.owner === HUMAN && b.node === node);
  const visited = state.visited.human[node];
  // Enemy-held = enemy buildings seen here (live or remembered). No node is special;
  // a base is just a node where you've spotted the enemy's buildings.
  const enemyHeld = present
    ? state.buildings.some(b => b.owner === BOT && b.node === node)
    : (Array.isArray(state.seen[node]) && state.seen[node].length > 0);
  el.className = "node " + (isHome ? "home" : enemyHeld ? "away" : "neutral");

  // Header: name + (your-base badge) + resources for any node you can see that has them.
  const badge = isHome ? `<span class="badge you">★ Your Base</span>` : "";
  let resStr = "";
  if (present && (state.field[node] > 0 || state.gasField[node] > 0)) {
    const hasRefinery = state.buildings.some(b => b.node === node && b.type === "refinery" && !b.construct);
    resStr = `💎 ${Math.ceil(state.field[node])} · ⛽ ${Math.ceil(state.gasField[node])}${hasRefinery ? " left" : ""}`;
  }
  // Paths are only known for nodes you've actually visited — an unexplored frontier
  // node shows that it exists, but not what it connects to.
  const pathsLine = visited
    ? `<div class="paths">↔ ${state.map.adj[node].map(nodeName).join(", ")}</div>`
    : `<div class="paths">↔ ?</div>`;
  el.innerHTML = `<div class="node-head">
      <h1>${nodeName(node)} ${badge}</h1>
      <span class="field" style="color:var(--dim)">${resStr}</span>
    </div>
    ${pathsLine}`;

  // --- Your forces (only when you have something here) ---
  const mine = document.createElement("div");
  mine.className = "force-mine";
  if (appendForces(mine, HUMAN, node, true)) {
    mine.insertAdjacentHTML("afterbegin", `<div class="section-label">Your forces</div>`);
    el.appendChild(mine);
  }

  // --- Enemy forces (fog of war) ---
  const en = document.createElement("div");
  en.className = "force-enemy";
  if (present) {
    // Full vision: show live enemy forces if any.
    if (appendForces(en, BOT, node, false)) {
      en.insertAdjacentHTML("afterbegin", `<div class="section-label">Enemy forces</div>`);
      el.appendChild(en);
    }
  } else {
    const snap = state.seen[node];
    if (snap) {
      en.innerHTML = `<div class="section-label">Enemy forces — last seen</div>`;
      if (snap.length) appendSeenBuildings(en, snap);
      const seenU = appendSeenUnits(en, state.seenUnits[node]);
      // "no forces" omitted — saves space; absence of rows is self-explanatory
    } else {
      en.innerHTML = `<div class="unknown">${visited ? "No vision here." : "Unexplored."}</div>`;
    }
    el.appendChild(en);
  }
  return el;
}

// Render a fading last-seen enemy unit count (marines/SCVs). Returns true if shown.
// Within SEEN_UNITS_TTL of the sighting; older intel is dropped (units move, so a
// stale count would be misleading — unlike buildings, which stay put).
function appendSeenUnits(container, snap) {
  if (!snap || state.time - snap.time > SEEN_UNITS_TTL) return false;
  if (!snap.marines && !snap.scvs && !snap.gasScvs) return false;
  const age = state.time - snap.time;
  const totalScvs = (snap.scvs || 0) + (snap.gasScvs || 0);
  const rows = [
    snap.marines && ["marine", `Marines — ~${snap.marines}`],
    totalScvs && ["scv", `SCVs — ~${totalScvs}`],
  ].filter(Boolean);
  for (const [icon, name] of rows) {
    const row = document.createElement("div");
    row.className = "row static seen";
    row.innerHTML = `${svgIcon(icon)}<div class="body">
        <div class="name">${name}</div>
        <div class="meta">Last seen ${age}s ago</div>
      </div>`;
    container.appendChild(row);
  }
  return true;
}

// Render remembered (frozen) enemy buildings from a fog snapshot — info only, dimmed.
// Grouped like live forces (CC individual; depots and barracks collapsed) so a big
// enemy base doesn't become an overwhelming wall of rows.
function appendSeenBuildings(container, snap) {
  const mkRow = (icon, name, meta, hp, maxHp) => {
    const row = document.createElement("div");
    row.className = "row static seen";
    row.innerHTML = `${svgIcon(icon)}<div class="body">
        <div class="name">${name}</div>
        <div class="meta">${meta}</div>
        ${hp != null ? hpBar(hp, maxHp) : ""}
      </div>`;
    container.appendChild(row);
  };

  // Command Centers — individual (there's normally just one).
  for (const b of snap.filter(b => b.type === "cc")) {
    const meta = b.construct
      ? `Was building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`
      : `Last seen · HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    mkRow("cc", "Command Center", meta, b.hp, b.maxHp);
  }

  // Supply Depots, Barracks, and Refineries — one summary row each.
  for (const [type, label] of [["depot", "Supply Depot"], ["barracks", "Barracks"], ["refinery", "Refinery"]]) {
    const group = snap.filter(b => b.type === type);
    if (!group.length) continue;
    const underC = group.filter(b => b.construct).length;
    const done = group.length - underC;
    const parts = [];
    if (done) parts.push(`${done} seen`);
    if (underC) parts.push(`${underC} building`);
    mkRow(type, `${label}${group.length > 1 ? ` ×${group.length}` : ""}`, parts.join(" · ") || "Last seen");
  }
}

// Pure: describe a group of barracks as text segments. Completed and
// under-construction barracks are reported *independently*, so newly-started
// barracks stay visible even while finished ones are busy training.
function barracksMeta(allRax, interactive) {
  const readyRax = allRax.filter(b => !b.construct);
  const underC = allRax.filter(b => b.construct);
  const segs = [];
  if (readyRax.length) {
    if (interactive) {
      const totalQ = readyRax.reduce((s, b) => s + (b.train ? 1 : 0) + (b.queued || 0), 0);
      segs.push(totalQ ? `Training · ${totalQ} queued` : "Idle · tap to train");
    } else {
      const totHP = readyRax.reduce((s, b) => s + Math.ceil(b.hp), 0);
      const totMax = readyRax.reduce((s, b) => s + b.maxHp, 0);
      segs.push(`HP ${totHP}/${totMax}`);
    }
  }
  if (underC.length) {
    // Closest-to-done builder represents the in-construction group.
    const lead = underC.slice().sort((a, b) =>
      (b.construct.progress / b.construct.total) - (a.construct.progress / a.construct.total))[0];
    const pct = Math.floor(lead.construct.progress / lead.construct.total * 100);
    segs.push(`${underC.length} building… ${pct}%`);
  }
  return segs;
}

// Returns true if anything was rendered. `interactive` enables tap-to-order.
function appendForces(container, owner, node, interactive) {
  let any = false;
  const buildings = buildingsOf(owner, node);

  // Command Center — always individual.
  for (const b of buildings.filter(b => b.type === "cc")) {
    any = true;
    const tappable = interactive;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%${interactive ? progBar(b.construct.progress, b.construct.total) : ""}`;
    } else if (b.train && interactive) {
      meta = `Training SCV ${Math.floor(b.train.progress / b.train.total * 100)}%${b.queued ? ` (+${b.queued} queued)` : ""}${progBar(b.train.progress, b.train.total)}`;
    } else {
      meta = interactive ? `Idle · supply +${C.cc.supply}` : `HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    }
    row.innerHTML = `${svgIcon("cc")}<div class="body">
        <div class="name">Command Center</div>
        <div class="meta">${meta}</div>
        ${hpBar(b.hp, b.maxHp)}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "cc", node, ref: b.id });
    container.appendChild(row);
  }

  // Supply Depots — one summary row for all depots at this node.
  const depots = buildings.filter(b => b.type === "depot");
  if (depots.length) {
    any = true;
    const depotsDone  = depots.filter(b => !b.construct);
    const depotsUnderC = depots.filter(b => b.construct);
    const parts = [];
    if (depotsDone.length) {
      const dHp = depotsDone.reduce((s, b) => s + Math.ceil(b.hp), 0);
      const dMax = depotsDone.reduce((s, b) => s + b.maxHp, 0);
      parts.push(`${depotsDone.length} complete · +${depotsDone.length * C.depot.supply} supply · HP ${dHp}/${dMax}`);
    }
    let depotBar = "";
    if (depotsUnderC.length) {
      const lead = depotsUnderC.slice().sort((a, b) =>
        (b.construct.progress / b.construct.total) - (a.construct.progress / a.construct.total))[0];
      const pct = Math.floor(lead.construct.progress / lead.construct.total * 100);
      parts.push(`${depotsUnderC.length} building… ${pct}%`);
      if (interactive) depotBar = progBar(lead.construct.progress, lead.construct.total);
    }
    const dHp = depotsDone.reduce((s, b) => s + b.hp, 0);
    const dMax = depotsDone.reduce((s, b) => s + b.maxHp, 0);
    const row = document.createElement("div");
    row.className = "row static";
    row.innerHTML = `${svgIcon("depot")}<div class="body">
        <div class="name">Supply Depot${depots.length > 1 ? ` ×${depots.length}` : ""}</div>
        <div class="meta">${parts.join(" · ") || "—"}</div>
        ${depotsDone.length ? hpBar(dHp, dMax) : depotBar}
      </div>`;
    container.appendChild(row);
  }

  // Barracks — grouped; tap queues in the next-free barracks.
  const allRax = buildings.filter(b => b.type === "barracks");
  if (allRax.length) {
    any = true;
    const readyRax = allRax.filter(b => !b.construct);
    const tappable = interactive && readyRax.length > 0;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta = barracksMeta(allRax, interactive).join(" · ");
    // Progress bar: prefer the leading trainee, else the leading builder.
    const underC = allRax.filter(b => b.construct);
    if (interactive) {
      const trainLead = readyRax.filter(b => b.train).sort((a, b) => b.train.progress - a.train.progress)[0];
      if (trainLead) meta += progBar(trainLead.train.progress, trainLead.train.total);
      else if (underC.length) {
        const bl = underC.slice().sort((a, b) => b.construct.progress - a.construct.progress)[0];
        meta += progBar(bl.construct.progress, bl.construct.total);
      }
    }
    const raxHp = readyRax.reduce((s, b) => s + b.hp, 0);
    const raxMax = readyRax.reduce((s, b) => s + b.maxHp, 0);
    row.innerHTML = `${svgIcon("barracks")}<div class="body">
        <div class="name">Barracks${allRax.length > 1 ? ` ×${allRax.length}` : ""}</div>
        <div class="meta">${meta}</div>
        ${readyRax.length ? hpBar(raxHp, raxMax) : ""}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "barracks-group", node });
    container.appendChild(row);
  }

  // Refinery — one row per refinery (normally just one per base).
  for (const b of buildings.filter(b => b.type === "refinery")) {
    any = true;
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`;
      if (interactive) meta += progBar(b.construct.progress, b.construct.total);
    } else {
      const gasScvs = state.units.filter(u => u.owner === owner && u.node === node && u.task === "gas").length;
      const satPct = Math.round(gasScvs / GAS_OPT * 100);
      meta = interactive
        ? `${gasScvs}/${GAS_OPT} gas SCVs · ${satPct}% util · ⛽ ${Math.ceil(state.gasField[node])} left`
        : `HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    }
    const row = document.createElement("div");
    row.className = "row static";
    row.innerHTML = `${svgIcon("refinery")}<div class="body">
        <div class="name">Refinery</div>
        <div class="meta">${meta}</div>
        ${b.construct ? "" : hpBar(b.hp, b.maxHp)}
      </div>`;
    container.appendChild(row);
  }

  // SCVs — grouped; show mining/gas utilisation to help the player saturate.
  const scvs = unitsOf(owner, node, null, "scv");
  if (scvs.length) {
    any = true;
    const miningN = scvs.filter(u => u.task === "mining").length;
    const gasN    = scvs.filter(u => u.task === "gas").length;
    const idleN   = scvs.filter(u => u.task === "idle").length;
    const buildN  = scvs.filter(u => u.task === "building").length;
    const parts = [];
    if (miningN) {
      // Show sat% only in interactive (own base) view where it's actionable.
      if (interactive) {
        const satPct = mineralSatPct(miningN, state.field[node]);
        parts.push(`${miningN} mining (${satPct}% sat)`);
      } else {
        parts.push(`${miningN} mining`);
      }
    }
    if (gasN)   parts.push(`${gasN} gas`);
    if (idleN)  parts.push(`${idleN} idle`);
    if (buildN) parts.push(`${buildN} building`);
    const row = document.createElement(interactive ? "button" : "div");
    row.className = "row" + (interactive ? "" : " static");
    row.innerHTML = `${svgIcon("scv")}<div class="body">
        <div class="name">SCVs — ${scvs.length}</div>
        <div class="meta">${parts.join(", ") || "—"}</div>
      </div>${interactive ? '<span class="chev">›</span>' : ""}`;
    if (interactive) row.onclick = () => openSheet({ kind: "scv", node, n: 1 });
    container.appendChild(row);
  }

  // Marines — all marines at a fixed node are idle (moving ones have node=-1).
  const marines = unitsOf(owner, node, null, "marine");
  if (marines.length) {
    any = true;
    const row = document.createElement(interactive ? "button" : "div");
    row.className = "row" + (interactive ? "" : " static");
    row.innerHTML = `${svgIcon("marine")}<div class="body">
        <div class="name">Marines — ${marines.length}</div>
        <div class="meta">ready</div>
      </div>${interactive ? '<span class="chev">›</span>' : ""}`;
    if (interactive) row.onclick = () => openSheet({ kind: "marine", node, n: 1 });
    container.appendChild(row);
  }

  return any;
}

function renderTransit() {
  const wrap = $("transit");
  // Show all player units with active transit (traveling or dwelling at intermediate node).
  const mine = state.units.filter(u => u.owner === HUMAN && u.transit != null);
  if (!mine.length) { wrap.innerHTML = ""; return; }
  const byDir = {};
  for (const u of mine) {
    const k = u.transit.to;
    (byDir[k] = byDir[k] || []).push(u);
  }
  let html = `<div class="section-label">In transit</div>`;
  for (const to in byDir) {
    const group = byDir[to];
    const scvN = group.filter(u => u.type === "scv").length;
    const marN = group.filter(u => u.type === "marine").length;
    const label = [scvN && `${scvN} SCV${scvN > 1 ? "s" : ""}`,
                   marN && `${marN} Marine${marN > 1 ? "s" : ""}`].filter(Boolean).join(", ");
    const mode = group[0].transit.mode;
    const modeLabel = mode === "attack" ? " ⚔️" : " 📦";
    const hops = group[0].transit.path.length - 1;
    const dwellPer = mode === "attack" ? ENGAGE_DELAY : DWELL_TIME;
    const totalTime = hops * EDGE_TIME + Math.max(0, hops - 1) * dwellPer;
    // Estimate overall progress as completed hops + current segment/dwell fraction.
    const avgDone = group.reduce((s, u) => {
      const done = (u.transit.pathIdx - 1) * (EDGE_TIME + dwellPer);
