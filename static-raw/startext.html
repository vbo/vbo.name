<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StarText — Mini RTS</title>
<style>
  :root {
    --bg: #0c1018;
    --panel: #161c28;
    --panel2: #1d2533;
    --line: #2a3445;
    --txt: #d7e0ec;
    --dim: #8090a4;
    --accent: #4ea1ff;
    --mineral: #41d6ff;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
    --enemy: #ff7a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.35;
    overscroll-behavior: none;
  }
  #app { max-width: 1000px; margin: 0 auto; padding: 8px 8px 96px; }

  /* Top status bar */
  #statusbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; gap: 8px; flex-wrap: wrap;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .stat { display: flex; flex-direction: column; min-width: 70px; }
  .stat b { font-size: 18px; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  .stat.minerals b { color: var(--mineral); }
  .stat.supply.blocked b { color: var(--warn); }

  h1 { font-size: 15px; margin: 0; letter-spacing: .04em; }
  .sub { color: var(--dim); font-size: 12px; }

  /* Board */
  #board { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 720px) { #board { grid-template-columns: 1fr 1fr; } }

  .node {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
  }
  .node.home { border-color: #2f4a6b; }
  .node.away { border-color: #5a2f3a; }
  .node-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .node-head .field { font-size: 12px; color: var(--mineral); }

  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 10px 0 4px;
  }
  .force-mine .section-label { color: var(--accent); }
  .force-enemy .section-label { color: var(--enemy); }

  .row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; margin-bottom: 6px;
    min-height: 48px; width: 100%; text-align: left;
    color: var(--txt); font: inherit; cursor: pointer;
  }
  .row.static { cursor: default; }
  .row.seen { opacity: .6; border-style: dashed; }
  .row .icon { width: 26px; height: 26px; flex: 0 0 26px; }
  .row .body { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 14px; }
  .row .meta { font-size: 12px; color: var(--dim); }
  .row .chev { color: var(--dim); font-size: 18px; }
  button.row:active { background: #243049; }

  .bar { height: 6px; background: #0a0f17; border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; border-radius: 4px; }
  .bar.hp > i { background: var(--good); }
  .bar.hp.mid > i { background: var(--warn); }
  .bar.hp.low > i { background: var(--bad); }
  .bar.prog > i { background: var(--accent); }

  .unknown {
    color: var(--dim); font-style: italic; font-size: 13px;
    padding: 12px; text-align: center;
    background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px;
  }

  /* Transit */
  #transit { margin-top: 10px; }
  .transit-row {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; margin-bottom: 6px;
  }
  .transit-row .name { font-size: 14px; font-weight: 600; }
  .transit-row .meta { font-size: 12px; color: var(--dim); }

  /* Notifications */
  #notes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  #notes:empty { display: none; }
  .note {
    padding: 11px 14px; border-radius: 10px; font-weight: 600; font-size: 14px;
    text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .note.loss { background: #3a1d24; border: 1px solid var(--bad); color: #ffd7d7; }
  .note.alert {
    background: #5a1414; border: 1px solid #ff5a5a; color: #fff;
    font-size: 17px; letter-spacing: .03em;
    animation: alertpulse .7s ease-in-out infinite alternate;
  }
  @keyframes alertpulse {
    from { box-shadow: 0 0 0 0 rgba(255,70,70,.65); }
    to   { box-shadow: 0 0 0 9px rgba(255,70,70,0); }
  }

  /* Action sheet */
  #sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; z-index: 20;
  }
  #sheet-backdrop.open { display: block; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform .18s ease-out;
    max-width: 1000px; margin: 0 auto;
  }
  #sheet.open { transform: translateY(0); }
  #sheet h2 { font-size: 16px; margin: 0 0 2px; }
  #sheet .sheet-sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }

  .stepper { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
  .stepper button {
    width: 48px; height: 48px; border-radius: 12px; font-size: 24px;
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
  }
  .stepper button:active { background: #243049; }
  .stepper .count { font-size: 22px; font-weight: 700; min-width: 40px; text-align: center; }
  .stepper .label { color: var(--dim); font-size: 12px; }
  input[type=range] { width: 100%; height: 40px; }

  .act {
    display: block; width: 100%; min-height: 50px; margin-top: 8px;
    border-radius: 12px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #06101f; border: none;
  }
  .act.secondary { background: var(--panel2); color: var(--txt); border: 1px solid var(--line); }
  .act:disabled { opacity: .4; }
  .act:active:not(:disabled) { filter: brightness(.9); }
  .act .cost { font-weight: 400; font-size: 12px; opacity: .8; }
  .act-close { background: transparent; color: var(--dim); border: none; font-size: 14px; margin-top: 12px; width: 100%; padding: 10px; }

  /* End screen */
  #end {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(6,9,15,.94); text-align: center; padding: 24px;
  }
  #end.open { display: flex; }
  #end .big { font-size: 40px; font-weight: 800; margin-bottom: 6px; }
  #end.win .big { color: var(--good); }
  #end.loss .big { color: var(--bad); }
  #end p { color: var(--dim); margin: 4px 0 24px; }
  #end button {
    min-height: 54px; padding: 0 28px; border-radius: 14px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #06101f; border: none;
  }
  .hint { color: var(--dim); font-size: 11px; text-align: center; margin-top: 14px; }

  .pause {
    align-self: center; min-height: 44px; padding: 0 16px; border-radius: 10px;
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    font-size: 14px; font-weight: 600; white-space: nowrap;
  }
  .pause:active { background: #243049; }
  body.paused #board { opacity: .6; }
</style>
</head>
<body>
<div id="app">
  <div id="statusbar">
    <div class="stat minerals"><b id="s-min">50</b><span>Minerals</span></div>
    <div class="stat supply" id="s-supwrap"><b id="s-sup">4 / 10</b><span>Supply</span></div>
    <div class="stat"><b id="s-time">0:00</b><span>Time</span></div>
    <div class="stat" style="flex:1; min-width:100px;">
      <h1>StarText</h1>
      <span class="sub">Destroy the Enemy Command Center.</span>
    </div>
    <button id="pause-btn" class="pause">⏸ Pause</button>
  </div>

  <div id="notes"></div>
  <div id="board"></div>
  <div id="transit"></div>
  <div class="hint">Tap Command Center, Barracks, SCVs, or Marines to give orders.</div>
</div>

<div id="sheet-backdrop"></div>
<div id="sheet"></div>

<div id="end">
  <div class="big" id="end-big">Victory</div>
  <p id="end-msg"></p>
  <button id="end-again">Play again</button>
</div>

<script>
"use strict";

// ── StarText — single-file mini-RTS ──────────────────────────────────────────
// The simulation (resetState + tick and everything it calls) is DOM-free and
// deterministic under a seed, so it runs headless in Node for fast tests.
//
//   Run tests:  sed -n '/<script>/,/<\/script>/p' startext.html | sed '1d;$d' \
//                 | node -   →  prints "N passed, M failed", exits non-zero on fail
//   In browser: open startext.html?test to see the same report instead of the game.
//
// See runTests() near the bottom. Add an assert there whenever you add behaviour.
// ─────────────────────────────────────────────────────────────────────────────

// Seedable RNG (mulberry32) so the sim is deterministic under test. Tests call
// seedRng(n) for reproducible runs; the live game seeds from Date.now().
let _rngState = 0;
function seedRng(n) { _rngState = n >>> 0; }
function rng() {
  _rngState = (_rngState + 0x6D2B79F5) | 0;
  let t = _rngState;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

/* ----------------------------- Constants ----------------------------- */
const TICK_MS = 1000;       // simulation runs at 1 tick / second
const TRAVEL_TIME = 20;     // seconds to move between the two nodes
const MINE_RATE = 0.7;      // minerals per mining SCV per second
const FIELD_TOTAL = 12000;  // 8 patches × 1500 — standard BW main base
const SUPPLY_MAX = 200;     // BW hard cap

const C = {
  scv:     { hp: 60,  dmg: 5, atk: 1.5, cost: 50, build: 12 },
  // Marine: BW stats — 40 HP, 6 dmg, 15-frame cooldown (~0.9 s at our tick rate)
  marine:  { hp: 40,  dmg: 6, atk: 0.9, cost: 50, build: 24, queueMax: 5 },
  cc:      { hp: 1500, supply: 10, trainCost: 50, trainTime: 12, queueMax: 5 },
  depot:   { hp: 400,  cost: 100, build: 25, supply: 8 },
  barracks:{ hp: 1000, cost: 150, build: 46 },
};

const HOME = 0, AWAY = 1;           // node indices from the human's perspective
const NODE_NAMES = ["Your Base", "Enemy Base"];
const HUMAN = "human", BOT = "bot";

/* ----------------------------- Game state ---------------------------- */
let state, ui, timer, idSeq;

// Pure: build a fresh game state with no DOM/timer side effects. Tests call this
// directly (optionally seeded) and then drive tick() in a loop.
function resetState(seed) {
  seedRng(seed === undefined ? (typeof Date !== "undefined" ? Date.now() : 1) : seed);
  idSeq = 1;
  state = {
    time: 0,
    over: null,                 // null | "win" | "loss"
    paused: false,
    field: [FIELD_TOTAL, FIELD_TOTAL],
    minerals: { human: 50, bot: 50 },
    units: [],
    buildings: [],
    notes: [],                  // transient on-screen notifications
    underAttack: false,         // edge-trigger for the "under attack" alert
    seen: [null, null],         // per-node last-seen enemy buildings (null = never scouted)
    bot: { lastEval: 0, lastWave: 30, waveInterval: 90 }, // adaptive; starts at 90s between waves
  };
  // Each side: 1 Command Center + 4 idle SCVs at its home node.
  spawnBase(HUMAN, HOME);
  spawnBase(BOT, AWAY);
  ui = { sheet: null };          // sheet: { kind, node, ref, n }
}

function init() {
  resetState();
  closeSheet();
  document.getElementById("end").className = "";
  setPaused(false);
  render();
}

function spawnBase(owner, node) {
  state.buildings.push({
    id: idSeq++, owner, node, type: "cc",
    hp: C.cc.hp, maxHp: C.cc.hp, construct: null, train: null, queued: 0,
    rally: "mining", // newborn SCVs auto-mine by default; toggle to "idle" in the CC sheet
  });
  for (let i = 0; i < 4; i++) newSCV(owner, node);
}

function newSCV(owner, node) {
  const u = { id: idSeq++, type: "scv", owner, node, task: "idle",
    hp: C.scv.hp, maxHp: C.scv.hp, atkCd: 0, buildingId: null, transit: null };
  state.units.push(u); return u;
}

function newMarine(owner, node) {
  const u = { id: idSeq++, type: "marine", owner, node, task: "idle",
    hp: C.marine.hp, maxHp: C.marine.hp, atkCd: 0, buildingId: null, transit: null };
  state.units.push(u); return u;
}

/* ----------------------------- Queries ------------------------------- */
const unitsOf = (owner, node, task, type) => state.units.filter(u =>
  u.owner === owner && u.node === node &&
  (task ? u.task === task : true) && (type ? u.type === type : true));
const buildingsOf = (owner, node) => state.buildings.filter(b =>
  b.owner === owner && (node === undefined || b.node === node));
const enemy = o => (o === HUMAN ? BOT : HUMAN);

// SCVs at a node that can be re-tasked or sent (not building, not moving).
const controllable = (owner, node) => state.units.filter(u =>
  u.owner === owner && u.node === node && u.type === "scv" &&
  (u.task === "idle" || u.task === "mining"));
// Idle marines at a node ready to be sent.
const idleMarines = (owner, node) => state.units.filter(u =>
  u.owner === owner && u.node === node && u.type === "marine" && u.task === "idle");

function supplyCap(owner) {
  let cap = 0;
  for (const b of buildingsOf(owner)) {
    if (b.construct) continue;
    if (b.type === "cc")    cap += C.cc.supply;
    if (b.type === "depot") cap += C.depot.supply;
  }
  return Math.min(cap, SUPPLY_MAX); // BW hard cap
}
function supplyUsed(owner) {
  // Every unit uses 1; active + queued trainees in CC and Barracks are reserved up front.
  let used = state.units.filter(u => u.owner === owner).length;
  for (const b of buildingsOf(owner)) {
    if (b.type === "cc" || b.type === "barracks")
      used += (b.train ? 1 : 0) + (b.queued || 0);
  }
  return used;
}
const hasCompletedDepot = owner =>
  state.buildings.some(b => b.owner === owner && b.type === "depot" && !b.construct);
const hasBarracks = owner =>
  state.buildings.some(b => b.owner === owner && b.type === "barracks");

/* ----------------------------- Simulation ---------------------------- */
function tick() {
  if (state.over) return;
  state.time++;
  state.notes = state.notes.filter(n => n.until > state.time); // expire old toasts

  mineStep();
  buildingStep();
  unitStep();
  combatStep();
  cleanupDead();
  alertStep();
  fogStep();
  if (state.time - state.bot.lastEval >= 3) { botEval(); state.bot.lastEval = state.time; }

  checkEnd();
  render();
}

function notify(text, kind, ttl = 5) {
  state.notes.push({ id: idSeq++, text, kind, until: state.time + ttl });
}

// Fire a prominent alert the moment enemies first appear at Your Base (edge-triggered,
// so it re-fires for each fresh wave rather than spamming every tick).
function alertStep() {
  const enemyHome = state.units.some(u => u.owner === BOT && u.node === HOME);
  if (enemyHome && !state.underAttack) notify("⚠️ UNDER ATTACK at Your Base!", "alert", 6);
  state.underAttack = enemyHome;
}

// Fog memory: while we have a unit/building at a node, remember a frozen snapshot of
// the enemy *buildings* there. Units are never remembered — only seen when present.
function fogStep() {
  for (const node of [HOME, AWAY]) {
    const present = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                    state.buildings.some(b => b.owner === HUMAN && b.node === node);
    if (!present) continue;
    state.seen[node] = state.buildings
      .filter(b => b.owner === BOT && b.node === node)
      .map(b => ({ type: b.type, hp: b.hp, maxHp: b.maxHp,
                   construct: b.construct ? { ...b.construct } : null }));
  }
}

function mineStep() {
  for (const u of state.units) {
    if (u.task !== "mining") continue;
    if (state.field[u.node] <= 0) { u.task = "idle"; continue; }
    const got = Math.min(MINE_RATE, state.field[u.node]);
    state.field[u.node] -= got;
    state.minerals[u.owner] += got;
  }
}

function buildingStep() {
  for (const b of state.buildings) {
    if (b.construct) {
      b.construct.progress++;
      if (b.construct.progress >= b.construct.total) {
        b.construct = null;
        const scv = state.units.find(u => u.buildingId === b.id);
        if (scv) { scv.task = "idle"; scv.buildingId = null; }
      }
    }
    if (b.train) {
      b.train.progress++;
      if (b.train.progress >= b.train.total) {
        b.train = null;
        if (b.type === "cc") {
          const scv = newSCV(b.owner, b.node);
          // Rally: send the newborn to mine unless the patch is dry or rally is "idle".
          if (b.rally === "mining" && state.field[b.node] > 0) scv.task = "mining";
          if (b.queued > 0) { b.queued--; b.train = { progress: 0, total: C.cc.trainTime }; }
        } else if (b.type === "barracks") {
          newMarine(b.owner, b.node);
          if (b.queued > 0) { b.queued--; b.train = { progress: 0, total: C.marine.build }; }
        }
      }
    }
  }
}

function unitStep() {
  for (const u of state.units) {
    if (u.task === "moving") {
      u.transit.progress++;
      if (u.transit.progress >= TRAVEL_TIME) {
        u.node = u.transit.to;
        u.task = "idle";
        u.transit = null;
      }
    }
  }
}

function combatStep() {
  // Idle units (SCVs and Marines) auto-attack, focusing whatever can shoot back.
  for (const u of state.units) {
    if (u.task !== "idle" || u.node < 0) { u.atkCd = 0; continue; }
    if (!targetsAt(enemy(u.owner), u.node).length) { u.atkCd = 0; continue; }
    const cfg = u.type === "marine" ? C.marine : C.scv;
    u.atkCd -= 1;
    let guard = 0;
    while (u.atkCd <= 0 && guard++ < 3) {
      const t = pickTarget(enemy(u.owner), u.node);
      if (!t) break;
      t.hp -= cfg.dmg;
      u.atkCd += cfg.atk;
    }
  }
}

// Engine targeting: prioritise enemies that can deal damage back (idle units = fighters).
function pickTarget(owner, node) {
  const live = targetsAt(owner, node);
  if (!live.length) return null;
  const threats = live.filter(o => o.task === "idle");
  const pool = threats.length ? threats : live;
  return pool[(rng() * pool.length) | 0];
}

// Enemy units (any task) + buildings present at a node — all are valid targets.
function targetsAt(owner, node) {
  const us = state.units.filter(u => u.owner === owner && u.node === node && u.hp > 0);
  const bs = state.buildings.filter(b => b.owner === owner && b.node === node && b.hp > 0);
  return us.concat(bs);
}

function cleanupDead() {
  // Remove dead buildings; free or cancel anything tied to them.
  state.buildings = state.buildings.filter(b => {
    if (b.hp > 0) return true;
    const scv = state.units.find(u => u.buildingId === b.id);
    if (scv) { scv.task = "idle"; scv.buildingId = null; }
    if (b.owner === HUMAN && b.type !== "cc") // CC loss is the defeat screen
      notify(`💥 Your ${BUILDING_LABEL[b.type]} was destroyed!`, "loss", 6);
    return false;
  });
  // Remove dead units; a builder dying cancels its building (no refund).
  const deadBuilds = [];
  let scvLost = 0, marineLost = 0;
  state.units = state.units.filter(u => {
    if (u.hp > 0) return true;
    if (u.buildingId) deadBuilds.push(u.buildingId);
    if (u.owner === HUMAN) u.type === "marine" ? marineLost++ : scvLost++;
    return false;
  });
  if (scvLost)    notify(`Lost ${scvLost} SCV${scvLost > 1 ? "s" : ""}.`, "loss", 4);
  if (marineLost) notify(`Lost ${marineLost} Marine${marineLost > 1 ? "s" : ""}.`, "loss", 4);
  if (deadBuilds.length) {
    state.buildings = state.buildings.filter(b =>
      !(deadBuilds.includes(b.id) && b.construct));
  }
}

function checkEnd() {
  const humanCC = state.buildings.some(b => b.owner === HUMAN && b.type === "cc");
  const botCC = state.buildings.some(b => b.owner === BOT && b.type === "cc");
  if (!botCC) endGame("win");
  else if (!humanCC) endGame("loss");
}

function endGame(result) {
  state.over = result;
  if (typeof document === "undefined") return; // headless test: state only, no DOM
  stopLoop();
  closeSheet();
  const el = document.getElementById("end");
  el.className = "open " + result;
  document.getElementById("end-big").textContent = result === "win" ? "Victory!" : "Defeat";
  document.getElementById("end-msg").textContent = result === "win"
    ? "You destroyed the Enemy Command Center."
    : "Your Command Center was destroyed.";
}

/* ------------------------------- Actions ----------------------------- */
// All actions are validated again here so the UI can never force an illegal move.
// Queue an SCV at the CC. Minerals + supply are reserved up front, so a queued
// SCV is guaranteed to build. maxQueue lets the bot train only when truly idle.
function queueSCV(owner, maxQueue = C.cc.queueMax) {
  const cc = state.buildings.find(b => b.owner === owner && b.type === "cc" && !b.construct);
  if (!cc) return;
  const inQueue = (cc.train ? 1 : 0) + cc.queued; // active + waiting
  if (inQueue >= maxQueue) return;
  if (state.minerals[owner] < C.cc.trainCost) return;
  if (supplyUsed(owner) >= supplyCap(owner)) return;
  state.minerals[owner] -= C.cc.trainCost;
  if (!cc.train) cc.train = { progress: 0, total: C.cc.trainTime };
  else cc.queued++;
}

function freeIdle(owner, node) {
  // Get an idle SCV, pulling one off mining if necessary.
  let scv = unitsOf(owner, node, "idle")[0];
  if (!scv) { scv = unitsOf(owner, node, "mining")[0]; if (scv) scv.task = "idle"; }
  return scv;
}

function startBuilding(owner, node, type) {
  const cfg = type === "depot" ? C.depot : C.barracks;
  if (state.minerals[owner] < cfg.cost) return false;
  const scv = freeIdle(owner, node);
  if (!scv) return false;
  state.minerals[owner] -= cfg.cost;
  const b = {
    id: idSeq++, owner, node, type,
    hp: cfg.hp, maxHp: cfg.hp,
    construct: { progress: 0, total: cfg.build }, train: null, queued: 0,
  };
  state.buildings.push(b);
  scv.task = "building";
  scv.buildingId = b.id;
  return true;
}

// Queue a Marine. With raxId, queue at that specific Barracks (player taps one);
// otherwise pick the least-busy completed Barracks at the node (used by the bot).
function queueMarine(owner, node, raxId) {
  let rax;
  if (raxId != null) {
    rax = state.buildings.find(b => b.id === raxId && !b.construct && b.type === "barracks");
  } else {
    rax = state.buildings
      .filter(b => b.owner === owner && b.node === node && b.type === "barracks" && !b.construct)
      .sort((a, b) => ((a.train ? 1 : 0) + a.queued) - ((b.train ? 1 : 0) + b.queued))[0];
  }
  if (!rax) return;
  const inQueue = (rax.train ? 1 : 0) + rax.queued;
  if (inQueue >= C.marine.queueMax) return;
  if (state.minerals[owner] < C.marine.cost) return;
  if (supplyUsed(owner) >= supplyCap(owner)) return;
  state.minerals[owner] -= C.marine.cost;
  if (!rax.train) rax.train = { progress: 0, total: C.marine.build };
  else rax.queued++;
}

function sendUnits(owner, node, n, unitType = "scv") {
  const pool = unitType === "marine" ? idleMarines(owner, node) : controllable(owner, node);
  // For SCVs, send idle ones before pulling miners off duty.
  if (unitType === "scv") pool.sort((a, b) => (a.task === "idle" ? 0 : 1) - (b.task === "idle" ? 0 : 1));
  const dest = node === HOME ? AWAY : HOME;
  for (const u of pool.slice(0, n)) {
    u.task = "moving";
    u.node = -1; // off-map: not minable, not targetable, hidden from fog
    u.transit = { to: dest, progress: 0 };
  }
}

function setTask(owner, node, n, from, to, unitType) {
  const pool = unitsOf(owner, node, from, unitType).slice(0, n);
  for (const u of pool) u.task = to;
}

/* -------------------------------- Bot -------------------------------- */
function botEval() {
  const home = AWAY;
  const min = () => state.minerals[BOT];
  const underAttack = state.units.some(u => u.owner === HUMAN && u.node === home);
  const botRax = state.buildings.find(b =>
    b.owner === BOT && b.type === "barracks" && !b.construct);

  // Adaptive difficulty: check player pace every 30s and nudge wave frequency.
  if (state.time % 30 === 0 && state.time > 0) {
    const humanMarines = state.units.filter(u => u.owner === HUMAN && u.type === "marine").length;
    const humanTotal = state.units.filter(u => u.owner === HUMAN).length;
    const iv = state.bot.waveInterval;
    if (humanMarines >= 5) state.bot.waveInterval = Math.max(50, iv - 6);
    else if (humanMarines >= 2 && state.time < 200) state.bot.waveInterval = Math.max(55, iv - 4);
    if (humanTotal <= 3) state.bot.waveInterval = Math.min(120, iv + 8); // player struggling → ease off
  }

  if (underAttack) {
    // Recall mining SCVs to defend; marines are already idle and auto-fight.
    unitsOf(BOT, home, "mining", "scv").forEach(u => u.task = "idle");
  } else {
    // Attack wave: prefer marines, fall back to SCV rush if no barracks yet.
    const marines = idleMarines(BOT, home);
    const scvsHome = state.units.filter(u => u.owner === BOT && u.node === home &&
      u.type === "scv" && (u.task === "idle" || u.task === "mining"));
    const waveDue = state.time - state.bot.lastWave >= state.bot.waveInterval;
    const minWave = state.bot.waveInterval <= 60 ? 4 : 3;
    if (waveDue) {
      if (marines.length >= minWave) {
        sendUnits(BOT, home, marines.length, "marine");
        state.bot.lastWave = state.time;
      } else if (!botRax && scvsHome.length >= 6) {
        sendUnits(BOT, home, 2 + ((rng() * 2) | 0), "scv");
        state.bot.lastWave = state.time;
      }
    }
  }

  // Supply: build depots before getting blocked.
  if (supplyUsed(BOT) >= supplyCap(BOT) - 2 && min() >= C.depot.cost &&
      !state.buildings.some(b => b.owner === BOT && b.type === "depot" && b.construct)) {
    startBuilding(BOT, home, "depot");
  }

  // SCV production: cap at 10 once barracks is running (shift investment to marines).
  const botSCVs = state.units.filter(u => u.owner === BOT && u.type === "scv").length;
  if (min() >= C.cc.trainCost && supplyUsed(BOT) < supplyCap(BOT) &&
      (botSCVs < 10 || !botRax)) {
    queueSCV(BOT, 1);
  }

  // Tech: build barracks (no depot prerequisite).
  if (min() >= C.barracks.cost && !hasBarracks(BOT)) {
    startBuilding(BOT, home, "barracks");
  }

  // Pump marines continuously once barracks is up.
  if (botRax && min() >= C.marine.cost && supplyUsed(BOT) < supplyCap(BOT)) {
    queueMarine(BOT, home);
  }

  // Idle SCVs back to mining when safe.
  if (!underAttack && state.field[home] > 0)
    unitsOf(BOT, home, "idle", "scv").forEach(u => u.task = "mining");
}

/* ------------------------------ Rendering ---------------------------- */
const $ = id => document.getElementById(id);
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const BUILDING_LABEL = { cc: "Command Center", depot: "Supply Depot", barracks: "Barracks" };

function svgIcon(kind) {
  if (kind === "cc")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="3" y="9" width="18" height="11" rx="1"/><path d="M7 9V6h10v3M12 13v3"/></svg>`;
  if (kind === "depot")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><rect x="4" y="8" width="16" height="10" rx="2"/><path d="M4 12h16"/></svg>`;
  if (kind === "barracks")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#9ec1ff" stroke-width="2"><path d="M4 18V8l8-4 8 4v10"/><path d="M9 18v-5h6v5"/></svg>`;
  if (kind === "scv")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ffd27a" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 5v3M12 16v3M5 12h3M16 12h3"/></svg>`;
  if (kind === "marine")
    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ff9a9a" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M6 21v-1a6 6 0 0112 0v1"/><path d="M17 13l4 1.5-4 1.5"/></svg>`;
  if (kind === "mineral")
    return `<svg class="icon" viewBox="0 0 24 24" fill="#41d6ff" stroke="#0a1a22" stroke-width="1"><path d="M12 3l4 6-4 12-4-12z"/></svg>`;
  return "";
}

function hpBar(hp, maxHp) {
  const p = Math.max(0, hp / maxHp);
  const cls = p > 0.5 ? "" : p > 0.25 ? "mid" : "low";
  return `<div class="bar hp ${cls}"><i style="width:${(p * 100).toFixed(0)}%"></i></div>`;
}
function progBar(progress, total) {
  return `<div class="bar prog"><i style="width:${((progress / total) * 100).toFixed(0)}%"></i></div>`;
}

function render() {
  if (typeof document === "undefined") return; // headless test: no DOM to paint
  // Status bar (human numbers).
  $("s-min").textContent = Math.floor(state.minerals[HUMAN]);
  const used = supplyUsed(HUMAN), cap = supplyCap(HUMAN);
  $("s-sup").textContent = `${used} / ${cap}`;
  $("s-supwrap").className = "stat supply" + (used >= cap ? " blocked" : "");
  $("s-time").textContent = fmtTime(state.time);
  if (typeof document.body !== "undefined" && document.body)
    document.body.classList.toggle("paused", !!state.paused);

  // Nodes.
  const board = $("board");
  board.innerHTML = "";
  board.appendChild(renderNode(HOME));
  board.appendChild(renderNode(AWAY));

  renderTransit();
  $("notes").innerHTML = state.notes.map(n => `<div class="note ${n.kind}">${n.text}</div>`).join("");
  if (ui.sheet) renderSheet();
}

function renderNode(node) {
  const el = document.createElement("div");
  el.className = "node " + (node === HOME ? "home" : "away");
  const fieldLeft = Math.ceil(state.field[node]);
  el.innerHTML = `<div class="node-head">
      <h1>${NODE_NAMES[node]}</h1>
      <span class="field">💎 ${fieldLeft} left</span>
    </div>`;

  // --- Your forces (always visible) ---
  const mine = document.createElement("div");
  mine.className = "force-mine";
  mine.innerHTML = `<div class="section-label">Your forces</div>`;
  appendForces(mine, HUMAN, node, true);
  el.appendChild(mine);

  // --- Enemy forces (fog of war) ---
  const present = state.units.some(u => u.owner === HUMAN && u.node === node) ||
                  state.buildings.some(b => b.owner === HUMAN && b.node === node);
  const en = document.createElement("div");
  en.className = "force-enemy";
  let showEnemy = false;
  if (present) {
    en.innerHTML = `<div class="section-label">Enemy forces</div>`;
    const had = appendForces(en, BOT, node, false);
    if (had) showEnemy = true;
    // If had===false: no enemy presence at all — hide the section entirely.
  } else {
    // Out of sight: show last-seen buildings or "Unknown" if never scouted.
    const snap = state.seen[node];
    if (snap == null) {
      en.innerHTML = `<div class="section-label">Enemy forces</div>` +
        `<div class="unknown">Unknown — no scouts here.</div>`;
    } else if (snap.length === 0) {
      en.innerHTML = `<div class="section-label">Enemy forces — last seen</div>` +
        `<div class="unknown">Last seen: no buildings.</div>`;
    } else {
      en.innerHTML = `<div class="section-label">Enemy forces — last seen</div>`;
      appendSeenBuildings(en, snap);
    }
    showEnemy = true;
  }
  if (showEnemy) el.appendChild(en);
  return el;
}

// Render remembered (frozen) enemy buildings from a fog snapshot — info only, dimmed.
function appendSeenBuildings(container, snap) {
  for (const b of snap) {
    const row = document.createElement("div");
    row.className = "row static seen";
    const meta = b.construct
      ? `Was building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%`
      : `Last seen · HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    row.innerHTML = `${svgIcon(b.type)}<div class="body">
        <div class="name">${BUILDING_LABEL[b.type]}</div>
        <div class="meta">${meta}</div>
        ${hpBar(b.hp, b.maxHp)}
      </div>`;
    container.appendChild(row);
  }
}

// Pure: describe a group of barracks as text segments. Completed and
// under-construction barracks are reported *independently*, so newly-started
// barracks stay visible even while finished ones are busy training.
function barracksMeta(allRax, interactive) {
  const readyRax = allRax.filter(b => !b.construct);
  const underC = allRax.filter(b => b.construct);
  const segs = [];
  if (readyRax.length) {
    if (interactive) {
      const totalQ = readyRax.reduce((s, b) => s + (b.train ? 1 : 0) + (b.queued || 0), 0);
      segs.push(totalQ ? `Training · ${totalQ} queued` : "Idle · tap to train");
    } else {
      const totHP = readyRax.reduce((s, b) => s + Math.ceil(b.hp), 0);
      const totMax = readyRax.reduce((s, b) => s + b.maxHp, 0);
      segs.push(`HP ${totHP}/${totMax}`);
    }
  }
  if (underC.length) {
    // Closest-to-done builder represents the in-construction group.
    const lead = underC.slice().sort((a, b) =>
      (b.construct.progress / b.construct.total) - (a.construct.progress / a.construct.total))[0];
    const pct = Math.floor(lead.construct.progress / lead.construct.total * 100);
    segs.push(`${underC.length} building… ${pct}%`);
  }
  return segs;
}

// Returns true if anything was rendered. `interactive` enables tap-to-order.
function appendForces(container, owner, node, interactive) {
  let any = false;
  const buildings = buildingsOf(owner, node);

  // Command Center — always individual.
  for (const b of buildings.filter(b => b.type === "cc")) {
    any = true;
    const tappable = interactive;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta;
    if (b.construct) {
      meta = `Building… ${Math.floor(b.construct.progress / b.construct.total * 100)}%${interactive ? progBar(b.construct.progress, b.construct.total) : ""}`;
    } else if (b.train && interactive) {
      meta = `Training SCV ${Math.floor(b.train.progress / b.train.total * 100)}%${b.queued ? ` (+${b.queued} queued)` : ""}${progBar(b.train.progress, b.train.total)}`;
    } else {
      meta = interactive ? `Idle · supply +${C.cc.supply}` : `HP ${Math.ceil(b.hp)}/${b.maxHp}`;
    }
    row.innerHTML = `${svgIcon("cc")}<div class="body">
        <div class="name">Command Center</div>
        <div class="meta">${meta}</div>
        ${hpBar(b.hp, b.maxHp)}
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "cc", node, ref: b.id });
    container.appendChild(row);
  }

  // Supply Depots — one summary row for all depots at this node.
  const depots = buildings.filter(b => b.type === "depot");
  if (depots.length) {
    any = true;
    const done = depots.filter(b => !b.construct).length;
    const underC = depots.filter(b => b.construct).length;
    const parts = [];
    if (done) parts.push(`${done} complete · +${done * C.depot.supply} supply`);
    if (underC) parts.push(`${underC} building`);
    const row = document.createElement("div");
    row.className = "row static";
    row.innerHTML = `${svgIcon("depot")}<div class="body">
        <div class="name">Supply Depot${depots.length > 1 ? ` ×${depots.length}` : ""}</div>
        <div class="meta">${parts.join(" · ") || "—"}</div>
      </div>`;
    container.appendChild(row);
  }

  // Barracks — grouped; tap queues in the next-free barracks.
  const allRax = buildings.filter(b => b.type === "barracks");
  if (allRax.length) {
    any = true;
    const readyRax = allRax.filter(b => !b.construct);
    const tappable = interactive && readyRax.length > 0;
    const row = document.createElement(tappable ? "button" : "div");
    row.className = "row" + (tappable ? "" : " static");
    let meta = barracksMeta(allRax, interactive).join(" · ");
    // Progress bar: prefer the leading trainee, else the leading builder.
    const underC = allRax.filter(b => b.construct);
    if (interactive) {
      const trainLead = readyRax.filter(b => b.train).sort((a, b) => b.train.progress - a.train.progress)[0];
      if (trainLead) meta += progBar(trainLead.train.progress, trainLead.train.total);
      else if (underC.length) {
        const bl = underC.slice().sort((a, b) => b.construct.progress - a.construct.progress)[0];
        meta += progBar(bl.construct.progress, bl.construct.total);
      }
    }
    row.innerHTML = `${svgIcon("barracks")}<div class="body">
        <div class="name">Barracks${allRax.length > 1 ? ` ×${allRax.length}` : ""}</div>
        <div class="meta">${meta}</div>
      </div>${tappable ? '<span class="chev">›</span>' : ""}`;
    if (tappable) row.onclick = () => openSheet({ kind: "barracks-group", node });
    container.appendChild(row);
  }

  // SCVs — grouped.
  const scvs = unitsOf(owner, node, null, "scv");
  if (scvs.length) {
    any = true;
    const parts = [];
    const m = scvs.filter(u => u.task === "mining").length;
    const i = scvs.filter(u => u.task === "idle").length;
    const bl = scvs.filter(u => u.task === "building").length;
    if (m) parts.push(`${m} mining`);
    if (i) parts.push(`${i} idle`);
    if (bl) parts.push(`${bl} building`);
    const row = document.createElement(interactive ? "button" : "div");
    row.className = "row" + (interactive ? "" : " static");
    row.innerHTML = `${svgIcon("scv")}<div class="body">
        <div class="name">SCVs — ${scvs.length}</div>
        <div class="meta">${parts.join(", ") || "—"}</div>
      </div>${interactive ? '<span class="chev">›</span>' : ""}`;
    if (interactive) row.onclick = () => openSheet({ kind: "scv", node, n: 1 });
    container.appendChild(row);
  }

  // Marines — all marines at a fixed node are idle (moving ones have node=-1).
  const marines = unitsOf(owner, node, null, "marine");
  if (marines.length) {
    any = true;
    const row = document.createElement(interactive ? "button" : "div");
    row.className = "row" + (interactive ? "" : " static");
    row.innerHTML = `${svgIcon("marine")}<div class="body">
        <div class="name">Marines — ${marines.length}</div>
        <div class="meta">ready</div>
      </div>${interactive ? '<span class="chev">›</span>' : ""}`;
    if (interactive) row.onclick = () => openSheet({ kind: "marine", node, n: 1 });
    container.appendChild(row);
  }

  return any;
}

function renderTransit() {
  const wrap = $("transit");
  // Fog: only the player's own units are visible while crossing the map.
  const mine = state.units.filter(u => u.owner === HUMAN && u.task === "moving");
  if (!mine.length) { wrap.innerHTML = ""; return; }
  const byDir = {};
  for (const u of mine) {
    const k = u.transit.to;
    (byDir[k] = byDir[k] || []).push(u);
  }
  let html = `<div class="section-label">In transit</div>`;
  for (const to in byDir) {
    const group = byDir[to];
    const avg = group.reduce((s, u) => s + u.transit.progress, 0) / group.length;
    const eta = Math.max(0, TRAVEL_TIME - Math.round(avg));
    const scvN = group.filter(u => u.type === "scv").length;
    const marN = group.filter(u => u.type === "marine").length;
    const label = [scvN && `${scvN} SCV${scvN > 1 ? "s" : ""}`,
                   marN && `${marN} Marine${marN > 1 ? "s" : ""}`].filter(Boolean).join(", ");
    html += `<div class="transit-row">
        <div class="name">${label} → ${NODE_NAMES[to]}</div>
        <div class="meta">ETA ${eta}s</div>
        ${progBar(avg, TRAVEL_TIME)}
      </div>`;
  }
  wrap.innerHTML = html;
}

/* ---------------------------- Action sheet --------------------------- */
function openSheet(sel) { ui.sheet = sel; renderSheet(); }
function closeSheet() {
  ui.sheet = null;
  $("sheet").className = "";
  $("sheet-backdrop").className = "";
}

function renderSheet() {
  const sel = ui.sheet;
  const sheet = $("sheet");
  $("sheet-backdrop").className = "open";
  sheet.className = "open";
  const mineNow = Math.floor(state.minerals[HUMAN]);

  if (sel.kind === "cc") {
    const cc = state.buildings.find(b => b.id === sel.ref);
    if (!cc) { closeSheet(); return; }
    const inQ = (cc.train ? 1 : 0) + cc.queued;
    const supplyOK = supplyUsed(HUMAN) < supplyCap(HUMAN);
    const afford = mineNow >= C.cc.trainCost;
    const dis = cc.construct || inQ >= C.cc.queueMax || !supplyOK || !afford;
    const note = cc.construct ? "Under construction."
      : inQ >= C.cc.queueMax ? `Queue full (${C.cc.queueMax} max).`
      : !supplyOK ? "Supply capped — build a Supply Depot."
      : !afford ? `Need ${C.cc.trainCost} 💎.` : "";
    const rallyMining = cc.rally === "mining";
    sheet.innerHTML = `
      <h2>Command Center</h2>
      <div class="sheet-sub">${NODE_NAMES[sel.node]} · HP ${Math.ceil(cc.hp)}/${cc.maxHp} · Queue ${inQ}/${C.cc.queueMax}</div>
      <button class="act" ${dis ? "disabled" : ""} id="a-train">
        Train SCV <span class="cost">— ${C.cc.trainCost} 💎 · ${C.cc.trainTime}s · +1 supply</span>
      </button>
      ${note ? `<div class="sheet-sub" style="margin-top:8px">${note}</div>` : ""}
      <button class="act secondary" id="a-rally">
        Rally: ${rallyMining ? "⛏️ Mine" : "🛑 Idle"} <span class="cost">— new SCVs ${rallyMining ? "go mining" : "stay idle"}</span>
      </button>
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-train", () => { queueSCV(HUMAN); refreshSheet(); });
    bind("a-rally", () => { cc.rally = rallyMining ? "idle" : "mining"; refreshSheet(); });

  } else if (sel.kind === "barracks" || sel.kind === "barracks-group") {
    const allRax = buildingsOf(HUMAN, sel.node).filter(b => b.type === "barracks" && !b.construct);
    if (!allRax.length) { closeSheet(); return; }
    const totalQ = allRax.reduce((s, b) => s + (b.train ? 1 : 0) + (b.queued || 0), 0);
    const maxQ = allRax.length * C.marine.queueMax;
    const supplyOK = supplyUsed(HUMAN) < supplyCap(HUMAN);
    const afford = mineNow >= C.marine.cost;
    const dis = totalQ >= maxQ || !supplyOK || !afford;
    const note = totalQ >= maxQ ? `All queues full (${maxQ} max).`
      : !supplyOK ? "Supply capped — build a Supply Depot."
      : !afford ? `Need ${C.marine.cost} 💎.` : "";
    const trainingRax = allRax.filter(b => b.train).sort((a, b) => b.train.progress - a.train.progress);
    const eta = trainingRax.length ? C.marine.build - trainingRax[0].train.progress : 0;
    const label = allRax.length > 1 ? `Barracks ×${allRax.length}` : "Barracks";
    sheet.innerHTML = `
      <h2>${label}</h2>
      <div class="sheet-sub">${NODE_NAMES[sel.node]} · ${totalQ} training${trainingRax.length ? ` · next ready in ${eta}s` : ""}</div>
      <button class="act" ${dis ? "disabled" : ""} id="a-marine">
        Train Marine <span class="cost">— ${C.marine.cost} 💎 · ${C.marine.build}s · +1 supply</span>
      </button>
      ${note ? `<div class="sheet-sub" style="margin-top:8px">${note}</div>` : ""}
      <button class="act-close" id="a-close">Close</button>`;
    bind("a-marine", () => { queueMarine(HUMAN, sel.node, null); refreshSheet(); });

  } else if (sel.kind === "marine") {
    const node = sel.node;
    const pool = idleMarines(HUMAN, node);
    const max = Math.max(1, pool.length);
    sel.n = Math.min(Math.max(1, sel.n || pool.length), max);
    const n = sel.n;
    const other = node === HOME ? AWAY : HOME;
    sheet.innerHTML = `
      <h2>Marines at ${NODE_NAMES[node]}</h2>
      <div class="sheet-sub">${pool.length} ready to move</div>
      <button class="act" id="a-send-all-m" ${pool.length ? "" : "disabled"}>
        ⚔️ Send ALL ${pool.length} → ${NODE_NAMES[other]}
      </button>
      <div class="stepper">
        <button id="n-minus">−</button>
        <div class="count" id="n-count">${n}</div>
        <button id="n-plus">+</button>
        <div class="label">selected</div>
      </div>
      <input type="range" id="n-range" min="1" max="${max}" value="${n}">
      <button class="act secondary" id="a-send-m" ${pool.length ? "" : "disabled"}>
        Send ${n} → ${NODE_NAMES[other]} <span class="cost">— ${TRAVEL_TIME}s travel</span>
      </button>
      <button class="act-close" id="a-close">Close</button>`;
    const setN = v => { sel.n = Math.min(Math.max(1, v), max); renderSheet(); };
    bind("n-minus", () => setN(sel.n - 1));
    bind("n-plus", () => setN(sel.n + 1));
    $("n-range").oninput = e => setN(parseInt(e.target.value, 10));
    bind("a-send-all-m", () => { sendUnits(HUMAN, node, pool.length, "marine"); closeSheet(); render(); });
    bind("a-send-m", () => { sendUnits(HUMAN, node, sel.n, "marine"); closeSheet(); render(); });

  } else {
    // SCV group sheet.
    const node = sel.node;
    const all = controllable(HUMAN, node);
    const idleN = unitsOf(HUMAN, node, "idle", "scv").length;
    const miningN = unitsOf(HUMAN, node, "mining", "scv").length;
    const max = Math.max(1, all.length);
    sel.n = Math.min(Math.max(1, sel.n || 1), max);
    const n = sel.n;
    const other = node === HOME ? AWAY : HOME;
    const depotOK = all.length >= 1 && mineNow >= C.depot.cost;
    const raxOK = all.length >= 1 && mineNow >= C.barracks.cost;

    sheet.innerHTML = `
      <h2>SCVs at ${NODE_NAMES[node]}</h2>
      <div class="sheet-sub">${all.length} available · ${miningN} mining · ${idleN} idle</div>

      <button class="act" id="a-send-all" ${all.length ? "" : "disabled"}>
        Send ALL ${all.length} → ${NODE_NAMES[other]}
      </button>
      <button class="act secondary" id="a-mine-all" ${idleN ? "" : "disabled"}>
        Set ALL ${idleN} idle → mining
      </button>
      <button class="act secondary" id="a-idle-all" ${miningN ? "" : "disabled"}>
        Set ALL ${miningN} mining → idle
      </button>

      <div class="stepper">
        <button id="n-minus">−</button>
        <div class="count" id="n-count">${n}</div>
        <button id="n-plus">+</button>
        <div class="label">SCVs<br>selected</div>
      </div>
      <input type="range" id="n-range" min="1" max="${max}" value="${n}">
      <button class="act secondary" id="a-send" ${all.length ? "" : "disabled"}>
        Send ${n} → ${NODE_NAMES[other]} <span class="cost">— ${TRAVEL_TIME}s travel</span>
      </button>

      <button class="act secondary" id="a-depot" ${depotOK ? "" : "disabled"}>
        Build Supply Depot <span class="cost">— ${C.depot.cost} 💎 · ${C.depot.build}s</span>
      </button>
      <button class="act secondary" id="a-rax" ${raxOK ? "" : "disabled"}>
        Build Barracks <span class="cost">— ${C.barracks.cost} 💎 · ${C.barracks.build}s</span>
      </button>
      <button class="act-close" id="a-close">Close</button>`;

    const setN = v => { sel.n = Math.min(Math.max(1, v), max); renderSheet(); };
    bind("n-minus", () => setN(sel.n - 1));
    bind("n-plus", () => setN(sel.n + 1));
    $("n-range").oninput = e => setN(parseInt(e.target.value, 10));

    bind("a-send-all", () => { sendUnits(HUMAN, node, all.length, "scv"); closeSheet(); render(); });
    bind("a-mine-all", () => { setTask(HUMAN, node, idleN, "idle", "mining", "scv"); refreshSheet(); });
    bind("a-idle-all", () => { setTask(HUMAN, node, miningN, "mining", "idle", "scv"); refreshSheet(); });
    bind("a-send", () => { sendUnits(HUMAN, node, sel.n, "scv"); closeSheet(); render(); });
    bind("a-depot", () => { startBuilding(HUMAN, node, "depot"); refreshSheet(); });
    bind("a-rax", () => { startBuilding(HUMAN, node, "barracks"); refreshSheet(); });
  }
  bind("a-close", closeSheet);
}

function refreshSheet() { render(); if (ui.sheet) renderSheet(); }
function bind(id, fn) { const el = $(id); if (el) el.onclick = fn; }

/* ------------------------------- Loop -------------------------------- */
function startLoop() { clearInterval(timer); timer = setInterval(() => { if (!state.paused) tick(); }, TICK_MS); }
function stopLoop() { clearInterval(timer); }
function setPaused(p) {
  state.paused = p;
  const btn = $("pause-btn");
  if (btn) btn.textContent = p ? "▶ Resume" : "⏸ Pause";
  if (p) render(); // reflect paused label immediately
}
function togglePause() { setPaused(!state.paused); }

/* ------------------------------- Tests ------------------------------- */
// In-file test harness. Pure sim only (no DOM): resetState(seed) then drive tick().
// Run headless:  node -e "<extract script>; process.exit(runTests()?0:1)"
// Or in a browser: open startext.html?test to see the report instead of the game.
function runTests() {
  let pass = 0, fail = 0;
  const log = [];
  const ok = (cond, msg) => { cond ? pass++ : (fail++, log.push("FAIL: " + msg)); };
  const eq = (a, b, msg) => ok(a === b, `${msg} — got ${a}, expected ${b}`);
  const near = (a, b, eps, msg) => ok(Math.abs(a - b) <= eps, `${msg} — got ${a}, expected ~${b}`);
  // Run n ticks (capped so a broken end-condition can't loop forever).
  const run = n => { for (let i = 0; i < n && !state.over; i++) tick(); };
  const cc = o => state.buildings.find(b => b.owner === o && b.type === "cc");
  const rax = o => state.buildings.find(b => b.owner === o && b.type === "barracks" && !b.construct);
  const cheat = (o, m) => { state.minerals[o] = m; };

  const T = {
    "starting state is canon"() {
      resetState(1);
      eq(state.minerals.human, 50, "start minerals");
      eq(unitsOf(HUMAN, HOME, null, "scv").length, 4, "start SCVs");
      eq(supplyUsed(HUMAN), 4, "start supply used");
      eq(supplyCap(HUMAN), 10, "start supply cap");
      eq(state.field[HOME], FIELD_TOTAL, "home field");
    },
    "mining yields ~0.7/sec/SCV"() {
      resetState(1);
      unitsOf(HUMAN, HOME, "idle", "scv").forEach(u => u.task = "mining"); // 4 miners
      const before = state.minerals.human;
      tick();
      near(state.minerals.human - before, 4 * MINE_RATE, 0.01, "4 miners income/sec");
    },
    "SCV training costs, takes 12s, +1 supply"() {
      resetState(1);
      cheat(HUMAN, 50);
      queueSCV(HUMAN);
      eq(state.minerals.human, 0, "minerals spent on SCV");
      run(C.cc.trainTime);
      eq(unitsOf(HUMAN, HOME, null, "scv").length, 5, "SCV produced after 12s");
    },
    "CC rally=mining sends newborn SCVs to mine; rally=idle keeps them idle"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const cc1 = cc(HUMAN);
      eq(cc1.rally, "mining", "rally defaults to mining");
      queueSCV(HUMAN);
      run(C.cc.trainTime);
      ok(unitsOf(HUMAN, HOME, "mining", "scv").length >= 1, "newborn auto-mines on rally=mining");
      cc1.rally = "idle";
      const idleBefore = unitsOf(HUMAN, HOME, "idle", "scv").length;
      queueSCV(HUMAN);
      run(C.cc.trainTime);
      eq(unitsOf(HUMAN, HOME, "idle", "scv").length, idleBefore + 1, "newborn stays idle on rally=idle");
    },
    "CC rally=mining yields idle SCV when patch is dry"() {
      resetState(1);
      cheat(HUMAN, 9999);
      state.field[HOME] = 0; // dry
      queueSCV(HUMAN);
      run(C.cc.trainTime);
      ok(unitsOf(HUMAN, HOME, "mining", "scv").length === 0, "no mining when field empty");
    },
    "CC queue caps at 5 and reserves supply"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // raise cap so supply isn't the limiter
      state.buildings.push({ id: idSeq++, owner: HUMAN, node: HOME, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      for (let i = 0; i < 8; i++) queueSCV(HUMAN);
      eq((cc(HUMAN).train ? 1 : 0) + cc(HUMAN).queued, 5, "queue capped at 5");
    },
    "supply hard-caps at 200"() {
      resetState(1);
      for (let i = 0; i < 30; i++) state.buildings.push({ id: idSeq++, owner: HUMAN,
        node: HOME, type: "depot", hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      eq(supplyCap(HUMAN), SUPPLY_MAX, "cap clamps to 200");
    },
    "supply blocks training when full"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // fill supply: 4 SCVs + queue to 10
      for (let i = 0; i < 20; i++) queueSCV(HUMAN);
      ok(supplyUsed(HUMAN) <= supplyCap(HUMAN), "never overshoot supply cap");
    },
    "mining SCV can be pulled to build (regression)"() {
      resetState(1);
      cheat(HUMAN, 9999);
      // set all SCVs to mining — no idle SCVs
      unitsOf(HUMAN, HOME, null, "scv").forEach(u => u.task = "mining");
      ok(startBuilding(HUMAN, HOME, "depot"), "startBuilding succeeds with only miners");
      const builder = state.units.find(u => u.owner === HUMAN && u.task === "building");
      ok(builder != null, "one SCV pulled off mining to build");
    },
    "Barracks can be built without a Supply Depot"() {
      resetState(1);
      cheat(HUMAN, 9999);
      ok(startBuilding(HUMAN, HOME, "barracks"), "barracks allowed without depot");
    },
    "setTask with unitType=scv does not affect marines"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const m = newMarine(HUMAN, HOME); m.task = "idle";
      setTask(HUMAN, HOME, 10, "idle", "mining", "scv");
      eq(m.task, "idle", "marine task unchanged");
      ok(unitsOf(HUMAN, HOME, "mining", "scv").length > 0, "SCVs set to mining");
    },
    "Marine trains from Barracks (40hp), +1 supply"() {
      resetState(1);
      cheat(HUMAN, 9999);
      const b = { id: idSeq++, owner: HUMAN, node: HOME, type: "barracks",
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 };
      state.buildings.push(b);
      state.buildings.push({ id: idSeq++, owner: HUMAN, node: HOME, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      queueMarine(HUMAN, HOME, b.id);
      run(C.marine.build);
      const m = unitsOf(HUMAN, HOME, null, "marine");
      eq(m.length, 1, "1 marine produced");
      eq(m[0].hp, C.marine.hp, "marine hp = 40");
    },
    "two Barracks train independently (regression)"() {
      resetState(1);
      cheat(HUMAN, 9999);
      state.buildings.push({ id: idSeq++, owner: HUMAN, node: HOME, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      const r1 = { id: idSeq++, owner: HUMAN, node: HOME, type: "barracks",
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 };
      const r2 = { id: idSeq++, owner: HUMAN, node: HOME, type: "barracks",
        hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 };
      state.buildings.push(r1, r2);
      queueMarine(HUMAN, HOME, r1.id);
      queueMarine(HUMAN, HOME, r2.id);
      ok(r1.train && r2.train, "both barracks training at once");
    },
    "barracks group shows under-construction even when others are training (regression)"() {
      const train = { progress: 5, total: C.marine.build };
      const ready = [
        { type: "barracks", hp: 1000, maxHp: 1000, construct: null, train, queued: 1 },
        { type: "barracks", hp: 1000, maxHp: 1000, construct: null, train: null, queued: 0 },
      ];
      const building = [
        { type: "barracks", hp: 500, maxHp: 1000, construct: { progress: 10, total: C.barracks.build } },
        { type: "barracks", hp: 200, maxHp: 1000, construct: { progress: 3, total: C.barracks.build } },
      ];
      const segs = barracksMeta(ready.concat(building), true);
      ok(segs.some(s => /building/.test(s)), "under-construction barracks reported alongside training");
      ok(segs.some(s => /2 building/.test(s)), "counts both in-construction barracks");
      ok(segs.some(s => /Training/.test(s)), "still reports the training ones");
      // Only construction in progress → must still report it.
      const onlyBuilding = barracksMeta(building, true);
      ok(onlyBuilding.some(s => /2 building/.test(s)), "all-building group shows count");
    },
    "Marine and SCV deal their canon damage per hit"() {
      resetState(1);
      // 1 human marine vs 1 high-HP bot dummy, both idle at AWAY (no other units).
      const m = newMarine(HUMAN, AWAY); m.task = "idle";
      const e = { id: idSeq++, owner: BOT, node: AWAY, type: "scv", task: "idle",
        hp: 1000, maxHp: 1000, atkCd: 0, buildingId: null, transit: null };
      state.units = [m, e];
      state.buildings = []; // isolate: no CCs so the duel is the only combat
      tick();
      const dealt = 1000 - e.hp;
      ok(dealt > 0 && dealt % C.marine.dmg === 0, `marine damage is a multiple of 6 (got ${dealt})`);
    },
    "travel takes 20s and hides unit in transit"() {
      resetState(1);
      sendUnits(HUMAN, HOME, 1, "scv");
      const u = state.units.find(x => x.task === "moving");
      eq(u.node, -1, "in transit: off-map");
      run(TRAVEL_TIME);
      eq(u.node, AWAY, "arrived at enemy base");
      eq(u.task, "idle", "arrives idle");
    },
    "fog: enemy buildings unknown until scouted, then remembered"() {
      resetState(1);
      eq(state.seen[AWAY], null, "AWAY unknown at start");
      sendUnits(HUMAN, HOME, 2, "scv");
      run(TRAVEL_TIME + 2);
      ok(Array.isArray(state.seen[AWAY]) && state.seen[AWAY].length >= 1, "scouted: CC remembered");
      const snapLen = state.seen[AWAY].length;
      // remove our scouts; bot snapshot must freeze
      state.units = state.units.filter(u => !(u.owner === HUMAN && u.node === AWAY));
      state.buildings.push({ id: idSeq++, owner: BOT, node: AWAY, type: "depot",
        hp: 400, maxHp: 400, construct: null, train: null, queued: 0 });
      run(5);
      eq(state.seen[AWAY].length, snapLen, "snapshot frozen while unseen");
    },
    "destroying enemy CC wins"() {
      resetState(1);
      // isolate the CC so the attacker targets it, not the bot's defending SCVs
      state.units = state.units.filter(u => u.owner !== BOT);
      cc(BOT).hp = C.marine.dmg; // one hit
      const m = newMarine(HUMAN, AWAY); m.task = "idle";
      run(5);
      eq(state.over, "win", "win when enemy CC dies");
    },
    "losing own CC is defeat"() {
      resetState(1);
      state.units = state.units.filter(u => u.owner !== HUMAN);
      cc(HUMAN).hp = C.marine.dmg;
      const e = newMarine(BOT, HOME); e.task = "idle";
      run(5);
      eq(state.over, "loss", "loss when own CC dies");
    },
    "determinism: same seed → same result"() {
      const play = seed => { resetState(seed); run(120); return state.minerals.bot.toFixed(2); };
      eq(play(42), play(42), "identical seeded runs match");
    },
    "bot builds economy and tech over time"() {
      resetState(7);
      run(400);
      const botSCVs = state.units.filter(u => u.owner === BOT && u.type === "scv").length;
      ok(botSCVs > 4, "bot trained extra SCVs");
      ok(hasCompletedDepot(BOT) || state.buildings.some(b => b.owner === BOT && b.type === "depot"),
        "bot built a depot");
    },
    "pause flag freezes simulation in the loop"() {
      resetState(1);
      state.paused = true;
      const t0 = state.time;
      // emulate the loop's guard
      if (!state.paused) tick();
      eq(state.time, t0, "no tick while paused");
    },
  };

  for (const name in T) {
    try { T[name](); }
    catch (e) { fail++; log.push("THREW: " + name + " — " + (e && e.message)); }
  }
  const summary = `StarText tests: ${pass} passed, ${fail} failed`;
  if (typeof console !== "undefined") { console.log(summary); log.forEach(l => console.log("  " + l)); }
  return { pass, fail, log, summary };
}

/* ------------------------------- Boot -------------------------------- */
const HEADLESS = typeof document === "undefined";
if (HEADLESS) {
  // Node entry: run tests and exit non-zero on failure.
  const r = runTests();
  if (typeof module !== "undefined") module.exports = { runTests };
  if (typeof process !== "undefined") process.exit(r.fail ? 1 : 0);
} else if (location.search.indexOf("test") !== -1) {
  // Browser ?test mode: show the report instead of booting the game.
  const r = runTests();
  document.body.innerHTML =
    `<pre style="padding:16px;font-size:14px;color:${r.fail ? "#f87171" : "#4ade80"}">` +
    `${r.summary}\n\n${r.log.join("\n") || "All green."}</pre>`;
} else {
  $("sheet-backdrop").onclick = closeSheet;
  $("end-again").onclick = init;
  $("pause-btn").onclick = togglePause;
  init();
  startLoop();
}
</script>
</body>
</html>
